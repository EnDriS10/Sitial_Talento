<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Media Data</title></head>
<body>
<!--
    ARCHIVO DE DATOS — Media (Sitial de Talentos)
    ================================================================
    Este archivo NO se muestra a los visitantes. Es leído automáticamente
    por media.html y por la sección Media de index.html para construir
    la galería de fotos (ya NO se lee desde Assets/Media ni desde la API
    de GitHub).

    Cómo añadir una foto nueva:
    1. Sube la imagen a un servicio externo (por ejemplo https://imgur.com)
       y copia el enlace DIRECTO a la imagen (la URL de la imagen en sí,
       terminada normalmente en .jpg / .jpeg / .png / .webp).
    2. Añade un nuevo objeto al array datosMedia de abajo con:
         - name: "DD_MM_AAAA_evento[_num]"   (¡entre comillas!)
             evento ∈ { icho, imcho, oiaq, ocacq, otras }
             el sufijo _num es opcional, para distinguir varias fotos
             del mismo día y evento (_1, _2, _3...)
         - link: la URL directa de la imagen (entre comillas)
    3. Guarda el archivo. No hace falta tocar media.html ni index.html:
       la nueva foto aparecerá sola, ordenada por fecha (más reciente
       primero) la próxima vez que se cargue la galería.

    Ejemplo de "name":  29_10_2022_oiaq_1
      → 29/10/2022, evento OIAQ, foto número 1 de ese día/evento
      → se mostrará en la galería con la insignia "OIAQ · 2022"
-->
<script>
const datosMedia = [
    { name: "29_10_2022_oiaq_1", link: "https://i.imgur.com/09R24rp.jpeg" },
];
</script>
</body>
</html>
