<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body>
<script id="chem-draw">

// ════════════════════════════════════════════════════════════════════
// ChemDraw — motor de dibujo químico reutilizable, 100% código (sin
// imágenes). Genera SVG a partir de coordenadas: fórmulas esqueléticas
// (líneas/ángulos, como se dibujan a mano) y diagramas de orbitales
// moleculares (lóbulos p con sombreado de fase).
//
// Uso desde el contenido de un problema:
//   <span class="pc-mol" data-mol="fenilisocianuro"></span>
//   <div class="pc-orbitals" data-n="6" data-index="3"></div>
// y luego, tras inyectar el HTML, se llama a ChemDraw.renderAll(root).
// ════════════════════════════════════════════════════════════════════

(function () {

    // ── Helpers geométricos para construir moléculas fácilmente ──
    const DEG = Math.PI / 180;

    // Cadena en zigzag de n vértices (ángulos de 30°, longitud de enlace 1)
    function zz(x0, y0, n, upFirst) {
        if (upFirst === undefined) upFirst = true;
        const pts = [{ x: x0, y: y0 }];
        let up = upFirst;
        for (let i = 1; i < n; i++) {
            const p = pts[i - 1];
            pts.push({ x: p.x + Math.cos(30 * DEG), y: p.y + (up ? 1 : -1) * Math.sin(30 * DEG) });
            up = !up;
        }
        return pts;
    }
    // Anillo regular de n vértices centrado en (cx,cy)
    function ring(cx, cy, n, startDeg) {
        if (startDeg === undefined) startDeg = 90;
        const R = 1 / (2 * Math.sin(Math.PI / n));
        const pts = [];
        for (let k = 0; k < n; k++) {
            const a = (startDeg - k * (360 / n)) * DEG;
            pts.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) });
        }
        return pts;
    }
    // Traslada un array de puntos
    function tr(pts, dx, dy) { return pts.map(p => ({ x: p.x + dx, y: p.y + dy })); }
    // Punto a distancia d y ángulo deg desde otro punto
    function pt(from, deg, d) {
        if (d === undefined) d = 1;
        return { x: from.x + d * Math.cos(deg * DEG), y: from.y + d * Math.sin(deg * DEG) };
    }
    // Construye lista de átomos a partir de puntos [{x,y}] + mapa de etiquetas {idx:'O'} + cargas {idx:'+'}
    function atoms(pts, labels, charges, stars) {
        labels = labels || {}; charges = charges || {}; stars = stars || {};
        return pts.map((p, i) => ({ x: p.x, y: p.y, label: labels[i] || null, charge: charges[i] || null, star: stars[i] || false }));
    }

    // ── Renderizador de fórmulas esqueléticas ──
    function renderSkeletal(mol, opts) {
        opts = opts || {};
        const unit = opts.unit || 40;
        const pad = opts.pad || 24;
        const xs = mol.atoms.map(a => a.x), ys = mol.atoms.map(a => a.y);
        const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        const W = (maxX - minX) * unit + pad * 2;
        const H = (maxY - minY) * unit + pad * 2;
        const px = x => (x - minX) * unit + pad;
        const py = y => (maxY - y) * unit + pad;

        function shrinkPoint(P, Q, amt) {
            const dx = Q.x - P.x, dy = Q.y - P.y, len = Math.hypot(dx, dy);
            if (len === 0) return P;
            return { x: P.x + dx / len * amt, y: P.y + dy / len * amt };
        }
        function offsetLine(x1, y1, x2, y2, off) {
            const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
            const nx = -dy / len * off, ny = dx / len * off;
            return { x1: x1 + nx, y1: y1 + ny, x2: x2 + nx, y2: y2 + ny };
        }

        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" class="pc-skel-svg">';

        (mol.bonds || []).forEach(b => {
            const i = b[0], j = b[1], order = b[2] || 1;
            const a = mol.atoms[i], c = mol.atoms[j];
            let P1 = { x: px(a.x), y: py(a.y) }, P2 = { x: px(c.x), y: py(c.y) };
            if (a.label) P1 = shrinkPoint(P1, P2, 15);
            if (c.label) P2 = shrinkPoint(P2, P1, 15);

            if (order === 1) {
                svg += `<line x1="${P1.x}" y1="${P1.y}" x2="${P2.x}" y2="${P2.y}" class="pc-skel-bond"/>`;
            } else if (order === 2 && b[3] && b[3].ring) {
                // Doble enlace de anillo: una línea completa + una línea corta
                // interior, desplazada SIEMPRE hacia el centro del anillo.
                const cx = px(b[3].ring.x), cy = py(b[3].ring.y);
                svg += `<line x1="${P1.x}" y1="${P1.y}" x2="${P2.x}" y2="${P2.y}" class="pc-skel-bond"/>`;
                const mx = (P1.x + P2.x) / 2, my = (P1.y + P2.y) / 2;
                let dx0 = cx - mx, dy0 = cy - my;
                const dlen = Math.hypot(dx0, dy0) || 1;
                dx0 = dx0 / dlen * 4.4; dy0 = dy0 / dlen * 4.4;
                const bx = P2.x - P1.x, by = P2.y - P1.y, blen = Math.hypot(bx, by) || 1;
                const ux = bx / blen, uy = by / blen, inset = blen * 0.18;
                const ix1 = P1.x + ux * inset + dx0, iy1 = P1.y + uy * inset + dy0;
                const ix2 = P2.x - ux * inset + dx0, iy2 = P2.y - uy * inset + dy0;
                svg += `<line x1="${ix1}" y1="${iy1}" x2="${ix2}" y2="${iy2}" class="pc-skel-bond"/>`;
            } else if (order === 2) {
                const o1 = offsetLine(P1.x, P1.y, P2.x, P2.y, 4.4);
                const o2 = offsetLine(P1.x, P1.y, P2.x, P2.y, -4.4);
                svg += `<line x1="${o1.x1}" y1="${o1.y1}" x2="${o1.x2}" y2="${o1.y2}" class="pc-skel-bond"/>`;
                svg += `<line x1="${o2.x1}" y1="${o2.y1}" x2="${o2.x2}" y2="${o2.y2}" class="pc-skel-bond"/>`;
            } else if (order === 3) {
                svg += `<line x1="${P1.x}" y1="${P1.y}" x2="${P2.x}" y2="${P2.y}" class="pc-skel-bond"/>`;
                const o1 = offsetLine(P1.x, P1.y, P2.x, P2.y, 6.2);
                const o2 = offsetLine(P1.x, P1.y, P2.x, P2.y, -6.2);
                svg += `<line x1="${o1.x1}" y1="${o1.y1}" x2="${o1.x2}" y2="${o1.y2}" class="pc-skel-bond"/>`;
                svg += `<line x1="${o2.x1}" y1="${o2.y1}" x2="${o2.x2}" y2="${o2.y2}" class="pc-skel-bond"/>`;
            } else if (order === 'wedge') {
                svg += `<line x1="${P1.x}" y1="${P1.y}" x2="${P2.x}" y2="${P2.y}" class="pc-skel-bond pc-skel-dashed"/>`;
            }
        });

        mol.atoms.forEach(a => {
            if (a.label) {
                const x = px(a.x), y = py(a.y);
                const w = 11 + a.label.length * 8;
                svg += `<rect x="${x - w/2}" y="${y - 11}" width="${w}" height="22" rx="3" class="pc-skel-bg"/>`;
                svg += `<text x="${x}" y="${y + 6}" class="pc-skel-label">${a.label}</text>`;
                if (a.charge) svg += `<text x="${x + w/2 - 2}" y="${y - 8}" class="pc-skel-charge">(${a.charge})</text>`;
            }
            if (a.star) {
                const x = px(a.x), y = py(a.y);
                svg += `<text x="${x + 12}" y="${y - 10}" class="pc-skel-star">&#10033;</text>`;
            }
        });

        svg += '</svg>';
        return svg;
    }

    // ── Renderizador de diagramas de orbitales moleculares (lóbulos p) ──
    // Genera los signos de los coeficientes para el MO nº `moIndex` (1 =
    // más baja energía) de una cadena conjugada lineal de N orbitales p
    // (modelo de partícula en una caja / Hückel simplificado, igual que
    // el usado en el enunciado original).
    function pSigns(N, moIndex) {
        const signs = [];
        for (let i = 1; i <= N; i++) {
            const v = Math.sin(i * moIndex * Math.PI / (N + 1));
            signs.push(v >= 0 ? 1 : -1);
        }
        return signs;
    }
    function renderOrbitalRow(N, moIndex, opts) {
        opts = opts || {};
        const blank = !!opts.blank;
        const signs = opts.signs || pSigns(N, moIndex);
        const spacing = 46, lobeW = 20, lobeH = 34, pad = 20;
        const W = spacing * (N - 1) + pad * 2 + lobeW;
        const H = lobeH * 2 + pad * 1.4;
        const cy = H / 2;
        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" class="pc-orb-svg">';
        for (let i = 0; i < N; i++) {
            const cx = pad + lobeW / 2 + i * spacing;
            const topNeg = !blank && signs[i] < 0; // true => lóbulo superior sombreado (fase negativa arriba)
            svg += `<ellipse cx="${cx}" cy="${cy - lobeH/2 + 2}" rx="${lobeW/2}" ry="${lobeH/2}" class="pc-orb-lobe ${topNeg ? 'pc-orb-neg' : 'pc-orb-pos'}"/>`;
            svg += `<ellipse cx="${cx}" cy="${cy + lobeH/2 - 2}" rx="${lobeW/2}" ry="${lobeH/2}" class="pc-orb-lobe ${topNeg ? 'pc-orb-pos' : 'pc-orb-neg'}"/>`;
            svg += `<line x1="${cx}" y1="${cy - lobeH + 4}" x2="${cx}" y2="${cy + lobeH - 4}" class="pc-orb-axis"/>`;
        }
        svg += '</svg>';
        return svg;
    }

    // ════════════════════════════════════════════════════════════════
    // BIBLIOTECA DE MOLÉCULAS
    // Cada entrada: función que construye {atoms, bonds} usando los
    // helpers de arriba. Se evalúan una vez y se cachean.
    // ════════════════════════════════════════════════════════════════
    const BUILDERS = {};
    const CACHE = {};
    function def(id, fn) { BUILDERS[id] = fn; }
    function get(id) {
        if (CACHE[id]) return CACHE[id];
        const fn = BUILDERS[id];
        if (!fn) return null;
        const mol = fn();
        CACHE[id] = mol;
        return mol;
    }

    // ---- fragmentos comunes ----
    function benzeneAt(cx, cy, startDeg) {
        const p = ring(cx, cy, 6, startDeg || 90);
        const c = { x: cx, y: cy };
        // Los dobles enlaces aromáticos llevan el centro del anillo en b[3].ring,
        // para que renderSkeletal dibuje la línea corta SIEMPRE hacia el interior
        // del anillo (como en una fórmula esquelética real), no hacia afuera.
        return { atoms: atoms(p), bonds: [[0,1,2,{ring:c}],[1,2,1],[2,3,2,{ring:c}],[3,4,1],[4,5,2,{ring:c}],[5,0,1]] };
    }
    function mergeMol(parts) {
        // parts: array of {atoms, bonds, offset?} -> concatena reindexando bonds
        let allAtoms = [], allBonds = [];
        let base = 0;
        parts.forEach(p => {
            allAtoms = allAtoms.concat(p.atoms);
            (p.bonds || []).forEach(b => allBonds.push([b[0] + base, b[1] + base, b[2] || 1, b[3]]));
            base += p.atoms.length;
        });
        return { atoms: allAtoms, bonds: allBonds };
    }

    // ═══ Q2 — isocianuros ═══

    def('bromuro-alilo', () => {
        const c = zz(0, 0, 3);
        const a = atoms(c.concat([pt(c[2], -30, 1)]), { 3: 'Br' });
        return { atoms: a, bonds: [[0,1,2],[1,2,1],[2,3,1]] };
    });

    def('alil-isocianuro', () => {
        // CH2=CH-CH2-N≡C:
        const c = zz(0, 0, 3);
        const n = pt(c[2], -30, 1);
        const cIso = pt(n, -90, 1);
        const a = atoms(c.concat([n, cIso]), { 3: 'N', 4: 'C' }, { 4: '\u2212', 3:'' });
        return { atoms: a, bonds: [[0,1,2],[1,2,1],[2,3,1],[3,4,3]] };
    });

    def('alil-nitrilo', () => {
        // CH2=CH-CH2-C≡N  (nitrilo, producto de ataque por carbono con NaCN)
        const c = zz(0, 0, 3);
        const cNit = pt(c[2], -30, 1);
        const n = pt(cNit, -90, 1);
        const a = atoms(c.concat([cNit, n]), { 4: 'N' });
        return { atoms: a, bonds: [[0,1,2],[1,2,1],[2,3,1],[3,4,3]] };
    });

    def('formamida-generica', () => {
        // R-NH-CHO
        const r = { x: -1, y: 0.6 };
        const n = { x: 0, y: 0 };
        const c = pt(n, -30, 1);
        const o = pt(c, -90, 1);
        const a = atoms([r, n, c, o], { 0: 'R', 1: 'NH', 3: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,3,2]] };
    });

    def('acido-formico', () => {
        const c = { x: 0, y: 0 };
        const oh = pt(c, 150, 1);
        const o2 = pt(c, 90, 1);
        const h = pt(c, -30, 0.9);
        const a = atoms([h, c, oh, o2], { 2: 'OH', 3: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[1,3,2]] };
    });

    def('n-metilalilamina', () => {
        const c = zz(0, 0, 3);
        const n = pt(c[2], -30, 1);
        const me = pt(n, -90, 1);
        const a = atoms(c.concat([n, me]), { 3: 'NH' });
        return { atoms: a, bonds: [[0,1,2],[1,2,1],[2,3,1],[3,4,1]] };
    });

    def('piridina', () => {
        const p = ring(0, 0, 6, 90);
        const c = { x: 0, y: 0 };
        const a = atoms(p, { 0: 'N' });
        return { atoms: a, bonds: [[0,1,2,{ring:c}],[1,2,1],[2,3,2,{ring:c}],[3,4,1],[4,5,2,{ring:c}],[5,0,1]] };
    });

    def('butan-2-amina', () => {
        const c = zz(0, 0, 4);
        const nh2 = pt(c[1], 90, 1);
        const a = atoms(c.concat([nh2]), { 4: 'NH2' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,3,1],[1,4,1]] };
    });

    def('3-metoxianilina', () => {
        const ringPts = ring(0, 0, 6, 90);
        const c = { x: 0, y: 0 };
        const nh2 = pt(ringPts[0], 90, 1);
        const ome = pt(ringPts[2], -30, 1);
        const a = atoms(ringPts.concat([nh2, ome]), { 6: 'NH2', 7: 'OMe' });
        return { atoms: a, bonds: [[0,1,2,{ring:c}],[1,2,1],[2,3,2,{ring:c}],[3,4,1],[4,5,2,{ring:c}],[5,0,1],[0,6,1],[2,7,1]] };
    });

    def('n-metilformamida', () => {
        const c = { x: 0, y: 0 };
        const o = pt(c, 90, 1);
        const n = pt(c, -30, 1);
        const me = pt(n, -90, 1);
        const h = pt(c, 210, 0.9);
        const a = atoms([h, c, o, n, me], { 2: 'O', 3: 'NH' });
        return { atoms: a, bonds: [[0,1,1],[1,2,2],[1,3,1],[3,4,1]] };
    });

    def('acetamida', () => {
        const c2 = { x: 0, y: 0 };
        const me = pt(c2, 210, 1);
        const o = pt(c2, 90, 1);
        const n = pt(c2, -30, 1);
        const a = atoms([me, c2, o, n], { 2: 'O', 3: 'NH2' });
        return { atoms: a, bonds: [[0,1,1],[1,2,2],[1,3,1]] };
    });

    def('pirrolidina', () => {
        const p = ring(0, 0, 5, 90);
        const a = atoms(p, { 0: 'NH' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,3,1],[3,4,1],[4,0,1]] };
    });

    def('acido-ciclopropanocarboxilico', () => {
        const tri = ring(0, 0, 3, 90);
        const c = pt(tri[0], 90, 1);
        const oh = pt(c, 150, 1);
        const o2 = pt(c, 30, 1);
        const a = atoms(tri.concat([c, oh, o2]), { 4: 'OH', 5: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,0,1],[0,3,1],[3,4,1],[3,5,2]] };
    });

    def('isocianuro-biciclico-telaprevir', () => {
        // representación simplificada del fragmento bicíclico (hexahidrociclopenta-pirrol) con -NC y el grupo R
        const penta = ring(-0.9, 0, 5, 90);
        const hexa = ring(0.75, 0, 6, 90);
        const n = pt(penta[0], 150, 1);
        const cIso = pt(n, 150, 1);
        const rGroup = pt(hexa[2], -30, 1);
        const parts = mergeMol([
            { atoms: atoms(penta), bonds: [[0,1,1],[1,2,1],[2,3,1],[3,4,1],[4,0,1]] },
            { atoms: atoms(hexa), bonds: [[0,1,1],[1,2,1],[2,3,1],[3,4,1],[4,5,1],[5,0,1]] },
        ]);
        parts.atoms.push({ x: n.x, y: n.y, label: 'N', charge: null });
        parts.atoms.push({ x: cIso.x, y: cIso.y, label: 'C', charge: '\u2212' });
        parts.atoms.push({ x: rGroup.x, y: rGroup.y, label: 'R', charge: null });
        parts.bonds.push([0, 11, 1]); // penta[0] - N   (penta has 5 atoms idx0-4, hexa idx5-10)
        parts.bonds.push([11, 12, 3]); // N - C triple
        parts.bonds.push([7, 13, 1]); // hexa[2]=idx7 - R
        parts.bonds.push([4, 5, 1]); // fusión penta-hexa (comparten arista aproximada)
        return parts;
    });

    def('acetaldehido', () => {
        const c = { x: 0, y: 0 };
        const me = pt(c, 210, 1);
        const o = pt(c, 90, 1);
        const h = pt(c, -30, 0.9);
        const a = atoms([me, c, o, h], { 2: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,2],[1,3,1]] };
    });

    def('fenilisocianuro', () => {
        const b = benzeneAt(0, 0);
        const nc = pt(b.atoms[0], 90, 1);
        b.atoms.push({ x: nc.x, y: nc.y, label: 'NC' });
        b.bonds.push([0, 6, 1]);
        return b;
    });

    def('1-isocianopropano', () => {
        const c = zz(0, 0, 3);
        const nc = pt(c[2], -30, 1);
        const a = atoms(c.concat([nc]), { 3: 'CN' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,3,1]] };
    });

    def('acetona', () => {
        const c = zz(0, 0, 3);
        const o = pt(c[1], 90, 1);
        const a = atoms(c.concat([o]), { 3: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[1,3,2]] };
    });

    def('ciclopentanona', () => {
        const p = ring(0, 0, 5, 90);
        const o = pt(p[0], 90, 1);
        const a = atoms(p.concat([o]), { 5: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,3,1],[3,4,1],[4,0,1],[0,5,2]] };
    });

    def('benzofenona', () => {
        const b1 = benzeneAt(-1.7, -0.5);
        const b2 = benzeneAt(1.7, -0.5);
        const cCarbonyl = { x: 0, y: -0.5 };
        const o = pt(cCarbonyl, 90, 1);
        const m = mergeMol([b1, b2]);
        m.atoms.push({ x: cCarbonyl.x, y: cCarbonyl.y, label: null });
        m.atoms.push({ x: o.x, y: o.y, label: 'O' });
        const cIdx = m.atoms.length - 2, oIdx = m.atoms.length - 1;
        // vértice 2 de cada anillo (ángulo -30°, lado más próximo al centro) para evitar que el enlace cruce el anillo
        m.bonds.push([2, cIdx, 1], [cIdx, 10, 1], [cIdx, oIdx, 2]);
        return m;
    });

    def('acido-acetico', () => {
        const c = { x: 0, y: 0 };
        const me = pt(c, 210, 1);
        const oh = pt(c, 90, 1);
        const o2 = pt(c, -30, 1);
        const a = atoms([me, c, oh, o2], { 2: 'OH', 3: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[1,3,2]] };
    });

    def('acido-benzoico', () => {
        const b = benzeneAt(0, 0);
        const c = pt(b.atoms[0], 90, 1);
        const oh = pt(c, 150, 1);
        const o2 = pt(c, 30, 1);
        b.atoms.push({ x: c.x, y: c.y, label: null }, { x: oh.x, y: oh.y, label: 'OH' }, { x: o2.x, y: o2.y, label: 'O' });
        b.bonds.push([0, 6, 1], [6, 7, 1], [6, 8, 2]);
        return b;
    });

    def('acido-2-metilpropanoico', () => {
        const c1 = { x: 0, y: 0 };
        const ch = pt(c1, 150, 1);
        const me1 = pt(ch, 150, 1);
        const me2 = pt(ch, 90, 1);
        const oh = pt(c1, 90, 1);
        const o2 = pt(c1, -30, 1);
        const a = atoms([c1, ch, me1, me2, oh, o2], { 4: 'OH', 5: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[1,3,1],[0,4,1],[0,5,2]] };
    });

    def('propanal', () => {
        const c = zz(0, 0, 3);
        const o = pt(c[2], 30, 1);
        const a = atoms(c.concat([o]), { 3: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[2,3,2]] };
    });

    def('benzaldehido', () => {
        const b = benzeneAt(0, 0);
        const c = pt(b.atoms[0], 90, 1);
        const o = pt(c, 30, 1);
        b.atoms.push({ x: c.x, y: c.y, label: null }, { x: o.x, y: o.y, label: 'O' });
        b.bonds.push([0, 6, 1], [6, 7, 2]);
        return b;
    });

    def('butan-2-ona', () => {

    // Esqueleto de naftaleno REALMENTE fusionado (comparte la arista C4a-C8a
    // entre los dos anillos, en vez de dos hexágonos sueltos sin enlazar).
    // Numeración: 0=C1 1=C2 2=C3 3=C4 4=C4a 5=C8a 6=C5 7=C6 8=C7 9=C8
    function lawsoneSkeleton() {
        const P = {
            C1: { x: 0.87, y: 1 }, C2: { x: 1.73, y: 0.5 }, C3: { x: 1.73, y: -0.5 }, C4: { x: 0.87, y: -1 },
            C4a: { x: 0, y: -0.5 }, C8a: { x: 0, y: 0.5 },
            C5: { x: -0.87, y: -1 }, C6: { x: -1.73, y: -0.5 }, C7: { x: -1.73, y: 0.5 }, C8: { x: -0.87, y: 1 }
        };
        const pts = [P.C1, P.C2, P.C3, P.C4, P.C4a, P.C8a, P.C5, P.C6, P.C7, P.C8];
        const ringB = { x: 0.867, y: 0 };   // centro del anillo de la quinona (C1-C2-C3-C4-C4a-C8a)
        const ringA = { x: -0.867, y: 0 };  // centro del anillo aromático (C4a-C5-C6-C7-C8-C8a)
        return { pts, ringA, ringB };
    }
    // Enlaces del anillo aromático (siempre iguales: benceno fusionado, Kekulé)
    function lawsoneAromaticBonds(ringA) {
        return [[4,6,1],[6,7,2,{ring:ringA}],[7,8,1],[8,9,2,{ring:ringA}],[9,5,1],[5,4,2,{ring:ringA}]];
    }

    def('lawsone-ceto', () => {
        // Forma "tricetona": C1=O, C2=O, C4=O y C3 es un CH2 (sp3) — la
        // forma que da nombre a "lawsone tiene tres grupos cetona".
        const { pts, ringA } = lawsoneSkeleton();
        const o1 = pt(pts[0], 90, 1), o2 = pt(pts[1], 30, 1), o4 = pt(pts[3], -90, 1);
        const a = atoms(pts.concat([o1, o2, o4]), { 10: 'O', 11: 'O', 12: 'O' });
        return { atoms: a, bonds: [
            [5,0,1], [0,10,2], [0,1,1], [1,11,2], [1,2,1], [2,3,1], [3,12,2], [3,4,1],
            ...lawsoneAromaticBonds(ringA)
        ] };
    });

    def('lawsone-enol-a', () => {
        // Tautómero enólico SIN puente de H (H migra de C3 a O4: C3=C4, C4-OH;
        // C1=O y C2=O se mantienen — el OH en posición 4 no tiene ningún
        // carbonilo vecino con el que formar puente de hidrógeno).
        const { pts, ringA } = lawsoneSkeleton();
        const o1 = pt(pts[0], 90, 1), o2 = pt(pts[1], 30, 1), oh4 = pt(pts[3], -90, 1);
        const a = atoms(pts.concat([o1, o2, oh4]), { 10: 'O', 11: 'O', 12: 'OH' });
        return { atoms: a, bonds: [
            [5,0,1], [0,10,2], [0,1,1], [1,11,2], [1,2,1], [2,3,2], [3,12,1], [3,4,1],
            ...lawsoneAromaticBonds(ringA)
        ] };
    });

    def('lawsone-enol-b', () => {
        // Tautómero enólico CON puente de H intramolecular (H migra de C3 a O2:
        // C2=C3, C2-OH; C1=O y C4=O se mantienen — el OH de la posición 2 es
        // orto al C1=O, permitiendo el puente de hidrógeno). Esta es la forma
        // habitualmente dibujada como "lawsona" (2-hidroxi-1,4-naftoquinona).
        const { pts, ringA } = lawsoneSkeleton();
        const o1 = pt(pts[0], 90, 1), oh2 = pt(pts[1], 30, 1), o4 = pt(pts[3], -90, 1);
        const a = atoms(pts.concat([o1, oh2, o4]), { 10: 'O', 11: 'OH', 12: 'O' });
        return { atoms: a, bonds: [
            [5,0,1], [0,10,2], [0,1,1], [1,11,1], [1,2,2], [2,3,1], [3,12,2], [3,4,1],
            ...lawsoneAromaticBonds(ringA)
        ] };
    });

    def('lawsona-aducto-naranja', () => {
        // Aducto naranja: adición del tiolato de la queratina al C2 de la

        const { pts, ringA, ringB } = lawsoneSkeleton();
        const oh1 = pt(pts[0], 90, 1), s2 = pt(pts[1], 30, 1), oh4 = pt(pts[3], -90, 1);
        const q = pt(s2, 30, 1);

        return { atoms: a, bonds: [
            [5,0,1], [0,1,2,{ring:ringB}], [1,2,1], [2,3,2,{ring:ringB}], [3,4,1],
            [0,10,1], [1,11,1], [11,13,1], [3,12,1],
            ...lawsoneAromaticBonds(ringA)
        ] };
    });

        const { pts, ringA } = lawsoneSkeleton();

        const q = pt(s2, 30, 1);

    def('pirazolona-ester', () => {

    });

    def('tartrazina-simplificada', () => {
        // núcleo de pirazolona con dos anillos de ácido sulfanílico (uno vía N-arilo, otro vía azo) y un carboxilato
        const p = ring(0, 0, 5, 90);
        const arN = benzeneAt(-2.3, 1.1);
        const azoN1 = pt(p[3], -90, 1), azoN2 = pt(azoN1, -90, 1);
        const arAzo = benzeneAt(azoN2.x, azoN2.y - 2, 90);
        const cCarbox = pt(p[2], -30, 1), o1 = pt(cCarbox, -90, 1), o2 = pt(cCarbox, 30, 1);
        const m = mergeMol([{ atoms: atoms(p), bonds: [[0,1,1],[1,2,2,{ring:{x:0,y:0}}],[2,3,1],[3,4,1],[4,0,1]] }, arN, arAzo]);
        const nArIdx = 5; // primer atomo del anillo arN (idx 5..10)
        m.bonds.push([0, nArIdx, 1]);
        m.atoms.push({ x: azoN1.x, y: azoN1.y, label: 'N' }, { x: azoN2.x, y: azoN2.y, label: 'N' });
        const azoN1i = m.atoms.length - 2, azoN2i = m.atoms.length - 1;
        m.bonds.push([3, azoN1i, 1], [azoN1i, azoN2i, 2], [azoN2i, 11, 1]); // arAzo empieza en idx 11
        m.atoms.push({ x: cCarbox.x, y: cCarbox.y, label: null }, { x: o1.x, y: o1.y, label: 'OH' }, { x: o2.x, y: o2.y, label: 'O' });
        const cIdx = m.atoms.length - 3;
        m.bonds.push([2, cIdx, 1], [cIdx, cIdx + 1, 1], [cIdx, cIdx + 2, 2]);
        // grupos SO3H simplificados como etiqueta directa en cada anillo (para no saturar el dibujo)
        const so3a = pt(arN.atoms[3], -90, 1);
        const so3b = pt(arAzo.atoms[3], -90, 1);
        m.atoms.push({ x: so3a.x, y: so3a.y, label: 'SO3H' });
        m.atoms.push({ x: so3b.x, y: so3b.y, label: 'SO3H' });
        m.bonds.push([8, m.atoms.length - 2, 1]); // arN vertex3 = idx 5+3=8
        m.bonds.push([14, m.atoms.length - 1, 1]); // arAzo vertex3 = idx 11+3=14
        return m;
    });

    // ═══ Q4 — polienos conjugados y carotenos ═══

    def('butadieno', () => {
        // CH2=CH-CH=CH2 (1,3-butadieno), con todos los hidrógenos explícitos
        const c = zz(0, 0, 4);
        const h0a = pt(c[0], 150, 1), h0b = pt(c[0], -90, 1);
        const h1 = pt(c[1], 90, 1);
        const h2 = pt(c[2], -90, 1);
        const h3a = pt(c[3], -30, 1), h3b = pt(c[3], 90, 1);
        const a = atoms(c.concat([h0a, h0b, h1, h2, h3a, h3b]), { 4:'H', 5:'H', 6:'H', 7:'H', 8:'H', 9:'H' });
        return { atoms: a, bonds: [[0,1,2],[1,2,1],[2,3,2],[0,4,1],[0,5,1],[1,6,1],[2,7,1],[3,8,1],[3,9,1]] };
    });

    def('hexatrieno', () => {
        // CH2=CH-CH=CH-CH=CH2 (1,3,5-hexatrieno)
        const c = zz(0, 0, 6);
        return { atoms: atoms(c), bonds: [[0,1,2],[1,2,1],[2,3,2],[3,4,1],[4,5,2]] };
    });

    // Anillo terminal tipo beta-ionona (trimetilciclohexeno) con una cadena
    // de polieno saliendo de él — usado para representar de forma
    // simplificada (no 100% IUPAC) el esqueleto de los carotenos.
    function ioninoRing(cx, cy, dobleEnAnillo) {
        const p = ring(cx, cy, 6, 90);
        const me1 = pt(p[4], -150, 0.85), me2 = pt(p[4], -90, 0.85);
        const me3 = pt(p[2], 30, 0.85);
        const bonds = dobleEnAnillo
            ? [[0,1,1],[1,2,1],[2,3,2],[3,4,1],[4,5,1],[5,0,1]]
            : [[0,1,1],[1,2,2],[2,3,1],[3,4,1],[4,5,1],[5,0,1]];
        const a = atoms(p.concat([me1, me2, me3]));
        return { atoms: a, bonds: bonds.concat([[4,6,1],[4,7,1],[2,8,1]]), attachIdx: 0 };
    }
    function caroteneChain(startX) {
        // Cadena central conjugada con alternancia estricta simple/doble
        // (representación esquemática, no numeración IUPAC exacta).
        const pts = zz(startX, 0, 15, false);
        const meIdxs = [1, 4, 7, 10, 13];
        const meAtoms = [];
        const bonds = [];
        for (let i = 0; i < pts.length - 1; i++) bonds.push([i, i + 1, (i % 2 === 0) ? 2 : 1]);
        meIdxs.forEach((idx, k) => {
            const dir = (idx % 4 < 2) ? 90 : -90;
            const m = pt(pts[idx], dir, 0.85);
            meAtoms.push(m);
            bonds.push([idx, pts.length + k, 1]);
        });
        return { atoms: atoms(pts.concat(meAtoms)), bonds, len: pts.length };
    }
    def('beta-caroteno-simplificado', () => {
        const ringL = ioninoRing(-8.2, 0, false);
        const chain = caroteneChain(-6.8);
        const ringR = ioninoRing(-6.8 + (chain.len - 1) * Math.cos(30 * DEG) + 1.3, 0, false);
        const m = mergeMol([ringL, chain]);
        const chainLastIdx = ringL.atoms.length + chain.len - 1;
        const ringRBase = m.atoms.length;
        const m2 = mergeMol([m, ringR]);
        m2.bonds.push([1, ringL.atoms.length, 1]); // anillo izq. -> inicio cadena
        m2.bonds.push([chainLastIdx, ringRBase + 1, 1]); // fin cadena -> anillo der.
        return m2;
    });
    def('alfa-caroteno-simplificado', () => {
        // Igual que el beta-caroteno pero con un doble enlace desplazado en
        // uno de los anillos terminales (representación esquemática).
        const ringL = ioninoRing(-8.2, 0, true);
        const chain = caroteneChain(-6.8);
        const ringR = ioninoRing(-6.8 + (chain.len - 1) * Math.cos(30 * DEG) + 1.3, 0, false);
        const m = mergeMol([ringL, chain]);
        const chainLastIdx = ringL.atoms.length + chain.len - 1;
        const ringRBase = m.atoms.length;
        const m2 = mergeMol([m, ringR]);
        m2.bonds.push([1, ringL.atoms.length, 1]);
        m2.bonds.push([chainLastIdx, ringRBase + 1, 1]);
        return m2;
    });

    def('anilina-simple', () => {
        const b = benzeneAt(0, 0);
        const nh2 = pt(b.atoms[0], 90, 1);
        b.atoms.push({ x: nh2.x, y: nh2.y, label: 'NH2' });
        b.bonds.push([0, 6, 1]);
        return b;
    });

    def('telaprevir-E', () => {
        // Representación esquemática (simplificada) del intermedio E:
        // ciclopropano-C(=O)-NH-CH(Et)-C(=O)-N(anillo pirrolidínico con -OAc y -R)
        const cp = ring(-9.2, 0.2, 3, 90);
        const c1 = pt(cp[0], -10, 1);
        const o1 = pt(c1, 90, 1);
        const nh = pt(c1, -55, 1);
        const ch = pt(nh, -10, 1);
        const et1 = pt(ch, 90, 1), et2 = pt(et1, 40, 1);
        const c2 = pt(ch, -55, 1);
        const o2 = pt(c2, -90, 1);
        const ringN = pt(c2, -15, 1);
        const pRing = ring(ringN.x + 1.05, ringN.y - 0.05, 5, 162);
        const oac_o = pt(pRing[2], -70, 1);
        const oac_c = pt(oac_o, -20, 1);
        const oac_o2 = pt(oac_c, 90, 1);
        const oac_me = pt(oac_c, -40, 1);
        const rGroup = pt(pRing[3], -100, 1);
        const atomsArr = atoms(cp.concat([c1, o1, nh, ch, et1, et2, c2, o2]), { 4: 'O', 5: 'NH', 10: 'O' })
            .concat(atoms(pRing, { 0: 'N' }))
            .concat(atoms([oac_o, oac_c, oac_o2, oac_me, rGroup], { 0: 'O', 2: 'O', 4: 'R' }));
        const bonds = [
            [0,1,1],[1,2,1],[2,0,1],           // ciclopropano
            [0,3,1],                             // ciclopropano - C1
            [3,4,2],                             // C1=O
            [3,5,1],                             // C1-NH
            [5,6,1],                             // NH-CH
            [6,7,1],[7,8,1],                     // CH-CH2-CH3 (etilo)
            [6,9,1],                             // CH-C2
            [9,10,2],                            // C2=O
            [9,11,1],                            // C2-N(anillo)
            [11,12,1],[12,13,1],[13,14,1],[14,15,1],[15,11,1], // anillo pirrolidínico
            [13,16,1],[16,17,1],[17,18,2],[17,19,1],           // O-C(=O)-CH3 (éster)
            [14,20,1]                            // -R
        ];
        return { atoms: atomsArr, bonds };
    });

    // ═══ Q3 — pares de tautómeros con P y N (no carbonados) ═══

    def('fosforo-tautomero-a', () => {
        const p0 = { x: 0, y: 0 };
        const s = pt(p0, 90, 1), oh = pt(p0, 210, 1), oet = pt(p0, -30, 1), et = pt(oet, -30, 1);
        const a = atoms([p0, s, oh, oet, et], { 0: 'P', 1: 'S', 2: 'OH', 3: 'O' });
        return { atoms: a, bonds: [[0,1,2],[0,2,1],[0,3,1],[3,4,1]] };
    });
    def('fosforo-tautomero-b', () => {
        const p0 = { x: 0, y: 0 };
        const sh = pt(p0, 90, 1), o = pt(p0, 210, 1), oet = pt(p0, -30, 1), et = pt(oet, -30, 1);
        const a = atoms([p0, sh, o, oet, et], { 0: 'P', 1: 'SH', 2: 'O', 3: 'O' });
        return { atoms: a, bonds: [[0,1,1],[0,2,2],[0,3,1],[3,4,1]] };
    });
    def('nitro-normal', () => {
        const n = { x: 0, y: 0 };
        const r = pt(n, 150, 1), o1 = pt(n, -30, 1), o2 = pt(n, 90, 1);
        const a = atoms([r, n, o1, o2], { 1: 'N', 2: 'O', 3: 'O' }, { 1: '+', 3: '\u2212' });
        return { atoms: a, bonds: [[0,1,1],[1,2,2],[1,3,1]] };
    });
    def('nitro-aci', () => {
        const c = { x: 0, y: 0 };
        const r = pt(c, 210, 1), n = pt(c, -30, 1), oh = pt(n, -90, 1), o = pt(n, 30, 1);
        const a = atoms([r, c, n, oh, o], { 3: 'OH', 4: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,2],[2,3,1],[2,4,1]] };
    });

    def('imina-inicial', () => {
        // CH3-CH(OH)-CH=NH
        const c = zz(0, 0, 3);
        const oh = pt(c[1], 90, 1);
        const nh = pt(c[2], 30, 1);
        const a = atoms(c.concat([oh, nh]), { 3: 'OH', 4: 'NH' });
        return { atoms: a, bonds: [[0,1,1],[1,2,2],[1,3,1],[2,4,2]] };
    });
    def('imina-tautomero-1', () => {
        // CH3-C(OH)=CH-NH2  (enol-enamina)
        const c = zz(0, 0, 3);
        const oh = pt(c[1], 90, 1);
        const nh2 = pt(c[2], 30, 1);
        const a = atoms(c.concat([oh, nh2]), { 3: 'OH', 4: 'NH2' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[1,3,1],[2,4,1]] };
    });
    def('imina-tautomero-2', () => {
        // CH3-CH(NH2)-CH=O (amino-aldehído)
        const c = zz(0, 0, 3);
        const nh2 = pt(c[1], 90, 1);
        const o = pt(c[2], 30, 1);
        const a = atoms(c.concat([nh2, o]), { 3: 'NH2', 4: 'O' });
        return { atoms: a, bonds: [[0,1,1],[1,2,1],[1,3,1],[2,4,2]] };
    });
    def('imina-tautomero-3', () => {
        // CH2=C(OH)-CH2-NH2
        const c = zz(0, 0, 3);
        const oh = pt(c[1], 90, 1);
        const nh2 = pt(c[2], 30, 1);
        const a = atoms(c.concat([oh, nh2]), { 3: 'OH', 4: 'NH2' });
        return { atoms: a, bonds: [[0,1,2],[1,2,1],[1,3,1],[2,4,1]] };
    });

    // ════════════════════════════════════════════════════════════════
    // API pública
    // ════════════════════════════════════════════════════════════════
    // Tamaños predefinidos para moléculas: "sm" (rejillas con muchos
    // compuestos), "md" (por defecto) y "lg" (una sola molécula protagonista).
    const SIZE_PRESETS = { sm: { unit: 26, pad: 14 }, md: { unit: 36, pad: 20 }, lg: { unit: 46, pad: 24 } };

    function renderMolById(id, size) {
        const mol = get(id);
        if (!mol) return '<span class="pc-mol-missing">[' + id + ']</span>';
        return renderSkeletal(mol, SIZE_PRESETS[size] || SIZE_PRESETS.md);
    }

    function renderAll(root) {
        root = root || document;
        root.querySelectorAll('[data-mol]').forEach(el => {
            const size = el.getAttribute('data-size') || 'md';
            el.innerHTML = renderMolById(el.getAttribute('data-mol'), size);
            el.classList.add('pc-mol-rendered', 'pc-mol-' + size);
        });
        root.querySelectorAll('[data-orbitals]').forEach(el => {
            const N = parseInt(el.getAttribute('data-n') || '6', 10);
            const idx = parseInt(el.getAttribute('data-index') || '1', 10);
            const blank = el.getAttribute('data-blank') === 'true';
            el.innerHTML = renderOrbitalRow(N, idx, { blank });
            el.classList.add('pc-orb-rendered');
        });
        root.querySelectorAll('[data-diagram]').forEach(el => {
            const fn = DIAGRAMS[el.getAttribute('data-diagram')];
            el.innerHTML = fn ? fn() : '<span class="pc-mol-missing">[' + el.getAttribute('data-diagram') + ']</span>';
            el.classList.add('pc-diagram-rendered');
        });
        root.querySelectorAll('[data-scheme]').forEach(el => {
            const fn = SCHEMES[el.getAttribute('data-scheme')];
            el.innerHTML = fn ? fn() : '<span class="pc-mol-missing">[' + el.getAttribute('data-scheme') + ']</span>';
            el.classList.add('pc-scheme-rendered');
        });
    }

    // ════════════════════════════════════════════════════════════════
    // ESQUEMAS DE SÍNTESIS / REACCIÓN
    // Renderiza una fila de: [molécula] --reactivos/condiciones--> [molécula] --> ...
    // steps: array de nodos, donde cada nodo es
    //   { mol: 'id-molecula' }  ó  { text: 'HO' }  (para fórmulas sueltas)
    // y entre nodos, flechas: { arrow: true, above: 'reactivo', below: 'condiciones' }
    // ════════════════════════════════════════════════════════════════
    function renderSchemeItem(node, size) {
        if (node.arrow) {
            return `<div class="pc-scheme-arrow">
                <span class="pc-scheme-arrow-above">${node.above || ''}</span>
                <svg viewBox="0 0 60 14" class="pc-scheme-arrow-svg"><line x1="2" y1="7" x2="52" y2="7" class="pc-skel-bond"/><polygon points="52,2 60,7 52,12" class="pc-scheme-arrowhead"/></svg>
                <span class="pc-scheme-arrow-below">${node.below || ''}</span>
            </div>`;
        }
        if (node.plus) return `<div class="pc-scheme-plus">+</div>`;
        if (node.text === '') return `<div class="pc-scheme-node"></div>`;
        if (node.text) {
            return `<div class="pc-scheme-node"><div class="pc-scheme-text">${node.text}</div>${node.label ? `<div class="pc-scheme-label">${node.label}</div>` : ''}</div>`;
        }
        const svg = renderMolById(node.mol, size || 'sm');
        return `<div class="pc-scheme-node"><div class="pc-scheme-mol">${svg}</div>${node.label ? `<div class="pc-scheme-label">${node.label}</div>` : ''}</div>`;
    }
    function renderScheme(steps, opts) {
        opts = opts || {};
        const rows = opts.rows || [steps];
        const inner = rows.map(row => `<div class="pc-scheme-row">${row.map(n => renderSchemeItem(n, opts.size)).join('')}</div>`).join('');
        return `<div class="pc-scheme-box">${inner}</div>`;
    }

    // ═══ Q6 — síntesis total de la acitretina ═══

    const SCHEMES = {};

    function acitretinAr() {
        // Anillo 4-metoxi-2,3,6-trimetilfenilo (fragmento aromático común
        // a todos los intermedios de esta síntesis).
        const b = benzeneAt(0, 0, 90);
        const me1 = pt(b.atoms[0], 90, 0.85);
        const me2 = pt(b.atoms[5], 150, 0.85);
        const ome = pt(b.atoms[4], -150, 0.85);
        const me3 = pt(b.atoms[3], -90, 0.85);
        b.atoms.push({ x: me1.x, y: me1.y, label: null });
        b.atoms.push({ x: me2.x, y: me2.y, label: null });
        b.atoms.push({ x: ome.x, y: ome.y, label: 'OMe' });
        b.atoms.push({ x: me3.x, y: me3.y, label: null });
        b.bonds.push([0,6,1], [5,7,1], [4,8,1], [3,9,1]);
        return b; // 10 átomos (0-9); el punto de anclaje de la cadena es atoms[1]
    }

    def('acitretina-s0', () => {
        // Compuesto de partida: cetona vinílica aromática
        const ar = acitretinAr();
        const ap = ar.atoms[1];
        const c1 = pt(ap, -30, 1), c2 = pt(c1, 30, 1), c3 = pt(c2, -30, 1);
        const o3 = pt(c3, -90, 1), c4 = pt(c3, 30, 1);
        const chain = atoms([c1, c2, c3, o3, c4], { 3: 'O' });
        const m = mergeMol([ar, { atoms: chain, bonds: [] }]);
        const b = ar.atoms.length;
        m.bonds.push([1,b+0,1], [b+0,b+1,2], [b+1,b+2,1], [b+2,b+3,2], [b+2,b+4,1]);
        return m;
    });

    def('acitretina-s1', () => {
        // Tras acilación de Claisen con formiato: enolato sódico del β-cetoaldehído
        const ar = acitretinAr();
        const ap = ar.atoms[1];
        const c1 = pt(ap, -30, 1), c2 = pt(c1, 30, 1), c3 = pt(c2, -30, 1);
        const o3 = pt(c3, -90, 1), c4 = pt(c3, 30, 1), c5 = pt(c4, -30, 1);
        const ona = pt(c5, 30, 1);
        const chain = atoms([c1, c2, c3, o3, c4, c5, ona], { 3: 'O', 6: 'ONa' });
        const m = mergeMol([ar, { atoms: chain, bonds: [] }]);
        const b = ar.atoms.length;
        m.bonds.push([1,b+0,1], [b+0,b+1,2], [b+1,b+2,1], [b+2,b+3,2], [b+2,b+4,1], [b+4,b+5,2], [b+5,b+6,1]);
        return m;
    });

    def('acitretina-s2', () => {
        // Tras hidrólisis ácida (tautomerización) y protección MeOH/H2SO4: acetal dimetílico
        const ar = acitretinAr();
        const ap = ar.atoms[1];
        const c1 = pt(ap, -30, 1), c2 = pt(c1, 30, 1), c3 = pt(c2, -30, 1);
        const o3 = pt(c3, -90, 1), c4 = pt(c3, 30, 1), c5 = pt(c4, -30, 1);
        const ome1 = pt(c5, 30, 1), ome2 = pt(c5, -90, 1);
        const chain = atoms([c1, c2, c3, o3, c4, c5, ome1, ome2], { 3: 'O', 6: 'OMe', 7: 'OMe' });
        const m = mergeMol([ar, { atoms: chain, bonds: [] }]);
        const b = ar.atoms.length;
        m.bonds.push([1,b+0,1], [b+0,b+1,2], [b+1,b+2,1], [b+2,b+3,2], [b+2,b+4,1], [b+4,b+5,1], [b+5,b+6,1], [b+5,b+7,1]);
        return m;
    });

    def('acitretina-s3', () => {
        // Wittig de metilenación + isomerización: dieno conjugado con metilo, acetal intacto
        const ar = acitretinAr();
        const ap = ar.atoms[1];
        const c1 = pt(ap, -30, 1), c2 = pt(c1, 30, 1), c3 = pt(c2, -30, 1);
        const me3 = pt(c3, -90, 1), c4 = pt(c3, 30, 1), c5 = pt(c4, -30, 1);
        const ome1 = pt(c5, 30, 1), ome2 = pt(c5, -90, 1);
        const chain = atoms([c1, c2, c3, me3, c4, c5, ome1, ome2], { 6: 'OMe', 7: 'OMe' });
        const m = mergeMol([ar, { atoms: chain, bonds: [] }]);
        const b = ar.atoms.length;
        m.bonds.push([1,b+0,1], [b+0,b+1,2], [b+1,b+2,1], [b+2,b+3,1], [b+2,b+4,2], [b+4,b+5,1], [b+5,b+6,1], [b+5,b+7,1]);
        return m;
    });

    def('acitretina-s4', () => {
        // Desprotección ácida a aldehído (enal), conjugación extendida
        const ar = acitretinAr();
        const ap = ar.atoms[1];
        const c1 = pt(ap, -30, 1), c2 = pt(c1, 30, 1), c3 = pt(c2, -30, 1);
        const me3 = pt(c3, -90, 1), c4 = pt(c3, 30, 1), c5 = pt(c4, -30, 1);
        const o5 = pt(c5, 30, 1);
        const chain = atoms([c1, c2, c3, me3, c4, c5, o5], { 6: 'O' });
        const m = mergeMol([ar, { atoms: chain, bonds: [] }]);
        const b = ar.atoms.length;
        m.bonds.push([1,b+0,1], [b+0,b+1,2], [b+1,b+2,1], [b+2,b+3,1], [b+2,b+4,2], [b+4,b+5,1], [b+5,b+6,2]);
        return m;
    });

    def('acitretina-s5', () => {
        // Tras condensación de Stobbe con un succinato metilado: éster/ácido vecinales
        const ar = acitretinAr();
        const ap = ar.atoms[1];
        const c1 = pt(ap, -30, 1), c2 = pt(c1, 30, 1), c3 = pt(c2, -30, 1);
