<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body>
<script id="mol-graph">

// ════════════════════════════════════════════════════════════════════
// MolGraph — motor de dibujo químico reutilizable (sucesor de ChemDraw)
//
// Diferencia clave con ChemDraw: las estructuras orgánicas/inorgánicas
// (fórmulas esqueléticas) ya NO se definen a mano átomo por átomo.
// Se definen con una línea de SMILES, y el layout 2D (ángulos de
// enlace, aromaticidad, resonancia visual, disposición general) lo
// calcula RDKit.js — el mismo motor de química computacional que usa
// buena parte de la industria/academia — vía WebAssembly, en el propio
// navegador del usuario (sin backend, sin coste de servidor).
//
// Lo que RDKit NO sabe dibujar (porque no son estructuras químicas
// reales, sino diagramas didácticos abstractos) se queda en el motor
// "manual" heredado de ChemDraw: diagramas de orbitales moleculares,
// diagramas de puntos y cruces, interferencia de fases p, celdas
// unidad/poliedros, etc. MolGraph es por tanto un motor HÍBRIDO:
//   - RDKit.js  → cualquier molécula real (dado un SMILES)
//   - motor manual heredado → diagramas abstractos que no son moléculas
//
// El montaje de ESQUEMAS DE SÍNTESIS (cajas + flechas + texto encima/
// debajo + reparto en varias líneas tipo "serpiente") tampoco lo hace
// RDKit (no es su trabajo) y se mantiene tal cual funcionaba en
// ChemDraw, solo que ahora cada "nodo" molécula lleva un SMILES en vez
// de un id apuntando a coordenadas escritas a mano.
//
// ── Uso desde el contenido de un problema (100% compatible con el
//    HTML que ya tienes escrito para ChemDraw) ──
//   <span class="pc-mol" data-mol="acetona"></span>
//   <span class="pc-mol" data-smiles="CC(=O)C"></span>   (nuevo: SMILES directo)
//   <div class="pc-orbitals" data-n="6" data-index="3"></div>
//
// Color de los átomos: por defecto TODO el esqueleto (enlaces y
// etiquetas de heteroátomo: O, N, S, halógenos...) se dibuja en el
// mismo color estándar (negro/tinta), como en una fórmula esquelética
// de libro de texto — nada de rojo para O o azul para N por defecto.
// Si un caso concreto necesita el coloreado clásico tipo CPK (p.ej.
// para señalar visualmente heteroátomos en un problema didáctico),
// se especifica explícitamente con data-color-atoms="true", o con
// { colorAtoms: true } en un nodo de esquema / llamada directa a la API.
//
// Y tras inyectar el HTML:
//   await MolGraph.renderAll(root);     // <-- ahora es ASÍNCRONO
//                                        //     (hay que esperar a que
//                                        //     cargue el WASM de RDKit)
// ════════════════════════════════════════════════════════════════════

(function () {

    // ────────────────────────────────────────────────────────────────
    // 1) CARGA DE RDKit.js (WebAssembly) — una sola vez, cacheada
    // ────────────────────────────────────────────────────────────────
    // Se sirve desde jsDelivr (CDN público, gratuito, con caché de
    // navegador entre visitas). Si prefieres alojarlo tú mismo en el
    // repo (p.ej. para evitar cualquier dependencia externa), basta con
    // cambiar RDKIT_JS_URL / RDKIT_WASM_URL a rutas locales — el resto
    // del motor no cambia.
    const RDKIT_JS_URL = 'https://cdn.jsdelivr.net/npm/@rdkit/rdkit@2025.3.4-1.0.0/dist/RDKit_minimal.js';
    const RDKIT_WASM_LOCATE = (file) => 'https://cdn.jsdelivr.net/npm/@rdkit/rdkit@2025.3.4-1.0.0/dist/' + file;

    let _rdkitPromise = null;
    function loadRDKit() {
        if (_rdkitPromise) return _rdkitPromise;
        _rdkitPromise = new Promise((resolve, reject) => {
            if (window.RDKit) return resolve(window.RDKit);
            if (typeof window.initRDKitModule === 'function') {
                window.initRDKitModule({ locateFile: RDKIT_WASM_LOCATE })
                    .then(mod => { window.RDKit = mod; resolve(mod); })
                    .catch(reject);
                return;
            }
            const s = document.createElement('script');
            s.src = RDKIT_JS_URL;
            s.onload = () => {
                window.initRDKitModule({ locateFile: RDKIT_WASM_LOCATE })
                    .then(mod => { window.RDKit = mod; resolve(mod); })
                    .catch(reject);
            };
            s.onerror = () => reject(new Error('No se pudo cargar RDKit.js desde ' + RDKIT_JS_URL));
            document.head.appendChild(s);
        });
        return _rdkitPromise;
    }

    // ────────────────────────────────────────────────────────────────
    // 2) SMILES → SVG, con estilo acorde al sitio (fondo transparente,
    //    grosor de enlace uniforme, tamaño consistente con los presets
    //    que ya usaba ChemDraw: sm/md/lg).
    // ────────────────────────────────────────────────────────────────
    const SIZE_PRESETS = {
        sm: { w: 190, h: 140, bond: 1.7 },
        md: { w: 260, h: 190, bond: 1.9 },
        lg: { w: 340, h: 250, bond: 2.1 }
    };

    const _molCache = {}; // smiles+size+color -> svg string (evita recalcular layout)

    // Color "estándar" para heteroátomos (O, N, S, halógenos, metales...)
    // cuando NO se pide coloreado tipo CPK: el mismo tono que usan los
    // enlaces, para que ningún átomo destaque por color salvo que se
    // especifique explícitamente (colorAtoms: true).
    //
    // OJO: no basta con `symbolColour` — esa opción SOLO tiñe el texto
    // de la etiqueta (la "O", la "N"...); la mitad del enlace pegada al
    // heteroátomo se sigue coloreando con la paleta CPK por defecto
    // (rojo hacia O, azul hacia N...) a menos que además se sobrescriba
    // `atomColourPalette` con el mismo color para esos números atómicos.
    // Cubrimos los elementos que aparecen en problemas de química
    // orgánica/inorgánica de olimpiada; el carbono (6) no hace falta
    // listarlo porque su color por defecto en RDKit ya es este mismo negro.
    const STANDARD_ATOM_COLOUR = [0.06, 0.06, 0.06];
    const STANDARD_ATOM_NUMBERS = [
        1, 5, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17,
        19, 20, 24, 25, 26, 27, 28, 29, 30, 35, 47, 53, 56, 78, 79, 80
    ]; // H,B,N,O,F,Na,Mg,Al,Si,P,S,Cl,K,Ca,Cr,Mn,Fe,Co,Ni,Cu,Zn,Br,Ag,I,Ba,Pt,Au,Hg
    const STANDARD_ATOM_PALETTE = {};
    STANDARD_ATOM_NUMBERS.forEach(z => { STANDARD_ATOM_PALETTE[z] = STANDARD_ATOM_COLOUR; });

    // ────────────────────────────────────────────────────────────────
    // 2.b) REETIQUETADO DE ÁTOMOS COMODÍN — RDKit dibuja un átomo
    //      comodín [*:N] literalmente como texto "*" (+ el número de
    //      mapeo), lo cual no es la notación química habitual. Para los
    //      usos didácticos de este banco (grupos R variables, átomos
    //      genéricos X/Y/Z, un H "postizo" explícito, el grupo &ndash;NC
    //      de un isocianuro abreviado, o el resto "R'" de una cadena de
    //      queratina) sustituimos ese rótulo DESPUÉS de que RDKit calcule
    //      el layout 2D y el SVG final.
    //
    //      Primer intento (fallido): buscar texto tipo "*:1" dentro de
    //      los <text> del SVG. No funcionó de forma fiable porque RDKit
    //      reparte el símbolo del átomo y su número de mapeo en varios
    //      fragmentos de texto internos, así que el patrón exacto nunca
    //      terminaba de coincidir siempre.
    //
    //      Solución robusta: RDKit SIEMPRE marca cada trazo (texto o
    //      trazo de enlace) de un átomo con la clase CSS "atom-<índice>"
    //      — es el mismo mecanismo que usa para resaltar átomos — así
    //      que en vez de adivinar el texto, calculamos nosotros mismos
    //      (recorriendo el SMILES, igual que lo hace RDKit al parsear)
    //      el índice de átomo de cada [*:N], localizamos TODOS los
    //      elementos con esa clase, y los sustituimos por un único
    //      <text> nuevo en la misma posición, con el rótulo que
    //      queremos. Esto no depende de cómo RDKit trocee el texto
    //      internamente.
    //
    //      Números de mapeo reservados (namespace propio de este banco,
    //      no tiene relación con reacciones/SMARTS reales):
    //        1-4 → R¹ R² R³ R⁴   (sustituyentes variables, p.ej. Passerini)
    //        5-7 → X Y Z         (átomos genéricos, tautomería general)
    //        8   → R'            (resto de una proteína de queratina)
    //        9   → NC            (isocianuro abreviado, sin dibujar N≡C)
    //        10  → H             (hidrógeno explícito "postizo")
    // ────────────────────────────────────────────────────────────────
    const SUP_DIGITS = { '0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074' };
    const WILDCARD_LABELS = {
        '1': 'R' + SUP_DIGITS['1'], '2': 'R' + SUP_DIGITS['2'],
        '3': 'R' + SUP_DIGITS['3'], '4': 'R' + SUP_DIGITS['4'],
        '5': 'X', '6': 'Y', '7': 'Z',
        '8': "R'", '9': 'NC', '10': 'H'
    };

    // Recorre un SMILES en el MISMO orden en que RDKit asigna índices de
    // átomo (orden de aparición; los dígitos de cierre de anillo, signos
    // de enlace, paréntesis de rama y puntos de desconexión NO cuentan
    // como átomo) y devuelve {índiceDeÁtomo: nºDeMapeo} para cada átomo
    // comodín [*:N] que encuentre.
    function _atomIndexOfMapNums(smiles) {
        const map = {};
        let atomIdx = 0, i = 0;
        while (i < smiles.length) {
            const c = smiles[i];
            if (c === '[') {
                const close = smiles.indexOf(']', i);
                const inner = smiles.slice(i + 1, close);
                const mm = inner.match(/:(\d+)/);
                if (mm) map[atomIdx] = mm[1];
                atomIdx++;
                i = close + 1;
                continue;
            }
            if (c === 'C' && smiles[i + 1] === 'l') { atomIdx++; i += 2; continue; }
            if (c === 'B' && smiles[i + 1] === 'r') { atomIdx++; i += 2; continue; }
            if (/[A-Za-z]/.test(c)) { atomIdx++; i++; continue; }
            i++; // dígitos de anillo, ( ) = # - / \ . + %
        }
        return map;
    }

    function _relabelWildcardAtoms(svg, mapNumsByIdx) {
        if (!mapNumsByIdx || !Object.keys(mapNumsByIdx).length) return svg;
        try {
            const wrap = document.createElement('div');
            wrap.innerHTML = svg;
            const svgEl = wrap.querySelector('svg');
            if (!svgEl) return svg;
            Object.keys(mapNumsByIdx).forEach(idxStr => {
                const label = WILDCARD_LABELS[mapNumsByIdx[idxStr]];
                if (!label) return;
                const nodes = Array.prototype.slice.call(svgEl.querySelectorAll('.atom-' + idxStr));
                if (!nodes.length) return;
                let x = null, y = null, fontSize = null, fill = null;
                nodes.forEach(n => {
                    if (x === null && n.hasAttribute && n.hasAttribute('x')) {
                        x = n.getAttribute('x'); y = n.getAttribute('y');
                    }
                    const style = (n.getAttribute && n.getAttribute('style')) || '';
                    if (!fontSize) { const fm = style.match(/font-size:\s*([\d.]+)px/); if (fm) fontSize = fm[1]; }
                    if (!fill) { const cm = style.match(/fill:\s*(#[0-9A-Fa-f]{3,8})/); if (cm) fill = cm[1]; }
                });
                nodes.forEach(n => { if (n.parentNode) n.parentNode.removeChild(n); });
                if (x === null) return; // no había ningún <text> para este átomo: no arriesgamos a mal-posicionar
                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                t.setAttribute('x', x);
                t.setAttribute('y', y);
                t.setAttribute('text-anchor', 'middle');
                t.setAttribute('class', 'atom-' + idxStr + ' pc-wildcard-label');
                t.setAttribute('style', 'font-size:' + (fontSize || '15') + 'px;font-family:sans-serif;fill:' + (fill || '#161616') + ';font-weight:600;');
                t.textContent = label;
                svgEl.appendChild(t);
            });
            return wrap.innerHTML;
        } catch (e) {
            return svg;
        }
    }

    function svgForSmiles(smiles, size, colorAtoms) {
        if (!window.RDKit) return null;
        const preset = SIZE_PRESETS[size] || SIZE_PRESETS.md;
        const cacheKey = smiles + '|' + size + '|' + (colorAtoms ? 'cpk' : 'std');
        if (_molCache[cacheKey]) return _molCache[cacheKey];

        const mol = window.RDKit.get_mol(smiles);
        if (!mol) return null;
        try {
            const details = {
                width: preset.w,
                height: preset.h,
                bondLineWidth: preset.bond,
                addStereoAnnotation: false,
                backgroundColour: [1, 1, 1, 0] // fondo transparente: hereda el fondo de la tarjeta (claro u oscuro)
            };
            // Por defecto, sin coloreado por elemento: O, N, S, halógenos...
            // se dibujan en el mismo color estándar que el resto del
            // esqueleto (etiqueta Y enlace). Solo si colorAtoms===true se
            // deja que RDKit use su paleta CPK habitual (rojo=O, azul=N...).
            if (!colorAtoms) {
                details.symbolColour = STANDARD_ATOM_COLOUR;
                details.atomColourPalette = STANDARD_ATOM_PALETTE;
            }
            let svg = mol.get_svg_with_highlights(JSON.stringify(details));
            // Quita el rect de fondo que RDKit añade igualmente (por si
            // algún visor ignora el canal alfa) y las etiquetas propias
            // de RDKit; deja solo <svg>...</svg> con los trazos.
            svg = svg.replace(/<rect[^>]*fill:#FFFFFF00[^>]*>\s*<\/rect>/i, '');
            svg = svg.replace('<svg ', '<svg class="pc-skel-svg pc-mol-rdkit" ');
            const mapNums = _atomIndexOfMapNums(smiles);
            svg = _relabelWildcardAtoms(svg, mapNums);
            _molCache[cacheKey] = svg;
            return svg;
        } finally {
            mol.delete();
        }
    }

    // ────────────────────────────────────────────────────────────────
    // 3) REGISTRO DE MOLÉCULAS — antes eran ~80 funciones de 10-40
    //    líneas cada una (coordenadas a mano). Ahora es un diccionario
    //    id → SMILES. Añadir una molécula nueva es escribir una línea.
    //
    //    Convención para "resto de la molécula" (grupos R, como en
    //    telaprevir o en los productos genéricos de Passerini): átomo
    //    comodín con número de mapeo, [*:1], [*:2]... RDKit lo dibuja
    //    como "*:1" — notación estándar de punto de conexión, más
    //    informativa que una simple "R" cuando hay varios R distintos
    //    en la misma estructura (R¹, R², R³, R⁴ del Passerini general).
    // ────────────────────────────────────────────────────────────────
    const MOLS = {

        // ═══ Q2 — isocianuros ═══
        'fenilisocianuro':              '[*:9]c1ccccc1',
        '1-isocianopropano':            'CCC[*:9]',
        'alil-isocianuro':              'C=CC[*:9]',
        'alil-nitrilo':                 'C=CCC#N',
        'bromuro-alilo':                'C=CCBr',
        'formamida-generica':           '[*:1]NC=O',
        'acido-formico':                'OC=O',
        'n-metilalilamina':             'C=CCNC',
        'piridina':                     'c1ccncc1',
        'butan-2-amina':                'CC(N)CC',
        '3-metoxianilina':              'COc1cccc(N)c1',
        'dimetilamina':                 'CNC',
        'acetamida':                    'CC(N)=O',
        'pirrolidina':                  'C1CCNC1',
        'acetona':                      'CC(C)=O',
        'ciclopentanona':               'O=C1CCCC1',
        'benzofenona':                  'O=C(c1ccccc1)c1ccccc1',
        'acido-acetico':                'CC(=O)O',
        'acido-benzoico':               'OC(=O)c1ccccc1',
        'acido-2-metilpropanoico':      'CC(C)C(=O)O',
        'propanal':                     'CCC=O',
        'benzaldehido':                 'O=Cc1ccccc1',
        'butan-2-ona':                  'CCC(C)=O',
        'acido-ciclopropanocarboxilico':'OC(=O)C1CC1',
        'acetaldehido':                 'CC=O',
        // 4-metil-1,3-diisocianobenceno: dos isocianuros en el anillo, meta
        // entre sí, uno para y otro orto al metilo (verificado contra la
        // figura de la p.5 del examen — la posición relativa importa
        // porque hace que los dos grupos NC sean químicamente distintos).
        'diisocianobenceno':            '[*:9]c1ccc(C)c([*:9])c1',
        // OJO: pese al nombre heredado ("...propano"), la figura del
        // examen muestra solo DOS carbonos (CN-CH2-CH2-NC): es en
        // realidad 1,2-diisocianoetano. Mantengo el id por compatibilidad
        // con el contenido ya escrito; el SMILES sí está corregido.
        'diisocianopropano':            '[*:9]CC[*:9]',
        // Carbono cuaternario con TRES isocianuros directos (equivalentes
        // entre sí) más un cuarto brazo isocianometilo (-CH2-NC, distinto
        // por tener un espaciador) → 2 entornos de isocianuro distintos.
        // Confirmado contra la figura: el "armario de Galvin" contiene
        // 2 (bencénico) + 1 (etano, simétrico) + 2 (este) = 5 isocianuros
        // distinguibles, tal y como exige el mark scheme del apartado (k).
        'trisisocianometano':           '[*:9]CC([*:9])([*:9])[*:9]',
        // Corregido tras revisar la p.5 del examen a alta resolución: NO
        // llevan hidroxilo, son ácidos poli-carboxílicos "puros". Con
        // ácido benzoico (1 tipo) + este ácido trimelítico (3 tipos, sin
        // simetría) + tereftálico (1 tipo, simétrico) = 5 grupos ácido
        // distinguibles, tal y como exige el mark scheme del apartado (k).
        'acido-2-hidroxi-dicarboxibenzoico': 'OC(=O)c1ccc(C(=O)O)c(C(=O)O)c1', // ácido trimelítico (benceno-1,2,4-tricarboxílico) — id heredado, ver nota
        'acido-4-hidroxibenzoico':      'OC(=O)c1ccc(C(=O)O)cc1', // ácido tereftálico (benceno-1,4-dicarboxílico) — id heredado, ver nota
        'passerini-acido-generico':     '[*:1]C(=O)O',
        'passerini-isocianuro-generico':'[*:2][*:9]',
        'passerini-cetona-generica':    '[*:3]C([*:4])=O',
        'passerini-producto-generico':  '[*:1]C(=O)OC([*:3])([*:4])C(=O)N[*:2]',
        'passerini-producto-general':   '[*:1]C(=O)OC([*:3])([*:4])C(=O)N[*:2]',
        // Los TRES reactivos reales del Passerini que da compuesto E
        // (verificado contra la figura de la p.4/p.5 y el mark scheme (g)):
        //   1. ácido acético            (ya está: 'acido-acetico')
        //   2. ciclopropil-isocianuro   (el isocianuro, R² = ciclopropilo)
        //   3. un aldehído amino-N-acilado por el anillo bicíclico
        // El "isocianuro bicíclico" que había definido antes NO existe:
        // el anillo bicíclico entra como parte del ALDEHÍDO (amina ya
        // acilada), no del isocianuro. Corregido:
        'ciclopropil-isocianuro':       '[*:9]C1CC1',
        'telaprevir-aldehido-biciclico':'O=CC(CCC)NC(=O)C1C2CCCC2CN1[*:1]',
        'telaprevir-E':                 'O=C(NC1CC1)C(OC(C)=O)C(CCC)NC(=O)C1C2CCCC2CN1[*:1]',

        // ═══ Q3 — henna / tautomería ═══
        'lawsone-ceto':                 'O=C1c2ccccc2C(=O)C(=O)C1',
        'lawsone-enol-a':               'O=C1c2ccccc2C(O)=C(O)C1=O',
        'lawsone-enol-b':               'Oc1c(O)c(=O)c2ccccc2c1=O',
        'ciclohexanona':                'O=C1CCCCC1',
        // Con hidrógenos explícitos: al ser una molécula tan pequeña (un
        // solo carbono), dibujarla sin H visibles dejaría solo un trazo
        // "=O" suelto, sin ninguna referencia de dónde está el carbono.
        // Los H se representan como átomos comodín (nº de mapeo 10, ver
        // _relabelWildcardAtoms) en vez de [H] real, porque RDKit
        // eliminaría un [H] explícito normal al sanear la molécula.
        'formaldehido':                 '[*:10]C(=O)[*:10]',
        'pivalona':                     'CC(C)(C)C(=O)C',
        'pivalaldehido':                'CC(C)(C)C=O',
        'acroleina':                    'C=CC=O',
        'benzil':                       'O=C(c1ccccc1)C(=O)c1ccccc1',
        'metilvinilcetona':             'C=CC(C)=O',
        'fosforo-tautomero-a':          'COP(=S)(OC)O',
        'fosforo-tautomero-b':          'COP(=O)(OC)S',
        'nitro-normal':                 'CC[N+](=O)[O-]',
        'nitro-aci':                    'CC=[N+]([O-])O',
        'imina-inicial':                'CC(N)=O',
        'imina-tautomero-1':            'CC(O)=N',
        'imina-tautomero-2':            'C=C(O)N',
        'imina-tautomero-3':            'CC(=N)O',
        'acetamida-tautomero':          'CC(O)=N',
        'tautomeria-ceto-ejemplo':      'CC(C)=O',
        'tautomeria-enol-ejemplo':      'CC(O)=C',
        // Ecuación general de tautomería X=Y–Z–H ⇌ X(H)–Y=Z: átomos
        // genéricos (no elementos reales) y un H "postizo" explícito,
        // todos como átomos comodín con número de mapeo reservado —
        // ver _relabelWildcardAtoms (X=5, Y=6, Z=7, H=10).
        'tautomeria-xyz-izq':           '[*:5]=[*:6][*:7][*:10]',
        'tautomeria-xyz-der':           '[*:10][*:5][*:6]=[*:7]',
        // El resto de la cadena lateral de queratina se abrevia como
        // "Ker" (átomo comodín, número de mapeo 8) en vez de dibujar un
        // anillo de fenilo que no pertenece a la estructura real.
        'lawsona-aducto-naranja':       'Oc1c2ccccc2c(O)c(S[*:8])c1O',
        'lawsona-aducto-marron':        'O=C1c2ccccc2C(=O)C(S[*:8])=C1O',

        // ═══ Q4 — carotenos / tartrazina ═══
        'butadieno':                    'C=CC=C',
        'hexatrieno':                   'C=CC=CC=C',
        'alfa-caroteno-simplificado':   'CC1=C(C)CCCC1(C)/C=C/C=C(C)/C=C/C=C(C)/C=C/C=C(C)/C=C/C1C(C)=CCCC1(C)C',

    function smilesById(id) { return MOLS[id] || null; }

    // ────────────────────────────────────────────────────────────────
    // 4) DIAGRAMAS ABSTRACTOS (heredados sin cambios de ChemDraw) —
    //    orbitales p / interferencia de fases / MO. RDKit no interviene
    //    aquí porque no son moléculas, son esquemas didácticos.
    // ────────────────────────────────────────────────────────────────
    function pSigns(N, moIndex) {
        // Signos alternos de los lóbulos p para el MO nº moIndex (1..N)
        // de una cadena conjugada de N orbitales p (Hückel simple).
        const signs = [];
        for (let k = 0; k < N; k++) {
            const v = Math.sin((moIndex * (k + 1) * Math.PI) / (N + 1));
            signs.push(v >= 0 ? 1 : -1);
        }
        return signs;
    }
    function renderOrbitalRow(N, moIndex, opts) {
        opts = opts || {};
        const blank = !!opts.blank;
        const signs = opts.signs || pSigns(N, moIndex);
        const spacing = 46, lobeW = 20, lobeH = 34, pad = 20;
        const W = spacing * (N - 1) + pad * 2 + lobeW;
        const H = lobeH * 2 + pad * 1.4;
        const cy = H / 2;
        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" class="pc-orb-svg">';
        for (let i = 0; i < N; i++) {
            const cx = pad + lobeW / 2 + i * spacing;
            const topNeg = !blank && signs[i] < 0;
            svg += `<ellipse cx="${cx}" cy="${cy - lobeH/2 + 2}" rx="${lobeW/2}" ry="${lobeH/2}" class="pc-orb-lobe ${topNeg ? 'pc-orb-neg' : 'pc-orb-pos'}"/>`;
            svg += `<ellipse cx="${cx}" cy="${cy + lobeH/2 - 2}" rx="${lobeW/2}" ry="${lobeH/2}" class="pc-orb-lobe ${topNeg ? 'pc-orb-pos' : 'pc-orb-neg'}"/>`;
            svg += `<line x1="${cx}" y1="${cy - lobeH + 4}" x2="${cx}" y2="${cy + lobeH - 4}" class="pc-orb-axis"/>`;
        }
        svg += '</svg>';
        return svg;
    }

    // ────────────────────────────────────────────────────────────────
    // 5) RENDER DE UN NODO "MOLÉCULA" (usado tanto por [data-mol] /
    //    [data-smiles] sueltos como dentro de un esquema de síntesis)
    // ────────────────────────────────────────────────────────────────
    function renderMolSmiles(smiles, size, colorAtoms) {
        const svg = svgForSmiles(smiles, size || 'md', !!colorAtoms);
        if (!svg) return '<span class="pc-mol-missing">[SMILES inválido: ' + smiles + ']</span>';
        return svg;
    }
    function renderMolById(id, size, colorAtoms) {
        const smiles = smilesById(id);
        if (!smiles) return '<span class="pc-mol-missing">[' + id + ']</span>';
        return renderMolSmiles(smiles, size, colorAtoms);
    }

    // ────────────────────────────────────────────────────────────────
    // 6) snake-wrap de filas de esquema (idéntico a ChemDraw, sin
    //    cambios — es puro layout de caja, no depende de RDKit)
    // ────────────────────────────────────────────────────────────────
    function snakeifySchemeRows(root) {
        root.querySelectorAll('.pc-scheme-row').forEach(row => {
            if (row.dataset.snaked === '1') return;
            const children = Array.from(row.children);
            if (children.length <= 1) return;
            const prevAlign = row.style.alignItems;
            row.style.alignItems = 'flex-start';
            const lines = [];
            let curTop = null, curLine = [];
            children.forEach(ch => {
                const top = ch.offsetTop;
                if (curTop === null || Math.abs(top - curTop) < 6) {
                    curLine.push(ch);
                    if (curTop === null) curTop = top;
                } else {
                    lines.push(curLine);
                    curLine = [ch];
                    curTop = top;
                }
            });
            if (curLine.length) lines.push(curLine);
            row.style.alignItems = prevAlign;
            row.dataset.snaked = '1';
            if (lines.length <= 1) return;
            row.classList.add('pc-scheme-row-snake');
            const frag = document.createDocumentFragment();
            lines.forEach((line, i) => {
                const div = document.createElement('div');
                const reversed = i % 2 === 1;
                div.className = 'pc-scheme-line' + (reversed ? ' pc-scheme-line-rev' : '');
                line.forEach(ch => div.appendChild(ch));
                if (i < lines.length - 1) {
                    const turn = document.createElement('div');
                    turn.className = 'pc-scheme-turn' + (reversed ? ' pc-scheme-turn-left' : ' pc-scheme-turn-right');
                    turn.innerHTML = '<svg viewBox="0 0 20 20" class="pc-scheme-turn-svg"><path d="M10 1 L10 13 M5 9 L10 15 L15 9" class="pc-scheme-turn-path"/></svg>';
                    div.appendChild(turn);
                }
                frag.appendChild(div);
            });
            row.innerHTML = '';
            row.appendChild(frag);
        });
    }

    // ────────────────────────────────────────────────────────────────
    // 6.b) ALINEACIÓN EXACTA DEL CONECTOR DE UN ESQUEMA "EN HORQUILLA" —
    //      el trazo se dibuja primero con posiciones aproximadas
    //      (renderForkScheme, por si esta función no llegara a
    //      ejecutarse), y AQUÍ, una vez que el navegador ya calculó el
    //      layout real (flechas, etiquetas encima/debajo, tamaños de
    //      molécula distintos entre ramas...), medimos en píxeles el
    //      centro vertical exacto de la línea de cada flecha-rama y
    //      volvemos a trazar el conector para que encaje exactamente,
    //      como si fuera una sola flecha que se abre en dos. Mismo
    //      patrón que snakeifySchemeRows: medir tras el layout, no
    //      adivinar porcentajes de antemano.
    // ────────────────────────────────────────────────────────────────
    function alignForkConnectors(root) {
        root.querySelectorAll('.pc-fork').forEach(fork => {
            if (fork.dataset.aligned === '1') return;
            const linesSvg = fork.querySelector('.pc-fork-lines');
            const branchesBox = fork.querySelector('.pc-fork-branches');
            const pathEl = fork.querySelector('.pc-fork-path');
            if (!linesSvg || !branchesBox || !pathEl) return;
            const branchLines = Array.prototype.map.call(
                branchesBox.querySelectorAll('.pc-fork-branch'),
                br => br.querySelector('.pc-scheme-arrow-line')
            ).filter(Boolean);
            if (!branchLines.length) return;
            const boxRect = linesSvg.getBoundingClientRect();
            const H = boxRect.height || 1;
            if (H < 2) return; // aún no tiene layout real (p.ej. oculto); lo intentamos en el siguiente frame
            const ys = branchLines.map(line => {
                const r = line.getBoundingClientRect();
                return (r.top + r.height / 2) - boxRect.top;
            });
            const yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
            const yMid = (yMin + yMax) / 2;
            const W = 38;
            linesSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            let path = `M0,${yMid.toFixed(1)} L16,${yMid.toFixed(1)} `;
            if (ys.length > 1) path += `M16,${yMin.toFixed(1)} L16,${yMax.toFixed(1)} `;
            ys.forEach(y => { path += `M16,${y.toFixed(1)} L${W},${y.toFixed(1)} `; });
            pathEl.setAttribute('d', path);
            fork.dataset.aligned = '1';
        });
    }

    // ────────────────────────────────────────────────────────────────
    // 7) ESQUEMAS DE SÍNTESIS / REACCIÓN — idéntico API a ChemDraw,
    //    pero los nodos ahora aceptan { smiles: '...' } además del
    //    legado { mol: 'id-del-registro' }.
    // ────────────────────────────────────────────────────────────────
    function renderSchemeItem(node, size) {
        const sz = node.size || size;
        if (node.equilibrium) {
            // Flecha doble de equilibrio (⇌): dos trazos paralelos en
            // sentidos opuestos, minimalista, sin punta "central" — como
            // pide el enunciado para tautomería ceto/enol y para el
            // esquema general X=Y–Z–H ⇌ X(H)–Y=Z.
            return `<div class="pc-scheme-arrow pc-scheme-equilibrium">
                <span class="pc-scheme-arrow-above">${node.above || ''}</span>
                <svg viewBox="0 0 68 22" class="pc-scheme-arrow-svg pc-scheme-eq-svg">
                    <line x1="6" y1="7" x2="62" y2="7" class="pc-scheme-arrow-line"/>
                    <polygon points="62,3 68,7 62,11" class="pc-scheme-arrowhead"/>
                    <line x1="6" y1="15" x2="62" y2="15" class="pc-scheme-arrow-line"/>
                    <polygon points="6,11 0,15 6,19" class="pc-scheme-arrowhead"/>
                </svg>
                <span class="pc-scheme-arrow-below">${node.below || ''}</span>
            </div>`;
        }
        if (node.arrow) {
            return `<div class="pc-scheme-arrow">
                <span class="pc-scheme-arrow-above">${node.above || ''}</span>
                <svg viewBox="0 0 68 16" class="pc-scheme-arrow-svg"><line x1="2" y1="8" x2="58" y2="8" class="pc-scheme-arrow-line"/><polygon points="58,2 68,8 58,14" class="pc-scheme-arrowhead"/></svg>
                <span class="pc-scheme-arrow-below">${node.below || ''}</span>
            </div>`;
        }
        if (node.plus) return `<div class="pc-scheme-plus">+</div>`;
        if (node.text === '') return `<div class="pc-scheme-node"></div>`;
        if (node.text) {
            return `<div class="pc-scheme-node"><div class="pc-scheme-text">${node.text}</div>${node.label ? `<div class="pc-scheme-label">${node.label}</div>` : ''}</div>`;
        }
        const svg = node.smiles
            ? renderMolSmiles(node.smiles, sz || 'sm', node.colorAtoms)
            : renderMolById(node.mol, sz || 'sm', node.colorAtoms);
        return `<div class="pc-scheme-node"><div class="pc-scheme-mol">${svg}</div>${node.label ? `<div class="pc-scheme-label">${node.label}</div>` : ''}</div>`;
    }
    function renderScheme(steps, opts) {
        opts = opts || {};
        const rows = opts.rows || [steps];
        const inner = rows.map(row => `<div class="pc-scheme-row">${row.map(n => renderSchemeItem(n, opts.size)).join('')}</div>`).join('');
        return `<div class="pc-scheme-box">${inner}</div>`;
    }
    function renderForkScheme(start, branches, opts) {
        opts = opts || {};
        const size = opts.size || 'sm';
        const startHtml = renderSchemeItem(start, size);
        const n = branches.length;
        // Trazo en "llave" [ : un tramo horizontal desde el compuesto de
        // partida hasta una barra vertical, y desde ahí un tramo
        // horizontal recto hacia cada rama — todo en ángulo recto, sin
        // diagonales, para que quede minimalista y ordenado (como una
        // llave/corchete que se abre en dos).
        const tys = branches.map((br, i) => ((i + 0.5) / n * 100));
        const tyMin = Math.min.apply(null, tys), tyMax = Math.max.apply(null, tys);
        const tyMid = (tyMin + tyMax) / 2;
        let path = `M0,${tyMid} L16,${tyMid} `;
        if (n > 1) path += `M16,${tyMin} L16,${tyMax} `;
        tys.forEach(ty => { path += `M16,${ty} L38,${ty} `; });
        const branchesHtml = branches.map(br => {
            const arrowHtml = renderSchemeItem({ arrow: true, above: br.above, below: br.below }, size);
            const nodesHtml = (br.nodes || []).map(nd => renderSchemeItem(nd, size)).join('');
            return `<div class="pc-fork-branch">${arrowHtml}${nodesHtml}</div>`;
        }).join('');
        return `<div class="pc-scheme-box"><div class="pc-fork">
            <div class="pc-fork-start">${startHtml}</div>
            <svg class="pc-fork-lines" viewBox="0 0 38 100" preserveAspectRatio="none"><path d="${path}" class="pc-fork-path"/></svg>
            <div class="pc-fork-branches">${branchesHtml}</div>
        </div></div>`;
    }

            ],
            [
                { text: '<span class="pc-scheme-unknown">6</span>' },
                { arrow: true, above: 'piridina, &Delta;' },
                { mol: 'acitretina-final', label: 'acitretina (producto final)' }
            ]
        ]
    });

    SCHEMES['q3-keratina'] = () => renderScheme(null, {
        size: 'sm',
        rows: [[
            { text: 'lawsona' },
            { arrow: true, above: 'queratina&ndash;S(&minus;)' },
            { mol: 'lawsona-aducto-naranja', label: '<span style="color:#c9862c">aducto naranja</span>' },
            { arrow: true, above: 'oxidación', below: '(tiempo)' },
            { mol: 'lawsona-aducto-marron', label: '<span style="color:#7a4a1e">aducto marrón</span>' }
        ]]
    });

    SCHEMES['q3-ceto-enol-general'] = () => renderScheme(
        [
            { mol: 'tautomeria-ceto-ejemplo', label: 'forma ceto' },
            { equilibrium: true },
            { mol: 'tautomeria-enol-ejemplo', label: 'forma enol' }
        ],
        { size: 'sm' }
    );
    SCHEMES['q3-tautomeria-general'] = () => renderScheme(
        [
            { mol: 'tautomeria-xyz-izq' },
            { equilibrium: true },
            { mol: 'tautomeria-xyz-der' }
        ],
        { size: 'sm' }
    );

    // ────────────────────────────────────────────────────────────────
    // 8) renderAll — AHORA ASÍNCRONO (hay que esperar la carga del
    //    WASM de RDKit la primera vez; las siguientes llamadas son
    //    instantáneas porque el módulo ya está en memoria).
    // ────────────────────────────────────────────────────────────────
    async function renderAll(root) {
        root = root || document;

        // Los diagramas abstractos (orbitales) no dependen de RDKit:
        // se pintan ya mismo, sin esperar nada, para que aparezcan al
        // instante aunque la red vaya lenta.
        root.querySelectorAll('[data-orbitals]').forEach(el => {
            const N = parseInt(el.getAttribute('data-n') || '6', 10);
            const idx = parseInt(el.getAttribute('data-index') || '1', 10);
            const blank = el.getAttribute('data-blank') === 'true';
            el.innerHTML = renderOrbitalRow(N, idx, { blank });
            el.classList.add('pc-orb-rendered');
        });
        root.querySelectorAll('[data-diagram]').forEach(el => {
            const fn = DIAGRAMS[el.getAttribute('data-diagram')];
            el.innerHTML = fn ? fn() : '<span class="pc-mol-missing">[' + el.getAttribute('data-diagram') + ']</span>';
            el.classList.add('pc-diagram-rendered');
        });

        const needsRDKit =
            root.querySelector('[data-mol]') ||
            root.querySelector('[data-smiles]') ||
            root.querySelector('[data-scheme]');
        if (needsRDKit) {
            try {
                await loadRDKit();
            } catch (e) {
                console.warn('MolGraph: no se pudo cargar RDKit.js, las estructuras químicas no se dibujarán.', e);
            }
        }

        root.querySelectorAll('[data-mol]').forEach(el => {
            const size = el.getAttribute('data-size') || 'md';
            const colorAtoms = el.getAttribute('data-color-atoms') === 'true';
            el.innerHTML = renderMolById(el.getAttribute('data-mol'), size, colorAtoms);
            el.classList.add('pc-mol-rendered', 'pc-mol-' + size);
        });
        root.querySelectorAll('[data-smiles]').forEach(el => {
            const size = el.getAttribute('data-size') || 'md';
            const colorAtoms = el.getAttribute('data-color-atoms') === 'true';
            el.innerHTML = renderMolSmiles(el.getAttribute('data-smiles'), size, colorAtoms);
            el.classList.add('pc-mol-rendered', 'pc-mol-' + size);
        });
        root.querySelectorAll('[data-scheme]').forEach(el => {
            const fn = SCHEMES[el.getAttribute('data-scheme')];
            el.innerHTML = fn ? fn() : '<span class="pc-mol-missing">[' + el.getAttribute('data-scheme') + ']</span>';
            el.classList.add('pc-scheme-rendered');
        });

        const raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : (fn => setTimeout(fn, 0));
        raf(() => { snakeifySchemeRows(root); alignForkConnectors(root); raf(() => alignForkConnectors(root)); });
    }

    window.MolGraph = {
        renderAll,
        renderMolById,
        renderMolSmiles,
        renderOrbitalRow,
        renderScheme,
        renderForkScheme,
        pSigns,
        loadRDKit,
        MOLS,
        SCHEMES,
        DIAGRAMS
    };

})();

</script>
</body>
</html>
