    "q18-cohetes-2023": {
        titulo: "Combustibles de cohetes",
        numero: "Q18",
        fuente: "55ª Olimpiada Internacional de Química (IChO) · UK Round One 2023",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 55th IChO, UK Round One 2023 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, S. Kang, JL Kiappes, B. Pilgrim, R. Plant, P. Robotham, A. Taylor, A. Thom, G. Trenins.",

        enunciado: `
            <p class="pc-q-title">Q18 — Combustibles de cohetes</p>

            <div class="pc-intro">
                <p>El programa Artemis de la NASA usa oxígeno líquido (LOX) e hidrógeno líquido como fuentes de combustible. Estos combustibles mantienen baja la masa del cohete y, junto con su gran variación de entalpía de combustión, permiten que el cohete venza la gravedad.</p>
                <p>En 2022 hubo varios intentos de lanzamiento fallidos por una fuga en el combustible de hidrógeno.</p>
            </div>
            <p>En el motor del cohete, los componentes del combustible se vaporizan primero y después reaccionan para formar agua.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Escribe una ecuación para la reacción entre el hidrógeno y el oxígeno gaseosos.</p></div></div>
            <p>La entalpía de enlace H&ndash;H es 432 kJ mol<sup>&minus;1</sup> y la entalpía de enlace media O&ndash;H es 460 kJ mol<sup>&minus;1</sup>. Supón que la variación de entalpía de la reacción del inciso (a) es &minus;241 kJ por mol de hidrógeno gaseoso.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Calcula la entalpía del enlace O=O en kJ mol<sup>&minus;1</sup>.</p></div></div>
            <p>La densidad del hidrógeno líquido es 0.071 g cm<sup>&minus;3</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p></p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula el número de moles de moléculas de hidrógeno en 1 dm<sup>3</sup> de hidrógeno líquido.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula la energía liberada cuando se quema el gas formado a partir de 1 dm<sup>3</sup> de hidrógeno líquido.</p></div></div></div>
            <p>El objetivo de SpaceX de colonizar Marte lleva a elegir el metano como alternativa al hidrógeno. El metano puede formarse con los recursos naturales de Marte mediante el proceso de Sabatier, ya que la atmósfera del planeta contiene un 95.3 % de dióxido de carbono en volumen. En el proceso de Sabatier se forman metano y agua a partir de la reacción entre dióxido de carbono e hidrógeno gaseoso.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p></p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe una ecuación para el proceso de Sabatier.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Indica el estado de oxidación del carbono y del hidrógeno en los reactivos y en los productos.</p></div></div></div>
            <p>SpaceX ha desarrollado recientemente un nuevo motor, el Raptor, que usa metano líquido y LOX. Hace falta energía para pasar ambos al estado gaseoso antes de que reaccionen. La variación de entalpía de vaporización del metano es +8.2 kJ mol<sup>&minus;1</sup> y la del oxígeno es +6.8 kJ mol<sup>&minus;1</sup>. La variación de entalpía de combustión del metano, mostrada abajo, es &minus;890.8 kJ mol<sup>&minus;1</sup>.</p>
            <p class="pc-eq pc-math">CH<sub>4(g)</sub> + 2 O<sub>2(g)</sub> &rarr; CO<sub>2(g)</sub> + 2 H<sub>2</sub>O<sub>(g)</sub></p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula la variación de entalpía de la reacción, en kJ, cuando un mol de metano <strong>líquido</strong> reacciona con oxígeno <strong>líquido</strong> para dar dióxido de carbono gaseoso y agua gaseosa.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q18 — Combustibles de cohetes <span class="pc-total-chip">Total: 7 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">H<sub>2</sub> + &frac12; O<sub>2</sub> &rarr; H<sub>2</sub>O</p><p class="pc-note">Se aceptan los símbolos de estado y cualquier múltiplo con estequiometría correcta, p. ej. 2 H<sub>2</sub> + O<sub>2</sub> &rarr; 2 H<sub>2</sub>O.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">&Delta;<sub>r</sub>H = &Sigma;(enlaces rotos) &minus; &Sigma;(enlaces formados)</p><p class="pc-eq pc-math">&minus;241 = [432 + <em>y</em>(&frac12;) ] &minus; (2 &times; 460)  &rArr;  &frac12; <em>y</em> = &minus;241 &minus; 432 + 920 = +247 kJ mol<sup>&minus;1</sup></p><p class="pc-eq pc-math">Enlace O=O: <em>y</em> = 2 &times; 247 = <strong>+494 kJ mol<sup>&minus;1</sup></strong></p><p class="pc-note">Con la ecuación 2 H<sub>2</sub> + O<sub>2</sub> &rarr; 2 H<sub>2</sub>O: [2&times;(&minus;241)] = [2&times;432 + <em>y</em>] &minus; (4&times;460) &rArr; <em>y</em> = +494 kJ mol<sup>&minus;1</sup>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">1 dm<sup>3</sup> = 1000 cm<sup>3</sup>;  <em>m</em>(H<sub>2</sub>) = &rho;<em>V</em> = 0.071 g cm<sup>&minus;3</sup> &times; 1000 cm<sup>3</sup> = 71 g</p><p class="pc-eq pc-math"><em>n</em>(H<sub>2</sub>) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">71 g</span><span class="pc-eq-frac-den">2.016 g mol<sup>&minus;1</sup></span></span> = <strong>35.2 mol</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Energía liberada = 35.2 mol &times; 241 kJ mol<sup>&minus;1</sup> = <strong>8480 kJ</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CO<sub>2</sub> + 4 H<sub>2</sub> &rarr; CH<sub>4</sub> + 2 H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(ii)</span><span class="pc-marks">1 punto</span></div><table class="pc-table"><thead><tr><th></th><th>Reactivo</th><th>Producto</th></tr></thead><tbody><tr><td>Estado de oxidación del H</td><td>0</td><td>+1</td></tr><tr><td>Estado de oxidación del C</td><td>+4</td><td>&minus;4</td></tr></tbody></table><p class="pc-note">Los cuatro estados de oxidación deben ser correctos para obtener el punto (no hace falta escribir el signo +).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p>Ciclo termoquímico: el CH<sub>4</sub> y el O<sub>2</sub> líquidos se vaporizan y después se queman.</p><div class="pc-free-host" data-esquema="size=sm escala=0.5 gapx=90 gapy=70
a @0,0: t:CH₄(g) + 2 O₂(g)
b @2,0: t:CO₂(g) + 2 H₂O(g)
c @1,1: t:CH₄(l) + 2 O₂(l)
a -&gt; b | −890.8 kJ mol⁻¹
c -&gt; a | +8.2 + (2 × 6.8) kJ mol⁻¹ | | ruta=recta
c -&gt; b | z | | ruta=recta"></div><p class="pc-eq pc-math"><em>z</em> = [+8.2 + (2 &times; 6.8) + (&minus;890.8)] kJ = <strong>&minus;869.0 kJ</strong></p><p class="pc-note">No se penaliza si se da kJ mol<sup>&minus;1</sup>; sí si las unidades son incorrectas.</p></div>
        `
    },

    "q19-electronegatividad-2023": {
        titulo: "Electronegatividad, enlace y estructura",
        numero: "Q19",
        fuente: "55ª Olimpiada Internacional de Química (IChO) · UK Round One 2023",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 55th IChO, UK Round One 2023 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, S. Kang, JL Kiappes, B. Pilgrim, R. Plant, P. Robotham, A. Taylor, A. Thom, G. Trenins.",

        enunciado: `
            <p class="pc-q-title">Q19 — Electronegatividad, enlace y estructura</p>

            <div class="pc-intro">
                <p>2022 fue el 90.º aniversario de que Linus Pauling propusiera el concepto de electronegatividad. Su libro <em>La naturaleza del enlace químico</em> se considera el libro de química más influyente del siglo XX, y recibió el Premio Nobel de 1954 por su trabajo.</p>
                <p>La electronegatividad, &chi;, es una medida de la capacidad de un átomo para atraer un par de electrones en un enlace covalente.</p>
            </div>
            <p>Pauling usó datos termodinámicos para calcular la diferencia de electronegatividad entre dos átomos A y B. Todos los valores de electronegatividad son positivos y no tienen unidades, y el átomo A tiene mayor electronegatividad que el átomo B.</p>
            <p class="pc-eq pc-math">&chi;<sub>A</sub> &minus; &chi;<sub>B</sub> = 0.102 <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body">B<sub><em>d</em></sub>(AB) &minus; <span class="pc-eq-frac"><span class="pc-eq-frac-num">B<sub><em>d</em></sub>(AA) + B<sub><em>d</em></sub>(BB)</span><span class="pc-eq-frac-den">2</span></span></span></span></p>
            <p>B<sub><em>d</em></sub> representa las energías de disociación de enlace, en kJ mol<sup>&minus;1</sup>, de los enlaces A&ndash;A, B&ndash;B y A&ndash;B.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Calcula la diferencia de electronegatividad entre Cl y H, sabiendo que B<sub><em>d</em></sub>(H<sub>2</sub>) = 432 kJ mol<sup>&minus;1</sup>, B<sub><em>d</em></sub>(Cl<sub>2</sub>) = 244 kJ mol<sup>&minus;1</sup> y B<sub><em>d</em></sub>(HCl) = 427 kJ mol<sup>&minus;1</sup>.</p></div></div>
            <p>Como este método da una diferencia de electronegatividad, hay que elegir un punto de referencia para obtener los valores de cada elemento. Pauling eligió originalmente el hidrógeno como referencia, con un valor de 2.20.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Usando esta referencia y tu conocimiento de las tendencias de la electronegatividad en la tabla periódica, calcula la electronegatividad del cloro.</p></div></div>
            <p>Otros científicos propusieron otros métodos para determinar la electronegatividad de un elemento, que pueden ajustarse para ser coherentes con los de Pauling. Robert Mulliken calculó el valor a partir de la primera energía de ionización (E<sub><em>i</em></sub>) y la primera afinidad electrónica (E<sub><em>ea</em></sub>) de un átomo.</p>
            <p class="pc-eq pc-math">&chi;<sub>A</sub> = 0.00197 (E<sub><em>i</em></sub> + E<sub><em>ea</em></sub>) + 0.19</p>
            <p>En esta ecuación E<sub><em>i</em></sub> y E<sub><em>ea</em></sub> están en kJ mol<sup>&minus;1</sup>, aunque E<sub><em>i</em></sub> suele medirse en electronvoltios (eV). 1 eV = 96.49 kJ mol<sup>&minus;1</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Calcula la electronegatividad de Mulliken ajustada del nitrógeno, sabiendo que E<sub><em>i</em></sub>(N) = 14.5 eV y E<sub><em>ea</em></sub>(N) = 6.80 kJ mol<sup>&minus;1</sup>.</p></div></div>
            <div class="pc-figrow"><div class="pc-figtext"><p>Los científicos han usado la electronegatividad para racionalizar las diferencias de enlace.</p><p>Los <strong>triángulos de van Arkel&ndash;Ketelaar</strong> permiten visualizar de forma sencilla los grados de enlace iónico, metálico y covalente que presenta un compuesto binario (AB).</p><p>En el triángulo se representa la electronegatividad media de A y B, &chi;&#772;, frente a la diferencia de electronegatividad, &chi;<sub>A</sub> &minus; &chi;<sub>B</sub>.</p></div><div class="pc-figside"><img src="https://i.imgur.com/rlsUxcJ.png" alt="Triángulo de van Arkel–Ketelaar: iónico, metálico y covalente" loading="lazy" style="max-width:330px;width:100%;border-radius:10px"></div></div>
            <p>Las electronegatividades de diez elementos se dan en la tabla:</p>
            <table class="pc-table"><thead><tr><th>Elemento</th><th>H</th><th>C</th><th>O</th><th>F</th><th>Al</th><th>P</th><th>Si</th><th>Cs</th><th>Hg</th><th>Br</th></tr></thead><tbody><tr><td>Electronegatividad</td><td>2.20</td><td>2.55</td><td>3.44</td><td>3.98</td><td>1.61</td><td>2.19</td><td>1.90</td><td>0.79</td><td>2.00</td><td>2.96</td></tr></tbody></table>
            <p>Considera el siguiente diagrama de van Arkel&ndash;Ketelaar:</p>

            <div class="pc-figrow"><div class="pc-figtext"><p>El nitruro de boro ocupa una posición central en el triángulo de van Arkel&ndash;Ketelaar, con elementos de los tres tipos de enlace.</p><p>Puede formarse mediante la reacción (1) entre el ácido bórico (H<sub>3</sub>BO<sub>3</sub>) y el amoníaco.</p><p>También puede formarse mediante la reacción (2) entre el trióxido de diboro (B<sub>2</sub>O<sub>3</sub>), el nitrógeno y el hexaboruro de calcio (CaB<sub>6</sub>), que produce óxido de calcio como subproducto.</p></div><div class="pc-figside"><img src="https://i.imgur.com/vVvF0wR.png" alt="Posición del nitruro de boro (BN) en el triángulo de van Arkel–Ketelaar" loading="lazy" style="max-width:330px;width:100%;border-radius:10px"></div></div>

            <p>El nitruro de boro tiene varias formas cristalinas: una forma cúbica (c-BN), una estructura hexagonal en capas parecida al grafito (h-BN) y una estructura de wurtzita (w-BN). Las distintas formas pueden interconvertirse cambiando la presión y la temperatura. Abajo se muestran diagramas de las tres estructuras.</p>
            <figure class="pc-figure"><img src="https://i.imgur.com/zE9ue5b.png" alt="Celda unidad de c-BN, estructura en capas de h-BN y celda unidad de w-BN" loading="lazy" style="max-width:640px;width:100%"></figure>
            <div class="pc-figrow"><div class="pc-figtext"><p>La celda unidad del c-BN es cúbica, con parámetro de celda <em>a</em> = 3.63 &Aring;.</p><p>La celda unidad del h-BN es un prisma hexagonal regular recto, con parámetros de celda <em>b</em> = 1.47 &Aring; y <em>c</em> = 6.66 &Aring;.</p><p>La celda unidad del w-BN es un prisma rómbico recto, con parámetros de celda <em>d</em> = 2.54 &Aring; y <em>e</em> = 3.63 &Aring; y ángulos interiores de 60° y 120°.</p></div><div class="pc-figside"><img src="https://i.imgur.com/un70qLJ.png" alt="Celda unidad del h-BN" loading="lazy" style="max-width:230px;width:100%;border-radius:10px"></div></div>
            <p>Te puede ser útil consultar las constantes y fórmulas: volumen de un cubo = (lado)<sup>3</sup>; volumen de un prisma recto = (área de la base) &times; (altura); área de un hexágono regular = <span class="pc-eq-frac"><span class="pc-eq-frac-num">3&radic;3</span><span class="pc-eq-frac-den">2</span></span> &times; (lado)<sup>2</sup>. <em>N</em><sub>A</sub> = 6.02&times;10<sup>23</sup> mol<sup>&minus;1</sup>; 1 &Aring; = 1&times;10<sup>&minus;10</sup> m.</p>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">B<sub>2</sub>O<sub>3</sub> + 10 N<sub>2</sub> + 3 CaB<sub>6</sub> &rarr; 20 BN + 3 CaO</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>V</em> = <em>a</em><sup>3</sup> = (3.63&times;10<sup>&minus;10</sup> m)<sup>3</sup> = 4.78&times;10<sup>&minus;29</sup> m<sup>3</sup> = <strong>4.78&times;10<sup>&minus;23</sup> cm<sup>3</sup></strong></p><p class="pc-note">Sin puntos si la respuesta se da en m<sup>3</sup> o en &Aring;, porque se pide en cm<sup>3</sup>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(ii)</span><span class="pc-marks">3 puntos</span></div><p>La celda tiene 4 B y 4 N: los 4 N están dentro del cubo; B: 8 &times; &#8539; en vértices + 6 &times; &frac12; en caras = 4.</p><p class="pc-eq pc-math"><em>m</em><sub>celda</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">4 (10.81 + 14.01) g mol<sup>&minus;1</sup></span><span class="pc-eq-frac-den">6.02&times;10<sup>23</sup> mol<sup>&minus;1</sup></span></span> = 1.649&times;10<sup>&minus;22</sup> g</p><p class="pc-eq pc-math">&rho; = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1.649&times;10<sup>&minus;22</sup> g</span><span class="pc-eq-frac-den">4.78&times;10<sup>&minus;23</sup> cm<sup>3</sup></span></span> = <strong>3.45 g cm<sup>&minus;3</sup></strong></p><p class="pc-note">Primer punto: número correcto de B y N. Segundo: masa de la celda. Tercero: resultado final. Se admite arrastre de (h)(i).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">área = <span class="pc-eq-frac"><span class="pc-eq-frac-num">3&radic;3</span><span class="pc-eq-frac-den">2</span></span> &times; (1.47&times;10<sup>&minus;10</sup> m)<sup>2</sup> = 5.614&times;10<sup>&minus;20</sup> m<sup>2</sup> = 5.614&times;10<sup>&minus;16</sup> cm<sup>2</sup></p><p class="pc-eq pc-math"><em>V</em> = 5.614&times;10<sup>&minus;16</sup> cm<sup>2</sup> &times; 6.66&times;10<sup>&minus;8</sup> cm = <strong>3.74&times;10<sup>&minus;23</sup> cm<sup>3</sup></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(iv)</span><span class="pc-marks">3 puntos</span></div><p>La celda tiene 2 B y 2 N: B = 6 &times; &#8537; (vértices) + 3 &times; &#8531; (aristas) = 2, y lo mismo para N.</p><p class="pc-eq pc-math"><em>m</em><sub>celda</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2 (10.81 + 14.01)</span><span class="pc-eq-frac-den">6.02&times;10<sup>23</sup></span></span> = 8.246&times;10<sup>&minus;23</sup> g</p><p class="pc-eq pc-math">&rho; = <span class="pc-eq-frac"><span class="pc-eq-frac-num">8.246&times;10<sup>&minus;23</sup> g</span><span class="pc-eq-frac-den">3.74&times;10<sup>&minus;23</sup> cm<sup>3</sup></span></span> = <strong>2.20 g cm<sup>&minus;3</sup></strong></p><p class="pc-note">Se admite arrastre de (h)(iii).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(v)</span><span class="pc-marks">1 punto</span></div><p>La celda del w-BN tiene <strong>2 átomos de B y 2 átomos de N</strong>.</p><p class="pc-eq pc-math">B: 1 completamente dentro + 4 &times; <sup>1</sup>&frasl;<sub>12</sub> + 4 &times; <sup>2</sup>&frasl;<sub>12</sub> en vértices = 2</p><p class="pc-eq pc-math">N: 1 completamente dentro + 2 &times; <sup>1</sup>&frasl;<sub>6</sub> + 2 &times; <sup>2</sup>&frasl;<sub>6</sub> en aristas = 2</p><p class="pc-note">Ambos deben ser correctos para obtener el punto.</p></div>
        `
    },

    "q20-aminoacidos-2023": {
        titulo: "Complejos de aminoácidos",
        numero: "Q20",
        fuente: "55ª Olimpiada Internacional de Química (IChO) · UK Round One 2023",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 55th IChO, UK Round One 2023 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, S. Kang, JL Kiappes, B. Pilgrim, R. Plant, P. Robotham, A. Taylor, A. Thom, G. Trenins.",

        enunciado: `
            <p class="pc-q-title">Q20 — Complejos de aminoácidos</p>

            <div class="pc-intro">
                <p>El bisglicinato de cobre (o glicinato de cobre(II)) se usa como suplemento dietético de cobre. Es uno de los muchos complejos de coordinación metálicos de los aminoácidos.</p>
            </div>
            <p>Los aminoácidos tienen la estructura general mostrada aquí y contienen un grupo carboxilo ácido y un grupo amino básico. El sustituyente R puede contener diversos grupos funcionales:</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="N[C@@H]([*:16])C(=O)O"></span><span class="pc-compound-name">aminoácido (estructura general)</span></div></div>
            <p>El aminoácido esencial isoleucina (R = CH(CH<sub>3</sub>)CH<sub>2</sub>CH<sub>3</sub>) tiene un p<em>K</em><sub>a</sub> de 9.60, y su sal clorhidrato tiene un p<em>K</em><sub>a</sub> de 2.36.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Dibuja la estructura esquelética de la isoleucina en disolución acuosa a pH = 2.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja la estructura esquelética de la isoleucina en disolución acuosa a pH = 11.</p></div></div></div>
            <p>El punto isoeléctrico es el pH al que la carga global de una molécula es cero.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Dibuja la estructura esquelética de la isoleucina en el punto isoeléctrico.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula el punto isoeléctrico de la isoleucina.</p></div></div></div>
            <p>Para confirmar los valores de p<em>K</em><sub>a</sub>, se valora una muestra de 50 cm<sup>3</sup> de una disolución 0.025 mol dm<sup>&minus;3</sup> de clorhidrato de isoleucina con 40 cm<sup>3</sup> de una disolución 0.1 mol dm<sup>&minus;3</sup> de NaOH.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Identifica en el cuadernillo cuál de las siguientes curvas de valoración describe mejor la valoración.</p></div></div>
            <figure class="pc-figure"><img src="https://i.imgur.com/D9inXfZ.png" alt="Seis curvas de valoración (pH frente a volumen de valorante añadido) para elegir la correcta" loading="lazy" style="max-width:640px;width:100%"></figure>
            <p>Cuando el aminoácido está totalmente desprotonado, el ion carboxilato, RCH(NH<sub>2</sub>)COO<sup>&minus;</sup>, puede coordinarse a iones metálicos como ligando bidentado a través del nitrógeno y de un oxígeno del carboxilato, como se muestra (los demás ligandos del ion metálico M y las cargas no se muestran):</p>
            <p>El glicinato de cobre(II) se forma al añadir glicina (R = H) a una disolución acuosa de etanoato de cobre(II). Se forma un precipitado azul del glicinato de cobre(II) piramidal cuadrado (C<sub>4</sub>H<sub>10</sub>CuN<sub>2</sub>O<sub>5</sub>), que contiene una molécula de agua coordinada.</p>
            <p>Al calentarse, este precipitado sufre isomería entre distintos estereoisómeros, aunque la molécula de agua permanece en la posición axial, como se muestra:</p>
            <div style="text-align:center"><svg viewBox="0 0 330 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cu(II) piramidal cuadrado con agua axial" style="width:330px;max-width:100%;font-family:Inter,sans-serif"><defs><marker id="cu-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9z" fill="currentColor"/></marker></defs><line x1="170.0" y1="30.0" x2="170.0" y2="58.0" stroke="currentColor" stroke-width="1.7"/><text x="170.0" y="22.0" font-size="15" text-anchor="middle" fill="currentColor" >H<tspan baseline-shift="sub" font-size="10">2</tspan>O</text><text x="170.0" y="76.0" font-size="16" text-anchor="middle" fill="currentColor" >Cu</text><path d="M142.6,67.0L143.1,65.2M135.4,65.6L136.1,63.0M128.1,64.2L129.0,60.7M120.9,62.7L122.0,58.4M113.6,61.3L115.0,56.2M106.4,59.8L107.9,53.9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M196.9,65.2L197.4,67.0M203.9,63.0L204.6,65.6M211.0,60.7L211.9,64.2M218.0,58.4L219.1,62.7M225.0,56.2L226.4,61.3M232.1,53.9L233.6,59.8" stroke="currentColor" stroke-width="1.5" fill="none"/><polygon points="150.0,80.0 98.3,104.9 101.7,111.1" fill="currentColor"/><polygon points="190.0,80.0 238.3,111.1 241.7,104.9" fill="currentColor"/><text x="262.0" y="40.0" font-size="12" text-anchor="start" fill="currentColor" >axial</text><path d="M258,38 L184,36" stroke="currentColor" stroke-width="1" marker-end="url(#cu-m)"/><text x="60.0" y="100.0" font-size="12" text-anchor="middle" fill="currentColor" >ecuatorial</text><text x="280.0" y="100.0" font-size="12" text-anchor="middle" fill="currentColor" >ecuatorial</text></svg></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Completa en el cuadernillo las estructuras de los estereoisómeros del glicinato de cobre(II), representando el ligando bidentado como se muestra a la derecha.</p><div style="text-align:center"><svg viewBox="0 0 160 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ligando bidentado N–O" style="width:150px;max-width:100%;font-family:Inter,sans-serif"><text x="25.0" y="55.0" font-size="17" text-anchor="middle" fill="currentColor" >N</text><text x="135.0" y="55.0" font-size="17" text-anchor="middle" fill="currentColor" >O</text><path d="M25,38 C25,5 135,5 135,38" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></div><p>Si el estereoisómero es quiral, dibuja solo un enantiómero.</p></div></div>
            <p>El aminoácido metionina (R = CH<sub>2</sub>CH<sub>2</sub>SCH<sub>3</sub>) forma el anión metioninato (Mt<sup>&minus;</sup>) al desprotonarse. En los complejos octaédricos de metales (MMt<sub>3</sub>), supón que el anión metioninato (Mt<sup>&minus;</sup>) actúa como ligando bidentado a través del nitrógeno y del oxígeno del carboxilato.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Completa en el cuadernillo las estructuras de los estereoisómeros de MMt<sub>3</sub>, representando el ligando bidentado como se muestra.</p><div style="text-align:center"><svg viewBox="0 0 160 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ligando bidentado N–O" style="width:150px;max-width:100%;font-family:Inter,sans-serif"><text x="25.0" y="55.0" font-size="17" text-anchor="middle" fill="currentColor" >N</text><text x="135.0" y="55.0" font-size="17" text-anchor="middle" fill="currentColor" >O</text><path d="M25,38 C25,5 135,5 135,38" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></div><p>Si el estereoisómero es quiral, dibuja solo un enantiómero.</p></div></div>
            <p>En un complejo octaédrico de un metal de transición, los orbitales d no son degenerados (de igual energía), sino que se desdoblan en dos niveles.</p>
            <svg viewBox="0 0 520 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="División de los orbitales d en un complejo octaédrico" style="max-width:520px;width:100%;display:block;margin:8px auto;font-family:Inter,sans-serif"><defs><marker id="ds-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9z" fill="currentColor"/></marker></defs><line x1="22" y1="170" x2="22" y2="20" stroke="currentColor" stroke-width="1.6" marker-end="url(#ds-m)"/><text x="30" y="30" font-size="12" fill="currentColor">Energía</text><line x1="60" y1="100" x2="80" y2="100" stroke="currentColor" stroke-width="2"/><line x1="90" y1="100" x2="110" y2="100" stroke="currentColor" stroke-width="2"/><line x1="120" y1="100" x2="140" y2="100" stroke="currentColor" stroke-width="2"/><line x1="150" y1="100" x2="170" y2="100" stroke="currentColor" stroke-width="2"/><line x1="180" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width="2"/><text x="125" y="122" font-size="11" text-anchor="middle" fill="currentColor">orbitales d degenerados</text><path d="M222,100 L330,50 M222,100 L330,150" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" fill="none"/><text x="276" y="104" font-size="11" text-anchor="middle" fill="currentColor">complejo</text><text x="276" y="118" font-size="11" text-anchor="middle" fill="currentColor">octaédrico</text><line x1="340" y1="50" x2="370" y2="50" stroke="currentColor" stroke-width="2"/><text x="355" y="70" font-size="11" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="8">z²</tspan></text><line x1="400" y1="50" x2="430" y2="50" stroke="currentColor" stroke-width="2"/><text x="415" y="70" font-size="11" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="8">x²−y²</tspan></text><line x1="340" y1="150" x2="370" y2="150" stroke="currentColor" stroke-width="2"/><text x="355" y="168" font-size="11" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="8">xy</tspan></text><line x1="385" y1="150" x2="415" y2="150" stroke="currentColor" stroke-width="2"/><text x="400" y="168" font-size="11" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="8">xz</tspan></text><line x1="430" y1="150" x2="460" y2="150" stroke="currentColor" stroke-width="2"/><text x="445" y="168" font-size="11" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="8">yz</tspan></text><text x="395" y="184" font-size="11" text-anchor="middle" fill="currentColor">orbitales d desdoblados</text></svg>
            <p>Cuando los electrones d llenan los orbitales pueden adoptar una de dos disposiciones, llamadas de espín alto y de espín bajo, según el número de electrones d.</p>
            <p>En la disposición de <strong>espín alto</strong>, todos los orbitales d se llenan primero con un electrón de espín paralelo antes de aparear ningún electrón.</p>
            <p>En la disposición de <strong>espín bajo</strong>, los orbitales d de menor energía se llenan por completo antes de que los electrones ocupen los orbitales d de mayor energía.</p>
            <p>FeMt<sub>3</sub> es un compuesto de Fe(III). El ion hierro tiene carga +3 y hay cinco electrones d para llenar el diagrama, lo que lleva a las disposiciones de espín alto y espín bajo siguientes:</p>
            <div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de orbitales d" style="width:230px;max-width:100%;font-family:Inter,sans-serif"><line x1="30" y1="120" x2="60" y2="120" stroke="currentColor" stroke-width="2"/><path d="M45,119 V97 M41.5,102 L45,97 L48.5,102" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="90" y1="120" x2="120" y2="120" stroke="currentColor" stroke-width="2"/><path d="M105,119 V97 M101.5,102 L105,97 L108.5,102" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="150" y1="120" x2="180" y2="120" stroke="currentColor" stroke-width="2"/><path d="M165,119 V97 M161.5,102 L165,97 L168.5,102" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="52" x2="90" y2="52" stroke="currentColor" stroke-width="2"/><path d="M75,51 V29 M71.5,34 L75,29 L78.5,34" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="120" y1="52" x2="150" y2="52" stroke="currentColor" stroke-width="2"/><path d="M135,51 V29 M131.5,34 L135,29 L138.5,34" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="136" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">xy</tspan></text><text x="105" y="136" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">xz</tspan></text><text x="165" y="136" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">yz</tspan></text><text x="75" y="68" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">z²</tspan></text><text x="135" y="68" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">x²−y²</tspan></text></svg><span class="pc-compound-name">Espín alto para Fe(III)</span></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de orbitales d" style="width:230px;max-width:100%;font-family:Inter,sans-serif"><line x1="30" y1="120" x2="60" y2="120" stroke="currentColor" stroke-width="2"/><path d="M40,119 V97 M36.5,102 L40,97 L43.5,102" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M50,97 V119 M46.5,114 L50,119 L53.5,114" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="90" y1="120" x2="120" y2="120" stroke="currentColor" stroke-width="2"/><path d="M100,119 V97 M96.5,102 L100,97 L103.5,102" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,97 V119 M106.5,114 L110,119 L113.5,114" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="150" y1="120" x2="180" y2="120" stroke="currentColor" stroke-width="2"/><path d="M165,119 V97 M161.5,102 L165,97 L168.5,102" stroke="#8e1b1b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="52" x2="90" y2="52" stroke="currentColor" stroke-width="2"/><line x1="120" y1="52" x2="150" y2="52" stroke="currentColor" stroke-width="2"/><text x="45" y="136" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">xy</tspan></text><text x="105" y="136" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">xz</tspan></text><text x="165" y="136" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">yz</tspan></text><text x="75" y="68" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">z²</tspan></text><text x="135" y="68" font-size="10" text-anchor="middle" fill="currentColor">d<tspan baseline-shift="sub" font-size="7">x²−y²</tspan></text></svg><span class="pc-compound-name">Espín bajo para Fe(III)</span></div></div>
            <p>Las disposiciones de espín alto y espín bajo se diferencian calculando el momento magnético de espín teórico (&mu;) del complejo (medido en magnetones de Bohr, BM) y comparándolo con los valores experimentales.</p>
            <p class="pc-eq pc-math">&mu; = <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body"><em>n</em>(<em>n</em> + 2)</span></span> &nbsp;&nbsp; donde <em>n</em> = número de electrones desapareados</p>
            <p>RhMt<sub>3</sub> es un complejo octaédrico de Rh(III) donde cada ligando Mt<sup>&minus;</sup> forma dos enlaces con el metal. CuMt<sub>2</sub> es un complejo octaédrico de Cu(II) donde cada ligando Mt<sup>&minus;</sup> forma tres enlaces con el metal.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Completa en el cuadernillo la siguiente información para RhMt<sub>3</sub> y CuMt<sub>2</sub>:</p><ul><li>El número de electrones d en la capa externa del ion metálico.</li><li>Rellena los electrones en los diagramas de orbitales d. Si es posible la disposición de espín alto y de espín bajo, dibuja ambas. En caso contrario, rellena solo la única posible.</li><li>Para cada disposición electrónica dibujada, calcula el momento magnético de espín de ese complejo.</li></ul></div></div>
            <p>El momento magnético de espín observado experimentalmente para el complejo de Fe(III) FeMt<sub>3</sub> es 5.63 BM.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Determina si el ion metálico en FeMt<sub>3</sub> es de espín alto o de espín bajo.</p></div></div>
