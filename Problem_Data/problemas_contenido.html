            <p class="pc-q-title">Q31 — Esta pregunta trata sobre el ácido levulínico <span class="pc-total-chip">Total: 16 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; éster</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; aldehído</td><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; cetona</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; acetal</td></tr><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; ácido carboxílico</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; alqueno</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; alcohol</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; hemiacetal</td></tr></tbody></table><p class="pc-note">Se debe marcar únicamente ácido carboxílico y cetona para obtener el punto.</p></div>

l @0,0: OCC(=O)C(O)C(O)C(O)CO | fructosa (forma lineal) | resaltar=2,9 | resalte=rojo"></div><p>Se enlazan el carbono del carbonilo (C2) y el oxígeno del OH del C5, formando el hemicetal cíclico de cinco miembros (furanosa).</p><p class="pc-note">Hay que rodear los dos átomos (C y O) para obtener el punto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OCC1OC(=CO)C(O)C1O"></span><span class="pc-compound-name">alqueno A (enol exocíclico)</span></div></div><p class="pc-note">Se acepta el isómero cis o el trans. Se pierde el OH hemicetálico (C2) y un H del CH<sub>2</sub>OH (C1): el enol resultante se isomeriza a aldehído (B).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(ii)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OCC1OC(O)(CO)C=C1O"></span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OCC1OC(O)(CO)C(O)=C1"></span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OCC1=CC(O)C(O)(CO)O1"></span></div></div><p class="pc-note">Tres estructuras correctas valen dos puntos. Dos correctas con, como máximo, una incorrecta valen un punto. Cualquier otra respuesta, cero. Son los tres alquenos endocíclicos trisustituidos que resultan de perder un OH de C3 o C4 junto con un H adyacente.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=CC1=CC(O)C(CO)O1"></span><span class="pc-compound-name">C</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=CC1OC(CO)=CC1O"></span><span class="pc-compound-name">D</span></div></div><p class="pc-note">Deben estar bien las dos; no hace falta indicar cuál es C y cuál D. Cada una pierde una molécula de agua de B y la siguiente pérdida de agua da el furano E (5-hidroximetilfurfural).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=CO"></span><span class="pc-compound-name">F: ácido metanoico (fórmico)</span></div></div><p class="pc-note">El espectro IR de F (O–H ancho 3500–3100 cm<sup>−1</sup> y C=O a 1745 cm<sup>−1</sup>) confirma un ácido carboxílico; E + 2 H<sub>2</sub>O → ácido levulínico + HCOOH.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p><strong>Z = +2</strong> &nbsp;(se acepta 2, 2+ o II)</p><p class="pc-eq pc-math">2 × (−1)[H<sup>−</sup>] + 0[CO] + 3 × 0[PPh<sub>3</sub>] + <em>Z</em> = 0 &nbsp;&rArr;&nbsp; <em>Z</em> = +2</p></div>

reoisómeros: CO <em>trans</em> a H (el catalizador), CO <em>trans</em> a P con los dos H en <em>cis</em>, y CO <em>trans</em> a P con los dos H en <em>trans</em>. Los tres tienen un plano de simetría, de modo que ninguno es quiral.</p><p class="pc-note">Dos puntos por las dos estructuras correctas (sin estructuras incorrectas ni duplicadas; si hay al menos una correcta pero también incorrectas o duplicadas, un punto). Un punto por marcar correctamente: debe marcarse «No» en todas, incluida la del catalizador, y sólo se concede si se ha dibujado al menos una estructura correcta. Si alguna estructura no es octaédrica o tiene un conjunto de ligandos erróneo, no se concede el punto de las marcas.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(j)</span><span class="pc-marks">3 puntos</span></div><p>Geometría: H<sup>J</sup> está <em>trans</em> al CO y <em>cis</em> a P<sup>X</sup>, P<sup>W</sup>, P<sup>Y</sup> y H<sup>K</sup>; H<sup>K</sup> está <em>trans</em> a P<sup>Y</sup> y <em>cis</em> a P<sup>X</sup>, P<sup>W</sup> y H<sup>J</sup>.</p><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 260 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Complejo con núcleos etiquetados" style="width:260px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="125.0" y1="76.8" x2="125.0" y2="36.6" stroke="currentColor" stroke-width="1.7"/><text x="125.0" y="14.0" text-anchor="middle" font-size="14">P<tspan dy="-5" font-size="0.72em">X</tspan><tspan dy="5">​</tspan>Ph<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><line x1="125.0" y1="113.2" x2="125.0" y2="153.4" stroke="currentColor" stroke-width="1.7"/><text x="125.0" y="184.0" text-anchor="middle" font-size="14">P<tspan dy="-5" font-size="0.72em">W</tspan><tspan dy="5">​</tspan>Ph<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><path d="M103.8,83.6L104.8,82.0M98.7,81.1L100.0,78.8M93.5,78.6L95.3,75.5M88.3,76.0L90.6,72.2M83.2,73.5L85.8,68.9M78.0,71.0L81.1,65.7" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="58.6" y="61.0" text-anchor="end" font-size="14">Ph<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan>P<tspan dy="-5" font-size="0.72em">Y</tspan><tspan dy="5">​</tspan></text><path d="M145.2,82.0L146.2,83.6M150.0,78.8L151.3,81.1M154.7,75.5L156.5,78.6M159.4,72.2L161.7,76.0M164.2,68.9L166.8,73.5M168.9,65.7L172.0,71.0" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="191.4" y="61.0" text-anchor="start" font-size="14">CO</text><polygon points="109.2,104.2 72.8,121.6 76.4,127.6" fill="currentColor"/><text x="58.6" y="139.0"         enunciado: `
            <p class="pc-q-title">Q32 — Esta pregunta trata sobre el «distanciamiento social» dentro de las moléculas</p>

            <div class="pc-intro">
                <p>La pandemia de COVID-19 nos ha introducido en el distanciamiento social. Esta pregunta trata de cómo la disposición de las moléculas en el espacio tridimensional suele hacer que partes de esas moléculas estén lo más lejos posible unas de otras.</p>
                <p>En la molécula de etano, la rotación alrededor del enlace C–C central hace que la posición relativa de los átomos de hidrógeno en el espacio pueda cambiar. Esta rotación ocurre con rapidez a temperatura ambiente. Las distintas disposiciones tridimensionales se llaman <em>confórmeros</em> (o isómeros conformacionales).</p>

1,213.3L128.3,210.7M126.0,214.7L125.0,211.3M123.0,216.1L121.7,211.9M119.9,217.5L118.4,212.5" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="105" y="222" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">b</tspan><tspan dy="-3">​</tspan></text><polygon points="140.0,216.0 129.3,231.7 134.7,234.3" fill="currentColor"/><text x="128" y="246" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">c</tspan><tspan dy="-3">​</tspan></text><polygon points="169.0,202.0 180.6,187.5 175.4,184.5" fill="currentColor"/><text x="174" y="181" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">e</tspan><tspan dy="-3">​</tspan></text><path d="M179.0,203.8L179.7,205.5M182.2,202.1L183.2,204.6M185.4,200.4L186.6,203.6M188.5,198.7L190.1,202.7M191.7,196.9L193.6,201.7" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="208" y="200" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">d</tspan><tspan dy="-3">​</tspan></text><line x1="171" y1="216" x2="174" y2="233" stroke="currentColor" stroke-width="1.6"/><text x="176" y="246" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">f</tspan><tspan dy="-3">​</tspan></text><line x1="214" y1="206" x2="330" y2="206" stroke="#222" stroke-width="1.3" stroke-dasharray="7 5"/><circle cx="388" cy="206" r="30" fill="#fff" stroke="currentColor" stroke-width="1.8"/><line x1="388" y1="206" x2="388.0" y2="164.0" stroke="currentColor" stroke-width="1.8"/><text x="388.0" y="160.0" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">a</tspan><tspan dy="-3">​</tspan></text><line x1="388" y1="206" x2="351.6" y2="227.0" stroke="currentColor" stroke-width="1.8"/><text x="348.8" y="239.5" text-anchor="end" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">b</tspan><tspan dy="-3">​</tspan></text><line x1="388" y1="206" x2="424.4" y2="227.0" stroke="currentColor" stroke-width="1.8"/><text x="427.2" y="239.5" text-anchor="start" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">c</tspan><tspan dy="-3">​</tspan></text><line x1="414.0" y1="191.0" x2="424.4" y2="185.0" stroke="currentColor" stroke-width="1.8"/><text x="427.2" y="181.5" text-anchor="start" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">d</tspan><tspan dy="-3">​</tspan></text><line x1="362.0" y1="191.0" x2="351.6" y2="185.0" stroke="currentColor" stroke-width="1.8"/><text x="348.8" y="181.5" text-anchor="end" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">e</tspan><tspan dy="-3">​</tspan></text><line x1="388.0" y1="236.0" x2="388.0" y2="248.0" stroke="currentColor" stroke-width="1.8"/><text x="388.0" y="261.0" text-anchor="middle" font-size="12" fill="currentColor">H<tspan dy="3" font-size="0.72em">f</tspan><tspan dy="-3">​</tspan></text><text x="494" y="206" text-anchor="middle" font-size="15" fill="currentColor">Staggered</text><rect x="552" y="62" width="236" height="146" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="9 5"/><text x="640" y="88" text-anchor="middle" font-size="16" fill="currentColor" font-style="italic">θ</text><text x="652" y="88" text-anchor="start" font-size="14" fill="currentColor">= dihedral angle</text><circle cx="610" cy="138" r="28" fill="#fff" stroke="currentColor" stroke-width="1.8"/><line x1="610" y1="138" x2="610.0" y2="98.0" stroke="currentColor" stroke-width="1.8"/><text x="610.0" y="94.0" text-anchor="middle" font-size="13" fill="currentColor">H′</text><line x1="610" y1="138" x2="575.4" y2="158.0" stroke="currentColor" stroke-width="1.8"/><text x="572.5" y="170.5" text-anchor="end" font-size="13" fill="currentColor">H</text><line x1="610" y1="138" x2="644.6" y2="158.0" stroke="currentColor" stroke-width="1.8"/><text x="647.5" y="170.5" text-anchor="start" font-size="13" fill="currentColor">H</text><line x1="634.2" y1="124.0" x2="644.6" y2="118.0" stroke="currentColor" stroke-width="1.8"/><text x="647.5" y="114.5" text-anchor="start" font-size="13" fill="currentColor">H″</text><line x1="585.8" y1="124.0" x2="575.4" y2="118.0" stroke="currentColor" stroke-width="1.8"/><text x="572.5" y="114.5" text-anchor="end" font-size="13" fill="currentColor">H</text><line x1="610.0" y1="166.0" x2="610.0" y2="178.0" stroke="currentColor" stroke-width="1.8"/><text x="610.0" y="191.0" text-anchor="middle" font-size="13" fill="currentColor">H</text><path d="M619,108 Q639,108 639,118" fill="none" stroke="#222" stroke-width="1.3"/><polygon points="636,112 642,122 634,120" fill="#222"/><polygon points="622,104 614,108 622,112" fill="#222"/></svg></div>
            <p>Estos confórmeros se representan mediante una proyección de Newman. Una proyección de Newman es una vista de la molécula a lo largo del enlace C–C, representado por un círculo. Los enlaces a hidrógeno del átomo de carbono delantero se muestran delante del círculo (parten de su centro). Los enlaces a hidrógeno del carbono trasero se muestran detrás del círculo (parten de su borde). Esta vista muestra con claridad el ángulo entre los enlaces C–H del carbono delantero y los enlaces C–H del carbono trasero. Este ángulo se llama <em>ángulo diédrico</em>, y el ángulo diédrico <em>θ</em> entre H′ y H″ es el mostrado arriba. En el etano, la conformación eclipsada, con <em>θ</em> = 0°, tiene mayor energía que la conformación escalonada, con <em>θ</em> = 60°, ya que los hidrógenos están menos «distanciados socialmente».</p>
            <figure class="pc-figure"><img src="https://i.imgur.com/NixQKEd.png" alt="Energía relativa del etano frente al ángulo diédrico, con cinco casillas para marcar E (eclipsada) o S (escalonada)" loading="lazy" style="max-width:640px;width:100%"></figure>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>La energía relativa de las distintas conformaciones para una rotación completa de 360° alrededor del enlace C–C del etano se muestra en el diagrama anterior. Para los cinco ángulos diédricos señalados en la gráfica, indica si el etano está en una conformación eclipsada (escribe E en la casilla) o escalonada (escribe S en la casilla).</p></div></div>
            <p>Aunque <em>θ</em> puede tomar cualquier valor entre 0° y 360° en la rotación alrededor de un enlace, a menudo se consideran solo seis conformaciones (tres escalonadas y tres eclipsadas). El diagrama muestra la energía relativa de las conformaciones para la rotación alrededor del enlace C<sub>2</sub>−C<sub>3</sub> del metilbutano.</p>

            <p class="pc-eq pc-math">Δ<em>G</em>° = −<em>RT</em> ln <em>K</em></p>

            <p>La acetilcolina es un neurotransmisor liberado por las neuronas motoras para activar los músculos.</p>

            <p>Aunque la acetilcolina puede adoptar muchas conformaciones en disolución, cuando se une a los receptores musculares tiene que adoptar una conformación concreta. Los fármacos para tratar diversas enfermedades buscan bloquear la unión de la acetilcolina.</p>
            <p>Muchos de estos fármacos son moléculas más rígidas, en las que el ángulo entre los grupos (NMe<sub>3</sub>)<sup>+</sup> y OAc no puede cambiar libremente. Los fármacos que más se parecen a la forma 3D de la acetilcolina unida suelen unirse con más fuerza a los receptores y por tanto son los bloqueadores más eficaces.</p>

erif;font-size:13px"><circle cx="85.0" cy="80.0" r="30" fill="none" stroke="currentColor" stroke-width="1.7"/><line x1="85.0" y1="80.0" x2="85.0" y2="35.0" stroke="currentColor" stroke-width="1.7"/><text x="85.0" y="31.0" text-anchor="middle" font-size="13" fill="currentColor">CH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><line x1="85.0" y1="80.0" x2="46.0" y2="102.5" stroke="currentColor" stroke-width="1.7"/><text x="43.2" y="116.0" text-anchor="end" font-size="13" fill="currentColor">H</text><line x1="85.0" y1="80.0" x2="124.0" y2="102.5" stroke="currentColor" stroke-width="1.7"/><text x="126.8" y="116.0" text-anchor="start" font-size="13" fill="currentColor">CH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><line x1="71.8" y1="53.0" x2="65.3" y2="39.6" stroke="currentColor" stroke-width="1.7"/><text x="62.8" y="35.7" text-anchor="end" font-size="13" fill="currentColor">H</text><line x1="68.2" y1="104.9" x2="59.8" y2="117.3" stroke="currentColor" stroke-width="1.7"/><text x="57.3" y="131.1" text-anchor="end" font-size="13" fill="currentColor">CH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><line x1="114.9" y1="82.1" x2="129.9" y2="83.1" stroke="currentColor" stroke-width="1.7"/><text x="132.9" y="88.2" text-anchor="start" font-size="13" fill="currentColor">H</text></svg><span class="pc-compound-name"><strong>6</strong></span></div></div><p class="pc-note">Dos secuencias completamente correctas valen tres puntos. Cuatro o cinco números en la posición correcta respecto a una de las dos secuencias, dos puntos; tres, un punto. Una mezcla de ambas (p. ej. 2, 6, 3, 5, 1, 4) solo vale dos puntos, porque las estructuras deben formar una secuencia de rotación continua alrededor del enlace central.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(i)</span><span class="pc-marks">3 puntos</span></div><table class="pc-table"><thead><tr><th></th><th>G<sub>1</sub> &#8652; AP</th><th>AP &#8652; G<sub>2</sub></th><th>G<sub>2</sub> &#8652; G<sub>1</sub></th></tr></thead><tbody><tr><td>Δ<em>G</em>° / kJ mol<sup>−1</sup></td><td>−3.63</td><td><strong>+3.63</strong></td><td><strong>0</strong></td></tr><tr><td><em>K</em></td><td><strong>4.33</strong></td><td><strong>0.231</strong></td><td><strong>1</strong></td></tr></tbody></table><p class="pc-eq pc-math">Δ<em>G</em>° = −<em>RT</em> ln <em>K</em> &nbsp;&rArr;&nbsp; <em>K</em> = e<sup>−Δ<em>G</em>°/<em>RT</em></sup></p><p class="pc-eq pc-math"><em>K</em><sub>G1→AP</sub> = e<sup>3630/(8.314 × 298)</sup> = e<sup>1.465</sup> = 4.33</p><p class="pc-eq pc-math"><em>K</em><sub>AP→G2</sub> = e<sup>−3630/(8.314 × 298)</sup> = 0.231 &nbsp;&nbsp; <em>K</em><sub>G2→G1</sub> = e<sup>0</sup> = 1</p><p class="pc-note">Un punto por +3.63 kJ mol<sup>−1</sup> para AP ⇌ G<sub>2</sub>, otro por 0 para G<sub>2</sub> ⇌ G<sub>1</sub> (puede razonarse porque G<sub>1</sub> y G<sub>2</sub> tienen igual energía y AP ⇌ G<sub>2</sub> es el sentido contrario de G<sub>1</sub> ⇌ AP), y otro por los tres valores de <em>K</em> correctos (se admite error arrastrado).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(ii)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">[G<sub>1</sub>] = [G<sub>2</sub>] &nbsp;&nbsp; y &nbsp;&nbsp; [G<sub>2</sub>] = 0.231 [AP]</p><p class="pc-eq pc-math">% AP = <span class="pc-eq-frac"><span class="pc-eq-frac-num">[AP]</span><span class="pc-eq-frac-den">[AP] + [G<sub>1</sub>] + [G<sub>2</sub>]</span></span> × 100 = <span class="pc-eq-frac"><span class="pc-eq-frac-num">100</span><span class="pc-eq-frac-den">1 + 0.231 + 0.231</span></span> = <strong>68.4 %</strong></p><p class="pc-note">La respuesta correcta vale los dos puntos; con dos ecuaciones simultáneas correctas, un punto. Con error arrastrado: % = 100/(1 + <em>K</em><sub>2</sub> + <em>K</em><sub>2</sub><em>K</em><sub>3</sub>), con <em>K</em><sub>2</sub> para AP ⇌ G<sub>2</sub> y <em>K</em><sub>3</sub> para G<sub>2</sub> ⇌ G<sub>1</sub>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">(7 = 11) , (8 = 10) , 9 , 12</p><p>7 y 11 son escalonadas <em>gauche</em> (±60°), imágenes especulares entre sí; 8 y 10 son eclipsadas a ±120°; 9 es la <em>anti</em> (180°) y 12 la eclipsada <em>syn</em> (0°).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">3 puntos</span></div><table class="pc-table"><thead><tr><th></th><th>W</th><th>X</th><th>Y</th><th>Z</th><th>Ninguno</th></tr></thead><tbody><tr><td><strong>7</strong></td><td></td><td></td><td></td><td></td><td>&#10003;</td></tr><tr><td><strong>8</strong></td><td></td><td>&#10003;</td><td></td><td></td><td></td></tr><tr><td><strong>9</strong></td><td></td><td></td><td></td><td></td><td>&#10003;</td></tr><tr><td><strong>10</strong></td><td></td><td></td><td>&#10003;</td><td></td><td></td></tr><tr><td><strong>11</strong></td><td></td><td></td><td></td><td></td><td>&#10003;</td></tr><tr><td><strong>12</strong></td><td>&#10003;</td><td></td><td></td><td>&#10003;</td><td></td></tr></tbody></table><p>En un ciclopropano plano los dos sustituyentes de carbonos vecinos quedan <em>cis</em> (ángulo diédrico 0°, W y Z, conformación 12) o <em>trans</em> (≈ ±120°, X e Y, conformaciones 8 y 10 según el sentido); las conformaciones escalonadas 7, 9 y 11 no pueden imitarse con un anillo plano.</p><p class="pc-note">Seis filas correctas, tres puntos; cuatro o cinco, dos; dos o tres, un punto.</p></div>

            <p class="pc-q-title">Q34 — Esta pregunta trata sobre los fluoruros de xenón</p>

            <div class="pc-intro">
                <p>En el momento de su descubrimiento por el químico escocés Sir William Ramsay, el gas noble xenón se consideraba inerte. Desde entonces se ha descubierto que el xenón reacciona con oxidantes fuertes. Por ejemplo, el xenón reacciona con flúor gaseoso formando una serie de fluoruros, XeF<sub>2</sub>, XeF<sub>4</sub> y XeF<sub>6</sub>.</p>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Escribe una ecuación para la formación del tetrafluoruro de xenón.</p></div></div>
            <p>La estructura del tetrafluoruro de xenón tiene seis pares de electrones en el xenón y, por tanto, está basada en una configuración octaédrica.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Dibuja una estructura de puntos y cruces del tetrafluoruro de xenón.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja las dos posibles disposiciones tridimensionales de los pares de electrones del xenón en el tetrafluoruro de xenón y marca la que se adopta.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Dibuja las posibles disposiciones tridimensionales de los cinco pares de electrones del xenón en el difluoruro de xenón y marca la que se adopta.</p></div></div>
            <p>Se ha estudiado la cinética de formación del difluoruro de xenón a partir de xenón y flúor en diversas condiciones. La tabla siguiente muestra las velocidades instantáneas de reacción a 120 °C para distintas concentraciones iniciales de los reactivos. Supón que el volumen del recipiente de reacción es constante.</p>
            <table class="pc-table"><thead><tr><th><em>n</em><sub>Xe</sub> / mol</th><th><em>n</em><sub>F<sub>2</sub></sub> / mol</th><th>10<sup>5</sup> × velocidad / mol dm<sup>−3</sup> s<sup>−1</sup></th></tr></thead><tbody><tr><td>1.0</td><td>5.0</td><td>3.6</td></tr><tr><td>1.0</td><td>10.0</td><td>3.6</td></tr><tr><td>2.0</td><td>10.0</td><td>7.2</td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>¿Cuál es la ecuación de velocidad de la formación del difluoruro de xenón?</p></div></div>
            <p>La ecuación de Arrhenius describe la relación entre la constante de velocidad y la temperatura.</p>
            <p class="pc-eq pc-math"><em>k</em> = <em>A</em> e<sup>−<em>E</em><sub>a</sub>/<em>RT</em></sup></p>
            <p>La reacción sin catalizar entre xenón y flúor para formar XeF<sub>2</sub> a una temperatura <em>T</em> tiene una constante de velocidad <em>k</em>, con factor de frecuencia de colisión <em>A</em> y energía de activación <em>E</em><sub>a</sub>. <em>R</em> es la constante universal de los gases. Cuando se añade un catalizador de difluoruro de níquel a la mezcla de reacción, la constante de velocidad pasa a ser <em>k</em><sub>cat</sub>, con un factor de frecuencia de colisión <em>A</em><sub>cat</sub> y una energía de activación <em>E</em><sub>cat</sub> diferentes. Se encuentra que la reacción catalizada es 13 veces más rápida a 120 °C y 23 veces más rápida a 100 °C. La variación de la energía de activación es Δ<em>E</em> = <em>E</em><sub>a</sub> − <em>E</em><sub>cat</sub>.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Escribe una expresión para el cociente <em>k</em><sub>cat</sub>/<em>k</em> en función de <em>T</em>, <em>A</em>, <em>A</em><sub>cat</sub>, Δ<em>E</em> y las constantes que necesites.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Calcula la variación de la energía de activación, Δ<em>E</em>, en kJ mol<sup>−1</sup>, suponiendo que los factores de frecuencia de colisión no dependen de la temperatura.</p></div></div>
            <p>La etapa determinante de la velocidad en la formación sin catalizar del difluoruro de xenón es la reacción del flúor atómico con el xenón, F(g) + Xe(g) → XeF(g). Una teoría cinética más refinada expresa la constante de velocidad de esta reacción como:</p>
            <p class="pc-eq pc-math"><em>k</em> = <em>&alpha;</em> <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>T</em></span><span class="pc-eq-frac-den"><em>&mu;</em></span></span></span></span> e<sup>−<em>E</em><sub>a</sub>/<em>RT</em></sup></p>
            <p>donde <em>&alpha;</em> es una constante y <em>&mu;</em> es una masa reducida, y ninguna de las dos depende de la temperatura. La constante de velocidad tiene los siguientes valores a distintas temperaturas:</p>
            <table class="pc-table"><thead><tr><th><em>T</em> / °C</th><th>50</th><th>70</th><th>100</th><th>130</th><th>170</th></tr></thead><tbody><tr><td><em>k</em> / dm<sup>3</sup> mol<sup>−1</sup> s<sup>−1</sup></td><td>1.55 × 10<sup>−10</sup></td><td>1.19 × 10<sup>−9</sup></td><td>1.70 × 10<sup>−8</sup></td><td>1.63 × 10<sup>−7</sup></td><td>2.07 × 10<sup>−6</sup></td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>Determina la energía de activación de esta reacción usando los datos tabulados.</p></div></div>
            <p>Cuando se descubrió el xenón en 1898 se le asignó una masa atómica relativa de 128, que se indica erróneamente como 28 en la imagen del comienzo de la pregunta. La masa atómica relativa se ha refinado desde entonces hasta su valor actual de 131.29. La constante de velocidad depende de la masa reducida, <em>&mu;</em>, donde:</p>
            <p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>&mu;</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>M</em><sub>Xe</sub></span></span> + <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>M</em><sub>F</sub></span></span></p>
            <p><em>M</em><sub>Xe</sub> y <em>M</em><sub>F</sub> son las masas atómicas del xenón y del flúor en g mol<sup>−1</sup>, dadas en la tabla periódica al final del examen (<em>A</em><sub>r</sub>(F) = 19.00).</p>
            <div class="pc-part"><span class="pc-part-label">(i)</span><div class="pc-part-body"><p>Determina la constante de velocidad de la reacción F + Xe → XeF a 100 °C si la masa atómica del xenón fuese 28 g mol<sup>−1</sup>. Supón que todos los demás parámetros no cambian.</p></div></div>

2.5" class="pc-dc-cross">&times;</text><text x="150.5" y="222.5" class="pc-dc-cross">&times;</text><text x="125.5" y="197.5" class="pc-dc-cross">&times;</text><text x="125.5" y="207.5" class="pc-dc-cross">&times;</text><text x="165.5" y="207.5" class="pc-dc-cross">&times;</text><text x="165.5" y="197.5" class="pc-dc-cross">&times;</text><circle cx="155.0" cy="87.0" r="2.6" class="pc-dc-dot"/><text x="140.5" y="91.5" class="pc-dc-cross">&times;</text><text x="150.5" y="46.5" class="pc-dc-cross">&times;</text><text x="140.5" y="46.5" class="pc-dc-cross">&times;</text><text x="165.5" y="71.5" class="pc-dc-cross">&times;</text><text x="165.5" y="61.5" class="pc-dc-cross">&times;</text><text x="125.5" y="61.5" class="pc-dc-cross">&times;</text><text x="125.5" y="71.5" class="pc-dc-cross">&times;</text><circle cx="135.2" cy="108.1" r="2.6" class="pc-dc-dot"/><circle cx="128.1" cy="115.2" r="2.6" class="pc-dc-dot"/><circle cx="164.8" cy="151.9" r="2.6" class="pc-dc-dot"/><circle cx="171.9" cy="144.8" r="2.6" class="pc-dc-dot"/></svg></div></div><p>Cada enlace Xe–F es un par compartido (un punto del Xe y una cruz del F); el Xe conserva dos pares solitarios (8 e<sup>−</sup> de valencia = 4 compartidos + 4 en dos pares) y cada F tiene tres pares solitarios.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pares electrónicos del Xe" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><circle cx="104.0" cy="42.1" r="2.6" fill="currentColor"/><circle cx="96.0" cy="42.1" r="2.6" fill="currentColor"/><circle cx="96.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="104.0" cy="127.9" r="2.6" fill="currentColor"/><path d="M83.7,72.7L85.0,71.2M79.8,70.1L81.7,67.8M75.8,67.5L78.4,64.4M71.9,64.8L75.1,61.0M67.9,62.2L71.7,57.6M64.0,59.5L68.4,54.1" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="49.7" y="43.1" text-anchor="end" font-size="15">F</text><path d="M115.0,71.2L116.3,72.7M118.3,67.8L120.2,70.1M121.6,64.4L124.2,67.5M124.9,61.0L128.1,64.8M128.3,57.6L132.1,62.2M131.6,54.1L136.0,59.5" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="150.3" y="43.1" text-anchor="start" font-size="15">F</text><polygon points="88.0,95.0 60.0,113.1 65.1,119.3" fill="currentColor"/><text x="49.7" y="138.9" text-anchor="end" font-size="15">F</text><polygon points="112.0,95.0 134.9,119.3 140.0,113.1" fill="currentColor"/><text x="150.3" y="138.9" text-anchor="start" font-size="15">F</text><text x="100" y="91" text-anchor="middle" font-size="16" font-weight="600">Xe</text></svg><span class="pc-compound-name">Pares libres <em>trans</em><br><strong>&#9745; adoptada</strong> (cuadrada plana)</span></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pares electrónicos del Xe" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><circle cx="96.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="104.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="129.1" cy="114.5" r="2.6" fill="currentColor"/><circle cx="134.2" cy="108.3" r="2.6" fill="currentColor"/><line x1="100.0" y1="68.8" x2="100.0" y2="34.3" stroke="currentColor" stroke-width="1.7"/><text x="100.0" y="17.0" text-anchor="middle" font-size="15">F</text><path d="M83.7,72.7L85.0,71.2M79.8,70.1L81.7,67.8M75.8,67.5L78.4,64.4M71.9,64.8L75.1,61.0M67.9,62.2L71.7,57.6M64.0,59.5L68.4,54.1" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="49.7" y="43.1" text-anchor="end" font-size="15">F</text><path d="M115.0,71.2L116.3,72.7M118.3,67.8L120.2,70.1M121.6,64.4L124.2,67.5M124.9,61.0L128.1,64.8M128.3,57.6L132.1,62.2M131.6,54.1L136.0,59.5" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="150.3" y="43.1" text-anchor="start" font-size="15">F</text><polygon points="88.0,95.0 60.0,113.1 65.1,119.3" fill="currentColor"/><text x="49.7" y="138.9" text-anchor="end" font-size="15">F</text><text x="100" y="91" text-anchor="middle" font-size="16" font-weight="600">Xe</text></svg><span class="pc-compound-name">Pares libres <em>cis</em><br>&#9744;</span></div></div><p class="pc-note">Un punto por identificar las dos disposiciones (<em>cis</em> y <em>trans</em> de los pares libres) y otro por marcar la <em>trans</em> (cuadrada plana). Se adopta para maximizar la separación entre los dos pares libres. No se exige nombrar las disposiciones ni dibujar cuñas y guiones si la forma es clara.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">3 puntos</span></div><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pares electrónicos del Xe" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="100.0" y1="68.8" x2="100.0" y2="34.3" stroke="currentColor" stroke-width="1.7"/><text x="100.0" y="17.0" text-anchor="middle" font-size="15">F</text><line x1="100.0" y1="101.2" x2="100.0" y2="135.7" stroke="currentColor" stroke-width="1.7"/><text x="100.0" y="165.0" text-anchor="middle" font-size="15">F</text><circle cx="57.8" cy="81.0" r="2.6" fill="currentColor"/><circle cx="57.8" cy="89.0" r="2.6" fill="currentColor"/><circle cx="134.2" cy="61.7" r="2.6" fill="currentColor"/><circle cx="129.1" cy="55.5" r="2.6" fill="currentColor"/><circle cx="129.1" cy="114.5" r="2.6" fill="currentColor"/><circle cx="134.2" cy="108.3" r="2.6" fill="currentColor"/><text x="100" y="91" text-anchor="middle" font-size="16" font-weight="600">Xe</text></svg><span class="pc-compound-name">F axiales, 3 pares libres ecuatoriales<br><strong>&#9745; adoptada</strong> (lineal)</span></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pares electrónicos del Xe" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="100.0" y1="68.8" x2="100.0" y2="34.3" stroke="currentColor" stroke-width="1.7"/><text x="100.0" y="17.0" text-anchor="middle" font-size="15">F</text><line x1="84.0" y1="85.0" x2="50.1" y2="85.0" stroke="currentColor" stroke-width="1.7"/><text x="33.0" y="90.0" text-anchor="end" font-size="15">F</text><circle cx="96.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="104.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="134.2" cy="61.7" r="2.6" fill="currentColor"/><circle cx="129.1" cy="55.5" r="2.6" fill="currentColor"/><circle cx="129.1" cy="114.5" r="2.6" fill="currentColor"/><circle cx="134.2" cy="108.3" r="2.6" fill="currentColor"/><text x="100" y="91" text-anchor="middle" font-size="16" font-weight="600">Xe</text></svg><span class="pc-compound-name">Un F axial y otro ecuatorial<br>&#9744;</span></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pares electrónicos del Xe" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="84.0" y1="85.0" x2="50.1" y2="85.0" stroke="currentColor" stroke-width="1.7"/><text x="33.0" y="90.0" text-anchor="end" font-size="15">F</text><path d="M115.0,71.2L116.3,72.7M118.3,67.8L120.2,70.1M121.6,64.4L124.2,67.5M124.9,61.0L128.1,64.8M128.3,57.6L132.1,62.2M131.6,54.1L136.0,59.5" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="150.3" y="43.1" text-anchor="start" font-size="15">F</text><circle cx="104.0" cy="42.1" r="2.6" fill="currentColor"/><circle cx="96.0" cy="42.1" r="2.6" fill="currentColor"/><circle cx="96.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="104.0" cy="127.9" r="2.6" fill="currentColor"/><circle cx="129.1" cy="114.5" r="2.6" fill="currentColor"/><circle cx="134.2" cy="108.3" r="2.6" fill="currentColor"/><text x="100" y="91" text-anchor="middle" font-size="16" font-weight="600">Xe</text></svg><span class="pc-compound-name">Dos F ecuatoriales<br>&#9744;</span></div></div><p class="pc-note">Primer punto: dibujar al menos una disposición de la forma global correcta (bipirámide trigonal). Segundo: dar las tres disposiciones y ninguna incorrecta o duplicada. Tercero: marcar la lineal, que es la que maximiza la separación entre los tres pares libres (todos en el plano ecuatorial, a 120°).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>v</em> = <em>k</em>[Xe] &nbsp;&nbsp;<em>o bien</em>&nbsp;&nbsp; <em>v</em> = <em>k p</em><sub>Xe</sub></p><p class="pc-note">Al duplicar <em>n</em><sub>Xe</sub> la velocidad se duplica (orden 1 en Xe), y al duplicar <em>n</em><sub>F<sub>2</sub></sub> no cambia (orden 0 en F<sub>2</sub>). Con volumen constante, <em>n</em> ∝ concentración.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>k</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>A</em><sub>cat</sub> e<sup>−<em>E</em><sub>cat</sub>/<em>RT</em></sup></span><span class="pc-eq-frac-den"><em>A</em> e<sup>−<em>E</em><sub>a</sub>/<em>RT</em></sup></span></span></p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>k</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>A</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>A</em></span></span> e<sup>Δ<em>E</em>/<em>RT</em></sup></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math">ln <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>k</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">Δ<em>E</em></span><span class="pc-eq-frac-den"><em>RT</em></span></span> + ln <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>A</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>A</em></span></span></p><p class="pc-eq pc-math">ln <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>k</em></span></span><span style="font-size:.8em">(<em>T</em><sub>1</sub>)</span> − ln <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>cat</sub></span><span class="pc-eq-frac-den"><em>k</em></span></span><span style="font-size:.8em">(<em>T</em><sub>2</sub>)</span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">Δ<em>E</em></span><span class="pc-eq-frac-den"><em>R</em></span></span>&thinsp;(1/<em>T</em><sub>1</sub> − 1/<em>T</em><sub>2</sub>)</p><p class="pc-eq pc-math">Δ<em>E</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>R</em> (ln 13 − ln 23)</span><span class="pc-eq-frac-den">1/393 K − 1/373 K</span></span></p><p class="pc-eq pc-math">Δ<em>E</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">8.314 J K<sup>−1</sup> mol<sup>−1</sup> × (ln 13 − ln 23)</span><span class="pc-eq-frac-den">(393)<sup>−1</sup> K<sup>−1</sup> − (373)<sup>−1</sup> K<sup>−1</sup></span></span></p><p class="pc-eq pc-math">Δ<em>E</em> = 3.48 × 10<sup>4</sup> J mol<sup>−1</sup> = <strong>34.8 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Un punto por eliminar <em>A</em><sub>cat</sub>/<em>A</em> (restando las dos temperaturas), otro por despejar Δ<em>E</em> y otro por el cálculo final (34.8 kJ mol<sup>−1</sup>).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>k</em> = <em>c</em> <em>T</em><sup>½</sup> e<sup>−<em>E</em><sub>a</sub>/<em>RT</em></sup> &nbsp;&nbsp; con &nbsp; <em>c</em> = <em>&alpha;</em>/√<em>&mu;</em> (constante)</p><p class="pc-eq pc-math">ln <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em></span><span class="pc-eq-frac-den"><span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body"><em>T</em></span></span></span></span> = −<span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>E</em><sub>a</sub></span><span class="pc-eq-frac-den"><em>R</em></span></span> · <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>T</em></span></span> + ln <em>c</em></p><p>Representando ln(<em>k</em>/√<em>T</em>) frente a 1/<em>T</em> se obtiene una recta de pendiente −<em>E</em><sub>a</sub>/<em>R</em>:</p><table class="pc-table"><thead><tr><th><em>T</em> / K</th><th>323</th><th>343</th><th>373</th><th>403</th><th>443</th></tr></thead><tbody><tr><td>10<sup>3</sup>/<em>T</em> / K<sup>−1</sup></td><td>3.096</td><td>2.916</td><td>2.681</td><td>2.481</td><td>2.257</td></tr><tr><td>ln(<em>k</em>/√<em>T</em>)</td><td>−25.48</td><td>−23.47</td><td>−20.85</td><td>−18.63</td><td>−16.13</td></tr></tbody></table><p class="pc-eq pc-math"><em>E</em><sub>a</sub> = −<em>R</em> <span class="pc-eq-frac"><span class="pc-eq-frac-num">ln(<em>k</em><sub>1</sub><em>T</em><sub>1</sub><sup>−1/2</sup>) − ln(<em>k</em><sub>2</sub><em>T</em><sub>2</sub><sup>−1/2</sup>)</span><span class="pc-eq-frac-den"><em>T</em><sub>1</sub><sup>−1</sup> − <em>T</em><sub>2</sub><sup>−1</sup></span></span></p><p class="pc-eq pc-math"><em>E</em><sub>a</sub> = −8.314 × <span class="pc-eq-frac"><span class="pc-eq-frac-num">(−25.48) − (−16.13)</span><span class="pc-eq-frac-den">1/323 − 1/443</span></span> = <strong>92.7 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Un punto por eliminar las constantes independientes de <em>T</em>, otro por despejar <em>E</em><sub>a</sub> y otro por el resultado. Puede usarse cualquier par de temperaturas; el intervalo válido es 92.4 ≤ <em>E</em><sub>a</sub> ≤ 93.0 kJ mol<sup>−1</sup> (si se ignora el factor <em>T</em><sup>½</sup> sale 94.3 kJ mol<sup>−1</sup>, que no puntúa).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)</span><span class="pc-marks">2 puntos</span></div><p>Solo cambia la masa reducida <em>&mu;</em>. Para el «xenón ligero» con <em>k</em>′:</p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em>′</span><span class="pc-eq-frac-den"><em>k</em></span></span> = <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&mu;</em></span><span class="pc-eq-frac-den"><em>&mu;</em>′</span></span></span></span> = <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body"><span class="pc-eq-frac"><span class="pc-eq-frac-num">1/28 + 1/19.00</span><span class="pc-eq-frac-den">1/131.29 + 1/19.00</span></span></span></span> = 1.211</p><p class="pc-eq pc-math"><em>k</em>′ = 1.211 × 1.70 × 10<sup>−8</sup> dm<sup>3</sup> mol<sup>−1</sup> s<sup>−1</sup> = <strong>2.06 × 10<sup>−8</sup> dm<sup>3</sup> mol<sup>−1</sup> s<sup>−1</sup></strong></p><p class="pc-note">Un punto por una expresión que elimine todos los parámetros inalterados y otro por el cálculo final.</p></div>
        `

    "q35-carburo-calcio-2020": {
        titulo: "Carburo de calcio",
        numero: "Q35",
        fuente: "52ª Olimpiada Internacional de Química (IChO) · UK Round One 2020",

        enunciado: `
            <p class="pc-q-title">Q35 — Esta pregunta trata sobre el carburo de calcio</p>

            <div class="pc-intro">
                <p>El carburo de calcio (CaC<sub>2</sub>) es un sólido incoloro que se usa en la producción de etino. El carburo de calcio se produce cuando el óxido de calcio reacciona con carbono, formando carburo de calcio y monóxido de carbono. La mascota del equipo de la IChO del Reino Unido aparece junto a una lámpara de carburo de calcio.</p>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe una ecuación para la formación del carburo de calcio a partir del óxido de calcio.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja un diagrama de puntos y cruces del ion carburo, C<sub>2</sub><sup>2−</sup>.</p></div></div></div>
            <p>El químico alemán Friedrich Wöhler descubrió que el carburo de calcio reaccionaba con el agua liberando etino (C<sub>2</sub>H<sub>2</sub>) e hidróxido de calcio. El etino se quemaba en las lámparas de los mineros y en los faros de los primeros automóviles para iluminar.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Escribe una ecuación para la formación de etino a partir de carburo de calcio.</p></div></div>
            <p>Se añadió una muestra impura de carburo de calcio de masa 0.752 g a 50.0 cm<sup>3</sup> de agua. Una vez reaccionado todo el carburo de calcio, se retiraron 20.00 cm<sup>3</sup> de la mezcla de reacción y se valoraron con ácido clorhídrico 0.250 mol dm<sup>−3</sup>. Se necesitaron 34.60 cm<sup>3</sup> de ácido clorhídrico para neutralizar la muestra. Puede suponerse que ninguna de las impurezas reaccionó.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Calcula el porcentaje de pureza del carburo de calcio.</p></div></div>
            <div class="pc-figrow"><div class="pc-figtext"><p>El diagrama muestra la celda unidad del carburo de calcio. El calcio está situado en los vértices y en el centro de la celda unidad.</p><p>Algunos de los átomos están completamente contenidos dentro de los límites de una sola celda unidad. Solo una fracción de los átomos centrados en vértices, aristas o caras está contenida dentro de una sola celda unidad.</p></div><div class="pc-figside"><img src="https://i.imgur.com/aiyJIbf.png" alt="Celda unidad del carburo de calcio con las dimensiones x, y, z" loading="lazy" style="max-width:330px;width:100%;border-radius:10px"></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Considerando las fracciones de átomos dentro de una celda unidad, cuenta el número neto de átomos de calcio y de carbono dentro de una celda unidad.</p></div></div>
            <p>La densidad del carburo de calcio es 2.20 g cm<sup>−3</sup> y los valores de <em>x</em> e <em>y</em> son ambos 3.88 Å.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula el valor de <em>z</em> en Å.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q35 — Esta pregunta trata sobre el carburo de calcio <span class="pc-total-chip">Total: 10 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CaO + 3 C &rarr; CaC<sub>2</sub> + CO</p><p class="pc-note">Debe estar completamente correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><div class="pc-dotcross"><svg viewBox="40 15 310 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de puntos y cruces del ion carburo C2 2−" style="width:380px;max-width:100%"><circle cx="125" cy="85" r="42" class="pc-dc-atom-circle"/><circle cx="195" cy="85" r="42" class="pc-dc-atom-circle"/><text x="125" y="93" class="pc-dc-atom-label">C</text><text x="195" y="93" class="pc-dc-atom-label">C</text><circle cx="155.5" cy="69" r="2.8" class="pc-dc-dot"/><text x="160.0" y="73.5" class="pc-dc-cross">&times;</text><circle cx="155.5" cy="85" r="2.8" class="pc-dc-dot"/><text x="160.0" y="89.5" class="pc-dc-cross">&times;</text><circle cx="155.5" cy="101" r="2.8" class="pc-dc-dot"/><text x="160.0" y="105.5" class="pc-dc-cross">&times;</text><circle cx="95" cy="81" r="2.8" class="pc-dc-dot"/><circle cx="95" cy="92" r="3.4" fill="none" stroke="#2a7a3b" stroke-width="1.6"/><text x="220.5" y="85.5" class="pc-dc-cross">&times;</text><circle cx="225" cy="92" r="3.4" fill="none" stroke="#2a7a3b" stroke-width="1.6"/><text x="355" y="38" font-size="17" fill="currentColor" text-anchor="end">2−</text></svg></div><p style="text-align:center;font-size:.85em">• = electrón del C izquierdo &nbsp; × = electrón del C derecho &nbsp; <span style="color:#2a7a3b">○</span> = electrón adicional (carga 2−)</p><p class="pc-note">Hay que indicar la carga 2−. Los dos C comparten tres pares (triple enlace, 6 e<sup>−</sup>) y cada C conserva un par solitario: 10 e<sup>−</sup> de valencia (2 × 4 + 2 de la carga).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CaC<sub>2</sub> + 2 H<sub>2</sub>O &rarr; Ca(OH)<sub>2</sub> + C<sub>2</sub>H<sub>2</sub></p><p class="pc-note">Debe estar completamente correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>n</em>(HCl) = 0.03460 dm<sup>3</sup> × 0.250 mol dm<sup>−3</sup> = 8.65 × 10<sup>−3</sup> mol</p><p class="pc-eq pc-math"><em>n</em>(Ca(OH)<sub>2</sub>) en 20.0 cm<sup>3</sup> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">8.65 × 10<sup>−3</sup></span><span class="pc-eq-frac-den">2</span></span> = 4.325 × 10<sup>−3</sup> mol</p><p class="pc-eq pc-math"><em>n</em>(Ca(OH)<sub>2</sub>) en 50.0 cm<sup>3</sup> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">50.0</span><span class="pc-eq-frac-den">20.0</span></span> × 4.325 × 10<sup>−3</sup> = 0.0108 mol = <em>n</em>(CaC<sub>2</sub>)</p><p class="pc-eq pc-math"><em>m</em>(CaC<sub>2</sub>) = 0.0108 mol × 64.1 g mol<sup>−1</sup> = 0.693 g</p><p class="pc-eq pc-math">% pureza = <span class="pc-eq-frac"><span class="pc-eq-frac-num">0.693 g</span><span class="pc-eq-frac-den">0.752 g</span></span> × 100 = <strong>92.2 %</strong></p><p class="pc-note">Un punto por los moles de CaC<sub>2</sub> (0.0108 mol) y otro por el porcentaje. La respuesta correcta vale los dos puntos sea cual sea el procedimiento.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">Ca: 8 vértices × <sup>1</sup>⁄<sub>8</sub> + 1 centro = <strong>2 átomos de Ca</strong></p><p class="pc-eq pc-math">C: 8 aristas (átomos de C<sub>2</sub><sup>2−</sup>) × <sup>1</sup>⁄<sub>4</sub> + 2 en el interior = <strong>4 átomos de C</strong>  (2 iones C<sub>2</sub><sup>2−</sup>)</p><p class="pc-note">Un punto por cada número correcto: la celda unidad contiene 2 unidades CaC<sub>2</sub>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>V</em><sub>m</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">64.1 g mol<sup>−1</sup></span><span class="pc-eq-frac-den">2.20 g cm<sup>−3</sup></span></span> = 29.14 cm<sup>3</sup> mol<sup>−1</sup> = 2.914 × 10<sup>−5</sup> m<sup>3</sup> mol<sup>−1</sup></p><p class="pc-eq pc-math"><em>V</em><sub>celda</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2 × 2.914 × 10<sup>−5</sup> m<sup>3</sup> mol<sup>−1</sup></span><span class="pc-eq-frac-den">6.02 × 10<sup>23</sup> mol<sup>−1</sup></span></span> = 9.68 × 10<sup>−29</sup> m<sup>3</sup> = 96.8 Å<sup>3</sup></p><p class="pc-eq pc-math"><em>z</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>V</em><sub>celda</sub></span><span class="pc-eq-frac-den"><em>x</em> <em>y</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">96.8 Å<sup>3</sup></span><span class="pc-eq-frac-den">(3.88 Å)<sup>2</sup></span></span> = <strong>6.43 Å</strong></p><p class="pc-note">Un punto por el volumen molar en m<sup>3</sup>, otro por el volumen de la celda (en m<sup>3</sup> o Å<sup>3</sup>) y otro por <em>z</em>. La respuesta correcta vale tres puntos sea cual sea el procedimiento.</p></div>
        `
    },

    "q36-hidrogeno-combustible-2020": {
        titulo: "El hidrógeno como combustible",
        numero: "Q36",
        fuente: "52ª Olimpiada Internacional de Química (IChO) · UK Round One 2020",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 52nd IChO, UK Round One 2020 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, P. Bolgar, C. Francis, M. Jordan, S. Kang, JL Kiappes, R. King, B. Pilgrim, P. Robotham, R. Simon, A. Taylor, A. Thom, G. Trenins. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© Dr Ben Pilgrim, © Shutterstock, © Royal Society of Chemistry) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q36 — Esta pregunta trata sobre el hidrógeno como combustible</p>

            <div class="pc-intro">
                <p>Las emisiones de dióxido de carbono procedentes de los combustibles fósiles son un factor importante del cambio climático. El hidrógeno es una posible alternativa a los combustibles fósiles, que proporciona «energía limpia» con agua como único subproducto. El gobierno del Reino Unido estudia convertir la red de gas natural para que transporte hidrógeno en lugar de gas natural.</p>
            </div>
            <p>En esta pregunta supón que todos los procesos tienen lugar a 298 K.</p>
            <table class="pc-table"><thead><tr><th>Dato</th><th>Valor</th></tr></thead><tbody><tr><td>Entalpía de formación de CH<sub>4</sub>(g), Δ<sub>f</sub>H°</td><td>−74.8 kJ mol<sup>−1</sup></td></tr><tr><td>Entalpía de formación de CO<sub>2</sub>(g), Δ<sub>f</sub>H°</td><td>−393.5 kJ mol<sup>−1</sup></td></tr><tr><td>Entalpía de formación de H<sub>2</sub>O(l), Δ<sub>f</sub>H°</td><td>−285.8 kJ mol<sup>−1</sup></td></tr><tr><td>Entropía de formación de H<sub>2</sub>O(l), Δ<sub>f</sub>S°</td><td>−163.0 J K<sup>−1</sup> mol<sup>−1</sup></td></tr></tbody></table>
            <p>Un método de bajo coste para producir hidrógeno es el reformado de metano. Aunque produce CO<sub>2</sub>, este puede capturarse con facilidad. El proceso de reformado puede representarse con la reacción global:</p>
            <p class="pc-eq pc-math">CH<sub>4</sub>(g) + 2 H<sub>2</sub>O(l) &rarr; CO<sub>2</sub>(g) + 4 H<sub>2</sub>(g)</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Calcula la variación de entalpía de esta reacción.</p></div></div>
            <p>La electrólisis del agua es otro método de producir hidrógeno. A gran escala, actualmente cuesta más que el reformado de metano. En la electrólisis con membrana de electrolito polimérico, los protones se transfieren a través de una membrana entre los dos electrodos. Las dos semirreacciones son:</p>
            <p class="pc-eq pc-math">1. &nbsp; 2 H<sub>2</sub>O(l) &rarr; O<sub>2</sub>(g) + 4 H<sup>+</sup>(aq) + 4 e<sup>−</sup></p><p class="pc-eq pc-math">2. &nbsp; 2 H<sup>+</sup>(aq) + 2 e<sup>−</sup> &rarr; H<sub>2</sub>(g)</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>¿Cuál de estas semirreacciones ocurre en el cátodo?</p></div></div>
            <p>La reacción global de la celda es:</p>
            <p class="pc-eq pc-math">2 H<sub>2</sub>O(l) &rarr; 2 H<sub>2</sub>(g) + O<sub>2</sub>(g)</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Calcula la variación de entalpía de la reacción global de la celda.</p></div></div>
            <p>Dado que:</p>
            <p class="pc-eq pc-math">Δ<em>G</em>° = −<em>nFE</em>° &nbsp;&nbsp;y&nbsp;&nbsp; Δ<em>G</em>° = Δ<em>H</em>° − <em>T</em>Δ<em>S</em>°</p>
            <p>donde <em>n</em> = moles de electrones transferidos en la ecuación global y <em>F</em> = constante de Faraday (96485 C mol<sup>−1</sup>).</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Calcula el potencial de la celda, <em>E</em>°, de la reacción global de la celda en V.</p><p><em>(Si no obtuviste respuesta, usa −1.13 V en los cálculos posteriores.)</em></p></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>¿Cuál es el potencial estándar de electrodo de la semirreacción 1?</p></div></div>
            <p>Para sustituir al gas natural en aparatos como calderas u hornos, hace falta que se libere una cantidad de calor por segundo similar al quemar el combustible.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>¿Cuál es la variación de entalpía estándar de combustión del CH<sub>4</sub>?</p><p><em>(Si no obtuviste respuesta, usa −943.2 kJ mol<sup>−1</sup>.)</em></p></div></div>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>¿Cuál es la variación de entalpía estándar de combustión del H<sub>2</sub>?</p><p><em>(Si no obtuviste respuesta, usa −352.8 kJ mol<sup>−1</sup>.)</em></p></div></div>
            <p>Cuando los gases combustibles se suministran a la misma presión, el calor liberado por segundo en un quemador puede expresarse mediante:</p>
            <p class="pc-eq pc-math">calor liberado por segundo &prop; <span class="pc-eq-frac"><span class="pc-eq-frac-num">variación de entalpía estándar de combustión</span><span class="pc-eq-frac-den"><span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body">masa molecular relativa</span></span></span></span></p>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>¿Cuál es el cociente entre el calor liberado por segundo en un quemador alimentado con hidrógeno y en el mismo quemador alimentado con metano? Supón que el hidrógeno y el metano se suministran a la misma presión.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q36 — Esta pregunta trata sobre el hidrógeno como combustible <span class="pc-total-chip">Total: 10 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<sub>r</sub>H° = ΣΔ<sub>f</sub>H°(productos) − ΣΔ<sub>f</sub>H°(reactivos)</p><p class="pc-eq pc-math">Δ<sub>r</sub>H° = −393.5 − [−74.8 + 2 × (−285.8)] kJ mol<sup>−1</sup> = <strong>+253 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Los elementos H<sub>2</sub>(g) tienen Δ<sub>f</sub>H° = 0.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">2 H<sup>+</sup>(aq) + 2 e<sup>−</sup> &rarr; H<sub>2</sub>(g)</p><p>Es la <strong>semirreacción 2</strong>: la reducción ocurre en el cátodo.</p><p class="pc-note">Vale citar «reacción 2» o la propia ecuación.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<em>H</em>° = 2 × 285.8 = <strong>+571.6 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Es la inversa de la formación de 2 mol de H<sub>2</sub>O(l). El signo debe ser correcto: un valor negativo no puntúa.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">Δ<em>S</em>° = 2 × 163.0 = +326.0 J K<sup>−1</sup> mol<sup>−1</sup></p><p class="pc-eq pc-math">Δ<em>G</em>° = 571.6 − 298 × 0.326 = +474.5 kJ mol<sup>−1</sup></p><p class="pc-eq pc-math"><em>E</em>° = <span class="pc-eq-frac"><span class="pc-eq-frac-num">−Δ<em>G</em>°</span><span class="pc-eq-frac-den"><em>nF</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">−474.5 × 10<sup>3</sup> J mol<sup>−1</sup></span><span class="pc-eq-frac-den">4 × 96485 C mol<sup>−1</sup></span></span> = <strong>−1.23 V</strong></p><p class="pc-note">Un punto por Δ<em>G</em>° y otro por <em>E</em>°. Se admite error arrastrado desde (c).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>E</em>°(1) = −1.23 V</p><p class="pc-note">Es igual que en (d): la otra semirreacción es el electrodo estándar de hidrógeno, con <em>E</em>° = 0.00 V. (Escrita como oxidación, tal como aparece, vale −1.23 V; el potencial de reducción del par O<sub>2</sub>/H<sub>2</sub>O es +1.23 V.) Se acepta −1.13 V si no se obtuvo respuesta en (d).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CH<sub>4</sub>(g) + 2 O<sub>2</sub>(g) &rarr; CO<sub>2</sub>(g) + 2 H<sub>2</sub>O(l)</p><p class="pc-eq pc-math">Δ<sub>c</sub>H° = 2 × (−285.8) + (−393.5) − (−74.8) = <strong>−890.3 kJ mol<sup>−1</sup></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">H<sub>2</sub>(g) + ½ O<sub>2</sub>(g) &rarr; H<sub>2</sub>O(l)</p><p class="pc-eq pc-math">Δ<sub>c</sub>H°(H<sub>2</sub>) = <strong>−285.8 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Es la entalpía de formación del agua, dato del enunciado; es la única respuesta correcta (sin error arrastrado).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>M</em><sub>r</sub>(H<sub>2</sub>) = 2 &nbsp;&nbsp; <em>M</em><sub>r</sub>(CH<sub>4</sub>) = 16</p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">calor con H<sub>2</sub></span><span class="pc-eq-frac-den">calor con CH<sub>4</sub></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><span class="pc-eq-frac"><span class="pc-eq-frac-num">−285.8</span><span class="pc-eq-frac-den">√2</span></span></span><span class="pc-eq-frac-den"><span class="pc-eq-frac"><span class="pc-eq-frac-num">−890.3</span><span class="pc-eq-frac-den">√16</span></span></span></span> = <strong>0.908</strong> &nbsp;(0.908 : 1)</p><p class="pc-note">Con los valores dados como alternativa (−352.8 y −943.2): 1.058. Debe darse en este orden (valor menor que 1); un punto por el inverso, 1.101.</p></div>
        `
    },

    "q37-crema-solar-2020": {
        titulo: "Crema solar",
        numero: "Q37",
        fuente: "52ª Olimpiada Internacional de Química (IChO) · UK Round One 2020",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 52nd IChO, UK Round One 2020 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, P. Bolgar, C. Francis, M. Jordan, S. Kang, JL Kiappes, R. King, B. Pilgrim, P. Robotham, R. Simon, A. Taylor, A. Thom, G. Trenins. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© Dr Ben Pilgrim, © Shutterstock, © Royal Society of Chemistry) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q37 — Esta pregunta trata sobre la crema solar</p>

            <div class="pc-intro">
                <p>El 1 de enero, la isla de Palaos, en el Pacífico, impuso una prohibición de ciertos protectores solares para proteger sus arrecifes de coral. La prohibición restringe el uso de diez productos tóxicos para la vida marina y relacionados con el blanqueamiento del coral. A los científicos les preocupan especialmente dos sustancias que absorben luz UV: la oxibenzona y el octinoxato.</p>
                <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="COc1ccc(C(=O)c2ccccc2)c(O)c1"></span><span class="pc-compound-name">oxibenzona</span></div></div>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>¿Qué grupos funcionales están presentes en la oxibenzona? Marca la(s) respuesta(s) correcta(s) en el cuadernillo.</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; éster</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; aldehído</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; cetona</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; ácido carboxílico</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; éter</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; fenol</td></tr></tbody></table></div></div>
            <p>La oxibenzona absorbe bien la radiación UV por la deslocalización de sus electrones. Esta deslocalización de electrones está favorecida por un enlace de hidrógeno <strong>intra</strong>molecular en la oxibenzona.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>En la estructura de la oxibenzona del cuadernillo, rodea con un círculo los dos átomos implicados en el enlace de hidrógeno intramolecular.</p></div></div>
            <p>La síntesis de la oxibenzona se muestra a continuación.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.85 gapx=70 gapy=40
a @0,0: t:A | C7H6O2
b @2,0: t:B
c @0,1: t:C | C6H6O2
d @2,1: t:D | C7H8O2
p @3,1: COc1ccc(C(=O)c2ccccc2)c(O)c1 | oxibenzona C14H12O3
a -&gt; b | SOCl2
c -&gt; d | NaOH | sulfato de dimetilo
b -&gt; p | AlCl3 | ruta=hv
d -&gt; p | AlCl3"></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja las estructuras de los compuestos <strong>A</strong>, <strong>B</strong>, <strong>C</strong> y <strong>D</strong>.</p></div></div>
            <p>El octinoxato existe como múltiples estereoisómeros; solo se muestra uno. Los enantiómeros son estereoisómeros que son imágenes especulares no superponibles entre sí.</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="COc1ccc(/C=C/C(=O)OC[C@@H](CC)CCCC)cc1"></span><span class="pc-compound-name">octinoxato</span></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Dibuja un segundo estereoisómero del octinoxato que sea el enantiómero del mostrado.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja un tercer estereoisómero del octinoxato que no sea el enantiómero del mostrado.</p></div></div></div>
            <p>En la síntesis del octinoxato se usa una reacción de condensación catalizada por base entre dos moléculas que contienen grupos C=O. El producto de esta reacción es una molécula que contiene un C=C y un C=O contiguos. Esta proximidad contribuye a que el octinoxato sea un buen absorbente de luz UV.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.9 gapx=70 gapy=40
r1 @0,0: [*:1]C(=O)C[*:2] | |
p0 @1,0: t:+
r3 @2,0: [*:3]C(=O)[*:4]
pr @4,0: [*:1]C(=O)C([*:2])=C([*:3])[*:4]
w @5,0: t:+ H2O
r3 -&gt; pr | base | catalizador"></div>
            <p>La síntesis del octinoxato comienza con la conversión de dos moléculas de <strong>E</strong> en <strong>F</strong>.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.8 gapx=70 gapy=40
e1 @0,0: t:E + E | C4H8O
f @1,0: t:F + H2O | C8H14O
e1 -&gt; f | NaOH"></div>
            <table class="pc-table"><thead><tr><th>Compuesto</th><th>IR</th><th>RMN de <sup>1</sup>H</th></tr></thead><tbody><tr><td><strong>E</strong></td><td>1730 cm<sup>−1</sup></td><td>0.9 ppm, 3H, triplete; 1.6 ppm, 2H, multiplete; 2.5 ppm, 2H, multiplete; 9.7 ppm, 1H, triplete</td></tr><tr><td><strong>F</strong></td><td>1628 cm<sup>−1</sup>, 1687 cm<sup>−1</sup></td><td>—</td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Dibuja las estructuras de los compuestos <strong>E</strong> y <strong>F</strong>. No se requiere estereoquímica.</p></div></div>
            <p>El compuesto <strong>F</strong> se convierte después en octinoxato en tres etapas. No se muestran los subproductos.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.85 gapx=70 gapy=40
f @0,0: t:F
g @1,0: t:G
h @2,0: t:H
ald @1,1: COc1ccc(C=O)cc1 | 4-metoxibenzaldehído
oc @2,1: COc1ccc(/C=C/C(=O)OCC(CC)CCCC)cc1 | octinoxato
f -&gt; g | H2 / Pd
g -&gt; h | CH3COOCH3 | NaOCH3
h -&gt; oc | ald. | NaOCH3"></div>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Dibuja las estructuras de los compuestos <strong>G</strong> y <strong>H</strong>. No se requiere estereoquímica.</p></div></div>
            <p>Al exponerse a la luz UV, el octinoxato forma dos tipos de dímeros tóxicos para la vida marina: truxinatos y truxilatos. Si se irradia un único estereoisómero con luz UV, pueden formarse muchos estereoisómeros diferentes de truxinatos y truxilatos por la posición de los grupos (abreviados R o Ar) en el nuevo anillo de ciclobutano.</p>
            
            <div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 160 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Truxinato (cabeza con cabeza)" style="width:150px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><rect x="60" y="45" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"/><polygon points="60.0,45.0 34.7,17.0 29.3,23.0" fill="currentColor"/><text x="26" y="18" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,45.0 130.7,23.0 125.3,17.0" fill="currentColor"/><text x="134" y="18" text-anchor="start" font-size="15">R</text><path d="M56.7,89.3L55.3,87.8M53.0,93.3L51.0,91.0M49.3,97.2L46.7,94.2M45.7,101.2L42.3,97.4M42.0,105.1L38.0,100.6M38.3,109.0L33.7,103.8" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="26" y="122" text-anchor="end" font-size="15">Ar</text><path d="M104.7,87.8L103.3,89.3M109.0,91.0L107.0,93.3M113.3,94.2L110.7,97.2M117.7,97.4L114.3,101.2M122.0,100.6L118.0,105.1M126.3,103.8L121.7,109.0" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg><span class="pc-compound-name"><strong>Truxinato</strong><br>(cabeza-cabeza): Ar con Ar y R con R</span></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 160 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Truxilato (cabeza con cola)" style="width:150px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><rect x="60" y="45" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"/><polygon points="60.0,45.0 34.7,17.0 29.3,23.0" fill="currentColor"/><text x="26" y="18" text-anchor="end" font-size="15">Ar</text><path d="M103.3,40.7L104.7,42.2M107.0,36.7L109.0,39.0M110.7,32.8L113.3,35.8M114.3,28.8L117.7,32.6M118.0,24.9L122.0,29.4M121.7,21.0L126.3,26.2" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="134" y="18" text-anchor="start" font-size="15">R</text><path d="M56.7,89.3L55.3,87.8M53.0,93.3L51.0,91.0M49.3,97.2L46.7,94.2M45.7,101.2L42.3,97.4M42.0,105.1L38.0,100.6M38.3,109.0L33.7,103.8" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="26" y="122" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,85.0 125.3,113.0 130.7,107.0" fill="currentColor"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg><span class="pc-compound-name"><strong>Truxilato</strong><br>(cabeza-cola): Ar frente a R</span></div></div>
            <p style="font-size:.85em">En el truxinato (dímero cabeza-cabeza) los dos grupos Ar son vecinos en el anillo (igual que los dos R); en el truxilato (dímero cabeza-cola) cada Ar queda junto a un R. Las cuñas y los guiones indican la cara del anillo en que está cada sustituyente.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>¿Qué tienen en común todos los productos truxinato y truxilato producidos en esta reacción? Marca la(s) respuesta(s) correcta(s) en el cuadernillo.</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; La misma fórmula molecular</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; Los mismos puntos de fusión</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; Giran el plano de la luz polarizada en el mismo sentido</td></tr></tbody></table></div></div>
            <p>Un grupo de investigación separó los productos formados para entender mejor sus propiedades toxicológicas. Los dímeros truxinato pueden clasificarse según el número de sustituyentes en la misma cara del anillo de ciclobutano (dos, tres o cuatro). Esto se muestra con enlaces en cuña y con guiones.</p>

lygon points="100.0,85.0 125.3,113.0 130.7,107.0" fill="currentColor"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 160 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclobutano con Ar y R" style="width:150px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><rect x="60" y="45" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M55.3,42.2L56.7,40.7M51.0,39.0L53.0,36.7M46.7,35.8L49.3,32.8M42.3,32.6L45.7,28.8M38.0,29.4L42.0,24.9M33.7,26.2L38.3,21.0" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="26" y="18" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,45.0 130.7,23.0 125.3,17.0" fill="currentColor"/><text x="134" y="18" text-anchor="start" font-size="15">R</text><polygon points="60.0,85.0 29.3,107.0 34.7,113.0" fill="currentColor"/><text x="26" y="122" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,85.0 125.3,113.0 130.7,107.0" fill="currentColor"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg></div></div></td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>En el cuadernillo, rodea con un círculo si cada estructura tiene un enantiómero.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>En el cuadernillo, dibuja las estructuras que completen la(s) línea(s) «<strong>Dos</strong>» de la tabla. Indica si cada estructura tiene un enantiómero. Para un par de enantiómeros, dibuja solo uno de ellos. No es necesario usar todas las casillas.</p></div></div></div>
