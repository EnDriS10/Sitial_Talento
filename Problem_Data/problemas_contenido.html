<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em>(NH<sub>3</sub>) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">3</span></span> × 1.83 × 10<sup>−3</sup> mol = 6.11 × 10<sup>−4</sup> mol</p><p class="pc-eq pc-math"><em>V</em> = 6.11 × 10<sup>−4</sup> mol × 24 000 cm<sup>3</sup> mol<sup>−1</sup> = <strong>14.7 cm<sup>3</sup></strong></p><p class="pc-note">ECF: 3458 × (e) / (d).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>m</em>(NH<sub>3</sub>) = 130 acres × 0.0770 t acre<sup>−1</sup> = 10.01 t</p><p class="pc-eq pc-math"><em>n</em>(NH<sub>3</sub>) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">10.01 × 10<sup>6</sup> g</span><span class="pc-eq-frac-den">17.034 g mol<sup>−1</sup></span></span> = 5.88 × 10<sup>5</sup> mol</p><p class="pc-eq pc-math"><em>n</em>(Li) = 3 × 5.88 × 10<sup>5</sup> = 1.76 × 10<sup>6</sup> mol</p><p class="pc-eq pc-math"><em>m</em>(Li) = 1.76 × 10<sup>6</sup> mol × 6.94 g mol<sup>−1</sup> = 1.22 × 10<sup>7</sup> g = <strong>12.2 t</strong></p><p class="pc-note">Medio punto por cada uno de los cuatro pasos.</p></div>

    "q48-uranio-enriquecido-2018": {
        titulo: "Uso del uranio enriquecido",
        numero: "Q48",
        fuente: "50ª Olimpiada Internacional de Química (IChO) · UK Round One 2018",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 50th IChO, UK Round One 2018 (licencia CC BY-NC-SA). Autores originales: P. Bolgar, M. Jordan, B. Pilgrim, P. Robotham, D. Schofield, R. Simon, A. Taylor, A. Thom, B. Wicky. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© wk1003mike / Shutterstock, © Todd Klassy / Shutterstock, © U.S. Photonics / Nuclear Regulatory Commission, © Carl Court / Getty Images, © Cammep / iStock, © Macmillan Publishers Ltd) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q48 — Esta pregunta trata sobre el uso del uranio enriquecido</p>

            <div class="pc-intro">
                <p>En las noticias recientes se ha informado de varias pruebas nucleares subterráneas. La energía liberada en estas bombas nucleares puede proceder de la fisión nuclear del elemento uranio. El uranio se encuentra en la naturaleza como dos isótopos principales, <sup>235</sup>U y <sup>238</sup>U, pero solo el <sup>235</sup>U puede sufrir fisión nuclear. El uranio natural necesita enriquecimiento (a menudo con centrifugadoras de gas) para aumentar la proporción de <sup>235</sup>U en una muestra antes de usarlo para estos fines.</p>
            </div>
            <p>La energía liberada (o rendimiento) de una explosión nuclear se mide en kilotones (1 kilotón = 4.184 × 10<sup>12</sup> J). Cuando 1 libra (0.45 kg) de <sup>235</sup>U (masa atómica relativa exacta = 235.0439) sufre fisión completa, el rendimiento es de 8.0 kilotones.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Calcula la energía liberada en la fisión del <sup>235</sup>U en kJ mol<sup>−1</sup>.</p></div></div>
            <p>La masa atómica relativa exacta del uranio hallado en la corteza terrestre es 238.0289. La masa atómica relativa exacta del isótopo <sup>238</sup>U es 238.0507.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Suponiendo que solo están presentes <sup>235</sup>U y <sup>238</sup>U, calcula el porcentaje de abundancia en la corteza terrestre de:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p><sup>235</sup>U</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p><sup>238</sup>U</p></div></div></div>
            <p>Para su uso en armas nucleares, una muestra de uranio debe contener al menos un 80 % del isótopo <sup>235</sup>U. Como es un porcentaje mucho mayor que el de la corteza, la cantidad de <sup>235</sup>U debe enriquecerse artificialmente. El enriquecimiento se realiza convirtiendo el uranio en hexafluoruro de uranio (UF<sub>6</sub>), que es un gas por encima de 57 °C. Las dos formas isotópicas del hexafluoruro de uranio gaseoso (<sup>235</sup>UF<sub>6</sub> y <sup>238</sup>UF<sub>6</sub>) pueden separarse en una centrifugadora.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>¿Qué propiedad del flúor es esencial para la separación con éxito de <sup>235</sup>UF<sub>6</sub> y <sup>238</sup>UF<sub>6</sub> en una centrifugadora de gas? Marca la respuesta correcta.</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; A &nbsp;El flúor elemental existe como moléculas diatómicas.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; B &nbsp;El flúor tiene un solo isótopo natural.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; C &nbsp;El flúor tiene la electronegatividad más alta de todos los elementos.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; D &nbsp;El flúor es un gas a temperatura y presión ambiente.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; E &nbsp;El flúor reacciona vigorosamente con la mayoría de los metales.</td></tr></tbody></table></div></div>
            <p>El UF<sub>6</sub> es octaédrico.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>¿Es el UF<sub>6</sub> una molécula polar? Marca la respuesta correcta.</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; Sí</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; No</td></tr></tbody></table></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula cuánto más pesado es el <sup>238</sup>UF<sub>6</sub> que el <sup>235</sup>UF<sub>6</sub>. Da la respuesta como porcentaje de la masa del <sup>235</sup>UF<sub>6</sub>. Usa masas atómicas relativas enteras en este apartado.</p></div></div>
            <p>Una vez enriquecida la muestra de UF<sub>6</sub> hasta contener cantidades suficientemente altas del isótopo <sup>235</sup>U, debe convertirse de nuevo en uranio metálico. En primer lugar, el UF<sub>6</sub> se trata con hidrógeno gaseoso para formar tetrafluoruro de uranio. Después, el tetrafluoruro de uranio se calienta con magnesio para dar uranio metálico.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Escribe las ecuaciones de:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>la reacción del hexafluoruro de uranio con hidrógeno.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>la reacción del tetrafluoruro de uranio con magnesio.</p></div></div></div>
            <p>La conversión del mineral de uranio en UF<sub>6</sub> es un proceso más complicado. El uranio se encuentra en la naturaleza como el óxido U<sub>3</sub>O<sub>8</sub>. Hay varias estructuras cristalinas de U<sub>3</sub>O<sub>8</sub>, todas las cuales contienen átomos de uranio en dos estados de oxidación diferentes.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Indica los estados de oxidación del uranio en el U<sub>3</sub>O<sub>8</sub> si los estados de oxidación de los átomos de uranio del U<sub>3</sub>O<sub>8</sub> difieren en:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Una unidad</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dos unidades</p></div></div></div>
            <p>La conversión de U<sub>3</sub>O<sub>8</sub> en UF<sub>6</sub> se muestra en el esquema siguiente (no se muestran todos los subproductos de las reacciones).</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=34 gapy=40
u @0,0: t:U3O8
r @1,0: t:Compuesto R
t @2,0: t:Compuesto T

z @1,1: t:Compuesto Z
f @0,1: t:UF6
u -&gt; r | HNO3
r -&gt; t | NH3
t -&gt; x | H2
x -&gt; z | HF
z -&gt; f | F2"></div>
            <ul><li><strong>R</strong>: todos los átomos de U están en estado de oxidación VI.</li><li><strong>T</strong>: <em>M</em> = 624.13 g mol<sup>−1</sup>; contiene dos cationes tetraédricos idénticos por unidad.</li><li><strong>X</strong>: contiene 88.1 % de U y 11.9 % de O en masa.</li><li><strong>Z</strong>: <em>M</em> = 314.02 g mol<sup>−1</sup>.</li></ul>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>El compuesto <strong>R</strong> está formado por un catión lineal de carga +2 y un anión plano trigonal de carga −1. Dibuja la estructura del catión y del anión presentes en el compuesto <strong>R</strong>, mostrando los enlaces en cada estructura.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>El compuesto <strong>T</strong> tiene una estructura compleja. Puede considerarse formado por dos cationes tetraédricos idénticos y una parte aniónica. Dibuja la estructura del catión tetraédrico y da la fórmula de la parte aniónica.</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Da las fórmulas del compuesto <strong>X</strong> y del compuesto <strong>Z</strong>.</p></div></div></div>
            <p>El uranio es un elemento radiactivo. Los isótopos <sup>235</sup>U y <sup>238</sup>U sufren desintegración alfa: el átomo de uranio se convierte en un átomo de otro elemento con la pérdida de una partícula alfa, que es el núcleo de un átomo de helio.</p>
            <div class="pc-part"><span class="pc-part-label">(i)</span><div class="pc-part-body"><p>Escribe las ecuaciones de desintegración radiactiva del <sup>235</sup>U y del <sup>238</sup>U, indicando el número másico del nuevo elemento formado.</p></div></div>
            <p>El <sup>235</sup>U se desintegra mucho más rápido que el <sup>238</sup>U. Esto significa que una muestra de uranio natural no puede usarse para fabricar una bomba sin enriquecerla primero. La velocidad de desintegración radiactiva de un isótopo puede medirse mediante su semivida, <em>t</em><sub>½</sub>. La gráfica muestra cómo cae la cantidad de los dos isótopos de uranio con el tiempo.</p>

            <div class="pc-part"><span class="pc-part-label">(j)</span><div class="pc-part-body"><p>Usando la gráfica, da la semivida en años de:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p><sup>235</sup>U</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p><sup>238</sup>U</p></div></div></div>
            <p>La siguiente ecuación relaciona el número de átomos radiactivos, <em>N</em>, que quedan tras un tiempo <em>t</em> con el número inicial, <em>N</em><sub>0</sub>:</p>
            <p class="pc-eq pc-math"><em>N</em> = <em>N</em><sub>0</sub> e<sup>−<em>λt</em></sup> &nbsp;&nbsp; donde &nbsp; <em>λ</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">ln 2</span><span class="pc-eq-frac-den"><em>t</em><sub>½</sub></span></span></p>
            <p>Se supone que cuando se formó la Tierra el número de átomos de <sup>235</sup>U y de <sup>238</sup>U era el mismo.</p>
            <div class="pc-part"><span class="pc-part-label">(k)</span><div class="pc-part-body"><p>Estima la edad de la Tierra usando tus respuestas a los apartados anteriores.</p></div></div>

            <p class="pc-q-title">Q48 — Esta pregunta trata sobre el uso del uranio enriquecido <span class="pc-total-chip">Total: 21 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em>(U) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">450 g</span><span class="pc-eq-frac-den">235.0439 g mol<sup>−1</sup></span></span> = 1.91 mol</p><p class="pc-eq pc-math"><em>E</em> = 8.0 × 4.184 × 10<sup>12</sup> J = 3.35 × 10<sup>13</sup> J</p><p class="pc-eq pc-math"><em>E</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">3.35 × 10<sup>10</sup> kJ</span><span class="pc-eq-frac-den">1.91 mol</span></span> = <strong>1.8 × 10<sup>10</sup> kJ mol<sup>−1</sup></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>M</em><sub>r</sub> = <em>m</em><sub>235</sub><em>x</em> + <em>m</em><sub>238</sub>(1 − <em>x</em>)</p><p class="pc-eq pc-math"><em>x</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">238.0289 − 238.0507</span><span class="pc-eq-frac-den">235.0439 − 238.0507</span></span> = 0.00725</p><p class="pc-eq pc-math">abundancia de <sup>235</sup>U = <strong>0.725 %</strong></p><p class="pc-note">ECF: 100 % − (ii).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">abundancia de <sup>238</sup>U = 100 − 0.725 = <strong>99.275 %</strong></p><p class="pc-note">ECF: 100 % − (i).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; A &nbsp;El flúor elemental existe como moléculas diatómicas.</td></tr><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; B &nbsp;El flúor tiene un solo isótopo natural.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; C &nbsp;El flúor tiene la electronegatividad más alta de todos los elementos.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; D &nbsp;El flúor es un gas a temperatura y presión ambiente.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; E &nbsp;El flúor reacciona vigorosamente con la mayoría de los metales.</td></tr></tbody></table><p>Si el flúor tuviera varios isótopos, las masas de las moléculas de UF<sub>6</sub> no dependerían solo del isótopo de uranio y la separación por masa no funcionaría.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; Sí</td><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; No</td></tr></tbody></table><p>Aunque los enlaces U–F individuales son polares, la forma octaédrica del UF<sub>6</sub> hace que se cancelen.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">% = <span class="pc-eq-frac"><span class="pc-eq-frac-num">238 − 235</span><span class="pc-eq-frac-den">235 + 6 × 19</span></span> × 100 = <strong>0.860 %</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">UF<sub>6</sub> + H<sub>2</sub> &rarr; UF<sub>4</sub> + 2 HF</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">UF<sub>4</sub> + 2 Mg &rarr; U + 2 MgF<sub>2</sub></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">+6, +5, (+5)</p><p class="pc-note">No hace falta repetir el +5. No se penaliza la falta del signo +; vale usar números romanos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">+4, +6, (+6)</p><p class="pc-note">No hace falta repetir el +6. En ambos casos el U<sub>3</sub>O<sub>8</sub> tiene un U medio de +16⁄3.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(i)</span><span class="pc-marks">2 puntos</span></div><p>Catión (lineal): dos enlaces U≡O (o U=O):</p><p class="pc-eq pc-math">[ O≡U≡O ]<sup>2+</sup></p><p>Anión (plano trigonal): nitrato, NO<sub>3</sub><sup>−</sup>:</p><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[O-][N+](=O)[O-]"></span><span class="pc-compound-name">NO<sub>3</sub><sup>−</sup></span></div></div><p>Compuesto R = UO<sub>2</sub>(NO<sub>3</sub>)<sub>2</sub> (nitrato de uranilo).</p><p class="pc-note">Un punto por el catión y otro por el anión. Se admiten enlaces dativos; las cargas deben sumar +2 y −1, y el N no puede tener más de cuatro enlaces.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(ii)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 210 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Catión amonio NH4+" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="100" y1="70" x2="100" y2="22" stroke="currentColor" stroke-width="1.6"/><line x1="100" y1="70" x2="56" y2="102" stroke="currentColor" stroke-width="1.6"/><polygon points="100.0,70.0 150.2,96.1 153.8,87.9" fill="currentColor"/><path d="M106.0,64.6L107.1,66.2M112.3,59.6L114.0,62.1M118.6,54.6L120.9,57.9M124.9,49.7L127.7,53.8M131.1,44.7L134.6,49.6M137.4,39.7L141.4,45.4" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="100" y="80" text-anchor="middle" font-size="17" font-weight="600" fill="#fff" stroke="#fff" stroke-width="5" paint-order="stroke">N</text><text x="100" y="82" text-anchor="middle" font-size="17" font-weight="600">N</text><text x="100" y="15" text-anchor="middle" font-size="15">H</text><text x="50" y="114" text-anchor="end" font-size="15">H</text><text x="158" y="100" text-anchor="start" font-size="15">H</text><text x="152" y="34" text-anchor="start" font-size="15">H</text><text x="186" y="40" font-size="17">+</text></svg><span class="pc-compound-name">catión NH<sub>4</sub><sup>+</sup></span></div></div><p class="pc-eq pc-math">parte aniónica: <strong>U<sub>2</sub>O<sub>7</sub><sup>2−</sup></strong></p><p>T = (NH<sub>4</sub>)<sub>2</sub>U<sub>2</sub>O<sub>7</sub> (<em>M</em> = 2 × 18.04 + 2 × 238.03 + 7 × 16.00 = 624.1 g mol<sup>−1</sup>).</p><p class="pc-note">Un punto por el catión (debe indicarse la carga) y otro por la fórmula del anión.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(iii)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><strong>X = UO<sub>2</sub></strong> &nbsp;(88.1 % de U: 238.03 / 270.03) &nbsp;&nbsp; <strong>Z = UF<sub>4</sub></strong> &nbsp;(<em>M</em> = 238.03 + 4 × 19.00 = 314.0 g mol<sup>−1</sup>)</p><p class="pc-note">Un punto por cada fórmula.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(k)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>λ</em><sub>235</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">ln 2</span><span class="pc-eq-frac-den">0.704 × 10<sup>9</sup></span></span> = 9.85 × 10<sup>−10</sup> años<sup>−1</sup> &nbsp;&nbsp; <em>λ</em><sub>238</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">ln 2</span><span class="pc-eq-frac-den">4.47 × 10<sup>9</sup></span></span> = 1.55 × 10<sup>−10</sup> años<sup>−1</sup></p><p class="pc-eq pc-math">Como <em>N</em><sub>0</sub> es igual para ambos: <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>N</em><sub>235</sub></span><span class="pc-eq-frac-den"><em>N</em><sub>238</sub></span></span> = e<sup>−(<em>λ</em><sub>235</sub> − <em>λ</em><sub>238</sub>)<em>t</em></sup></p><p class="pc-eq pc-math">de (b): <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>N</em><sub>235</sub></span><span class="pc-eq-frac-den"><em>N</em><sub>238</sub></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">0.725</span><span class="pc-eq-frac-den">99.275</span></span></p><p class="pc-eq pc-math"><em>t</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">ln<span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num">0.725</span><span class="pc-eq-frac-den">99.275</span></span><span style="font-size:1.25em">)</span></span><span class="pc-eq-frac-den">−(9.85 − 1.55) × 10<sup>−10</sup> años<sup>−1</sup></span></span> = <strong>5.92 × 10<sup>9</sup> años</strong></p><p class="pc-note">Medio punto por cada <em>λ</em>, un punto por la relación <em>N</em><sub>235</sub>/<em>N</em><sub>238</sub> y un punto por el resultado.</p></div>

        enunciado: `
            <p class="pc-q-title">Q49 — Esta pregunta trata sobre los antitusivos</p>

            <div class="pc-intro">
                <p>En septiembre de 2017, la primera ministra del Reino Unido, Theresa May, tuvo una fuerte tos durante su discurso en el congreso del Partido Conservador. El fármaco antitusivo dextrometorfano, presente en jarabes como Benylin®, podría haberla ayudado. Esta pregunta trata sobre la síntesis del dextrometorfano, que implica la formación de algunos enlaces fuertes y de algunos carbocationes estables.</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="COc1ccc2C[C@H]3N(C)CC[C@]4(CCCC[C@@H]34)c2c1"></span><span class="pc-compound-name">dextrometorfano</span></div></div>
            <p>El dextrometorfano suele administrarse como la sal de bromhidrato monohidratado.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Rodea con un círculo el átomo del dextrometorfano que se protona en la sal.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Determina la fórmula molecular del dextrometorfano y calcula con ella la masa molar de la sal bromhidrato monohidratada del dextrometorfano.</p></div></div>
            <p>La síntesis del dextrometorfano consta de varias etapas. En los esquemas, los subproductos de las reacciones no siempre se muestran. La síntesis comienza con la del compuesto <strong>F</strong>.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=30 gapy=44
s @0,0: COc1ccc(CO)cc1
A @1,0: t:A

F @1,1: COc1ccc(CC(=O)NCCC2=CCCCC2)cc1 | Compuesto F
E @0,1: t:E
D @0,2: t:D
k @1,2: O=C1CCCCC1
s -&gt; A | SOCl2
A -&gt; B | 1. Mg|2. CO2|3. H3O+
B -&gt; C | SOCl2
C -&gt; F | + E
E -&gt; F
k -&gt; D | NC-CH2-CO2H, KOH|calor (+ gas X, 44.01 g/mol)
D -&gt; E | 1. LiAlH4|2. H3O+"></div>
            <p style="font-size:.9em">El espectro IR del compuesto <strong>B</strong> muestra una banda muy ancha a 3100 cm<sup>−1</sup> y otra aguda a 1716 cm<sup>−1</sup>. El gas incoloro <strong>X</strong> tiene <em>M</em> = 44.01 g mol<sup>−1</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja las estructuras de los compuestos <strong>A</strong>, <strong>B</strong>, <strong>C</strong>, <strong>D</strong>, <strong>E</strong> y del gas <strong>X</strong>.</p></div></div>
            <p>En la reacción para obtener el compuesto <strong>D</strong>, el ácido cianoacético puede desprotonarse dos veces con el hidróxido de potasio:</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.6 gapx=40
a @0,0: N#CCC(=O)O | ácido cianoacético
z1 @1,0: t:Anión Z^−
z2 @2,0: t:Dianión Z^2−
a -&gt; z1 | KOH
z1 -&gt; z2 | KOH"></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Dibuja una estructura del anión <strong>Z</strong><sup>−</sup>.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja una estructura del dianión <strong>Z</strong><sup>2−</sup>.</p></div></div></div>
            <p>La síntesis continúa con la conversión del compuesto <strong>F</strong> en el compuesto <strong>J</strong>. Los carbonos de <strong>F</strong> se numeran como en el original: 1 (CH<sub>3</sub>O), 2–7 (anillo aromático), 8 (CH<sub>2</sub> bencílico), 9 (C=O), 10 y 11 (CH<sub>2</sub>CH<sub>2</sub>N), 12 (C= del ciclohexeno unido a C11), 13 (=CH) y 14–17 (resto del ciclohexeno).</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.85 gapx=36 gapy=40
F @0,0: COc1ccc(CC(=O)NCCC2=CCCCC2)cc1 | F
G @1,0: COc1ccc(CC2=NCCC3=C2CCCC3)cc1 | G
H @1,1: t:Compuesto H | C17H23NO
I @0,1: t:Catión I^+
J @0,2: COc1ccc(CC2N(C)CCC3=C2CCCC3)cc1 | J | caja=verde
F -&gt; G | POCl3
G -&gt; H | H2 / Ni
H -&gt; I | CH2O, H+
I -&gt; J | NaBH4"></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Escribe los números de los dos átomos de carbono del compuesto <strong>F</strong> que se unen en la reacción que da el compuesto <strong>G</strong>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Dibuja las estructuras del compuesto <strong>H</strong> (fórmula molecular C<sub>17</sub>H<sub>23</sub>NO) y del catión <strong>I</strong><sup>+</sup>.</p></div></div>
            <p>La síntesis continúa con la conversión del compuesto <strong>J</strong> en los compuestos <strong>M<sub>1</sub></strong> y <strong>M<sub>2</sub></strong> en una etapa. Al calentar <strong>J</strong> con ácido fosfórico acuoso, se convierte primero en un intermedio <strong>K</strong> y un líquido incoloro <strong>Y</strong> (<em>M</em> = 32.04 g mol<sup>−1</sup>). El intermedio <strong>K</strong> se convierte después en el carbocatión <strong>L</strong><sup>+</sup>, que sufre ciclación y da la mezcla de los dos isómeros <strong>M<sub>1</sub></strong> y <strong>M<sub>2</sub></strong>.</p>
            <p>El tratamiento de la mezcla de <strong>M<sub>1</sub></strong> y <strong>M<sub>2</sub></strong> con cloruro de trimetilfenilamonio (un agente metilante) da una mezcla de levometorfano y dextrometorfano. Al añadir ácido D-tartárico a esta mezcla, el dextrometorfano deseado puede separarse del levometorfano no deseado: este proceso se llama resolución.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.8 gapx=30 gapy=40
J @0,0: COc1ccc(CC2N(C)CCC3=C2CCCC3)cc1 | J
K @1,0: t:Intermedio K
L @2,0: t:Carbocatión L^+
M @2,1: t:Compuestos M1 y M2 | (dos isómeros)
J -&gt; K | H3PO4, H2O, Δ | + CH3OH (Y)
K -&gt; L | H+
L -&gt; M | ciclación"></div>
            <p>En la conversión del compuesto <strong>J</strong> en <strong>M<sub>1</sub></strong> y <strong>M<sub>2</sub></strong> pueden unirse distintos pares de átomos de carbono (numeración de <strong>J</strong> como en el original: 1 N–CH<sub>3</sub>; 2 y 3 N–CH<sub>2</sub>–CH<sub>2</sub>; 4 y 9 carbonos del C=C; 5–8 CH<sub>2</sub> del anillo saturado; 10 CH–N; 11 CH<sub>2</sub> bencílico; 12 aromático <em>ipso</em>; 13 y 15 aromáticos <em>orto</em> al CH<sub>2</sub>; 14 y 16 <em>orto</em> al O; 17 C–O; 18 OCH<sub>3</sub>).</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Indica todos los pares de átomos de carbono que pueden unirse en esta reacción.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>Dibuja las estructuras del intermedio <strong>K</strong>, del carbocatión <strong>L</strong><sup>+</sup> y del líquido <strong>Y</strong>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(i)</span><div class="pc-part-body"><p>Completa las estructuras de los dos isómeros <strong>M<sub>1</sub></strong> y <strong>M<sub>2</sub></strong>, indicando claramente con cuñas llenas los átomos distintos del hidrógeno que salen del plano del papel y con cuñas discontinuas los que entran en él. Indica qué tipo de isómeros son <strong>M<sub>1</sub></strong> y <strong>M<sub>2</sub></strong>.</p></div></div>

            <p class="pc-q-title">Q49 — Esta pregunta trata sobre los antitusivos <span class="pc-total-chip">Total: 25 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="COc1ccc2C[C@H]3N(C)CC[C@]4(CCCC[C@@H]34)c2c1"></span><span class="pc-compound-name">El N terciario (par solitario) es el que se protona: R<sub>3</sub>NH<sup>+</sup> Br<sup>−</sup></span></div></div><p class="pc-note">Es el átomo de nitrógeno (la amina terciaria es la única función básica).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">Dextrometorfano: <strong>C<sub>18</sub>H<sub>25</sub>NO</strong></p><p class="pc-eq pc-math">Sal: C<sub>18</sub>H<sub>25</sub>NO + HBr + H<sub>2</sub>O = C<sub>18</sub>H<sub>28</sub>BrNO<sub>2</sub></p><p class="pc-eq pc-math"><em>M</em> = 18 × 12.01 + 28 × 1.008 + 79.904 + 14.01 + 2 × 16.00 = <strong>370.3 g mol<sup>−1</sup></strong></p><p class="pc-note">Un punto por la fórmula del dextrometorfano y otro por el resultado final.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">7 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="COc1ccc(CCl)cc1"></span><span class="pc-compound-name">A</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="COc1ccc(CC(=O)O)cc1"></span><span class="pc-compound-name">B</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="COc1ccc(CC(=O)Cl)cc1"></span><span class="pc-compound-name">C</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="N#CCC1=CCCCC1"></span><span class="pc-compound-name">D</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="NCCC1=CCCCC1"></span><span class="pc-compound-name">E</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="O=C=O"></span><span class="pc-compound-name">X: CO<sub>2</sub></span></div></div><p>A: cloruro de 4-metoxibencilo; B: ácido 4-metoxifenilacético (O–H muy ancha a 3100 cm<sup>−1</sup> y C=O a 1716 cm<sup>−1</sup>); C: cloruro de ácido; D: nitrilo con el doble enlace dentro del anillo (tras la descarboxilación); E: amina primaria.</p><p class="pc-note">A: 1 punto; B: 1; C: 1; D: 2; E: 1; X: 1. El isómero de D con el C=C fuera del anillo puntúa 1. Hay ECF solo para B y C.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="N#CCC(=O)[O-]"></span><span class="pc-compound-name">Z<sup>−</sup></span></div></div><p class="pc-note">Basta una forma correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(ii)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="N#C[CH-]C(=O)[O-]"></span><span class="pc-compound-name">Z<sup>2−</sup></span></div></div><p class="pc-note">Basta una forma correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Carbonos <strong>9</strong> y <strong>13</strong></p><p class="pc-note">Medio punto por cada número. Es la ciclación de Bischler–Napieralski: el C=O (9) se une al C=CH (13) del ciclohexeno.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">3 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="COc1ccc(CC2NCCC3=C2CCCC3)cc1"></span><span class="pc-compound-name">H</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="COc1ccc(CC2[N+](=C)CCC3=C2CCCC3)cc1"></span><span class="pc-compound-name">I<sup>+</sup></span></div></div><p>H se obtiene reduciendo el C=N (no el C=C); con el formaldehído y H<sup>+</sup> da el ion iminio I<sup>+</sup>.</p><p class="pc-note">H: 1 punto; I<sup>+</sup>: 2 puntos. Sin crédito si se reduce el doble enlace equivocado. ECF si el error de H es trivial.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><strong>4 y 13</strong> &nbsp;&nbsp; <strong>4 y 15</strong></p><p class="pc-note">Un punto por cada par completo. Si se dan tres pares, máximo 1 punto; con cuatro o más, cero. Las dos posibilidades se deben a la simetría del anillo aromático; M<sub>1</sub> y M<sub>2</sub> no corresponden a cada par, sino a la cara del alqueno de K que se protona.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)</span><span class="pc-marks">4 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="Oc1ccc(CC2N(C)CCC3=C2CCCC3)cc1"></span><span class="pc-compound-name">K</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="Oc1ccc(CC2N(C)CC[C+]3CCCCC23)cc1"></span><span class="pc-compound-name">L<sup>+</sup></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CO"></span><span class="pc-compound-name">Y: metanol</span></div></div><p>El éter metílico aromático se hidroliza (K es un fenol, Y = CH<sub>3</sub>OH); el alqueno de K se protona en C9 y deja el catión terciario en C4, que ataca al anillo aromático como en una alquilación de Friedel–Crafts.</p><p class="pc-note">K: 1 punto; L<sup>+</sup>: 2; Y: 1. Si la carga de L<sup>+</sup> no está en la posición correcta, no hay puntos. ECF por errores en K.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)</span><span class="pc-marks">3 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Oc1ccc2C[C@H]3N(C)CC[C@@]4(CCCC[C@@H]34)c2c1"></span><span class="pc-compound-name">M<sub>1</sub></span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Oc1ccc2C[C@@H]3N(C)CC[C@]4(CCCC[C@H]34)c2c1"></span><span class="pc-compound-name">M<sub>2</sub></span></div></div><p>M<sub>1</sub> y M<sub>2</sub> son <strong>enantiómeros</strong> (imágenes especulares no superponibles).</p><p class="pc-note">Un punto por cada estructura y un punto por el tipo de isómeros; N y C deben quedar ambos por encima del plano en un isómero y ambos por debajo en el otro. El H puede omitirse, pero si se dibuja debe ser correcto. Se admite intercambiar M<sub>1</sub> y M<sub>2</sub>.</p></div>
        `

        enunciado: `
            <p class="pc-q-title">Q50 — Esta pregunta trata sobre el gas «inerte» helio</p>

            <div class="pc-figrow"><div class="pc-figtext"><p>En 2013 los periódicos informaron de que unos científicos pedían al gobierno que prohibiera la venta de globos de fiesta rellenos de helio, ya que su uso en aplicaciones científicas, como los imanes superconductores, lo hacía demasiado valioso para malgastarlo en fiestas infantiles.</p></div><div class="pc-figside"><img src="https://i.imgur.com/Q3H38OU.png" alt="Globos de fiesta" loading="lazy" style="max-width:260px;width:100%;border-radius:10px"></div></div>
            <p>El helio está presente en la atmósfera terrestre con una concentración media de 0.916 mg m<sup>−3</sup>, y el volumen de la atmósfera terrestre es aproximadamente 4.2 × 10<sup>9</sup> km<sup>3</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Calcula la cantidad de sustancia (mol) de helio en la atmósfera terrestre.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>El volumen de una esfera de radio <em>r</em> es <span class="pc-eq-frac"><span class="pc-eq-frac-num">4</span><span class="pc-eq-frac-den">3</span></span>π<em>r</em><sup>3</sup>. Suponiendo que los globos de fiesta son esféricos y tienen un radio de 14 cm, calcula cuántos globos podrían llenarse con el helio de la atmósfera terrestre a temperatura y presión ambiente.</p></div></div>
            <p>El helio es muy poco reactivo: tiene la capa externa completa y la energía de ionización más alta de todos los elementos. El año pasado, una colaboración de 17 investigadores de todo el mundo propuso que se había formado el compuesto <strong>X</strong> (un compuesto de helio y sodio) a una presión extrema de 300 GPa.</p>
            <p>La celda unidad de un cristal se determina por cristalografía de rayos X y muestra la disposición de los átomos en el cristal. Al apilar celdas unidad se genera la estructura macroscópica.</p>
            <figure class="pc-figure"><img src="https://i.imgur.com/9xeFWzX.png" alt="Celda unidad del compuesto X" loading="lazy" style="max-width:380px;width:100%"></figure>
            <p>La celda unidad del compuesto <strong>X</strong> se representa en el diagrama: los átomos de helio están en los vértices y en los centros de las caras de la celda, y los átomos de sodio están en posiciones cúbicas dentro de la celda. Algunos átomos están completamente dentro de los límites de una celda unidad, mientras que, para los átomos centrados en vértices, aristas o caras, solo una fracción del átomo está dentro de una celda.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Considerando las fracciones de átomos dentro de una celda unidad, cuenta el número total de átomos de sodio y de helio en una celda unidad.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>¿Cuál es la fórmula del compuesto <strong>X</strong>?</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Usa tu respuesta del apartado (c) y las dimensiones de la celda (arista <em>a</em> = 3.95 Å) para calcular la densidad del compuesto <strong>X</strong> en g cm<sup>−3</sup>.</p></div></div>
            <p>Los cálculos sobre el compuesto <strong>X</strong> muestran que los átomos de sodio están presentes como iones Na<sup>+</sup>. Los electrones de valencia de los átomos de sodio se han emparejado y están localizados en los huecos de la estructura cristalina.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>¿Qué esperas que sea el compuesto <strong>X</strong>? Marca todas las respuestas correctas.</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; A &nbsp;Un sólido metálico</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; B &nbsp;Un sólido covalente</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; C &nbsp;Un sólido iónico</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; D &nbsp;Un conductor</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; E &nbsp;Un aislante</td></tr></tbody></table></div></div>
            <p>A presión atmosférica el compuesto <strong>X</strong> no es estable: se descompone en una mezcla de sodio y helio.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Escribe una ecuación para la descomposición del compuesto <strong>X</strong>.</p></div></div>
            <p>La gráfica muestra cómo cambia la variación de energía libre de la descomposición, Δ<sub>decomp</sub><em>G</em>, en función de la presión.</p>
            <div class="pc-figure"><svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ΔG de descomposición frente a la presión" style="width:520px;max-width:100%;font-family:Inter,sans-serif"><rect x="70" y="18" width="430" height="230" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="70.0" y1="18" x2="70.0" y2="248" stroke="currentColor" opacity=".15"/><text x="70.0" y="264" text-anchor="middle" font-size="11">100</text><line x1="123.8" y1="18" x2="123.8" y2="248" stroke="currentColor" opacity=".15"/><text x="123.8" y="264" text-anchor="middle" font-size="11">150</text><line x1="177.5" y1="18" x2="177.5" y2="248" stroke="currentColor" opacity=".15"/><text x="177.5" y="264" text-anchor="middle" font-size="11">200</text><line x1="231.2" y1="18" x2="231.2" y2="248" stroke="currentColor" opacity=".15"/><text x="231.2" y="264" text-anchor="middle" font-size="11">250</text><line x1="285.0" y1="18" x2="285.0" y2="248" stroke="currentColor" opacity=".15"/><text x="285.0" y="264" text-anchor="middle" font-size="11">300</text><line x1="338.8" y1="18" x2="338.8" y2="248" stroke="currentColor" opacity=".15"/><text x="338.8" y="264" text-anchor="middle" font-size="11">350</text><line x1="392.5" y1="18" x2="392.5" y2="248" stroke="currentColor" opacity=".15"/><text x="392.5" y="264" text-anchor="middle" font-size="11">400</text><line x1="446.2" y1="18" x2="446.2" y2="248" stroke="currentColor" opacity=".15"/><text x="446.2" y="264" text-anchor="middle" font-size="11">450</text><line x1="500.0" y1="18" x2="500.0" y2="248" stroke="currentColor" opacity=".15"/><text x="500.0" y="264" text-anchor="middle" font-size="11">500</text><line x1="70" y1="248.0" x2="500" y2="248.0" stroke="currentColor" opacity=".15"/><text x="64" y="252.0" text-anchor="end" font-size="11">-60</text><line x1="70" y1="209.7" x2="500" y2="209.7" stroke="currentColor" opacity=".15"/><text x="64" y="213.7" text-anchor="end" font-size="11">-40</text><line x1="70" y1="171.3" x2="500" y2="171.3" stroke="currentColor" opacity=".15"/><text x="64" y="175.3" text-anchor="end" font-size="11">-20</text><line x1="70" y1="133.0" x2="500" y2="133.0" stroke="currentColor" opacity=".15"/><text x="64" y="137.0" text-anchor="end" font-size="11">0</text><line x1="70" y1="94.7" x2="500" y2="94.7" stroke="currentColor" opacity=".15"/><text x="64" y="98.7" text-anchor="end" font-size="11">20</text><line x1="70" y1="56.3" x2="500" y2="56.3" stroke="currentColor" opacity=".15"/><text x="64" y="60.3" text-anchor="end" font-size="11">40</text><line x1="70" y1="18.0" x2="500" y2="18.0" stroke="currentColor" opacity=".15"/><text x="64" y="22.0" text-anchor="end" font-size="11">60</text><text x="285.0" y="292" text-anchor="middle" font-size="12">Presión / GPa</text><text transform="translate(14,133.0) rotate(-90)" text-anchor="middle" font-size="12">Δ_{decomp}G / kJ mol⁻¹</text><polyline fill="none" stroke="#2f6fb5" stroke-width="2.2" points="70.0,205.8 116.2,144.5 249.5,62.1 500.0,41.0"/></svg></div>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>¿Cuál es la presión mínima a la que la formación del compuesto <strong>X</strong> se vuelve termodinámicamente favorable?</p></div></div>

        respuesta: `
            <p class="pc-q-title">Q50 — Esta pregunta trata sobre el gas «inerte» helio <span class="pc-total-chip">Total: 13 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>V</em> = 4.2 × 10<sup>9</sup> km<sup>3</sup> = 4.2 × 10<sup>18</sup> m<sup>3</sup></p><p class="pc-eq pc-math"><em>m</em>(He) = 0.916 mg m<sup>−3</sup> × 4.2 × 10<sup>18</sup> m<sup>3</sup> = 3.85 × 10<sup>18</sup> mg = 3.85 × 10<sup>15</sup> g</p><p class="pc-eq pc-math"><em>n</em>(He) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">3.85 × 10<sup>15</sup> g</span><span class="pc-eq-frac-den">4.003 g mol<sup>−1</sup></span></span> = <strong>9.61 × 10<sup>14</sup> mol</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>V</em><sub>globo</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">4</span><span class="pc-eq-frac-den">3</span></span> π (1.4 dm)<sup>3</sup> = 11.5 dm<sup>3</sup></p><p class="pc-eq pc-math"><em>n</em> por globo = <span class="pc-eq-frac"><span class="pc-eq-frac-num">11.5 dm<sup>3</sup></span><span class="pc-eq-frac-den">24 dm<sup>3</sup> mol<sup>−1</sup></span></span> = 0.479 mol</p><p class="pc-eq pc-math">n.º de globos = <span class="pc-eq-frac"><span class="pc-eq-frac-num">9.61 × 10<sup>14</sup> mol</span><span class="pc-eq-frac-den">0.479 mol</span></span> = <strong>2.01 × 10<sup>15</sup> globos</strong></p><p class="pc-note">Un punto por el volumen del globo y otro por el número de globos. ECF: (a) / 0.479.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">He: 8 × <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">8</span></span> (vértices) + 6 × <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">2</span></span> (caras) = <strong>4 He</strong></p><p class="pc-eq pc-math">Na: <strong>8 Na</strong> (todos dentro de la celda)</p><p class="pc-note">Un punto por cada número.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>Na<sub>2</sub>He</strong> (HeNa<sub>2</sub>)</p><p class="pc-note">No hay ECF desde (c): la alta simetría de la celda lleva a una proporción sencilla.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>M</em> (celda) = 4 × 4.003 + 8 × 22.99 = 199.9 g mol<sup>−1</sup></p><p class="pc-eq pc-math"><em>m</em> (celda) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">199.9 g mol<sup>−1</sup></span><span class="pc-eq-frac-den">6.02 × 10<sup>23</sup> mol<sup>−1</sup></span></span> = 3.32 × 10<sup>−22</sup> g</p><p class="pc-eq pc-math"><em>V</em> (celda) = (3.95 × 10<sup>−10</sup> m)<sup>3</sup> = 6.16 × 10<sup>−29</sup> m<sup>3</sup> = 6.16 × 10<sup>−23</sup> cm<sup>3</sup></p><p class="pc-eq pc-math"><em>ρ</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">3.32 × 10<sup>−22</sup> g</span><span class="pc-eq-frac-den">6.16 × 10<sup>−23</sup> cm<sup>3</sup></span></span> = <strong>5.39 g cm<sup>−3</sup></strong></p><p class="pc-note">Un punto por cada uno de los tres pasos. ECF desde (c).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">2 puntos</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; A &nbsp;Un sólido metálico</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; B &nbsp;Un sólido covalente</td></tr><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; C &nbsp;Un sólido iónico</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; D &nbsp;Un conductor</td></tr><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; E &nbsp;Un aislante</td></tr></tbody></table><p>Los iones Na<sup>+</sup> y los pares electrónicos localizados en los huecos se comportan como un sólido iónico (electruro) sin electrones libres: es aislante.</p><p class="pc-note">Un punto por C y otro por E. Si se marca más de una opción en cada pareja contradictoria (A, B, C o D, E), cero en esa pareja.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">HeNa<sub>2</sub> &rarr; He + 2 Na</p><p class="pc-note">ECF desde (d).</p></div>

tColor" opacity=".15"/><text x="64" y="213.7" text-anchor="end" font-size="11">-40</text><line x1="70" y1="171.3" x2="500" y2="171.3" stroke="currentColor" opacity=".15"/><text x="64" y="175.3" text-anchor="end" font-size="11">-20</text><line x1="70" y1="133.0" x2="500" y2="133.0" stroke="currentColor" opacity=".15"/><text x="64" y="137.0" text-anchor="end" font-size="11">0</text><line x1="70" y1="94.7" x2="500" y2="94.7" stroke="currentColor" opacity=".15"/><text x="64" y="98.7" text-anchor="end" font-size="11">20</text><line x1="70" y1="56.3" x2="500" y2="56.3" stroke="currentColor" opacity=".15"/><text x="64" y="60.3" text-anchor="end" font-size="11">40</text><line x1="70" y1="18.0" x2="500" y2="18.0" stroke="currentColor" opacity=".15"/><text x="64" y="22.0" text-anchor="end" font-size="11">60</text><text x="285.0" y="292" text-anchor="middle" font-size="12">Presión / GPa</text><text transform="translate(14,133.0) rotate(-90)" text-anchor="middle" font-size="12">ΔdecompG / kJ mol⁻¹</text><polyline fill="none" stroke="#2f6fb5" stroke-width="2.2" points="70.0,205.8 116.2,144.5 249.5,62.1 500.0,41.0"/><line x1="134.5" y1="248" x2="134.5" y2="133.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="70" y1="133.0" x2="134.5" y2="133.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/></svg></div><p class="pc-eq pc-math"><em>p</em><sub>mín.</sub> ≈ <strong>160 GPa</strong></p><p>La formación es favorable cuando Δ<sub>decomp</sub><em>G</em> &gt; 0, es decir, por encima del punto donde la curva corta al eje cero.</p><p class="pc-note">Se admite 155–165 GPa.</p></div>

    "q51-piscina-rio-2017": {
        titulo: "La piscina verde de Río",
        numero: "Q51",
        fuente: "49ª Olimpiada Internacional de Química (IChO) · UK Round One 2017",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 49th IChO, UK Round One 2017 (licencia CC BY-NC-SA). Autores originales: P. Bolgar, M. Jordan, B. Pilgrim, P. Robotham, D. Schofield, R. Simon, A. Taylor, A. Thom, B. Wicky. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© wk1003mike / Shutterstock, © Todd Klassy / Shutterstock, © U.S. Photonics / Nuclear Regulatory Commission, © Carl Court / Getty Images, © Cammep / iStock, © Macmillan Publishers Ltd) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q51 — Esta pregunta trata sobre la piscina verde de Río</p>

            <div class="pc-intro"><p>Cuando el agua de la piscina de saltos de los Juegos Olímpicos de Río se volvió verde, se sugirió que la culpa era del crecimiento de algas, algo que los organizadores rechazaron con firmeza. Incluso después de publicarse el informe oficial, sigue habiendo mucha especulación sobre la razón real del cambio de color.</p></div>
            <p>Uno de los compuestos más usados en la cloración de piscinas es el hipoclorito de sodio, NaClO.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Determina el estado de oxidación del cloro en el hipoclorito de sodio, NaClO.</p></div></div>
            <p>Una vez disuelto, se establece un equilibrio entre el ClO<sup>−</sup> y su ácido conjugado.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Escribe una ecuación para este equilibrio.</p></div></div>
            <p>Este equilibrio depende mucho del pH y, en condiciones ácidas, se produce cloro.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Escribe una ecuación para la formación de cloro a partir de hipoclorito y HCl.</p></div></div>
            <p>Los organizadores acabaron explicando el color verde por el crecimiento de algas tras la adición inadvertida de una gran cantidad de peróxido de hidrógeno, que destruyó el hipoclorito y formó iones cloruro.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe una ecuación para la reacción entre el peróxido de hidrógeno y el hipoclorito.</p></div></div>
            <p>Los hipocloritos también tienden a reaccionar con amoníaco y compuestos análogos formando compuestos con nitrógeno y cloro. Uno de ellos es el tricloruro de nitrógeno, que puede causar irritación ocular y el característico olor de las piscinas.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe una ecuación para la formación del tricloruro de nitrógeno.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja una estructura del tricloruro de nitrógeno que muestre su forma e indica el ángulo Cl–N–Cl aproximado.</p></div></div></div>
            <p>Según las proporciones de reacción, otro posible resultado de la reacción entre amoníaco e hipoclorito es la formación de hidracina, H<sub>2</sub>N–NH<sub>2</sub>, e iones cloruro.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Escribe una ecuación para esta reacción.</p></div></div>
            <p>A veces se añade sulfato de cobre(II) a las piscinas, y esto también se sugirió como causa del color verde. Los iones cobre(II) también se culparon del tinte verdoso del pelo decolorado del nadador estadounidense Ryan Lochte. Los iones cobre(II) precipitan sobre el pelo por el pH alto de algunos champús.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Sugiere una fórmula para el precipitado azul del pelo de Ryan Lochte que lo volvió verde.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q51 — Esta pregunta trata sobre la piscina verde de Río <span class="pc-total-chip">Total: 8 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>+1</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">ClO<sup>−</sup> + H<sub>3</sub>O<sup>+</sup> &rlhar; HOCl + H<sub>2</sub>O</p><p class="pc-eq pc-math">ClO<sup>−</sup> + H<sub>2</sub>O &rlhar; HOCl + OH<sup>−</sup></p><p class="pc-note">Vale cualquiera de las dos; también H<sup>+</sup> + ClO<sup>−</sup> ⇌ HOCl. HOCl puede escribirse ClOH.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">HOCl + HCl &rarr; Cl<sub>2</sub> + H<sub>2</sub>O</p><p class="pc-eq pc-math">ClO<sup>−</sup> + Cl<sup>−</sup> + 2 H<sup>+</sup> &rarr; Cl<sub>2</sub> + H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">H<sub>2</sub>O<sub>2</sub> + ClO<sup>−</sup> &rarr; Cl<sup>−</sup> + H<sub>2</sub>O + O<sub>2</sub></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">NH<sub>3</sub> + 3 ClO<sup>−</sup> &rarr; NCl<sub>3</sub> + 3 OH<sup>−</sup></p><p class="pc-eq pc-math">NH<sub>3</sub> + 3 HOCl &rarr; NCl<sub>3</sub> + 3 H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(ii)</span><span class="pc-marks">1 punto</span></div><div style="text-align:center"><svg viewBox="0 0 220 150" role="img" aria-label="NCl3 piramidal" style="max-width:240px;width:100%"><g stroke="currentColor" stroke-width="2" fill="none"><line x1="110" y1="55" x2="55" y2="115"/><line x1="110" y1="55" x2="165" y2="115"/></g><polygon points="110,55 100,120 120,120" fill="currentColor"/><g font-size="17" text-anchor="middle" fill="currentColor"><text x="110" y="48" font-weight="600">N</text><text x="44" y="128">Cl</text><text x="176" y="128">Cl</text><text x="110" y="140">Cl</text></g><path d="M 78 100 A 45 45 0 0 0 142 100" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".0"/></svg></div><p>Forma <strong>piramidal trigonal</strong>; ángulo Cl–N–Cl ≈ <strong>107°</strong> (106°–108°).</p><p class="pc-note">Medio punto por la forma y medio por el ángulo.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">2 NH<sub>3</sub> + ClO<sup>−</sup> &rarr; N<sub>2</sub>H<sub>4</sub> + Cl<sup>−</sup> + H<sub>2</sub>O</p><p class="pc-eq pc-math">2 NH<sub>3</sub> + NaClO &rarr; N<sub>2</sub>H<sub>4</sub> + NaCl + H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>Cu(OH)<sub>2</sub></strong></p></div>
        `
    },

    "q52-quimica-atmosferica-2017": {
        titulo: "Química atmosférica",
        numero: "Q52",
        fuente: "49ª Olimpiada Internacional de Química (IChO) · UK Round One 2017",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 49th IChO, UK Round One 2017 (licencia CC BY-NC-SA). Autores originales: P. Bolgar, M. Jordan, B. Pilgrim, P. Robotham, D. Schofield, R. Simon, A. Taylor, A. Thom, B. Wicky. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© wk1003mike / Shutterstock, © Todd Klassy / Shutterstock, © U.S. Photonics / Nuclear Regulatory Commission, © Carl Court / Getty Images, © Cammep / iStock, © Macmillan Publishers Ltd) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q52 — Esta pregunta trata sobre la química atmosférica</p>

            <div class="pc-intro"><p>Estudiar las reacciones que ocurren en la atmósfera es crucial para entender el clima global y minimizar nuestro impacto ambiental. El sulfuro de hidrógeno, H<sub>2</sub>S, es una molécula con una química atmosférica interesante. El H<sub>2</sub>S está presente en el gas natural y es especialmente común cerca de los volcanes.</p></div>
            <p>El principal proceso por el que el H<sub>2</sub>S se elimina de forma natural del aire es su reacción con el radical OH (el principal oxidante diurno de la atmósfera). La reacción ocurre en un único encuentro entre el H<sub>2</sub>S y el radical OH.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Escribe una ecuación para la reacción del H<sub>2</sub>S con el radical OH que forma agua y otro radical.</p></div></div>
            <p>Para determinar la constante de velocidad de la reacción del apartado (a), se generó H<sub>2</sub>S seco en el laboratorio haciendo reaccionar sulfuro de hierro(II) con ácido clorhídrico.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Escribe una ecuación para la generación de H<sub>2</sub>S en el laboratorio.</p></div></div>
            <p>La tasa media de emisión de H<sub>2</sub>S al aire en una región volcánica puede tomarse como 7.65 × 10<sup>5</sup> moléculas cm<sup>−3</sup> s<sup>−1</sup>. La concentración de H<sub>2</sub>S medida es constante en el tiempo, lo que significa que la velocidad de producción de H<sub>2</sub>S es igual a la de su consumo en esta región.</p>
            <p>Para una reacción que ocurre en un único encuentro entre dos especies A y B, la velocidad es:</p>
            <p class="pc-eq pc-math">velocidad = <em>k</em> × [A] × [B]</p>
            <p>donde <em>k</em> es la constante de velocidad y [A] y [B] las concentraciones.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Calcula la concentración de H<sub>2</sub>S en la atmósfera en moléculas cm<sup>−3</sup>. Supón que el único proceso de eliminación del H<sub>2</sub>S es su reacción con el radical OH, cuya concentración media es 1.1 × 10<sup>6</sup> moléculas cm<sup>−3</sup>. La constante de velocidad de la reacción del apartado (a) se midió: <em>k</em> = 4.7 × 10<sup>−12</sup> cm<sup>3</sup> molécula<sup>−1</sup> s<sup>−1</sup>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>La concentración media de H<sub>2</sub>S suele expresarse en μg m<sup>−3</sup>. Expresa en esas unidades la concentración obtenida en (c).</p></div></div>
            <p>El gas natural suele contener azufre en forma de H<sub>2</sub>S. Para minimizar la emisión de azufre al desulfurar el gas natural, el H<sub>2</sub>S se quema parcialmente para formar SO<sub>2</sub>, que luego reacciona con el H<sub>2</sub>S restante para formar azufre elemental.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe una ecuación para la combustión del H<sub>2</sub>S.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Escribe una ecuación para la reacción del H<sub>2</sub>S con el SO<sub>2</sub>.</p></div></div></div>
            <p>Es muy difícil medir directamente la concentración de radicales OH, así que a menudo hay que recurrir a métodos indirectos. Además del H<sub>2</sub>S, el radical OH oxida otros compuestos de la atmósfera, como el 1,1,1-tricloroetano. Como su emisión atmosférica cesó en los años 90, su cambio de concentración puede usarse para estimar indirectamente la concentración media global del radical OH. El perfil de concentración del 1,1,1-tricloroetano muestra un decaimiento exponencial simple, típico de reacciones de primer orden.</p>
            <div class="pc-figure"><svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concentración atmosférica de 1,1,1-tricloroetano" style="width:520px;max-width:100%;font-family:Inter,sans-serif"><rect x="70" y="18" width="430" height="230" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="70.0" y1="18" x2="70.0" y2="248" stroke="currentColor" opacity=".15"/><text x="70.0" y="264" text-anchor="middle" font-size="11">2000</text><line x1="123.8" y1="18" x2="123.8" y2="248" stroke="currentColor" opacity=".15"/><text x="123.8" y="264" text-anchor="middle" font-size="11">2002</text><line x1="177.5" y1="18" x2="177.5" y2="248" stroke="currentColor" opacity=".15"/><text x="177.5" y="264" text-anchor="middle" font-size="11">2004</text><line x1="231.2" y1="18" x2="231.2" y2="248" stroke="currentColor" opacity=".15"/><text x="231.2" y="264" text-anchor="middle" font-size="11">2006</text><line x1="285.0" y1="18" x2="285.0" y2="248" stroke="currentColor" opacity=".15"/><text x="285.0" y="264" text-anchor="middle" font-size="11">2008</text><line x1="338.8" y1="18" x2="338.8" y2="248" stroke="currentColor" opacity=".15"/><text x="338.8" y="264" text-anchor="middle" font-size="11">2010</text><line x1="392.5" y1="18" x2="392.5" y2="248" stroke="currentColor" opacity=".15"/><text x="392.5" y="264" text-anchor="middle" font-size="11">2012</text><line x1="446.2" y1="18" x2="446.2" y2="248" stroke="currentColor" opacity=".15"/><text x="446.2" y="264" text-anchor="middle" font-size="11">2014</text><line x1="500.0" y1="18" x2="500.0" y2="248" stroke="currentColor" opacity=".15"/><text x="500.0" y="264" text-anchor="middle" font-size="11">2016</text><line x1="70" y1="248.0" x2="500" y2="248.0" stroke="currentColor" opacity=".15"/><text x="64" y="252.0" text-anchor="end" font-size="11">0</text><line x1="70" y1="209.7" x2="500" y2="209.7" stroke="currentColor" opacity=".15"/><text x="64" y="213.7" text-anchor="end" font-size="11">10</text>             <p class="pc-q-title">Q53 — Esta pregunta trata sobre la química de Iron Man</p>

            <div class="pc-intro"><p>A pesar de su nombre, el traje metálico del superhéroe de cómic «Iron Man» es, según la película de 2008, una aleación de titanio y oro. En julio de 2016, unos investigadores hallaron una aleación titanio-oro de fórmula Ti<sub>3</sub>Au unas cuatro veces más dura que el titanio puro y que la mayoría de los aceros. Además es biocompatible, lo que la hace ideal para prótesis de cadera y rodilla y para tornillos e implantes que fijan fracturas óseas.</p></div>
            <p>Actualmente se usa una fina película de nitruro de titanio, TiN, para aumentar la dureza del titanio, por ejemplo en herramientas de corte. Esto da al titanio un bonito color dorado que quizá eligió Iron Man para que su traje luciera bien.</p>
            <p>Las películas finas de TiN suelen prepararse mediante deposición química en fase vapor, en la que el TiN se forma sobre sustratos calentados por encima de 320 °C en una atmósfera de cloruro de titanio(IV) y amoníaco. Una ecuación sin ajustar de esta reacción es:</p>
            <p class="pc-eq pc-math"><em>a</em> TiCl<sub>4</sub>(g) + <em>b</em> NH<sub>3</sub>(g) &rarr; <em>c</em> TiN(s) + <em>d</em> HCl(g) + <em>e</em> N<sub>2</sub>(g)</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>¿Cuál es el estado de oxidación del titanio en el nitruro de titanio, TiN?</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>¿Qué elemento se oxida en la reacción entre TiCl<sub>4</sub> y NH<sub>3</sub>?</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>¿Qué elemento se reduce en la reacción entre TiCl<sub>4</sub> y NH<sub>3</sub>?</p></div><div class="pc-sub"><span class="pc-sub-label">(iv)</span><p>Ajusta la ecuación anterior.</p></div></div></div>
            <p>Para fabricar las aleaciones titanio-oro, los dos elementos se calientan juntos en las proporciones adecuadas bajo atmósfera inerte de argón.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Suponiendo que el traje de Iron Man requiere 40 kg de aleación, calcula las masas de titanio y de oro necesarias para prepararla con fórmula Ti<sub>3</sub>Au.</p></div></div>
            <p>Hay dos formas distintas de la aleación Ti<sub>3</sub>Au, la forma α y la forma β. La disposición de los átomos en cada forma se muestra mediante una celda unidad. La celda unidad se determina por cristalografía de rayos X y muestra la disposición de átomos que genera la estructura macroscópica al apilar las celdas. Algunos átomos están completamente dentro de la celda, mientras que, para los centrados en vértices, aristas o caras, solo hay fracciones dentro de una celda.</p>
            <p>Las celdas unidad de α-Ti<sub>3</sub>Au y β-Ti<sub>3</sub>Au se basan en cubos regulares. La dureza de las aleaciones depende del número de interacciones de enlace de cada átomo y de las longitudes de enlace.</p>
            <p>La celda de la forma α tiene un átomo de oro centrado en cada vértice del cubo y un átomo de titanio en el centro de cada cara. La arista del cubo mide 4.15 Å.</p>

            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>En la estructura macroscópica de α-Ti<sub>3</sub>Au, generada al apilar las celdas, los átomos de titanio están rodeados de átomos de oro y de otros átomos de titanio.</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>¿Cuántos átomos de titanio rodean a cada átomo de oro?</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>¿Cuántos átomos de oro rodean a cada átomo de titanio?</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>¿Cuántos átomos de titanio rodean a cada átomo de titanio?</p></div></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula la distancia Ti–Au.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula la distancia más corta entre dos átomos de titanio.</p></div></div></div>
            <p>La forma β también tiene un átomo de oro en cada vértice, pero además uno en el centro del cubo. La arista del cubo mide 5.09 Å. Los átomos de titanio se disponen de dos en dos en cada cara, separados exactamente la mitad de la arista. El par Ti–Ti está centrado en la cara y paralelo a una de las aristas del cubo. Los pares Ti–Ti de caras adyacentes están alineados en ángulo recto.</p>

            <p class="pc-q-title">Q53 — Esta pregunta trata sobre la química de Iron Man <span class="pc-total-chip">Total: 23 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>+3</strong></p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(iv)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">6 TiCl<sub>4</sub> + 8 NH<sub>3</sub> &rarr; 6 TiN + 24 HCl + N<sub>2</sub></p><p class="pc-eq pc-math">3 TiCl<sub>4</sub> + 4 NH<sub>3</sub> &rarr; 3 TiN + 12 HCl + <sup>1</sup>⁄<sub>2</sub> N<sub>2</sub></p><p class="pc-note">Sin puntuación parcial.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>M</em>(Ti<sub>3</sub>Au) = 3 × 47.90 + 196.97 = 340.67 g mol<sup>−1</sup></p><p class="pc-eq pc-math"><em>m</em>(Ti) = 40 kg × <span class="pc-eq-frac"><span class="pc-eq-frac-num">3 × 47.90</span><span class="pc-eq-frac-den">340.67</span></span> = <strong>17 kg</strong> &nbsp;&nbsp; <em>m</em>(Au) = 40 kg × <span class="pc-eq-frac"><span class="pc-eq-frac-num">196.97</span><span class="pc-eq-frac-den">340.67</span></span> = <strong>23 kg</strong></p><p class="pc-note">Medio punto por cada masa.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>12</strong></p><p class="pc-note">En cada uno de los tres planos (xy, xz, yz) hay cuatro átomos de Ti alrededor de un Au: 3 × 4 = 12.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">(2<em>x</em>)<sup>2</sup> = (4.15 Å)<sup>2</sup> + (4.15 Å)<sup>2</sup> &nbsp;&rArr;&nbsp; <em>x</em> = <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body">8.611 Å<sup>2</sup></span></span> = <strong>2.93 Å</strong></p><p class="pc-note">Un punto por plantear Pitágoras con el esquema y otro por el valor con unidades. El Ti está en el centro de una cara y el Au en un vértice: la distancia es la mitad de la diagonal de la cara.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>12</strong></p><p class="pc-note">Dos átomos de Ti en cada una de las seis caras del cubo que rodean al Au central.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>4</strong></p><p class="pc-note">Dos Au (vértices) en la cara y los dos Au centrales de cubos contiguos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(iii)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">Vecinos más próximos: <strong>2</strong> &nbsp;&nbsp; Siguientes vecinos más próximos: <strong>8</strong></p><p class="pc-note">Un punto por cada número.</p></div>

            <p class="pc-q-title">Q54 — Esta pregunta trata sobre la molécula de twistano</p>

            <div class="pc-intro"><p>Aunque la estructura esquelética del ciclohexano (C<sub>6</sub>H<sub>12</sub>) suele representarse como un hexágono regular, en realidad es una molécula flexible que existe en distintas formas llamadas <em>conformaciones</em>. Dos de ellas son la silla y el bote torcido (<em>twist-boat</em>). Los átomos de carbono de los anillos de seis miembros se numeran 1–6 para mostrar su conectividad.</p></div>
            <p>La silla es la conformación de menor energía del ciclohexano, con todos los ángulos de enlace casi iguales al ideal de un carbono tetraédrico. El bote torcido tiene mayor energía.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>¿En cuántos grados difiere el ángulo C–C–C ideal de la silla del ciclohexano del de un hexágono regular?</p></div></div>
            <p>La molécula de <em>adamantano</em> puede visualizarse añadiendo cuatro átomos de carbono más a la conformación silla del ciclohexano: se añade un carbono directamente encima de los átomos 1, 3 y 5 (carbonos 7, 9 y 8, unidos respectivamente a 1, 3 y 5), y se conectan estos tres nuevos átomos con un último carbono nuevo (10). Así se crean otros anillos de seis miembros, y en el adamantano todos están bloqueados en conformación silla.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Para cada anillo de seis miembros único del adamantano, escribe los números de sus seis átomos de carbono en el orden en que están conectados, empezando por el número más bajo (por ejemplo, -1-2-3-4-5-6-).</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>¿Cuántas señales hay en el espectro de RMN de <sup>13</sup>C del adamantano (es decir, cuántos entornos únicos de carbono hay)?</p></div></div>
            <p>La molécula de <em>twistano</em> puede visualizarse añadiendo cuatro átomos de carbono más a la conformación bote torcido del ciclohexano: dos átomos de carbono (7 y 8) que unen los átomos 2 y 5 por arriba (2–7–8–5) y otros dos (9 y 10) que unen los átomos 3 y 6 por abajo (3–10–9–6). Así se crean otros anillos de seis miembros y en el twistano todos están bloqueados en conformación bote torcido, lo que da nombre a la molécula.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Para cada anillo de seis miembros único del twistano, escribe los números de sus seis átomos de carbono en el orden en que están conectados, empezando por el número más bajo.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>¿Cuántas señales hay en el espectro de RMN de <sup>13</sup>C del twistano?</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>El adamantano y el twistano son isómeros. ¿Cuál es su fórmula molecular?</p></div></div>
            <p>Como todos sus anillos están en la conformación silla de menor energía, el adamantano es una molécula muy estable. Se descubrió en 1933 como componente del petróleo crudo. Por el contrario, el twistano es una molécula muy tensionada, ya que todos sus anillos están en la conformación bote torcido de mayor energía. Debe sintetizarse expresamente, lo que se logró por primera vez en 1962. La síntesis se muestra a continuación.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.6 gapx=34 gapy=36

            <p style="font-size:.9em">Fórmulas moleculares: <strong>B</strong> = C<sub>10</sub>H<sub>16</sub>O<sub>3</sub>S; <strong>H</strong> = C<sub>11</sub>H<sub>18</sub>O<sub>4</sub>S; <strong>K</strong> = C<sub>10</sub>H<sub>14</sub>O. En la reacción de <strong>D</strong> con I<sub>2</sub> se forma primero un catión intermedio (con un anillo de yodonio).</p>
            <p>En la síntesis no se rompe ningún enlace sencillo C–C, de modo que los presentes en el material de partida se mantienen todo el tiempo. Debes usarlos en el apartado (g).</p>

            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>Responde a las siguientes preguntas de opción múltiple:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>¿Cuántos planos de simetría tiene el twistano? (ninguno / uno / dos o más)</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>¿Cuántos ejes de rotación de simetría tiene el twistano? (ninguno / uno / dos o más)</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>¿Es el twistano superponible con su imagen especular? (sí / no)</p></div></div></div>
