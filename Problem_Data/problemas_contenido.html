            <p class="pc-q-title">Q1 — Esta pregunta trata sobre el pis en la piscina</p>

            <div class="pc-intro">
                <p>El nadador Michael Phelps, plusmarquista de medallas de oro olímpicas, dijo en una ocasión: <em>"Todo el mundo se hace pis en la piscina&hellip; el cloro lo mata, así que no pasa nada."</em></p>
                <p>Las piscinas se desinfectan habitualmente con cloro. El cloro reacciona con el agua para formar varias especies desinfectantes, y el proceso debe controlarse cuidadosamente para evitar la liberación de gas Cl<sub>2</sub>.</p>
                <p>El cloro reacciona con el agua de la siguiente manera:</p>
            </div>
            <p class="pc-eq">Cl<sub>2</sub> &nbsp;+&nbsp; H<sub>2</sub>O &nbsp;&rarr;&nbsp; HOCl &nbsp;+&nbsp; HCl</p>

            <div class="pc-part">
                <span class="pc-part-label">(a)</span>
                <div class="pc-part-body">
                    <p>Indica los estados de oxidación del cloro en cada una de estas especies: Cl<sub>2</sub>, HOCl y HCl.</p>
                </div>
            </div>

            <p>Por sí sola, esta reacción dejaría la piscina demasiado ácida, por lo que se añaden otros compuestos como el Na<sub>2</sub>CO<sub>3</sub>. Esto elimina iones H<sup>+</sup> y evita la reacción inversa que regeneraría Cl<sub>2</sub>.</p>

            <div class="pc-part">
                <span class="pc-part-label">(b)</span>
                <div class="pc-part-body">
                    <p>Escribe la ecuación de la reacción entre el carbonato de sodio y el ácido hipocloroso (ácido clórico(I), HOCl).</p>
                </div>
            </div>

            <p>Una mala gestión de la piscina puede provocar una acumulación de iones clorato(V) (ClO<sub>3</sub><sup>&minus;</sup>). Esto se debe a la lenta desproporción de los iones clorato(I) (OCl<sup>&minus;</sup>) en ClO<sub>3</sub><sup>&minus;</sup> y Cl<sup>&minus;</sup>.</p>

            <div class="pc-part">
                <span class="pc-part-label">(c)</span>
                <div class="pc-part-body">
                    <div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe la ecuación iónica de la desproporción de los iones clorato(I).</p></div>
                    <div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Indica la forma geométrica del ion ClO<sub>3</sub><sup>&minus;</sup>.</p></div>
                </div>
            </div>

            <p>La urea, (NH<sub>2</sub>)<sub>2</sub>CO, presente en la orina, se hidroliza para formar amoniaco y dióxido de carbono.</p>

            <div class="pc-part">
                <span class="pc-part-label">(d)</span>
                <div class="pc-part-body"><p>Escribe la ecuación de esta reacción.</p></div>
            </div>

            <p>El ácido clórico(I), HOCl, puede reaccionar con este amoniaco para formar monocloramina (NH<sub>2</sub>Cl), dicloramina (NHCl<sub>2</sub>) y tricloramina (NCl<sub>3</sub>).</p>

            <div class="pc-part">
                <span class="pc-part-label">(e)</span>
                <div class="pc-part-body"><p>Dibuja un diagrama de puntos y cruces para la estructura de la NH<sub>2</sub>Cl.</p></div>
            </div>

            <p>La tricloramina, NCl<sub>3</sub>, es volátil y provoca el característico "olor a cloro" de las piscinas.</p>
            <p>La ley de Henry establece que la concentración disuelta de un gas es proporcional a su presión parcial sobre el líquido. La constante de proporcionalidad se llama constante de la ley de Henry. Para la tricloramina en agua de piscina, esta constante vale 435 mol dm<sup>&minus;3</sup> atm<sup>&minus;1</sup>.</p>

                <span class="pc-part-label">(f)</span>
                <div class="pc-part-body">
                    <p>Para una concentración de NCl<sub>3</sub> de 5.0&times;10<sup>&minus;4</sup> mol dm<sup>&minus;3</sup> en el agua, calcula la presión parcial de equilibrio del NCl<sub>3</sub> sobre la piscina (en atm).</p>

            <p class="pc-q-title">Q1 — Esta pregunta trata sobre el pis en la piscina <span class="pc-total-chip">Total: 8 puntos</span></p>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">2 puntos</span></div>

            <p class="pc-q-title">Q2 — Esta pregunta trata sobre los isocianuros</p>

                <p>Los isocianuros son moléculas orgánicas con olores extremadamente desagradables. Los químicos los han descrito como "horribles", "extremadamente angustiantes" e incluso como "el Godzilla de los olores". Pese a ello, los isocianuros son intermedios importantes en muchas reacciones orgánicas.</p>

            <p>Los isocianuros también pueden obtenerse por deshidratación del compuesto <strong>C</strong>. El compuesto <strong>C</strong> puede hidrolizarse para dar la amina R&ndash;NH<sub>2</sub> y el compuesto <strong>D</strong>. El análisis elemental muestra que <strong>D</strong> tiene un 26.1&nbsp;% de carbono en masa, independientemente de la identidad de R.</p>

            <p>Las aminas pueden reaccionar con triclorometano e hidróxido de sodio para formar isocianuros; esto se conoce como el <strong>test de Zaytsev</strong>. Un resultado positivo se indica por el olor a isocianuro. Solo algunas aminas dan positivo; las amidas no.</p>

                <p class="pc-note">El test de Zaytsev solo da positivo con <strong>aminas primarias</strong> (alifáticas o aromáticas). 2 puntos si se marcan exactamente las 2 correctas y ninguna incorrecta. 1 punto si se marcan las 2 correctas más una incorrecta, o solo una correcta. 0 puntos si se marcan dos o más incorrectas.</p>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">3 puntos</span></div>
                <div class="pc-compounds">

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(h)</span><span class="pc-marks">1 punto</span></div>
                <p class="pc-eq">n = 2 isocianuros &times; 3 cetonas &times; 3 ácidos</p>
                <p class="pc-eq"><strong>n = 18</strong></p>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(i)</span><span class="pc-marks">1 punto</span></div>
                <div class="pc-compounds"><div class="pc-compound" style="min-width:220px"><span class="pc-mol" data-size="md" data-mol="passerini-producto-general"></span><span class="pc-compound-name">el carbono marcado con &#10033; es el estereocentro</span></div></div>
                <p class="pc-note">Es el carbono central que porta simultáneamente R<sup>3</sup>, R<sup>4</sup>, el grupo &ndash;O&ndash;C(=O)R<sup>1</sup> y el grupo &ndash;C(=O)NHR<sup>2</sup>. No se concede el punto si se marca cualquier otro átomo.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(j)</span><span class="pc-marks">2 puntos</span></div>
                <p>Los sustituyentes R<sup>3</sup> y R<sup>4</sup> son distintos entre sí en los dos aldehídos (propanal y benzaldehído) y en una de las dos cetonas (butan-2-ona), lo que genera un estereocentro (y por tanto un par de enantiómeros) en cada uno de esos tres casos. La ciclopentanona es simétrica &mdash; R<sup>3</sup> y R<sup>4</sup> forman parte del mismo anillo &mdash; y no genera estereocentro. Esto da 7 posibilidades para el compañero carbonílico (2+2+2+1 = 7).</p>
                <p class="pc-eq">n = 2 isocianuros &times; 7 (aldehídos/cetonas, contando enantiómeros) &times; 3 ácidos</p>
                <p class="pc-eq"><strong>n = 42</strong></p>
                <p class="pc-note">2 puntos por el número correcto. Sin crédito parcial.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(k)</span><span class="pc-marks">2 puntos</span></div>
                <p>Isocianuros (5 distinguibles): el bencénico aporta 2 (las posiciones 1 y 3 no son equivalentes entre sí, aunque una sea para y otra orto al metilo); el diisocianoetano aporta 1 (molécula simétrica, sus dos extremos son equivalentes); y el compuesto con carbono cuaternario aporta 2 (los tres &ndash;NC directos son equivalentes entre sí = 1 tipo, más el brazo &ndash;CH<sub>2</sub>NC = otro tipo distinto). Cetonas (2 distinguibles): ciclopentanona y acetona. Ácidos (5 distinguibles): ácido benzoico aporta 1; el ácido tereftálico aporta 1 (sus dos &ndash;CO<sub>2</sub>H son equivalentes por simetría); y el ácido trimelítico aporta 3 (sus tres &ndash;CO<sub>2</sub>H son todos distintos entre sí, sin ningún elemento de simetría que los relacione).</p>
                <p class="pc-eq">n = 5 isocianuros &times; 2 cetonas &times; 5 ácidos</p>
                <p class="pc-eq"><strong>n = 50</strong></p>
                <p class="pc-note">2 puntos por el número correcto. Sin crédito parcial.</p>
            </div>

    "q3-henna": {
        titulo: "Compuestos en los tatuajes de henna",
        numero: "Q3",
        fuente: "58ª Olimpiada Internacional de Química (IChO) · UK Round One 2026",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 58th IChO, UK Round One 2026. Autores originales: P. Bolgar, R. Danylyuk, O. Evans, S. Kang, JL Kiappes, B. Pilgrim, P. Robotham, A. Taylor, A. Thom. Publicado bajo licencia Creative Commons BY-NC-SA. Estructuras dibujadas con ChemDraw (motor propio).",

        enunciado: `
            <p class="pc-q-title">Q3 — Esta pregunta trata sobre compuestos en los tatuajes de henna</p>

            <div class="pc-intro">
                <p>Los tatuajes de henna contienen un compuesto llamado <strong>lawsona</strong>, que reacciona con la queratina de la piel para formar un producto coloreado. La lawsona tiene tres grupos ceto/enol y es un ejemplo de una molécula que sufre tautomería.</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound"><span class="pc-mol" data-size="lg" data-mol="lawsone-ceto"></span><span class="pc-compound-name">lawsona (forma ceto)</span></div></div>

            <p>Ciertas cetonas existen en equilibrio con un isómero alternativo llamado enol. Las formas ceto y enol se interconvierten rápidamente a medida que un átomo de hidrógeno (marcado con *) y un doble enlace cambian de posición. Estos pares de isómeros se llaman tautómeros, y su equilibrio se describe mediante una constante de equilibrio:</p>
            <div class="pc-scheme" data-scheme="q3-ceto-enol-general"></div>

            <div class="pc-part">
                <span class="pc-part-label">(a)</span>
                <div class="pc-part-body"><p>En el equilibrio, una determinada cetona existe en un 99.997&nbsp;% en forma ceto, <strong>A</strong>, y en un 0.003&nbsp;% en forma enol, <strong>B</strong>. Calcula la constante de equilibrio, K<sub>1</sub> = [B]/[A].</p></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(b)</span>
                <div class="pc-part-body"><p>La constante de equilibrio, K<sub>2</sub>, entre la forma ceto, <strong>C</strong>, y la forma enol, <strong>D</strong>, de otra cetona es 0.23. Calcula el porcentaje de <strong>C</strong> y <strong>D</strong> presentes en el equilibrio.</p></div>
            </div>

            <p>Los enoles también pueden formarse a partir de aldehídos. Sin embargo, para formar un enol, el átomo de carbono contiguo al carbono del grupo C=O debe tener un átomo de hidrógeno que pueda eliminarse (un "hidrógeno alfa").</p>

            <div class="pc-part">
                <span class="pc-part-label">(c)</span>
                <div class="pc-part-body"><p>Indica cuáles de los siguientes aldehídos y cetonas pueden formar tautómeros:</p></div>
            </div>
            <div class="pc-compounds">
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="ciclohexanona"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="benzaldehido"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="pivalona"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="acroleina"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="formaldehido"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="benzil"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="pivalaldehido"></span></div>
                <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="metilvinilcetona"></span></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(d)</span>
                <div class="pc-part-body">
                    <div class="pc-sub"><span class="pc-sub-label">(i)</span><p>La lawsona puede formar dos isómeros enólicos distintos. Dibuja la estructura de <strong>ambas</strong> formas enol.</p></div>
                    <div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Uno de los isómeros enólicos está estabilizado por un puente de hidrógeno intramolecular. Añade ese puente de hidrógeno a tu dibujo.</p></div>
                </div>
            </div>

            <p>Al aplicarse sobre la piel, la lawsona de la henna reacciona con aniones tiolato presentes en la cadena lateral de las proteínas de queratina de la piel. Esto da a la piel un color naranja. Con el tiempo, tiene lugar una reacción química y el color cambia a marrón.</p>
            <div class="pc-scheme" data-scheme="q3-keratina"></div>

            <div class="pc-part">
                <span class="pc-part-label">(e)</span>
                <div class="pc-part-body"><p>Clasifica la reacción que provoca el cambio de color de naranja a marrón (sustitución electrófila aromática / sustitución nucleófila aromática / reducción / oxidación / hidrólisis).</p></div>
            </div>

            <p>La tautomería se observa en una amplia variedad de grupos funcionales. Puede representarse mediante la ecuación general que se muestra a continuación, donde X, Y y Z representan átomos que pueden o no ser iguales. La tautomerización suele producirse cuando el átomo X es muy electronegativo (p. ej. X = O o N), lo que polariza fuertemente el enlace X=Y y hace que los enlaces X&ndash;H y Z&ndash;H sean relativamente ácidos.</p>
            <div class="pc-scheme" data-scheme="q3-tautomeria-general"></div>

            <div class="pc-part">
                <span class="pc-part-label">(f)</span>
                <div class="pc-part-body">
                    <p>Dibuja el tautómero de los siguientes compuestos:</p>
                    <div class="pc-compounds">
                        <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="fosforo-tautomero-a"></span><span class="pc-compound-name">(i)</span></div>
                        <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="nitro-normal"></span><span class="pc-compound-name">(ii)</span></div>
                    </div>
                </div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(g)</span>
                <div class="pc-part-body">
                    <p>Dibuja <strong>todos los tautómeros posibles</strong> de los siguientes compuestos. No es necesario considerar la estereoquímica.</p>
                    <div class="pc-compounds">
                        <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="acetamida"></span><span class="pc-compound-name">(i)</span></div>
                        <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="imina-inicial"></span><span class="pc-compound-name">(ii)</span></div>
                    </div>
                </div>
            </div>

            <p>El cambio de entalpía estándar, &Delta;<sub>r</sub>H&deg;, de la tautomerización de una cetona a un enol en fase gaseosa puede estimarse a partir de entalpías de enlace medias.</p>
            <table class="pc-table">
                <thead><tr><th>Enlace</th><th>&Delta;H&deg; / kJ mol<sup>&minus;1</sup></th><th>Enlace</th><th>&Delta;H&deg; / kJ mol<sup>&minus;1</sup></th></tr></thead>
                <tbody>
                    <tr><td>C&ndash;C</td><td>348</td><td>C&ndash;O</td><td>360</td></tr>
                    <tr><td>C=C</td><td>612</td><td>C=O</td><td>743</td></tr>
                    <tr><td>C&ndash;H</td><td>412</td><td>O&ndash;H</td><td>463</td></tr>
                </tbody>
            </table>

            <div class="pc-part">
                <span class="pc-part-label">(h)</span>
                <div class="pc-part-body"><p>Calcula &Delta;<sub>r</sub>H&deg; para una tautomerización típica de cetona a enol.</p></div>
            </div>

            <p>En la lawsona también hay que considerar la contribución del puente de hidrógeno (y otros factores). En fase gaseosa, el &Delta;<sub>r</sub>H&deg; para la tautomerización de cetona a enol del tautómero preferido de la lawsona es &minus;32.58 kJ mol<sup>&minus;1</sup>. El cambio de entropía estándar, &Delta;<sub>r</sub>S&deg;, de esta reacción es &minus;11.48 J K<sup>&minus;1</sup> mol<sup>&minus;1</sup>.</p>

            <div class="pc-part">
                <span class="pc-part-label">(i)</span>
                <div class="pc-part-body"><p>Calcula la constante de equilibrio, K<sub>gas</sub>, para esta tautomerización ceto&rarr;enol de la lawsona en fase gaseosa a 298 K.</p></div>
            </div>
            <p class="pc-note">Si no obtienes una respuesta para (i), asume que la respuesta es 3.05&times;10<sup>6</sup>.</p>

            <p>La energía libre de Gibbs de solvatación, &Delta;<sub>sol</sub>G&deg;, difiere entre las formas ceto y enol de la lawsona: &Delta;<sub>sol</sub>G&deg;<sub>ceto</sub> = &minus;126.0 kJ mol<sup>&minus;1</sup>; &Delta;<sub>sol</sub>G&deg;<sub>enol</sub> = &minus;109.2 kJ mol<sup>&minus;1</sup>. Las energías libres de Gibbs pueden sumarse en un ciclo similar a un ciclo de Hess usado para cambios de entalpía.</p>

            <div class="pc-part">
                <span class="pc-part-label">(j)</span>
                <div class="pc-part-body"><p>Calcula la constante de equilibrio, K<sub>agua</sub>, para la tautomerización ceto&rarr;enol de la lawsona en agua a 298 K.</p></div>
            </div>
        `,

        respuesta: `
            <p class="pc-q-title">Q3 — Esta pregunta trata sobre compuestos en los tatuajes de henna <span class="pc-total-chip">Total: 19 puntos</span></p>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div>
                <p class="pc-eq">K<sub>1</sub> = [B]/[A] = 0.003 / 99.997 = <strong>3.00&times;10<sup>&minus;5</sup></strong></p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">2 puntos</span></div>
                <p class="pc-eq">K<sub>2</sub> = [D]/[C] = 0.23, &nbsp; [C]+[D] = 100%</p>
                <p class="pc-eq">[D] = 23% &minus; 0.23[D] &rArr; 1.23[D] = 23% &rArr; <strong>[D] = 18.7%</strong>, &nbsp; <strong>[C] = 81.3%</strong></p>
                <p class="pc-note">2 puntos si ambos números son correctos. 1 punto si el planteamiento (sistema de ecuaciones) es correcto pero el resultado final tiene un error trivial, o si solo se da uno de los dos porcentajes.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div>
                <div class="pc-compounds">

            <p class="pc-q-title">Q4 — Esta pregunta trata sobre arroz, especias y ratones</p>

            <div class="pc-intro">
                <p>El plato nacional de Uzbekistán, país anfitrión de la Olimpiada Internacional de Química 2026, se llama pilaf: un plato de arroz que suele llevar cordero, zanahorias y especias. Su color característico proviene del pigmento caroteno de las zanahorias, que tiene varios isómeros distintos.</p>
                <div class="pc-compounds">
                    <div class="pc-compound" style="min-width:320px"><span class="pc-mol" data-size="lg" data-mol="beta-caroteno-simplificado"></span><span class="pc-compound-name">&beta;-caroteno (estructura simplificada)</span></div>
                </div>
                <p>El &beta;-caroteno contiene 40 átomos de carbono, 11 enlaces C=C y dos anillos.</p>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(a)</span>
                <div class="pc-part-body"><p>Escribe la fórmula molecular del &beta;-caroteno.</p></div>
            </div>

            <p>Los colores de los carotenos provienen de sus largas cadenas de enlaces C=C y C&ndash;C alternados. Decimos que los enlaces C=C de este tipo de cadenas (p. ej. &ndash;C=C&ndash;C=C&ndash;) están <strong>conjugados</strong>. El &alpha;-caroteno tiene un color más amarillento y el &beta;-caroteno más anaranjado, debido a que tienen un número distinto de enlaces C=C conjugados.</p>
            <div class="pc-compounds">
                <div class="pc-compound" style="min-width:320px"><span class="pc-mol" data-size="lg" data-mol="alfa-caroteno-simplificado"></span><span class="pc-compound-name">&alpha;-caroteno (estructura simplificada)</span></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(b)</span>
                <div class="pc-part-body">
                    <div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Número de enlaces C=C conjugados en el &alpha;-caroteno.</p></div>
                    <div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Número de enlaces C=C conjugados en el &beta;-caroteno.</p></div>
                </div>
            </div>

            <div class="pc-figrow">
                <p>Los orbitales moleculares nos ayudan a entender por qué las moléculas con enlaces C=C conjugados absorben luz visible. Las formas de los orbitales proceden de funciones matemáticas llamadas funciones de onda. En cualquier región del espacio, el valor de una función de onda puede ser positivo o negativo. Representamos las regiones de un orbital donde la función de onda es negativa sombreándolas de negro. Los orbitales p, por ejemplo, siempre tienen una región donde la función de onda es negativa y otra donde es positiva.</p>
                <div class="pc-figside"><div class="pc-diagram-wrap" data-diagram="p-orbital-fases"></div></div>
            </div>

            <div class="pc-figrow">
                <p>Los orbitales moleculares de los sistemas conjugados pueden generarse considerando la interferencia entre orbitales p. En el etileno, por ejemplo, los dos orbitales p implicados en el enlace &pi; interfieren y forman dos orbitales moleculares.</p>
                <div class="pc-figside"><div class="pc-diagram-wrap" data-diagram="interferencia-mo"></div></div>
            </div>

            <p>En el butadieno, los cuatro orbitales p de los enlaces C=C conjugados interfieren y forman cuatro orbitales moleculares, mostrados aquí en un orden que <strong>no</strong> corresponde a su energía real:</p>
            <div class="pc-compounds">
                <div class="pc-compound"><span class="pc-mol" data-size="md" data-mol="butadieno"></span><span class="pc-compound-name">1,3-butadieno</span></div>
            </div>
            <div class="pc-diagram-wrap" data-diagram="q4-butadieno-mos"></div>

            <div class="pc-part">
                <span class="pc-part-label">(c)</span>
                <div class="pc-part-body"><p>Considerando la cantidad de interferencia constructiva y destructiva entre orbitales p vecinos, ordena estos orbitales moleculares de menor a mayor energía.</p></div>
            </div>

            <div class="pc-figrow">
                <p>En el hexatrieno, los seis orbitales p de los enlaces C=C conjugados interfieren y forman seis orbitales moleculares.</p>
                <div class="pc-compounds" style="margin:0">
                    <div class="pc-compound"><span class="pc-mol" data-size="md" data-mol="hexatrieno"></span><span class="pc-compound-name">1,3,5-hexatrieno</span></div>
                </div>
                <div class="pc-figside"><div class="pc-diagram-wrap" data-diagram="q4-hexatrieno-vacio"></div></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(d)</span>
                <div class="pc-part-body"><p>En el cuadernillo de respuestas, completa el diagrama de orbitales moleculares del hexatrieno sombreando las partes correctas de los orbitales p (los lóbulos con línea discontinua son los que debes decidir; ver la pestaña de <strong>respuesta</strong> para la solución).</p></div>
            </div>

            <p>Los alquenos conjugados absorben luz cuya longitud de onda corresponde al hueco energético entre dos de estos orbitales moleculares. Podemos aproximar el hueco energético con esta ecuación:</p>
            <p class="pc-eq">&Delta;E = 4&beta; sin( 90&deg; / (N+1) )</p>
            <p><em>N</em> = número de orbitales p en el sistema conjugado. Para el hexatrieno, &beta; = 6.85&times;10<sup>&minus;19</sup> J.</p>

            <div class="pc-part">
                <span class="pc-part-label">(e)</span>
                <div class="pc-part-body">
                    <div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula el hueco energético en el hexatrieno.</p></div>
                    <div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula la longitud de onda de la luz absorbida por el hexatrieno, en nanómetros (nm), redondeada al número entero más próximo.</p></div>
                </div>
            </div>
            <p class="pc-note">Si no obtienes una respuesta para (e)(ii), asume que la respuesta es 200 nm.</p>

            <p>La luz visible tiene longitudes de onda entre 380 nm (violeta) y 720 nm (rojo).</p>

            <div class="pc-part">
                <span class="pc-part-label">(f)</span>
                <div class="pc-part-body"><p>Según tu respuesta a (e)(ii), indica si el hexatrieno absorbe luz visible o no.</p></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(g)</span>
                <div class="pc-part-body"><p>Indica qué le ocurre a la longitud de onda de la luz absorbida a medida que aumenta el número de enlaces C=C conjugados (suponiendo que &beta; no cambia): ¿disminuye, se mantiene igual, o aumenta?</p></div>
            </div>

            <p>Un colorante alimentario relacionado, la <strong>tartrazina</strong>, es conocido por dar a los Doritos su color amarillo-naranja característico, pero también tiene una aplicación más inusual: al aplicarse sobre la piel de un ratón, la vuelve temporalmente transparente, ya que cambia el índice de refracción de las regiones acuosas de la piel para igualarlo al de las regiones grasas (permitiendo así estudiar vasos sanguíneos, músculos y órganos internos sin cirugía invasiva).</p>
            <p>Región acuosa: índice de refracción = 1.33. Región grasa: índice de refracción = 1.45.</p>
            <p class="pc-eq">&Delta;n = 0.143 &times; c<sub>t</sub> &nbsp;&nbsp;<span class="pc-eq-label">(c<sub>t</sub> en mol dm<sup>&minus;3</sup>)</span></p>
            <p>M<sub>r</sub>(tartrazina) = 534.4 g mol<sup>&minus;1</sup>.</p>

            <div class="pc-part">
                <span class="pc-part-label">(h)</span>
                <div class="pc-part-body"><p>Suponiendo que el volumen total de las regiones acuosas en la piel de un ratón es 8.50 cm<sup>3</sup>, calcula la masa mínima de tartrazina necesaria para hacer transparente la piel de ese ratón.</p></div>
            </div>

            <p>La síntesis de la tartrazina a partir del nitrobenceno se muestra a continuación (pista: el Na<sub>2</sub>SO<sub>3</sub> es un agente reductor):</p>
            <div class="pc-scheme" data-scheme="q4-tartrazina-sintesis"></div>

            <div class="pc-part">
                <span class="pc-part-label">(i)</span>
                <div class="pc-part-body"><p>Dibuja las estructuras de los compuestos <strong>A</strong>&ndash;<strong>F</strong>.</p></div>
            </div>

            <p>Una forma de diferenciar entre &beta;-caroteno y tartrazina es investigar qué longitudes de onda de luz absorben mediante espectroscopía UV-visible.</p>
            <figure class="pc-figure"><img src="https://i.imgur.com/8KPoBFW.png" alt="Espectro UV-vis de la sustancia X" loading="lazy"><figcaption>Espectro UV-vis de la sustancia X</figcaption></figure>

            <div class="pc-part">
                <span class="pc-part-label">(j)</span>
                <div class="pc-part-body"><p>El espectro UV-vis de la sustancia <strong>X</strong> muestra un pico de absorción máxima en torno a 660 nm (poca absorción en el resto del visible). Sugiere el color de la sustancia <strong>X</strong>.</p></div>
            </div>

            <p>Una muestra que contiene tartrazina, &beta;-caroteno y un indicador de pH se añadió a éter dietílico. Se añadió HCl acuoso, se agitó la mezcla y se dejaron separar las capas. Después se añadió una base a la capa orgánica, lo que provocó un cambio de color. Finalmente se evaporó el éter dietílico de la capa orgánica y se añadió etanol al residuo; los sólidos no disueltos se filtraron y se disolvieron en hexano.</p>

                <div class="pc-part-body"><p>Explica, para cada una de las cinco disoluciones obtenidas en el proceso anterior (capa acuosa tras HCl; capa orgánica tras HCl; capa orgánica tras la base; la disolución en etanol; la disolución en hexano), qué compuesto(s) esperarías encontrar en cada una y por qué.</p></div>
            </div>

                    <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="acido-sulfanilico"></span><span class="pc-compound-name">B &mdash; ácido sulfanílico (sulfonación)</span></div>
                    <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="sal-diazonio"></span><span class="pc-compound-name">C &mdash; sal de diazonio</span></div>
                    <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="hidrazina-sulfonica"></span><span class="pc-compound-name">D &mdash; hidracina (reducción con Na<sub>2</sub>SO<sub>3</sub>)</span></div>
                    <div class="pc-compound"><span class="pc-mol" data-size="sm" data-mol="pirazolona-ester"></span><span class="pc-compound-name">E &mdash; hidrazona ciclada (pirazolona-éster)</span></div>
                    <div class="pc-compound"><span class="pc-mol" data-size="md" data-smiles="CCOC(=O)c1nn(-c2ccc(S(=O)(=O)O)cc2)c(O)c1N=Nc1ccc(S(=O)(=O)O)cc1"></span><span class="pc-compound-name">F &mdash; acoplamiento azoico de E con la sal de diazonio C (éster etílico)</span></div>
                    <div class="pc-compound"><span class="pc-mol" data-size="md" data-mol="tartrazina-simplificada"></span><span class="pc-compound-name">tartrazina &mdash; hidrólisis del éster con exceso de NaOH (sal trisódica)</span></div>
                </div>
                <p class="pc-note">1 punto por A, 1 por B, 1 por C, 2 por D, 2 por E, 1 por F (arrastre de error permitido en cada paso si la estructura previa es consistente con la fórmula molecular dada).</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(j)</span><span class="pc-marks">1 punto</span></div>
                <p>Si <strong>X</strong> absorbe con máximo hacia 660 nm (la región roja/naranja del espectro), el color que se observa es el complementario: <strong>azul</strong>.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(k)</span><span class="pc-marks">3 puntos</span></div>
                <p>La tartrazina (ácida, con grupos &ndash;SO<sub>3</sub>H/&ndash;COOH) pasa a la capa acuosa tras la extracción ácida, mientras que el &beta;-caroteno (apolar, sin grupos ácidos) permanece en la capa orgánica de éter. Al añadir base a la capa orgánica, cualquier resto de indicador de pH cambia de color al desprotonarse. Tras evaporar el éter y añadir etanol, la tartrazina remanente (si la hubiera) se disuelve en etanol (polar), mientras que el &beta;-caroteno, muy apolar, no se disuelve en etanol pero sí en hexano.</p>
                <p class="pc-note">3 puntos por identificar correctamente el compuesto mayoritario en cada una de las disoluciones y justificar la separación en términos de polaridad/acidez.</p>

        `

    // ────────────────────────────────────────────────────────────────
    // Q5 — Minerales (turquesa)
    // ────────────────────────────────────────────────────────────────
    "q5-minerales": {
        titulo: "Minerales: la turquesa de Al-Bīrūnī",
        numero: "Q5",
        fuente: "58ª Olimpiada Internacional de Química (IChO) · UK Round One 2026",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 58th IChO, UK Round One 2026. Autores originales: P. Bolgar, R. Danylyuk, O. Evans, S. Kang, JL Kiappes, B. Pilgrim, P. Robotham, A. Taylor, A. Thom. Publicado bajo licencia Creative Commons BY-NC-SA. Fotografías/diagramas originales del enunciado alojados externamente (Imgur) por el autor del sitio.",

        enunciado: `
            <p class="pc-q-title">Q5 — Esta pregunta trata sobre minerales</p>

            <div class="pc-intro">
                <p>El químico del siglo X al-Bīrūnī nació en Uzbekistán. Al-Bīrūnī desarrolló pruebas para distinguir minerales de aspecto similar entre sí, por lo que se le considera uno de los primeros mineralogistas científicos. Estudió la turquesa, una valiosa gema azul-verdosa.</p>
                <p>La turquesa tiene una fórmula idealizada de CuAl<sub>6</sub>(PO<sub>4</sub>)<sub>4</sub>(OH)<sub>x</sub>&middot;yH<sub>2</sub>O. El estado de oxidación del cobre en este mineral es 2+.</p>
            </div>

            <div class="pc-gallery" data-gallery="q5-turquesa"></div>

            <div class="pc-part">
                <span class="pc-part-label">(a)</span>
                <div class="pc-part-body"><p>Determina el número de iones hidróxido, x, presentes en esta fórmula.</p></div>
            </div>
            <p class="pc-note">Si no obtienes una respuesta para (a), asume que la respuesta es x = 10.</p>

            <p>Una forma sencilla de identificar una gema es el análisis destructivo para determinar su contenido elemental. El contenido de agua de la turquesa es variable, y <em>y</em> puede variar entre 2 y 8; este agua puede eliminarse calentando en un horno. Se realizó un análisis elemental sobre una muestra de turquesa pura deshidratada.</p>

            <div class="pc-part">
                <span class="pc-part-label">(b)</span>
                <div class="pc-part-body"><p>Determina el porcentaje de cobre en masa en esta muestra deshidratada, con tres cifras significativas.</p></div>
            </div>

            <p>La libetenita, Cu<sub>2</sub>PO<sub>4</sub>OH, es un mineral azul-verdoso que contiene cobre, de aspecto similar a la turquesa. Se analizaron seis muestras minerales:</p>
            <table class="pc-table">
                <thead><tr><th>Muestra</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr></thead>
                <tbody><tr><td>% Cu en masa</td><td>0%</td><td>7%</td><td>11%</td><td>17%</td><td>46%</td><td>53%</td></tr></tbody>
            </table>

            <div class="pc-part">
                <span class="pc-part-label">(c)</span>
                <div class="pc-part-body"><p>Calcula qué muestra de la tabla era libetenita pura y cuál era turquesa pura.</p></div>
            </div>

            <p>La turquesa tiene una composición intermedia entre la libetenita y otro mineral azul-verdoso, la variscita, AlPO<sub>4</sub>&middot;2H<sub>2</sub>O. Estos minerales pueden distinguirse fácilmente mediante análisis químico. Al-Bīrūnī solo tenía acceso a análisis químicos sencillos; tuvo que recurrir a otras medidas, como la comparación de densidades minerales. Las densidades pueden calcularse a partir del tamaño y la composición de la celda unidad del cristal (la unidad que se repite periódicamente formando el cristal).</p>

            <div class="pc-gallery" data-gallery="q5-variscita"></div>

            <p>Dentro de la celda unidad se observan octaedros 'AlO<sub>6</sub>' (un Al<sup>3+</sup> rodeado de seis oxígenos en forma octaédrica; dos de esos oxígenos forman parte de moléculas de agua, y los demás se consideran iones O<sup>2&minus;</sup>) y tetraedros 'PO<sub>4</sub>' (un centro P(V) rodeado de un tetraedro de cuatro oxígenos, como en el anión fosfato). Todos los iones O<sup>2&minus;</sup> se comparten entre dos poliedros (octaedros o tetraedros).</p>
            <p>Un tetraedro regular de arista <em>a</em> tiene el siguiente volumen: <span class="pc-eq-inline">V<sub>tet</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">6&radic;2</span></span> a<sup>3</sup></span>. La distancia de enlace P&ndash;O es 1.54 &Aring;.</p>

            <div class="pc-part">
                <span class="pc-part-label">(d)</span>
                <div class="pc-part-body"><p>Determina el volumen del tetraedro PO<sub>4</sub> en &Aring;<sup>3</sup>.</p></div>
            </div>
            <p class="pc-note">Si no obtienes una respuesta para (d), asume que la respuesta es 1.50 &Aring;<sup>3</sup>.</p>

            <p>El volumen de la celda unidad puede aproximarse como la suma del volumen de los octaedros, los tetraedros, las moléculas de agua y los espacios vacíos. Cada molécula de agua contribuye con 20 &Aring;<sup>3</sup> extra de volumen. El octaedro AlO<sub>6</sub> tiene un volumen de 9.00 &Aring;<sup>3</sup>. La celda unidad de la variscita contiene 8 unidades fórmula.</p>

            <div class="pc-part">
                <span class="pc-part-label">(e)</span>
                <div class="pc-part-body">
                    <div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula el volumen de la celda unidad de la variscita en &Aring;<sup>3</sup>, suponiendo que la celda está ocupada en un 50% por tetraedros, octaedros y agua.</p></div>
                    <div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula la densidad de la variscita en g cm<sup>&minus;3</sup>.</p></div>
                </div>
            </div>
            <p class="pc-note">Si no obtienes una respuesta para (e)(i), asume que la respuesta es 969 &Aring;<sup>3</sup>.</p>

            <p>La turquesa está formada por seis octaedros 'AlO<sub>6</sub>', un octaedro 'CuO<sub>6</sub>' y varios tetraedros fosfato 'PO<sub>4</sub>'. La distancia de enlace Cu&ndash;O es 2.29 &Aring;. Las distancias Al&ndash;O (1.89 &Aring;) y P&ndash;O (1.54 &Aring;) son las mismas que en la variscita. Un octaedro regular de arista <em>a</em> tiene el siguiente volumen: <span class="pc-eq-inline">V<sub>oct</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">&radic;2</span><span class="pc-eq-frac-den">3</span></span> a<sup>3</sup></span>.</p>
            <p>Supón que la turquesa contiene seis moléculas de agua de cristalización en la fórmula unidad (y = 6) y que la celda está ocupada en un 70% por tetraedros, octaedros y agua/hidróxido (cada hidróxido también contribuye con 20 &Aring;<sup>3</sup> extra, igual que el agua).</p>

            <div class="pc-part">
                <span class="pc-part-label">(f)</span>
                <div class="pc-part-body">
                    <div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula el volumen de la celda unidad de la turquesa en &Aring;<sup>3</sup>.</p></div>
                    <div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Determina la densidad de la turquesa en g cm<sup>&minus;3</sup>.</p></div>
                </div>
            </div>
            <p class="pc-note">Si no obtienes una respuesta para (f)(i), asume que la respuesta es 444 &Aring;<sup>3</sup>.</p>
        `,

        respuesta: `
            <p class="pc-q-title">Q5 — Esta pregunta trata sobre minerales <span class="pc-total-chip">Total: 13 puntos</span></p>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div>
                <p>Balance de cargas: Cu(+2) + 6&times;Al(+3) + 4&times;PO<sub>4</sub>(&minus;3) = +2+18&minus;12 = +8. Carga restante para el OH<sup>&minus;</sup>: &minus;8. Por tanto, <strong>x = 8</strong>.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div>
                <p>M<sub>r</sub>(turquesa deshidratada) = 605.31 + 17.008x g mol<sup>&minus;1</sup>. Con x = 8: M<sub>r</sub> = 741.4 g mol<sup>&minus;1</sup>. Por tanto, %Cu = 63.55 / 741.4 &times; 100 = <strong>8.57%</strong>.</p>
                <p class="pc-note">Se admite arrastre de error desde (a): con x = 10, %Cu = 8.20%.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div>
                <p>M<sub>r</sub>(libetenita) = 239.08 g mol<sup>&minus;1</sup> &rArr; %Cu = 2&times;63.55/239.08 = 53.2% &rArr; coincide con la <strong>muestra F</strong>.</p>
                <p>Para la turquesa (x=8, y entre 2 y 8): %Cu entre 7.18% y 8.17% &rArr; coincide con la <strong>muestra B</strong>.</p>
                <p class="pc-note">1 punto por identificar F como libetenita, 1 punto por identificar B como turquesa.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div>
                <p>La arista del tetraedro, a, se relaciona con la distancia P&ndash;O (r) mediante a = 2&radic;2&middot;r/&radic;3, es decir, a = 2&radic;2 &times; 1.54 / &radic;3 = 2.515 &Aring;. Por tanto, V<sub>tet</sub> = a<sup>3</sup>/(6&radic;2) = <strong>1.87 &Aring;<sup>3</sup></strong>.</p>
                <p class="pc-note">1 punto por la expresión algebraica correcta de a, 1 punto por el valor final.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(e)(i)</span><span class="pc-marks">2 puntos</span></div>
                <p>Volumen ocupado = 8&times;1.87 + 8&times;9.00 + 16&times;20 = 406.96 &Aring;<sup>3</sup>. Volumen total = 406.96 / 0.5 = <strong>814 &Aring;<sup>3</sup></strong>.</p>
            </div>
            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(e)(ii)</span><span class="pc-marks">1 punto</span></div>
                <p>M<sub>r</sub>(celda, 8 unidades) = 1263.86 g mol<sup>&minus;1</sup> &rArr; masa = 2.099&times;10<sup>&minus;21</sup> g. Densidad = 2.099&times;10<sup>&minus;21</sup> / (814&times;10<sup>&minus;24</sup> cm<sup>3</sup>) = <strong>2.58 g cm<sup>&minus;3</sup></strong>.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(f)(i)</span><span class="pc-marks">3 puntos</span></div>
                <p>V<sub>CuO6</sub> = (2.29/1.89)<sup>3</sup> &times; 9.00 = 16.01 &Aring;<sup>3</sup>. Volumen ocupado = 4&times;1.87 + 16.01 + 6&times;9.00 + 14&times;20 = 357.49 &Aring;<sup>3</sup>. Volumen total = 357.49 / 0.7 = <strong>511 &Aring;<sup>3</sup></strong>.</p>
                <p class="pc-note">1 punto por el volumen del octaedro CuO<sub>6</sub>, 1 punto por el volumen ocupado, 1 punto por el resultado final.</p>
            </div>
            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(f)(ii)</span><span class="pc-marks">1 punto</span></div>
                <p>M<sub>r</sub>(unidad fórmula) = 849.47 g mol<sup>&minus;1</sup> &rArr; masa = 1.411&times;10<sup>&minus;21</sup> g. Densidad = 1.411&times;10<sup>&minus;21</sup> / (511&times;10<sup>&minus;24</sup>) = <strong>2.76 g cm<sup>&minus;3</sup></strong>.</p>
            </div>
        `
    },

    "q6-acitretina": {
        titulo: "Síntesis total de la acitretina",
        numero: "Q6",
        fuente: "Andriamialisoa, Z.; Valla, A.; Cartier, D.; Labia, R. <em>Helv. Chim. Acta</em> <strong>2002</strong>, <em>85</em>, 2926.",
        creditos: "Problema elaborado a partir de una ruta de síntesis total publicada en la literatura química. Ver la referencia completa en la pestaña de respuesta.",

        enunciado: `
            <p class="pc-q-title">Q6 — Síntesis total de la acitretina</p>

            <div class="pc-intro">
                <p>La <strong>acitretina</strong> es un retinoide aromático usado en el tratamiento de la psoriasis grave. Su síntesis parte de una cetona vinílica aromática y avanza mediante una secuencia de reacciones clásicas en química orgánica: acilación de Claisen, protección de un grupo carbonilo como acetal, olefinación de Wittig, condensación de Stobbe, hidrólisis de un éster y descarboxilación térmica.</p>
                <p>A continuación se muestra el esquema de la síntesis. Se indican los reactivos empleados en cada paso, pero <strong>no el tipo de reacción ni la estructura de los productos intermedios</strong> (numerados del 1 al 6): esa es tu tarea. Se te da la estructura del compuesto de partida y la del producto final (acitretina).</p>
            </div>

            <div class="pc-scheme" data-scheme="q6-sintesis-enunciado"></div>

            <div class="pc-part">
                <span class="pc-part-label">(a)</span>
                <div class="pc-part-body"><p>Dibuja la estructura de los compuestos <strong>1</strong> a <strong>6</strong>.</p></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(b)</span>
                <div class="pc-part-body"><p>Para cada paso, indica el <strong>tipo de reacción</strong> que tiene lugar.</p></div>
            </div>

            <div class="pc-part">
                <span class="pc-part-label">(c)</span>
                <div class="pc-part-body"><p>El último paso (piridina, calor) elimina una molécula pequeña. ¿Cuál es, y por qué esta eliminación es termodinámicamente favorable en este sistema conjugado?</p></div>
            </div>
        `,

        respuesta: `
            <p class="pc-q-title">Q6 — Síntesis total de la acitretina <span class="pc-total-chip">Problema de práctica</span></p>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(a) y (b)</span></div>
                <p>Esquema completo de la síntesis, con la estructura de cada intermedio y el tipo de reacción de cada paso:</p>
                <div class="pc-scheme" data-scheme="q6-sintesis-respuesta"></div>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">Resumen de reactivos y reacciones</span></div>
                <table class="pc-table">
                    <thead><tr><th>Paso</th><th>Reactivos</th><th>Tipo de reacción</th></tr></thead>
                    <tbody>
                        <tr><td>1 &rarr; 2</td><td>MeONa, HCO<sub>2</sub>Me</td><td>Acilación de Claisen (formiato)</td></tr>
                        <tr><td>2 &rarr; 3</td><td>MeOH, H<sub>2</sub>SO<sub>4</sub></td><td>Protección del aldehído como acetal dimetílico</td></tr>
                        <tr><td>3 &rarr; 4</td><td>Ph<sub>3</sub>P=CH<sub>2</sub>, KO<sup>t</sup>Bu</td><td>Olefinación de Wittig (metilenación) + isomerización a dieno conjugado</td></tr>
                        <tr><td>4 &rarr; 5</td><td>1. HCO<sub>2</sub>H, H<sub>2</sub>SO<sub>4</sub>; 2. NEt<sub>3</sub></td><td>Hidrólisis del acetal a aldehído (enal) con isomerización del alqueno</td></tr>
                        <tr><td>5 &rarr; 6</td><td>Succinato de metilo, Triton B</td><td>Condensación de Stobbe</td></tr>
                        <tr><td>6 &rarr; 7</td><td>NaOH</td><td>Hidrólisis del éster metílico a ácido carboxílico</td></tr>
                        <tr><td>7 &rarr; acitretina</td><td>Piridina, calor</td><td>Descarboxilación térmica</td></tr>
                    </tbody>
                </table>
                <p class="pc-note">Este resumen se presenta a nivel de tipo de reacción y reactivos, sin detallar el mecanismo completo paso a paso.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">(c)</span></div>
                <p>El calentamiento con piridina provoca la pérdida de <strong>CO&#8322; (dióxido de carbono)</strong> desde el ácido carboxílico no conjugado con el resto de la cadena. La descarboxilación es favorable porque el sistema resultante extiende la conjugación &pi; a lo largo de toda la cadena poliénica hasta el grupo carboxilo final, estabilizando el producto por deslocalización electrónica adicional &mdash; la fuerza motriz termodinámica típica de estas eliminaciones en síntesis de retinoides y carotenoides.</p>
            </div>

            <div class="pc-answer">
                <div class="pc-answer-head"><span class="pc-part-label">Referencia</span></div>
                <p class="pc-note">Andriamialisoa, Z.; Valla, A.; Cartier, D.; Labia, R. <em>Helvetica Chimica Acta</em> <strong>2002</strong>, <em>85</em>, 2926&ndash;2932.</p>
            </div>
        `
    },

    "q7-tiro-plato-2025": {
        titulo: "Tiro al plato: nitrocelulosa",
        numero: "Q7",
        fuente: "57ª Olimpiada Internacional de Química (IChO) · UK Round One 2025",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 57th IChO, UK Round One 2025. Autores originales: H. Alonzi, P. Bolgar, R. Danylyuk, O. Evans, S. Kang, JL Kiappes, A. Leonescu, B. Pilgrim, S. Redman, P. Robotham, A. Taylor, A. Thom. Publicado bajo licencia Creative Commons BY-NC-SA. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph); no son imágenes ni fotografías.",

        enunciado: `
            <p class="pc-q-title">Q7 — Esta pregunta trata sobre el tiro al plato</p>

            <div class="pc-intro">
                <p>El equipo GB tuvo éxito en tiro al plato en los Juegos Olímpicos de 2024: Nathan Hales ganó el oro con un récord olímpico y Amber Rutter la plata, solo tres meses después de ser madre por primera vez.</p>
            </div>
            <p>En los cartuchos de tiro al plato se usan pólvoras de combustión rápida, como la nitrocelulosa. Su velocidad de combustión está diseñada para cargas ligeras, como el plato de 28 g. La nitrocelulosa es un compuesto muy inflamable compuesto principalmente por <strong>trinitrato de celulosa</strong>. Se prepara añadiendo celulosa (fórmula empírica C<sub>6</sub>H<sub>7</sub>(OH)<sub>3</sub>O<sub>2</sub>) a una mezcla de ácido nítrico concentrado y ácido sulfúrico concentrado. Se forma trinitrato de celulosa (fórmula empírica C<sub>6</sub>H<sub>7</sub>(ONO<sub>2</sub>)<sub>3</sub>O<sub>2</sub>) y otro producto.</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[*:11]C1OC(CO)C(O[*:11])C(O)C1O"></span><span class="pc-compound-name">unidad de celulosa<br>C<sub>6</sub>H<sub>7</sub>(OH)<sub>3</sub>O<sub>2</sub></span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[*:11]C1OC(CO[N+](=O)[O-])C(O[*:11])C(O[N+](=O)[O-])C1O[N+](=O)[O-]"></span><span class="pc-compound-name">unidad de trinitrato de celulosa<br>C<sub>6</sub>H<sub>7</sub>(ONO<sub>2</sub>)<sub>3</sub>O<sub>2</sub></span></div></div>
            <p>El ion nitronio, NO<sub>2</sub><sup>+</sup>, generado en la mezcla ácida, nitra los grupos alcohol de la celulosa para formar el grupo éster nítrico, &ndash;ONO<sub>2</sub>.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe una ecuación para la reacción entre la celulosa y el ácido nítrico que forma trinitrato de celulosa.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja el diagrama de puntos y cruces del ion nitronio.</p></div></div></div>
            <p>El ácido nítrico actúa como base de Lewis y acepta un protón del ácido sulfúrico para formar un intermedio, H<sub>2</sub>NO<sub>3</sub><sup>+</sup>. Este intermedio se descompone para formar el ion nitronio.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Escribe la ecuación de formación del intermedio a partir del ácido nítrico y el ácido sulfúrico.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Escribe la ecuación de descomposición del intermedio para formar el ion nitronio.</p></div></div>
            <p>La combustión completa del trinitrato de celulosa produce dióxido de carbono, agua y un elemento gaseoso.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe la ecuación de la combustión completa del trinitrato de celulosa, C<sub>6</sub>H<sub>7</sub>N<sub>3</sub>O<sub>11</sub>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula la entalpía estándar de combustión del trinitrato de celulosa.</p><p class="pc-eq">&Delta;<sub>f</sub>H&deg;(CO) = &minus;110.5 kJ mol<sup>&minus;1</sup>; &Delta;<sub>f</sub>H&deg;(CO<sub>2</sub>) = &minus;393.5 kJ mol<sup>&minus;1</sup>;<br>&Delta;<sub>f</sub>H&deg;(H<sub>2</sub>O) = &minus;285.8 kJ mol<sup>&minus;1</sup>; &Delta;<sub>f</sub>H&deg;(trinitrato de celulosa) = &minus;653.1 kJ mol<sup>&minus;1</sup>.</p></div></div>
            <p>Cuando se dispara, la combustión completa no se produce porque no hay tiempo suficiente para que reaccione con el oxígeno del aire. En su lugar, el trinitrato de celulosa se descompone en productos gaseosos que ayudan a propulsar el disparo. Se libera calor y los productos de esta descomposición pueden superar los 200&nbsp;&deg;C.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Escribe la ecuación del proceso de descomposición. Supón que todos los productos son gaseosos y que no se forma oxígeno en la reacción.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Calcula el volumen total de productos gaseosos producidos en la descomposición de 5.00 g de trinitrato de celulosa a 200&nbsp;&deg;C, en m<sup>3</sup>.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q7 — Esta pregunta trata sobre el tiro al plato <span class="pc-total-chip">Total: 8 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">C<sub>6</sub>H<sub>7</sub>(OH)<sub>3</sub>O<sub>2</sub> + 3 HNO<sub>3</sub> &rarr; C<sub>6</sub>H<sub>7</sub>(ONO<sub>2</sub>)<sub>3</sub>O<sub>2</sub> + 3 H<sub>2</sub>O</p><p class="pc-note">No se exigen símbolos de estado. Se aceptan múltiplos de la ecuación.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><svg viewBox="0 0 250 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de puntos y cruces del ion nitronio NO2+" style="max-width:300px;display:block;margin:8px auto">

</svg><p class="pc-note">Cada enlace N=O comparte 4 electrones (2 cruces del N y 2 puntos del O); cada O conserva 2 pares no enlazantes. Debe indicarse la carga positiva global.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">HNO<sub>3</sub> + H<sub>2</sub>SO<sub>4</sub> &rarr; H<sub>2</sub>NO<sub>3</sub><sup>+</sup> + HSO<sub>4</sub><sup>&minus;</sup></p><p class="pc-note">Se acepta H<sup>+</sup> + HNO<sub>3</sub> &rarr; H<sub>2</sub>NO<sub>3</sub><sup>+</sup>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">H<sub>2</sub>NO<sub>3</sub><sup>+</sup> &rarr; NO<sub>2</sub><sup>+</sup> + H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">C<sub>6</sub>H<sub>7</sub>N<sub>3</sub>O<sub>11</sub> + <sup>9</sup>&frasl;<sub>4</sub> O<sub>2</sub> &rarr; 6 CO<sub>2</sub> + <sup>7</sup>&frasl;<sub>2</sub> H<sub>2</sub>O + <sup>3</sup>&frasl;<sub>2</sub> N<sub>2</sub></p><p class="pc-note">Se aceptan múltiplos de la ecuación.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">&Delta;<sub>c</sub>H&deg; = 6&times;&Delta;<sub>f</sub>H&deg;(CO<sub>2</sub>) + 3.5&times;&Delta;<sub>f</sub>H&deg;(H<sub>2</sub>O) &minus; &Delta;<sub>f</sub>H&deg;(trinitrato)</p><p class="pc-eq">= 6(&minus;393.5) + 3.5(&minus;285.8) &minus; (&minus;653.1) = <strong>&minus;2708.2 kJ mol<sup>&minus;1</sup></strong></p><p class="pc-note">La respuesta debe ser negativa. Se admite arrastre de error desde (d) si los coeficientes estequiométricos están mal, pero no si se proponen productos incorrectos (p. ej. CO).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">C<sub>6</sub>H<sub>7</sub>N<sub>3</sub>O<sub>11</sub> &rarr; <sup>9</sup>&frasl;<sub>2</sub> CO + <sup>7</sup>&frasl;<sub>2</sub> H<sub>2</sub>O + <sup>3</sup>&frasl;<sub>2</sub> N<sub>2</sub> + <sup>3</sup>&frasl;<sub>2</sub> CO<sub>2</sub></p><p class="pc-note">Se aceptan múltiplos de la ecuación.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">M<sub>r</sub>(trinitrato de celulosa) = 297.15 g mol<sup>&minus;1</sup> &nbsp;&rArr;&nbsp; n = 5.00 / 297.15 = 0.01683 mol</p><p class="pc-eq">n(gas) = 11 &times; 0.01683 = 0.1851 mol</p><p class="pc-eq">V = nRT/p = (0.1851 &times; 8.314 &times; 473) / 101325 = <strong>7.18&times;10<sup>&minus;3</sup> m<sup>3</sup></strong></p><p class="pc-note">Sin puntos si la respuesta no está en m<sup>3</sup>. Se admite arrastre de error desde (f) usando n(gas). Se admite 1 bar en lugar de 1 atm.</p></div>
        `

    "q8-brat-2025": {
        titulo: "BrAt: el verano de Paddington",
        numero: "Q8",
        fuente: "57ª Olimpiada Internacional de Química (IChO) · UK Round One 2025",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 57th IChO, UK Round One 2025. Autores originales: H. Alonzi, P. Bolgar, R. Danylyuk, O. Evans, S. Kang, JL Kiappes, A. Leonescu, B. Pilgrim, S. Redman, P. Robotham, A. Taylor, A. Thom. Publicado bajo licencia Creative Commons BY-NC-SA. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph); no son imágenes ni fotografías.",

        enunciado: `
            <p class="pc-q-title">Q8 — Esta pregunta trata sobre BrAt</p>

            <div class="pc-intro">
                <p>Aunque el <em>Brat Summer</em> de Charlie XCX de 2024 ya haya pasado, este verano será el <em>BrAt Bear Summer</em> de Paddington. Igual que el <em>Brat Summer</em>, el compuesto BrAt no dura para siempre: se debe a la desintegración radiactiva del astato. El astato es el elemento natural más escaso de la corteza terrestre, con una masa total estimada de 30 g en cualquier momento.</p>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Estima cuántos átomos de At existen de forma natural en la Tierra en cualquier momento. Supón que todo el astato es el isótopo natural más estable, <sup>219</sup>At.</p></div></div>
            <p>El astato puede obtenerse sintéticamente a partir de bismuto mediante una reacción nuclear. El bismuto se obtiene como subproducto de la purificación del plomo. Durante la purificación se añaden magnesio y calcio a una mezcla de plomo y bismuto. El bismuto forma una aleación <strong>A</strong>, que contiene 7.91&nbsp;% de Ca y 9.60&nbsp;% de Mg en masa. No hay plomo en la aleación <strong>A</strong>.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Determina la fórmula empírica de la aleación <strong>A</strong>.</p></div></div>
            <p>La aleación <strong>A</strong> se separa del plomo y reacciona con cloro gaseoso para formar bismuto y dos compuestos iónicos <strong>B</strong> y <strong>C</strong> en proporción 2:1.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Escribe las fórmulas de los compuestos <strong>B</strong> y <strong>C</strong>.</p></div></div>
            <p>El astato puede obtenerse bombardeando átomos de bismuto con partículas alfa (núcleos de helio-4 de alta energía emitidos por una fuente radiactiva). Cuando una partícula alfa choca con un átomo de bismuto, los núcleos se fusionan y forman un isótopo de astato, <sup>x</sup><sub>y</sub>At, y dos neutrones:</p>
            <p class="pc-eq"><sup>209</sup><sub>83</sub>Bi + &alpha; &rarr; <sup>x</sup><sub>y</sub>At + 2 <sup>1</sup><sub>0</sub>n</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe los números másico y atómico del isótopo de astato, <sup>x</sup><sub>y</sub>At, que se forma.</p></div></div>
            <p>La mayor parte del bismuto no reacciona y debe eliminarse de la mezcla. Al añadir ácido nítrico concentrado, el bismuto restante reacciona formando nitrato de bismuto(III), agua y un gas incoloro de masa molar 30.01 g mol<sup>&minus;1</sup>. El astato puro, At<sub>2</sub>, se aísla por extracción de la mezcla acuosa con un disolvente orgánico.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Escribe una ecuación para la reacción del bismuto con ácido nítrico concentrado.</p></div></div>
            <p>El BrAt puede prepararse a partir de astato en dos pasos. Primero, Br<sub>2</sub> reacciona con <strong>D</strong> para formar únicamente el compuesto <strong>E</strong>. Después, <strong>E</strong> reacciona con At<sub>2</sub> para dar BrAt y <strong>D</strong>. El espectro de masas de <strong>E</strong> muestra dos picos principales de intensidad casi igual en valores de m/z de 205.82 y 207.82.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Escribe las fórmulas de <strong>D</strong> y <strong>E</strong>.</p></div></div>
            <p>Como el astato sufre desintegración radiactiva, las muestras de BrAt no duran mucho. Se sintetizarán 3.60 g de BrAt al comienzo de este verano. El periodo de semidesintegración de este isótopo de At es de 433 minutos. Supón que el <em>BrAt Bear Summer</em> de Paddington termina cuando solo quedan 3.65 mg de BrAt.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>¿Cuánto durará el <em>BrAt Bear Summer</em> de Paddington? Da la respuesta con la hora más próxima.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q8 — Esta pregunta trata sobre BrAt <span class="pc-total-chip">Total: 9 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">N&ordm; de átomos = (m / M) &middot; N<sub>A</sub> = (30 g / 219 g mol<sup>&minus;1</sup>) &times; 6.022&times;10<sup>23</sup> mol<sup>&minus;1</sup> = <strong>8&times;10<sup>22</sup></strong> átomos</p><p class="pc-note">Una cifra significativa es suficiente por el error de la masa estimada. No hace falta escribir «átomos» (no es una unidad oficial).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">Bi: 100 &minus; 7.91 &minus; 9.60 = 82.49 %</p><p class="pc-eq">n(Ca) = 7.91/40.08 = 0.197; n(Mg) = 9.60/24.31 = 0.395; n(Bi) = 82.49/209.0 = 0.395</p><p class="pc-eq">Proporción Ca : Mg : Bi = 1 : 2 : 2 &rArr; <strong>CaMg<sub>2</sub>Bi<sub>2</sub></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq"><strong>B</strong>: MgCl<sub>2</sub> &nbsp;&nbsp;&nbsp; <strong>C</strong>: CaCl<sub>2</sub></p><p class="pc-eq">CaMg<sub>2</sub>Bi<sub>2</sub> + 5 Cl<sub>2</sub> &rarr; 2 Bi + 2 MgCl<sub>2</sub> + CaCl<sub>2</sub> &nbsp;<span class="pc-eq-label">(dos de B por cada una de C)</span></p><p class="pc-note">Ambos deben ser correctos. Sin crédito si están intercambiados.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">x = <strong>211</strong> &nbsp;&nbsp; y = <strong>85</strong></p><p class="pc-eq"><sup>209</sup><sub>83</sub>Bi + <sup>4</sup><sub>2</sub>&alpha; &rarr; <sup>211</sup><sub>85</sub>At + 2 <sup>1</sup><sub>0</sub>n</p><p class="pc-note">Ambos deben ser correctos y en el orden correcto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq">Bi + 4 HNO<sub>3</sub> &rarr; Bi(NO<sub>3</sub>)<sub>3</sub> + 2 H<sub>2</sub>O + NO</p><p>El gas incoloro de M = 30.01 g mol<sup>&minus;1</sup> es NO.</p><p class="pc-note">No se exigen símbolos de estado. Se aceptan múltiplos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq"><strong>D</strong>: I<sub>2</sub> &nbsp;&nbsp;&nbsp; <strong>E</strong>: BrI (IBr)</p><p class="pc-eq">Br<sub>2</sub> + I<sub>2</sub> &rarr; 2 IBr &nbsp;&nbsp;&nbsp; IBr + At<sub>2</sub> &rarr; BrAt + ...</p><p>M(<sup>79</sup>Br<sup>127</sup>I) = 205.8 y M(<sup>81</sup>Br<sup>127</sup>I) = 207.8: los dos isótopos del Br (casi 1:1) explican los dos picos.</p><p class="pc-note">1 punto por D y 1 punto por E. No hay arrastre de error para E si D es incorrecto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq">z = n&ordm; de semividas: m<sub>t</sub> = m<sub>0</sub>(&frac12;)<sup>z</sup> &rArr; z = log<sub>1/2</sub>(m<sub>t</sub>/m<sub>0</sub>) = log<sub>1/2</sub>(3.65&times;10<sup>&minus;3</sup> / 3.60) = 9.95</p><p class="pc-eq">t = t<sub>1/2</sub> &times; z = (433 min / 60) &times; 9.95 = <strong>72 horas</strong></p><p class="pc-note">Un punto por plantear que son ~10 semividas (o la expresión algebraica equivalente). Si la respuesta es correcta pero no está en horas, un punto de dos.</p></div>
        `
    },

    "q9-epoxidos-2025": {
        titulo: "Epóxidos y resinas epoxi",
        numero: "Q9",

        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 57th IChO, UK Round One 2025. Autores originales: H. Alonzi, P. Bolgar, R. Danylyuk, O. Evans, S. Kang, JL Kiappes, A. Leonescu, B. Pilgrim, S. Redman, P. Robotham, A. Taylor, A. Thom. Publicado bajo licencia Creative Commons BY-NC-SA. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph); no son imágenes ni fotografías.",

        enunciado: `
            <p class="pc-q-title">Q9 — Esta pregunta trata sobre los epóxidos</p>

            <div class="pc-intro">
                <p>El epoxi es una familia de plásticos extremadamente duraderos y resistentes químicamente, con aplicaciones como adhesivos de alta resistencia, fibra de carbono y mobiliario decorativo. El plástico epoxi se sintetiza a partir de moléculas de <strong>epóxido</strong>: un anillo de tres miembros con dos átomos de carbono y uno de oxígeno. Los epóxidos son muy reactivos por la tensión del anillo de tres miembros.</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C1CO1"></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C[C@H]1CO1"></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C[C@@H]1[C@@H](C)O1"></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CCCC[C@H]1CO1"></span></div></div><p class="pc-note">Ejemplos de epóxidos.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Indica la fórmula general de un epóxido que contiene n átomos de carbono.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>En el cuadernillo, marca el ángulo C&ndash;C&ndash;O aproximado para las moléculas siguientes.</p><table class="pc-table"><thead><tr><th></th><th>60°</th><th>90°</th><th>104.5°</th><th>107°</th><th>109.5°</th><th>120°</th><th>180°</th></tr></thead><tbody><tr><td>C<sub>2</sub>H<sub>5</sub>OC<sub>2</sub>H<sub>5</sub></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C1CO1"></span></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div></div>
            <p>Un método habitual de formar epóxidos es la reacción de alquenos con peroxiácidos orgánicos. El mecanismo de esta reacción se muestra con el estado de transición entre corchetes (la reacción es concertada):</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=50 gapy=14

            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja la estructura del compuesto <strong>A</strong>.</p></div></div>
            <p>Estos peroxiácidos pueden añadir el átomo de oxígeno a la cara superior o inferior del doble enlace, según se aproximen desde arriba o desde abajo. Esto puede dar lugar a estereoisómeros.</p>
            <div class="pc-free-host" data-esquema="size=sm

            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Dibuja las estructuras de los dos estereoisómeros que se forman cuando el propeno reacciona con un peroxiácido.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>En el cuadernillo, marca el número de isómeros de epóxido que se formarían en la reacción de cada uno de los isómeros C<sub>4</sub>H<sub>8</sub>.</p><table class="pc-table"><thead><tr><th>Isómero C<sub>4</sub>H<sub>8</sub></th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="C=CCC"></span></td><td></td><td></td><td></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C/C=C\\C"></span></td><td></td><td></td><td></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C/C=C/C"></span></td><td></td><td></td><td></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC(C)=C"></span></td><td></td><td></td><td></td><td></td></tr></tbody></table></div></div>
            <p>Cuando los epóxidos reaccionan con nucleófilos, su anillo de tres miembros se abre, como en el esquema general:</p>
            <div class="pc-free-host" data-esquema="size=sm gapx=130

            <p>Algunos ejemplos concretos con el epóxido más sencillo:</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.85 gapx=120 gapy=100

            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Dibuja las estructuras de los compuestos <strong>B</strong>, <strong>C</strong> y <strong>D</strong>.</p></div></div>
            <p>Un epóxido especialmente útil es la <strong>epiclorhidrina</strong> (C<sub>3</sub>H<sub>5</sub>OCl). El fenóxido de sodio reacciona con la epiclorhidrina para formar el anión intermedio <strong>E<sup>&minus;</sup></strong>, que después cicla y forma el producto <strong>F</strong>.</p>

            <p>Para fabricar plástico epoxi, una <strong>resina epoxi</strong> (que contiene el epóxido) se mezcla con un <strong>endurecedor</strong> (que contiene el nucleófilo). Un ingrediente habitual de las resinas epoxi es el <u>b</u>is<u>f</u>enol <u>A</u> <u>d</u>i<u>g</u>licidil <u>é</u>ter, conocido como <strong>BADGE</strong>. Se puede sintetizar a partir de benceno:</p>

            <p>El BADGE reacciona con un endurecedor para formar el epoxi. Se muestran las unidades repetitivas de algunos epoxis; la estructura del BADGE se ha simplificado con un bloque (BPA):</p>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq"><strong>C<sub>n</sub>H<sub>2n</sub>O</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">2 puntos</span></div><table class="pc-table"><thead><tr><th></th><th>60°</th><th>90°</th><th>104.5°</th><th>107°</th><th>109.5°</th><th>120°</th><th>180°</th></tr></thead><tbody><tr><td>C<sub>2</sub>H<sub>5</sub>OC<sub>2</sub>H<sub>5</sub></td><td></td><td></td><td></td><td></td><td>✓</td><td></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C1CO1"></span></td><td>✓</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table><p>El éter dietílico es un O con hibridación sp<sup>3</sup> (&asymp;109.5&deg;); en el epóxido el triángulo equilátero fuerza ángulos de 60&deg;.</p><p class="pc-note">1 punto cada fila.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C[C@H]1CO1"></span><span class="pc-compound-name">estereoisómero 1<br>(<i>R</i>)-óxido de propileno</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C[C@@H]1CO1"></span><span class="pc-compound-name">estereoisómero 2<br>(<i>S</i>)-óxido de propileno</span></div></div><p class="pc-note">1 punto por cada estereoisómero (enantiómeros). Las dos caras de ataque dan los dos enantiómeros. Si se dibujan tres estructuras, 1 punto si contienen los dos correctos; con cuatro o más, 0.</p></div>

ep -&gt; c | NH3 (1 equiv.) | | ruta=vh
ep -&gt; d | NH3 (⅓ equiv.) | | ruta=vh"></div><p>El nucleófilo ataca un carbono del epóxido y abre el anillo. Con NH<sub>3</sub> en defecto (&frac13; equiv.) cada N reacciona tres veces y se obtiene la trietanolamina <strong>D</strong>.</p><p class="pc-note">1 punto por cada compuesto.</p></div>
