<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">11 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OCC1CC2CCC1C=C2"></span><span class="pc-compound-name">A</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CS(=O)(=O)OCC1CC2CCC1C=C2"></span><span class="pc-compound-name">B</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="N#CCC1CC2CCC1C=C2"></span><span class="pc-compound-name">C</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC(=O)CC1CC2CCC1C=C2"></span><span class="pc-compound-name">D</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="O=C1CC2CC3CCC2C(O1)C3I"></span><span class="pc-compound-name">E</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OCCC1CC2CCC1C(O)C2"></span><span class="pc-compound-name">F</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CS(=O)(=O)OCCC1CC2CCC1C(O)C2"></span><span class="pc-compound-name">G</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CS(=O)(=O)OCCC1CC2CCC1C(=O)C2"></span><span class="pc-compound-name">H</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CS(=O)(=O)OCCC1CC2CCC1C([O-])=C2"></span><span class="pc-compound-name">J<sup>−</sup></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="O=C1C2CCC3CC2CCC13"></span><span class="pc-compound-name">K</span></div></div><p>Pasos: LiAlH<sub>4</sub> reduce el éster al alcohol <strong>A</strong>; el mesilato <strong>B</strong> se sustituye con cianuro (<strong>C</strong>) y se hidroliza al ácido <strong>D</strong>; el I<sub>2</sub> forma un catión yodonio que el ácido atrapa para dar la yodolactona <strong>E</strong>; H<sub>2</sub>/Pt elimina el yodo, y LiAlH<sub>4</sub> abre la lactona al diol <strong>F</strong>; se mesila el OH primario (<strong>G</strong>) y el secundario se oxida a cetona (<strong>H</strong>); la base da el enolato <strong>J</strong><sup>−</sup>, que desplaza al mesilato intramolecularmente y cierra el último anillo (<strong>K</strong>, cetona del twistano). La reducción de Wolff–Kishner (H<sub>2</sub>N–NH<sub>2</sub>, KOH) elimina el C=O y da el twistano.</p><p class="pc-note">A, B, C, D, E, F, G, H: 1 punto cada uno (8 puntos); J<sup>−</sup> (basta una forma resonante): 2 puntos; K: 1 punto. Total del apartado: 11 puntos. Hay ECF para B, C, G, H y J<sup>−</sup>.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>Dos o más</strong> (tres ejes C<sub>2</sub>: grupo de simetría D<sub>2</sub>)</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>No</strong>: es quiral, no es superponible con su imagen especular.</p></div>

        enunciado: `
            <p class="pc-q-title">Q55 — Esta pregunta trata sobre las superbases</p>

            <div class="pc-intro"><p>El ion hidróxido es la base más fuerte posible en disolución acuosa, pero en disolventes orgánicos es posible tener bases más fuertes. Durante muchos años la base más fuerte conocida fue el anión metilo, pero en 2008 un equipo de científicos sintetizó el anión monóxido de litio, que resultó ser una base aún más fuerte. En 2016 se batieron de nuevo los récords: unos investigadores australianos anunciaron la formación de un dianión orgánico en fase gaseosa (DEB<sup>2−</sup>) con la mayor afinidad protónica jamás registrada, es decir, la base más fuerte.</p></div>
            <p>La fuerza de una base puede definirse por su afinidad protónica. La afinidad protónica de una especie X<sup>−</sup>, AP(X<sup>−</sup>), viene dada por la variación de entalpía estándar de la reacción:</p>
            <p class="pc-eq pc-math">HX &rarr; H<sup>+</sup> + X<sup>−</sup></p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Usando los datos de la tabla, calcula la afinidad protónica del anión metilo, AP(CH<sub>3</sub><sup>−</sup>), en kJ mol<sup>−1</sup>.</p><table class="pc-table"><thead><tr><th>Reacción</th><th>Proceso</th><th>Δ<em>H</em></th></tr></thead><tbody><tr><td>1</td><td>CH<sub>4</sub> → H• + CH<sub>3</sub>•</td><td>439 kJ mol<sup>−1</sup></td></tr><tr><td>2</td><td>H• → H<sup>+</sup> + e<sup>−</sup></td><td>2.18 × 10<sup>−18</sup> J</td></tr><tr><td>3</td><td>CH<sub>3</sub>• + e<sup>−</sup> → CH<sub>3</sub><sup>−</sup></td><td>−7.52 kJ mol<sup>−1</sup></td></tr></tbody></table></div></div>
            <p>Con una afinidad protónica de 1778 kJ mol<sup>−1</sup>, se comprobó que el anión monóxido de litio era una base más fuerte que el anión metilo. El anión monóxido de litio se forma en un espectrómetro de masas cuando un anión oxalato de litio, LiC<sub>2</sub>O<sub>4</sub><sup>−</sup>, pierde primero una molécula neutra P de masa 44 y después otra molécula neutra Q de masa 28.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Dibuja la estructura del anión oxalato (C<sub>2</sub>O<sub>4</sub><sup>2−</sup>) y da las fórmulas de P y Q.</p></div></div>
            <p>El dianión orgánico en fase gaseosa (DEB<sup>2−</sup>) tiene la mayor afinidad protónica jamás registrada, 1843 kJ mol<sup>−1</sup>. Este dianión se produce a partir del compuesto <strong>A</strong>, que pertenece a una familia de bencenos disustituidos, C<sub>6</sub>H<sub>4</sub>R<sub>2</sub>, en los que ambos sustituyentes R son iguales. El compuesto <strong>A</strong> tiene fórmula molecular C<sub>12</sub>H<sub>6</sub>O<sub>4</sub> y produce efervescencia al añadir hidrogenocarbonato de sodio.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Sugiere el grupo funcional presente en R responsable de la efervescencia y deduce con ello una estructura para R.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Dibuja todos los posibles bencenos disustituidos C<sub>6</sub>H<sub>4</sub>R<sub>2</sub> e indica el número de señales que esperarías en el RMN de <sup>13</sup>C de cada uno.</p></div></div>
            <p>El DEB<sup>2−</sup> se observó en el espectro de masas de iones negativos del compuesto <strong>A</strong>. Se forma a través de las especies B<sup>2−</sup> y C<sup>2−</sup>. El compuesto <strong>A</strong> tiene 6 señales en su espectro de RMN de <sup>13</sup>C.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Determina las estructuras de los intermedios B<sup>2−</sup> y C<sup>2−</sup> y del DEB<sup>2−</sup>.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q55 — Esta pregunta trata sobre las superbases <span class="pc-total-chip">Total: 12 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">Δ<sub>r</sub><em>H</em>(reacción 2) = 2.18 × 10<sup>−18</sup> J × 6.02 × 10<sup>23</sup> mol<sup>−1</sup> × 10<sup>−3</sup> kJ J<sup>−1</sup> = 1312 kJ mol<sup>−1</sup></p><p class="pc-eq pc-math">AP(CH<sub>3</sub><sup>−</sup>) = 439 + (−7.52) + 1312 = <strong>1743 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Un punto por convertir la reacción 2 a kJ mol<sup>−1</sup>; respuesta correcta con unidades, 2 puntos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">3 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[O-]C(=O)C(=O)[O-]"></span><span class="pc-compound-name">anión oxalato</span></div></div><p class="pc-eq pc-math">P = <strong>CO<sub>2</sub></strong> &nbsp;&nbsp; Q = <strong>CO</strong></p><p class="pc-note">Un punto por el oxalato (vale deslocalizado), uno por P y uno por Q.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Grupo funcional: <strong>ácido carboxílico</strong></p><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OC(=O)C#C"></span><span class="pc-compound-name">R = –C≡C–COOH</span></div></div><p class="pc-note">Medio punto por el grupo y medio por R.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">3 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OC(=O)C#Cc1ccccc1C#CC(=O)O"></span><span class="pc-compound-name"><em>orto</em>: 6 señales</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OC(=O)C#Cc1cccc(c1)C#CC(=O)O"></span><span class="pc-compound-name"><em>meta</em>: 7 señales</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OC(=O)C#Cc1ccc(cc1)C#CC(=O)O"></span><span class="pc-compound-name"><em>para</em>: 5 señales</span></div></div><p class="pc-note">Un punto por las tres estructuras y dos por los tres números de señales (todos correctos 2; dos correctos 1; uno ½).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">3 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[O-]C(=O)C#Cc1ccccc1C#CC(=O)[O-]"></span><span class="pc-compound-name">B<sup>2−</sup></span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[O-]C(=O)C#Cc1ccccc1C#[C-]"></span><span class="pc-compound-name">C<sup>2−</sup></span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[C-]#Cc1ccccc1C#[C-]"></span><span class="pc-compound-name">DEB<sup>2−</sup></span></div></div><p>El isómero de A es el <em>orto</em> (6 señales). B<sup>2−</sup> es el dicarboxilato; pierde CO<sub>2</sub> (44) para dar C<sup>2−</sup> y de nuevo CO<sub>2</sub> para dar DEB<sup>2−</sup>.</p><p class="pc-note">Un punto por estructura. Si se dibuja otro isómero del benceno, no hay puntos para B<sup>2−</sup>, pero puede haber ECF para C<sup>2−</sup> y DEB<sup>2−</sup>.</p></div>
