            <p class="pc-q-title">Q37 — Esta pregunta trata sobre la crema solar <span class="pc-total-chip">Total: 17 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; éster</td><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; aldehído</td><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; cetona</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; ácido carboxílico</td><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; éter</td><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; fenol</td></tr></tbody></table><p class="pc-note">Deben estar todas correctas (cetona, éter y fenol).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><div class="pc-free-host" data-esquema="size=md escala=1.1
ox @0,0: COc1ccc(C(=O)c2ccccc2)c(O)c1 | oxibenzona | resaltar=7,15 | resalte=rojo"></div><p>Los átomos implicados son el <strong>H del grupo OH</strong> (fenol) y el <strong>O del carbonilo</strong> (C=O): forman un anillo quelato de seis miembros.</p><p class="pc-note">Solo deben rodearse estos dos átomos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">4 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OC(=O)c1ccccc1"></span><span class="pc-compound-name">A: ácido benzoico</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="ClC(=O)c1ccccc1"></span><span class="pc-compound-name">B: cloruro de benzoílo</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Oc1cccc(O)c1"></span><span class="pc-compound-name">C: resorcinol (benceno-1,3-diol)</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="COc1cccc(O)c1"></span><span class="pc-compound-name">D: 3-metoxifenol</span></div></div><p>La acilación de Friedel–Crafts de D con el cloruro de ácido B (AlCl<sub>3</sub>) da la oxibenzona.</p><p class="pc-note">Un punto por cada estructura; no hay error arrastrado porque se puede razonar hacia delante y hacia atrás.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="COc1ccc(/C=C/C(=O)OC[C@H](CC)CCCC)cc1"></span><span class="pc-compound-name">enantiómero (R)</span></div></div><p class="pc-note">El doble enlace debe ser inequívocamente <em>trans</em> y el centro quiral debe estar dibujado como configuración <strong>R</strong> (el mostrado en el enunciado es el S). Se admiten abreviaturas si los grupos están bien definidos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(ii)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="COc1ccc(/C=C\\C(=O)OC[C@@H](CC)CCCC)cc1"></span><span class="pc-compound-name">(Z), centro S</span></div><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="COc1ccc(/C=C\\C(=O)OC[C@H](CC)CCCC)cc1"></span><span class="pc-compound-name">(Z), centro R</span></div></div><p class="pc-note">El doble enlace debe ser inequívocamente <em>cis</em> (sin punto si es <em>trans</em>); el centro quiral puede ser S o R, pero debe estar dibujado sin ambigüedad. Cualquiera de las dos vale.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CCCC=O"></span><span class="pc-compound-name">E: butanal</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CCCC=C(CC)C=O"></span><span class="pc-compound-name">F: 2-etilhex-2-enal</span></div></div><p>E (C<sub>4</sub>H<sub>8</sub>O) es un aldehído: IR 1730 cm<sup>−1</sup> (C=O) y RMN de <sup>1</sup>H con 9.7 ppm (1H, triplete, CHO). F, producto de la condensación aldólica con pérdida de H<sub>2</sub>O (C<sub>8</sub>H<sub>14</sub>O), conserva C=O conjugado (1687 cm<sup>−1</sup>) y C=C (1628 cm<sup>−1</sup>).</p><p class="pc-note">Un punto cada una; sin error arrastrado. Se acepta el isómero <em>cis</em> o <em>trans</em> de F, o sin estereoquímica definida.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CCCCC(CC)CO"></span><span class="pc-compound-name">G: 2-etilhexan-1-ol</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CCCCC(CC)COC(C)=O"></span><span class="pc-compound-name">H: etanoato de 2-etilhexilo</span></div></div><p>La hidrogenación con H<sub>2</sub>/Pd reduce tanto el C=C como el C=O de F a un alcohol saturado (G). La transesterificación con etanoato de metilo y NaOCH<sub>3</sub> da el éster H, cuyo CH<sub>3</sub> reacciona después con 4-metoxibenzaldehído en una condensación para dar el octinoxato.</p><p class="pc-note">Un punto cada una, sin estereoquímica. Se da error arrastrado a G solo si no tiene alquenos ni carbonilos y es coherente con F reducido o con H (el alcohol que forma el éster).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; La misma fórmula molecular</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; Los mismos puntos de fusión</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; Giran el plano de la luz polarizada en el mismo sentido</td></tr></tbody></table><p class="pc-note">Son isómeros (dímeros del mismo monómero) pero tienen propiedades físicas diferentes. Si se marca cualquier otra respuesta, no hay punto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(i)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 160 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclobutano con Ar y R" style="width:150px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><rect x="60" y="45" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"/><polygon points="60.0,45.0 34.7,17.0 29.3,23.0" fill="currentColor"/><text x="26" y="18" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,45.0 130.7,23.0 125.3,17.0" fill="currentColor"/><text x="134" y="18" text-anchor="start" font-size="15">R</text><polygon points="60.0,85.0 29.3,107.0 34.7,113.0" fill="currentColor"/><text x="26" y="122" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,85.0 125.3,113.0 130.7,107.0" fill="currentColor"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg><span class="pc-compound-name">Cuatro</span><table class="pc-table" style="width:auto"><thead><tr><th colspan="2">¿Tiene enantiómero?</th></tr></thead><tbody><tr><td>Sí</td><td><strong>No &#10003;</strong></td></tr></tbody></table></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 160 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclobutano con Ar y R" style="width:150px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><rect x="60" y="45" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"/><polygon points="60.0,45.0 34.7,17.0 29.3,23.0" fill="currentColor"/><text x="26" y="18" text-anchor="end" font-size="15">Ar</text><path d="M103.3,40.7L104.7,42.2M107.0,36.7L109.0,39.0M110.7,32.8L113.3,35.8M114.3,28.8L117.7,32.6M118.0,24.9L122.0,29.4M121.7,21.0L126.3,26.2" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="134" y="18" text-anchor="start" font-si end" font-size="15">Ar</text><polygon points="100.0,45.0 130.7,23.0 125.3,17.0" fill="currentColor"/><text x="134" y="18" text-anchor="start" font-size="15">R</text><path d="M56.7,89.3L55.3,87.8M53.0,93.3L51.0,91.0M49.3,97.2L46.7,94.2M45.7,101.2L42.3,97.4M42.0,105.1L38.0,100.6M38.3,109.0L33.7,103.8" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="26" y="122" text-anchor="end" font-size="15">Ar</text><path d="M104.7,87.8L103.3,89.3M109.0,91.0L107.0,93.3M113.3,94.2L110.7,97.2M117.7,97.4L114.3,101.2M122.0,100.6L118.0,105.1M126.3,103.8L121.7,109.0" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg><span class="pc-compound-name">Dos (b)</span><table class="pc-table" style="width:auto"><thead><tr><th colspan="2">¿Tiene enantiómero?</th></tr></thead><tbody><tr><td><strong>Sí &#10003;</strong></td><td>No</td></tr></tbody></table></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 160 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclobutano con Ar y R" style="width:150px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><rect x="60" y="45" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"/><polygon points="60.0,45.0 34.7,17.0 29.3,23.0" fill="currentColor"/><text x="26" y="18" text-anchor="end" font-size="15">Ar</text><path d="M103.3,40.7L104.7,42.2M107.0,36.7L109.0,39.0M110.7,32.8L113.3,35.8M114.3,28.8L117.7,32.6M118.0,24.9L122.0,29.4M121.7,21.0L126.3,26.2" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="134" y="18" text-anchor="start" font-size="15">R</text><path d="M56.7,89.3L55.3,87.8M53.0,93.3L51.0,91.0M49.3,97.2L46.7,94.2M45.7,101.2L42.3,97.4M42.0,105.1L38.0,100.6M38.3,109.0L33.7,103.8" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="26" y="122" text-anchor="end" font-size="15">Ar</text><polygon points="100.0,85.0 125.3,113.0 130.7,107.0" fill="currentColor"/><text x="134" y="122" text-anchor="start" font-size="15">R</text></svg><span class="pc-compound-name">Dos (c)</span><table class="pc-table" style="width:auto"><thead><tr><th colspan="2">¿Tiene enantiómero?</th></tr></thead><tbody><tr><td><strong>Sí &#10003;</strong></td><td>No</td></tr></tbody></table></div></div><p>Hay seis formas de elegir qué dos sustituyentes quedan en la misma cara, pero girar la molécula (cuña ↔ guion) las reduce a tres estructuras distintas. Solo la que tiene los dos Ar en una cara y los dos R en la otra posee plano de simetría y no tiene enantiómero.</p><p class="pc-note">Dos puntos por las estructuras (tres correctas con una casilla vacía valen dos; dos correctas, uno; tres correctas y una incorrecta o repetida, uno) y un punto por indicar bien «Sí/No» en todas las dibujadas.</p></div>

        enunciado: `
            <p class="pc-q-title">Q38 — Esta pregunta trata sobre los óxidos de silicio</p>

            <div class="pc-intro">
                <p>Los minerales formados por óxidos de silicio constituyen el 90 % de la corteza terrestre. El óxido de silicio puro más común es el dióxido de silicio. Se puede usar para fabricar gel de sílice, cuyos sobres se emplean para mantener los objetos libres de humedad.</p>
            </div>
            <p>Para fabricar gel de sílice, el dióxido de silicio sólido debe hacerse reaccionar en proporción 1 : 2 con carbonato de sodio a 1500 °C. Esta reacción forma la sal <strong>X</strong> y el gas incoloro <strong>Y</strong>. El anión de la sal <strong>X</strong> contiene solo silicio y oxígeno y tiene una estructura tetraédrica.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>¿Cuál es la fórmula del gas <strong>Y</strong>?</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja la estructura del anión de <strong>X</strong>, indicando con claridad su carga global.</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Escribe la ecuación de la reacción de formación de <strong>X</strong>.</p></div></div></div>
            <p>La reacción de <strong>X</strong> o de CaSiO<sub>3</sub> con ácidos diluidos forma un precipitado gelatinoso de SiO<sub>2</sub>·<em>x</em>H<sub>2</sub>O. Este precipitado se lava, se seca, se granula y se pone en sobres.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Escribe la ecuación de la reacción del CaSiO<sub>3</sub> con ácido clorhídrico diluido para formar SiO<sub>2</sub>·11H<sub>2</sub>O.</p></div></div>
            <p>Los silicatos son aniones que contienen solo silicio y oxígeno y solo enlaces sencillos Si–O. Su estructura puede describirse uniendo tetraedros de sílice. El ion pirosilicato [Si<sub>2</sub>O<sub>7</sub>]<sup>6−</sup>, que se encuentra en la åkermanita (Ca<sub>2</sub>Mg[Si<sub>2</sub>O<sub>7</sub>]), tiene la estructura mostrada a continuación.</p>
            <figure class="pc-figure"><img src="https://i.imgur.com/ohAOWDn.png" alt="Estructura del ion pirosilicato [Si2O7]6−: dos tetraedros de sílice unidos por un vértice" loading="lazy" style="max-width:420px;width:100%"></figure>
            <div class="pc-figrow"><div class="pc-figtext"><p>A la derecha se muestra parte de la estructura del cuarzo. Ten en cuenta que no se muestran todos los enlaces en todos los átomos.</p></div><div class="pc-figside"><img src="https://i.imgur.com/KxDDPXu.png" alt="Parte de la estructura del cuarzo: tetraedros de sílice unidos por los vértices" loading="lazy" style="max-width:320px;width:100%;border-radius:10px"></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>En el cuarzo, ¿a cuántos otros tetraedros está unido cada tetraedro de sílice?</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Dibuja la estructura del anión silicato de los siguientes compuestos. No se requiere la forma 3D.</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>El ion [Si<sub>3</sub>O<sub>9</sub>]<sup>6−</sup> que se encuentra en la benitoíta, BaTi[Si<sub>3</sub>O<sub>9</sub>], un mineral azul extremadamente raro.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>El mineral berilo, Be<sub>3</sub>Al<sub>2</sub>[Si<sub>6</sub>O<sub>18</sub>]. (Indica con claridad la carga global.)</p></div></div></div>
            <p>El talco (Mg<sub>3</sub>Si<sub>4</sub>H<sub>2</sub>O<sub>12</sub>) es un mineral que contiene iones hidróxido además de silicatos. Los iones hidróxido no interaccionan con el silicato, sino que se coordinan a los cationes magnesio. La red de silicato es esencialmente una lámina 2D que se usa como lubricante sólido.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>¿Cuál es la fórmula y la carga del anión silicato del talco?</p></div></div>
            <p>Otro mineral silicato hidratado, el crisotilo (Mg<sub>3</sub>Si<sub>2</sub>H<sub>4</sub>O<sub>9</sub>), forma fibras aciculares y es una forma de amianto. El talco suele encontrarse contaminado con crisotilo. Se analizó una muestra de mineral y se encontró que contenía 20.32 % de Mg y 28.18 % de Si en masa.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Suponiendo que la muestra contenía solo talco y crisotilo, determina el porcentaje molar de cada uno que contenía.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q38 — Esta pregunta trata sobre los óxidos de silicio <span class="pc-total-chip">Total: 12 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CO<sub>2</sub></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anión ortosilicato SiO4 4−, tetraédrico" style="width:190px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="100" y1="70" x2="100" y2="22" stroke="currentColor" stroke-width="1.6"/><line x1="100" y1="70" x2="56" y2="102" stroke="currentColor" stroke-width="1.6"/><polygon points="100.0,70.0 150.2,96.1 153.8,87.9" fill="currentColor"/><path d="M106.0,64.6L107.1,66.2M112.3,59.6L114.0,62.1M118.6,54.6L120.9,57.9M124.9,49.7L127.7,53.8M131.1,44.7L134.6,49.6M137.4,39.7L141.4,45.4" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="100" y="80" text-anchor="middle" font-size="17" font-weight="600" fill="#fff" stroke="#fff" stroke-width="5" paint-order="stroke">Si</text><text x="100" y="82" text-anchor="middle" font-size="17" font-weight="600">Si</text><text x="100" y="15" text-anchor="middle" font-size="15">O<tspan dy="-6" font-size="11">−</tspan></text><text x="50" y="114" text-anchor="end" font-size="15">O<tspan dy="-6" font-size="11">−</tspan></text><text x="158" y="100" text-anchor="start" font-size="15">O<tspan dy="-6" font-size="11">−</tspan></text><text x="152" y="34" text-anchor="start" font-size="15">O<tspan dy="-6" font-size="11">−</tspan></text></svg><span class="pc-compound-name">SiO<sub>4</sub><sup>4−</sup> (tetraédrico)</span></div></div><p>Se debe indicar la carga total 4− (o cuatro cargas 1−). X = Na<sub>4</sub>SiO<sub>4</sub>, aunque no hace falta para el punto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">SiO<sub>2</sub> + 2 Na<sub>2</sub>CO<sub>3</sub> &rarr; Na<sub>4</sub>SiO<sub>4</sub> + 2 CO<sub>2</sub></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CaSiO<sub>3</sub> + 2 HCl + 10 H<sub>2</sub>O &rarr; SiO<sub>2</sub>·11H<sub>2</sub>O + CaCl<sub>2</sub></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p><strong>4</strong></p><p>Cada Si está rodeado por cuatro O, y cada uno de ellos es puente con otro Si: cada tetraedro comparte sus cuatro vértices con otros cuatro tetraedros (SiO<sub>2</sub>).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="[O-][Si]1([O-])O[Si]([O-])([O-])O[Si]([O-])([O-])O1"></span><span class="pc-compound-name">[Si₃O₉]⁶− (anillo de 3 tetraedros)</span></div></div><p>Debe indicarse la carga global 6− (o seis cargas 1−, una por cada O terminal). Se acepta cualquier estructura con la fórmula y carga correctas que tenga solo enlaces sencillos Si–O (sin Si=O, Si–Si ni O–O).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(ii)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="[O-][Si]1([O-])O[Si]([O-])([O-])O[Si]([O-])([O-])O[Si]([O-])([O-])O[Si]([O-])([O-])O[Si]([O-])([O-])O1"></span><span class="pc-compound-name">[Si₆O₁₈]¹²− (anillo de 6 tetraedros)</span></div></div><p>Carga global 12− (una carga 1− por cada uno de los doce O terminales). Cada Si comparte dos O puente con sus vecinos y tiene dos O<sup>−</sup> terminales.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">[Si<sub>4</sub>O<sub>10</sub>]<sup>4−</sup></p><p>De Mg<sub>3</sub>Si<sub>4</sub>H<sub>2</sub>O<sub>12</sub> se quitan 3 Mg<sup>2+</sup> y 2 OH<sup>−</sup> (que aportan 6+ y 2−): queda Si<sub>4</sub>O<sub>10</sub> con carga 4−. Debe indicarse la carga.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>n</em>(Mg) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">20.32 g</span><span class="pc-eq-frac-den">24.305 g mol<sup>−1</sup></span></span> = 0.836 mol &nbsp;&nbsp; <em>n</em>(Si) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">28.18 g</span><span class="pc-eq-frac-den">28.09 g mol<sup>−1</sup></span></span> = 1.003 mol</p><p class="pc-eq pc-math">talco: Mg : Si = 3 : 4 &nbsp;&nbsp; crisotilo: Mg : Si = 3 : 2</p><p class="pc-eq pc-math"><em>x</em> talco + (1 − <em>x</em>) crisotilo &rArr; <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>n</em>(Si)</span><span class="pc-eq-frac-den"><em>n</em>(Mg)</span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">4<em>x</em> + 2(1 − <em>x</em>)</span><span class="pc-eq-frac-den">3</span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2(1 + <em>x</em>)</span><span class="pc-eq-frac-den">3</span></span></p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">1.003</span><span class="pc-eq-frac-den">0.836</span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2(1 + <em>x</em>)</span><span class="pc-eq-frac-den">3</span></span> &nbsp;&rArr;&nbsp; <em>x</em> = 0.8</p><p class="pc-eq pc-math"><strong>80 % de talco y 20 % de crisotilo</strong> (en moles)</p><p class="pc-note">Un punto por los moles de Mg y de Si; otro por la relación en función de <em>x</em> y 1 − <em>x</em>; otro por el porcentaje final.</p></div>

        enunciado: `
            <p class="pc-q-title">Q39 — Esta pregunta trata sobre compuestos coloridos</p>

            <div class="pc-intro">
                <p>Hay moléculas coloridas en las hojas (β-caroteno y clorofila), en la sangre (hemoglobina), en la piel (melanina) y en los suplementos multivitamínicos. Todas son compuestos orgánicos con enlaces sencillos y dobles alternados, y vamos a explorar cómo ese patrón da lugar al color.</p>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Una molécula sencilla con enlaces sencillos y dobles alternados es el buta-1,3-dieno. Dibuja su estructura esquelética.</p></div></div>
            <p>El buta-1,3-dieno es incoloro porque no absorbe luz visible. Sí absorbe en el UV a una longitud de onda, <em>&lambda;</em>, de 210 nm. Esta absorción se debe a que los electrones de los dobles enlaces se mueven entre distintos niveles de energía. La diferencia entre niveles viene dada por:</p>
            <p class="pc-eq pc-math">Δ<em>E</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>hc</em></span><span class="pc-eq-frac-den"><em>&lambda;</em></span></span></p>
            <p>donde <em>h</em> es la constante de Planck y <em>c</em> la velocidad de la luz en el vacío. Δ<em>E</em> también está relacionada con la longitud de la molécula, <em>L</em>, mediante:</p>
            <p class="pc-eq pc-math">Δ<em>E</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">(2<em>n</em> + 1) <em>h</em><sup>2</sup></span><span class="pc-eq-frac-den">8 <em>m</em><sub>e</sub> <em>L</em><sup>2</sup></span></span></p>
            <p>donde <em>m</em><sub>e</sub> es la masa del electrón y <em>n</em> es el número de dobles enlaces.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula la diferencia de energía, Δ<em>E</em>, de la absorción UV del buta-1,3-dieno, en J.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Con esta diferencia de energía, calcula la longitud, <em>L</em>, en Å.</p></div></div></div>
            <p>La porfina (<strong>1</strong>) absorbe luz visible y forma cristales rojos brillantes. Sus complejos de coordinación con metales (<strong>2</strong>) también son coloridos y se encuentran en la clorofila y la hemoglobina. Se ha determinado que el complejo de magnesio (M = Mg) absorbe a 571.4 nm y el complejo de cinc (M = Zn) a 568.7 nm.</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="C1=CC2=CC3=CC=C(N3)C=C4C=CC(=N4)C=C5C=CC(=N5)C=C1N2"></span><span class="pc-compound-name">1: porfina</span></div><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="@M:8,14,20,23:C1=CC2=CC3=CC=C([N-]3)C=C4C=CC(=N4)C=C5C=CC(=N5)C=C1[N-]2"></span><span class="pc-compound-name">2: complejo metálico de la porfina (M = Mg, Zn)</span></div></div>
            <p>Como en el buta-1,3-dieno, la longitud de onda está relacionada con el tamaño de la molécula, ahora mediante:</p>
            <p class="pc-eq pc-math"><em>&lambda;</em> = <em>&epsilon;</em> <em>d</em><sup>2</sup></p>
            <p>donde <em>d</em> es la distancia entre los átomos de nitrógeno de lados opuestos del anillo y <em>&epsilon;</em> es una constante de proporcionalidad que se supone igual para <strong>1</strong> y <strong>2</strong>. La longitud del enlace N–Mg es 2.052 Å.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula la constante de proporcionalidad <em>&epsilon;</em> en Å<sup>−1</sup> con cuatro cifras significativas.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula la longitud del enlace N–Zn en Å con cuatro cifras significativas.</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Calcula la longitud de onda de absorción de la porfina <strong>1</strong> (para la cual <em>d</em> = 4.112 Å) en nm con cuatro cifras significativas.</p></div></div></div>
            <p>La porficeno es un isómero de la porfina que ha atraído atención como interruptor molecular. Los átomos de hidrógeno de la porficeno pueden «saltar» a través del anillo, interconvirtiendo dos estados <em>trans</em> estables (T y T*) que son las posiciones encendido/apagado del interruptor. También hay un estado <em>cis</em> inestable C. Los estados <em>trans</em> pueden interconvertirse a través del estado <em>cis</em> con constante de velocidad <em>k</em><sub>1</sub>, o directamente con constante de velocidad <em>k</em><sub>2</sub>.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.7 gapx=40 gapy=40
c @1,0: C1=Cc2nc1ccc1ccc([nH]1)c1ccc(ccc3nc2C=C3)[nH]1 | C
t @0,1: C1=Cc2nc1ccc1ccc([nH]1)c1nc(ccc3ccc2[nH]3)C=C1 | T
ts @2,1: C1=Cc2nc1ccc1ccc([nH]1)c1nc(ccc3ccc2[nH]3)C=C1 | T*
t -&gt; c | k1 | ruta=recta
c -&gt; ts | rápida | ruta=recta
t -&gt; ts | k2"></div>
            <p>A temperaturas altas <em>k</em><sub>1</sub> ≫ <em>k</em><sub>2</sub> y puede ignorarse la conversión directa T → T*. Se obtuvieron la siguiente ecuación de velocidad y los siguientes datos cinéticos para la isomerización.</p>
            <p class="pc-eq pc-math"><em>k</em><sub>1</sub> = <em>A</em> exp<span style="font-size:1.25em">(</span>−<span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>E</em><sub>a</sub></span><span class="pc-eq-frac-den"><em>RT</em></span></span><span style="font-size:1.25em">)</span></p>
            <table class="pc-table"><thead><tr><th><em>T</em> / K</th><th><em>k</em><sub>1</sub> / s<sup>−1</sup></th></tr></thead><tbody><tr><td>493</td><td>3.31 × 10<sup>12</sup></td></tr><tr><td>393</td><td>1.32 × 10<sup>12</sup></td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>En tales condiciones, calcula la energía de activación, <em>E</em><sub>a</sub>, de T → T* con la ley de Arrhenius y los datos anteriores.</p></div></div>
            <p>La transformación es mucho más rápida a 100 K de lo esperado por la ley de Arrhenius, porque ahora domina la conversión directa T → T*. Esto se debe al efecto túnel cuántico. La constante de velocidad <em>k</em><sub>2</sub> tiene una dependencia de la temperatura no Arrhenius:</p>
            <p class="pc-eq pc-math"><em>k</em><sub>2</sub> = <span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num">2<em>E</em><sub>a</sub></span><span class="pc-eq-frac-den"><em>&mu;</em></span></span><span style="font-size:1.25em">)</span><sup>½</sup> <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;RT</em></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub></span></span> exp<span style="font-size:1.25em">[</span>−<em>&alpha;</em><span style="font-size:1.25em">(</span>2 − <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;RT</em></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub></span></span><span style="font-size:1.25em">)</span><span style="font-size:1.25em">]</span></p>
            <p>donde <em>&mu;</em> es una masa molar escalada con unidades m<sup>2</sup> kg mol<sup>−1</sup> y <em>&alpha;</em> es una constante adimensional. Esta expresión puede simplificarse combinando algunos de los términos en dos nuevos, <em>&beta;</em> y <em>&gamma;</em>:</p>
            <p class="pc-eq pc-math"><em>k</em><sub>2</sub> = <em>T</em> <span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&beta;</em></span><span class="pc-eq-frac-den"><em>&gamma;</em></span></span><span style="font-size:1.25em">)</span><sup>½</sup> exp(−2<em>&alpha;</em> + <em>&beta;T</em>)</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Expresa <em>&beta;</em> y <em>&gamma;</em> en función de <em>&alpha;</em>, <em>&mu;</em>, <em>E</em><sub>a</sub> y <em>R</em>.</p></div></div>
            <p>La ecuación puede reordenarse además para dar:</p>
            <p class="pc-eq pc-math">ln<span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>2</sub></span><span class="pc-eq-frac-den"><em>T</em></span></span><span style="font-size:1.25em">)</span> = <em>&beta;T</em> + <em>i</em></p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Usa los datos siguientes para calcular <em>&beta;</em> en K<sup>−1</sup>.</p><table class="pc-table"><thead><tr><th><em>T</em> / K</th><th><em>k</em><sub>2</sub> / s<sup>−1</sup></th></tr></thead><tbody><tr><td>83</td><td>8.74 × 10<sup>10</sup></td></tr><tr><td>61</td><td>6.23 × 10<sup>10</sup></td></tr></tbody></table><p><em>(Si no obtuviste respuesta, usa <em>&beta;</em> = 9.456 × 10<sup>−4</sup> K<sup>−1</sup> en los cálculos posteriores.)</em></p></div></div>
            <p>Puede demostrarse que el valor de la constante <em>&alpha;</em> es 2.235.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Calcula la energía de activación <em>E</em><sub>a</sub>.</p></div></div>

        respuesta: `
            <p class="pc-q-title">Q39 — Esta pregunta trata sobre compuestos coloridos <span class="pc-total-chip">Total: 17 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C=CC=C"></span><span class="pc-compound-name">buta-1,3-dieno</span></div></div></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<em>E</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>hc</em></span><span class="pc-eq-frac-den"><em>&lambda;</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">6.626 × 10<sup>−34</sup> m<sup>2</sup> kg s<sup>−1</sup> × 2.998 × 10<sup>8</sup> m s<sup>−1</sup></span><span class="pc-eq-frac-den">210 × 10<sup>−9</sup> m</span></span> = <strong>9.46 × 10<sup>−19</sup> J</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(ii)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>L</em><sup>2</sup> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">(2<em>n</em> + 1) <em>h</em><sup>2</sup></span><span class="pc-eq-frac-den">8 <em>m</em><sub>e</sub> Δ<em>E</em></span></span>, &nbsp; <em>n</em> = 2 (dos dobles enlaces)</p><p class="pc-eq pc-math"><em>L</em><sup>2</sup> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">5 × (6.626 × 10<sup>−34</sup>)<sup>2</sup></span><span class="pc-eq-frac-den">8 × 9.109 × 10<sup>−31</sup> × 9.46 × 10<sup>−19</sup></span></span> = 3.184 × 10<sup>−19</sup> m<sup>2</sup></p><p class="pc-eq pc-math"><em>L</em> = 5.64 × 10<sup>−10</sup> m = <strong>5.64 Å</strong></p><p class="pc-note">Un punto por indicar <em>n</em> = 2 y otro por <em>L</em> en Å (no se da el segundo punto si solo está en m).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>&epsilon;</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&lambda;</em></span><span class="pc-eq-frac-den"><em>d</em><sup>2</sup></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">5714 Å</span><span class="pc-eq-frac-den">(2 × 2.052 Å)<sup>2</sup></span></span> = <strong>339.3 Å<sup>−1</sup></strong></p><p class="pc-note">Sin punto si las unidades son otras.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>d</em><sup>2</sup> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&lambda;</em></span><span class="pc-eq-frac-den"><em>&epsilon;</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">5687 Å</span><span class="pc-eq-frac-den">339.3 Å<sup>−1</sup></span></span> = 16.76 Å<sup>2</sup> &nbsp;&rArr;&nbsp; <em>d</em> = 4.094 Å</p><p class="pc-eq pc-math">N–Zn = <span class="pc-eq-frac"><span class="pc-eq-frac-num">4.094 Å</span><span class="pc-eq-frac-den">2</span></span> = <strong>2.047 Å</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>&lambda;</em> = <em>&epsilon;d</em><sup>2</sup> = 339.3 Å<sup>−1</sup> × (4.112 Å)<sup>2</sup> = 5737 Å = <strong>573.7 nm</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>1</sub>(493 K)</span><span class="pc-eq-frac-den"><em>k</em><sub>1</sub>(393 K)</span></span> = exp<span style="font-size:1.25em">[</span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>E</em><sub>a</sub></span><span class="pc-eq-frac-den"><em>R</em></span></span><span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">393 K</span></span> − <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">493 K</span></span><span style="font-size:1.25em">)</span><span style="font-size:1.25em">]</span></p><p class="pc-eq pc-math">ln<span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num">3.31 × 10<sup>12</sup></span><span class="pc-eq-frac-den">1.32 × 10<sup>12</sup></span></span><span style="font-size:1.25em">)</span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>E</em><sub>a</sub></span><span class="pc-eq-frac-den">8.314 J K<sup>−1</sup> mol<sup>−1</sup></span></span> × 5.161 × 10<sup>−4</sup> K<sup>−1</sup></p><p class="pc-eq pc-math"><em>E</em><sub>a</sub> = <strong>14.8 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Un punto por una expresión en la que se haya eliminado <em>A</em>, otro por tomar logaritmos y otro por el resultado.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math">−2<em>&alpha;</em> + <em>&beta;T</em> = −<em>&alpha;</em><span style="font-size:1.25em">(</span>2 − <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;RT</em></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub></span></span><span style="font-size:1.25em">)</span> = −2<em>&alpha;</em> + <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;</em><sup>2</sup><em>RT</em></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub></span></span></p><p class="pc-eq pc-math"><strong><em>&beta;</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;</em><sup>2</sup><em>R</em></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub></span></span></strong></p><p class="pc-eq pc-math"><em>T</em> <span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&beta;</em></span><span class="pc-eq-frac-den"><em>&gamma;</em></span></span><span style="font-size:1.25em">)</span><sup>½</sup> = <span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num">2<em>E</em><sub>a</sub></span><span class="pc-eq-frac-den"><em>&mu;</em></span></span><span style="font-size:1.25em">)</span><sup>½</sup> <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;RT</em></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub></span></span> &nbsp;&rArr;&nbsp; <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&beta;</em></span><span class="pc-eq-frac-den"><em>&gamma;</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2<em>E</em><sub>a</sub></span><span class="pc-eq-frac-den"><em>&mu;</em></span></span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&alpha;</em><sup>2</sup><em>R</em><sup>2</sup></span><span class="pc-eq-frac-den"><em>E</em><sub>a</sub><sup>2</sup></span></span> = <em>&beta;</em> <span class="pc-eq-frac"><span class="pc-eq-frac-num">2<em>R</em></span><span class="pc-eq-frac-den"><em>&mu;</em></span></span></p><p class="pc-eq pc-math"><strong><em>&gamma;</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>&mu;</em></span><span class="pc-eq-frac-den">2<em>R</em></span></span></strong></p><p class="pc-note">Un punto por <em>&beta;</em> y dos por <em>&gamma;</em> (sin puntuación parcial).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math">ln<span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>2</sub>(83 K)</span><span class="pc-eq-frac-den">83 K</span></span><span style="font-size:1.25em">)</span> − ln<span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>2</sub>(61 K)</span><span class="pc-eq-frac-den">61 K</span></span><span style="font-size:1.25em">)</span> = <em>&beta;</em> (83 K − 61 K)</p><p class="pc-eq pc-math"><em>&beta;</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">ln<span style="font-size:1.25em">(</span><span class="pc-eq-frac"><span class="pc-eq-frac-num">8.74 × 10<sup>10</sup> × 61</span><span class="pc-eq-frac-den">83 × 6.23 × 10<sup>10</sup></span></span><span style="font-size:1.25em">)</span></span><span class="pc-eq-frac-den">83 − 61</span></span> K<sup>−1</sup> = <strong>1.389 × 10<sup>−3</sup> K<sup>−1</sup></strong></p><p class="pc-note">Un punto por eliminar la constante <em>i</em>, otro por despejar <em>&beta;</em> y otro por el valor con unidades.</p></div>

            <p class="pc-q-title">Q40 — Esta pregunta trata sobre el anammox y los ladderanos</p>

            <div class="pc-intro">
                <p>Anammox es la abreviatura de <em>anaerobic ammonium oxidation</em> (oxidación anaerobia del amonio). Aunque es una parte crucial del ciclo del nitrógeno, las bacterias responsables de este proceso solo se identificaron en 1999. En las membranas de estas bacterias se encontró una clase inusual de lípidos, que contienen varios anillos de ciclobutano fusionados. Estas moléculas se llaman ladderanos por su parecido con los peldaños de una escalera.</p>
            </div>
            <p>Se cree que el mecanismo de la oxidación del amonio involucra varias especies diferentes que contienen nitrógeno:</p>
            <ul><li>nitrógeno gaseoso</li><li>el ion amonio</li><li>el ion nitrito (NO<sub>2</sub><sup>−</sup>)</li><li>la hidracina (NH<sub>2</sub>NH<sub>2</sub>)</li><li>la hidroxilamina (NH<sub>2</sub>OH)</li></ul>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Da el estado de oxidación del átomo de nitrógeno en el nitrógeno gaseoso y en el ion amonio.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Da el estado de oxidación del átomo de nitrógeno en el ion nitrito (NO<sub>2</sub><sup>−</sup>), la hidracina (NH<sub>2</sub>NH<sub>2</sub>) y la hidroxilamina (NH<sub>2</sub>OH).</p></div></div></div>
            <p>La reacción ocurre en tres etapas, en todas las cuales puede suponerse medio ácido.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Usando los estados de oxidación del apartado (a), escribe las ecuaciones de las siguientes etapas del ciclo.</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Etapa 1: la semiecuación de la conversión de nitrito en hidroxilamina.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Etapa 2: la reacción del ion amonio y la hidroxilamina para dar hidracina.</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Etapa 3: la semiecuación de la conversión de hidracina en nitrógeno gaseoso.</p></div></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>A partir de ello, escribe la ecuación global del proceso anammox.</p></div></div>
            <p>Para entender mejor los lípidos de estas bacterias, un grupo de investigación sintetizó el ácido [5]-ladderanoico, un componente clave de dichos lípidos. La síntesis se muestra a continuación. No se muestran todos los subproductos.</p>

            <p class="pc-q-title">Q40 — Esta pregunta trata sobre el anammox y los ladderanos <span class="pc-total-chip">Total: 20 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><table class="pc-table"><thead><tr><th></th><th>Nitrógeno gaseoso, N<sub>2</sub></th><th>Ion amonio, NH<sub>4</sub><sup>+</sup></th></tr></thead><tbody><tr><td>Estado de oxidación del N</td><td><strong>0</strong></td><td><strong>−3</strong></td></tr></tbody></table><p class="pc-note">Deben ser correctos los dos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">2 puntos</span></div><table class="pc-table"><thead><tr><th></th><th>NO<sub>2</sub><sup>−</sup></th><th>NH<sub>2</sub>NH<sub>2</sub></th><th>NH<sub>2</sub>OH</th></tr></thead><tbody><tr><td>Estado de oxidación del N</td><td><strong>+3</strong></td><td><strong>−2</strong></td><td><strong>−1</strong></td></tr></tbody></table><p class="pc-note">Los tres correctos, dos puntos; dos correctos, un punto; uno o ninguno, cero.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">NO<sub>2</sub><sup>−</sup> + 4 e<sup>−</sup> + 5 H<sup>+</sup> &rarr; NH<sub>2</sub>OH + H<sub>2</sub>O</p><p class="pc-note">También se acepta NO<sub>2</sub><sup>−</sup> + 4 e<sup>−</sup> + 6 H<sup>+</sup> → [NH<sub>3</sub>OH]<sup>+</sup> + H<sub>2</sub>O.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">NH<sub>4</sub><sup>+</sup> + NH<sub>2</sub>OH &rarr; NH<sub>2</sub>NH<sub>2</sub> + H<sub>2</sub>O + H<sup>+</sup></p><p class="pc-note">Se aceptan también las variantes con H<sub>3</sub>O<sup>+</sup> o con la hidracina protonada [NH<sub>2</sub>NH<sub>3</sub>]<sup>+</sup>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">NH<sub>2</sub>NH<sub>2</sub> &rarr; N<sub>2</sub> + 4 e<sup>−</sup> + 4 H<sup>+</sup></p><p class="pc-note">También vale [NH<sub>2</sub>NH<sub>3</sub>]<sup>+</sup> → N<sub>2</sub> + 4 e<sup>−</sup> + 5 H<sup>+</sup>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">NO<sub>2</sub><sup>−</sup> + NH<sub>4</sub><sup>+</sup> &rarr; N<sub>2</sub> + 2 H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(A)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="OCC1CCC1CO"></span><span class="pc-compound-name">A: ciclobutano-1,2-diildimetanol</span></div></div><p class="pc-note">La reducción del anhídrido con LiAlH<sub>4</sub> en exceso da el diol (C<sub>6</sub>H<sub>12</sub>O<sub>2</sub>).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(B)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CS(=O)(=O)OCC1CCC1COS(C)(=O)=O"></span><span class="pc-compound-name">B: dimesilato</span></div></div><p class="pc-note">Con cloruro de mesilo y trietilamina, ambos OH pasan a mesilato (buen grupo saliente). Se admite error arrastrado desde A si es coherente con C<sub>8</sub>H<sub>16</sub>O<sub>6</sub>S<sub>2</sub>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(C)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C1SCC2CCC12"></span><span class="pc-compound-name">C: 3-tiabiciclo[3.2.0]heptano</span></div></div><p class="pc-note">El sulfuro desplaza a los dos mesilatos (doble SN2 intramolecular) y cierra el anillo de tetrahidrotiofeno.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(D)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=S1CC2CCC2C1Cl"></span><span class="pc-compound-name">D: α-clorosulfóxido</span></div></div><p class="pc-note">C se oxida a sulfóxido (H<sub>2</sub>O<sub>2</sub>/H<sup>+</sup>), y el SO<sub>2</sub>Cl<sub>2</sub> introduce Cl en α al S (reacción de Pummerer). El patrón de m/z 164.01 y 166.00 (3 : 1) indica un átomo de cloro (C<sub>6</sub>H<sub>9</sub>ClOS).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(E⁻)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=S1[CH-]C2CCC2C1Cl"></span><span class="pc-compound-name">E⁻ (forma sulfinilo)</span></div><span style="align-self:center"><em>o bien</em></span><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[O-]S1=CC2CCC2C1Cl"></span><span class="pc-compound-name">E⁻ (forma enolato-tipo)</span></div></div><p class="pc-note">Cualquiera de las dos vale dos puntos: el carbono ácido es el CH<sub>2</sub> contiguo al azufre del lado contrario al cloro. Una estructura con el anión en el carbono con Cl vale un punto como error arrastrado.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(F)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=S1C2C1C3CCC23"></span><span class="pc-compound-name">F: episulfóxido (tiirano S-óxido)</span></div></div><p class="pc-note">El carbanión desplaza al cloro intramolecularmente y forma el anillo de tres miembros.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(G)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C1=CC2CCC12"></span><span class="pc-compound-name">G: biciclo[2.2.0]hex-2-eno</span></div></div><p class="pc-note">Del episulfóxido se pierde SO y se forma el alqueno (tres señales de <sup>13</sup>C).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(X)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=S"></span><span class="pc-compound-name">X: monóxido de azufre, SO (M = 48.06 g mol−1)</span></div></div></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(H)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="ClC1C2C3C4C5CCC5C4C3C2C1"></span><span class="pc-compound-name">H: cloro-[5]-ladderano</span></div></div><p class="pc-note">La dimerización de G con cobre da el [5]-ladderano (cinco ciclobutanos fusionados) y la cloración con Mn lo funcionaliza en un carbono de los extremos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(I)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C=1C2C3C4C5CCC5C4C3C2C1"></span><span class="pc-compound-name">I: [5]-laddereno</span></div></div><p class="pc-note">La eliminación de HCl con una base fuerte da el alqueno en el ciclobutano terminal (seis señales de <sup>13</sup>C).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(J)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="OCCCCCCC=CC1C2C3C4C5CCC5C4C3C2C1"></span><span class="pc-compound-name">J</span></div></div><p class="pc-note">Se acepta el doble enlace dibujado <em>cis</em> o <em>trans</em>. Tras la adición de la cadena lateral, el HF desprotege el alcohol (elimina el grupo TBS).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(K)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="OCCCCCCCCC1C2C3C4C5CCC5C4C3C2C1"></span><span class="pc-compound-name">K</span></div></div><p class="pc-note">La hidrogenación (H<sub>2</sub>/Ni) satura el alqueno. La cadena lateral debe tener exactamente ocho átomos de carbono. La oxidación posterior (CrO<sub>3</sub>/H<sub>2</sub>SO<sub>4</sub>) convierte el alcohol primario en el ácido [5]-ladderanoico.</p></div>

            <p class="pc-q-title">Q41 — Esta pregunta trata sobre el dióxido de carbono</p>

            <div class="pc-intro">
                <p>Las industrias de la alimentación y las bebidas usan mucho dióxido de carbono. Durante el verano de 2018, una escasez mundial llevó a los supermercados a limitar las entregas de alimentos congelados y a racionar la cerveza. Esto resulta irónico considerando el aumento documentado de los niveles atmosféricos de CO<sub>2</sub>.</p>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Dibuja diagramas de puntos y cruces del dióxido de carbono y del monóxido de carbono.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula la diferencia entre los estados de oxidación del carbono en el dióxido de carbono y en el monóxido de carbono.</p></div></div></div>
            <p>El químico inglés William Henry estudió los equilibrios cuando un gas se disuelve en un líquido. Propuso que la concentración de un gas disuelto en un líquido es proporcional a la presión parcial del gas en la fase gaseosa. El factor de proporcionalidad se llama constante de la ley de Henry. La constante de la ley de Henry del CO<sub>2</sub> es 3.3 × 10<sup>−2</sup> mol dm<sup>−3</sup> atm<sup>−1</sup>.</p>
            <p>Los envases cerrados de bebidas gaseosas contienen CO<sub>2</sub> disuelto. Este CO<sub>2</sub> disuelto está en equilibrio con una pequeña cantidad de CO<sub>2</sub> gaseoso en la parte superior del envase.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>La presión parcial del CO<sub>2</sub> gaseoso en una lata de 250 cm<sup>3</sup> de bebida gaseosa es 3.0 atm a 25 °C. ¿Cuál es la concentración de CO<sub>2</sub> en la bebida?</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>¿Qué masa de CO<sub>2</sub> está disuelta en una lata de 250 cm<sup>3</sup> de bebida gaseosa?</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Si la lata contuviera únicamente la masa de CO<sub>2</sub> calculada en (ii) en forma de gas, calcula la presión en la lata cuando se almacena a 25 °C.</p></div><div class="pc-sub"><span class="pc-sub-label">(iv)</span><p>¿En qué condiciones sería más soluble el CO<sub>2</sub> gaseoso en agua?</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; alta presión y baja temperatura</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; alta presión y alta temperatura</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; baja presión y baja temperatura</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; baja presión y alta temperatura</td></tr></tbody></table></div></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>La presión máxima que puede soportar una lata de bebida gaseosa es 7 atm. Usando la gráfica siguiente, determina la temperatura máxima a la que puede almacenarse una lata con seguridad.</p><div class="pc-figure"><svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Constante de Henry del CO2 frente a la temperatura" style="width:520px;max-width:100%;font-family:Inter,sans-serif"><rect x="70" y="18" width="430" height="230" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="70.0" y1="18" x2="70.0" y2="248" stroke="currentColor" opacity=".15"/><text x="70.0" y="264" text-anchor="middle" font-size="11">0</text><line x1="156.0" y1="18" x2="156.0" y2="248" stroke="currentColor" opacity=".15"/><text x="156.0" y="264" text-anchor="middle" font-size="11">20</text><line x1="242.0" y1="18" x2="242.0" y2="248" stroke="currentColor" opacity=".15"/><text x="242.0" y="264" text-anchor="middle" font-size="11">40</text><line x1="328.0" y1="18" x2="328.0" y2="248" stroke="currentColor" opacity=".15"/><text x="328.0" y="264" text-anchor="middle" font-size="11">60</text><line x1="414.0" y1="18" x2="414.0" y2="248" stroke="currentColor" opacity=".15"/><text x="414.0" y="264" text-anchor="middle" font-size="11">80</text><line x1="500.0" y1="18" x2="500.0" y2="248" stroke="currentColor" opacity=".15"/><text x="500.0" y="264" text-anchor="middle" font-size="11">100</text><line x1="70" y1="248.0" x2="500" y2="248.0" stroke="currentColor" opacity=".15"/><text x="64" y="252.0" text-anchor="end" font-size="11">0.00</text><line x1="70" y1="215.1" x2="500" y2="215.1" stroke="currentColor" opacity=".15"/><text x="64" y="219.1" text-anchor="end" font-size="11">0.01</text><line x1="70" y1="182.3" x2="500" y2="182.3" stroke="currentColor" opacity=".15"/><text x="64" y="186.3" text-anchor="end" font-size="11">0.02</text><line x1="70" y1="149.4" x2="500" y2="149.4" stroke="currentColor" opacity=".15"/><text x="64" y="153.4" text-anchor="end" font-size="11">0.03</text><line x1="70" y1="116.6" x2="500" y2="116.6" stroke="currentColor" opacity=".15"/><text x="64" y="120.6" text-anchor="end" font-size="11">0.04</text><line x1="70" y1="83.7" x2="500" y2="83.7" stroke="currentColor" opacity=".15"/><text x="64" y="87.7" text-anchor="end" font-size="11">0.05</text><line x1="70" y1="50.9" x2="500" y2="50.9" stroke="currentColor" opacity=".15"/><text x="64" y="54.9" text-anchor="end" font-size="11">0.06</text><line x1="70" y1="18.0" x2="500" y2="18.0" stroke="currentColor" opacity=".15"/><text x="64" y="22.0" text-anchor="end" font-size="11">0.07</text><text x="285.0" y="292" text-anchor="middle" font-size="12">Temperatura / °C</text><text transform="translate(14,133.0) rotate(-90)" text-anchor="middle" font-size="12">Const. de Henry / mol dm⁻³ atm⁻¹</text><polyline fill="none" stroke="#2f6fb5" stroke-width="2.2" points="70.0,21.3 113.0,83.7 156.0,123.1 199.0,149.4 242.0,172.4 285.0,187.2 328.0,200.4 371.0,208.6 414.0,216.8 457.0,222.4 500.0,226.6"/></svg></div></div></div>
            <p>Un método de fabricación industrial de CO<sub>2</sub> involucra el proceso de Haber–Bosch.</p>
            <p class="pc-eq pc-math">CH<sub>4</sub> + H<sub>2</sub>O &#8652; CO + 3 H<sub>2</sub> &nbsp;&nbsp; <strong>Etapa 1</strong></p><p class="pc-eq pc-math">N<sub>2</sub> + 3 H<sub>2</sub> &#8652; 2 NH<sub>3</sub> &nbsp;&nbsp; <strong>Etapa 2</strong></p><p class="pc-eq pc-math">CO + H<sub>2</sub>O &#8652; CO<sub>2</sub> + H<sub>2</sub> &nbsp;&nbsp; <strong>Etapa 3</strong></p>
            <p>El amoníaco (el producto de la Etapa 2) se usa ampliamente para producir fertilizante. La producción de fertilizante suele detenerse en verano. Combinado con el aumento de la demanda de refrescos durante el caluroso verano del año pasado, la parada de la producción de fertilizante contribuyó a la escasez de CO<sub>2</sub>.</p>
            <p>En la Etapa 3, una mezcla inicial de 40 mol de CO, 20 mol de H<sub>2</sub> y 20 mol de CO<sub>2</sub> en contacto con 40 mol de vapor de agua se dejó llegar al equilibrio en un reactor a 1100 K. A 1100 K esta reacción tiene <em>K</em><sub>p</sub> = 0.64.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Calcula el número de moles de cada gas que sale del reactor tras alcanzar el equilibrio.</p></div></div>
            <p>Las entalpías estándar de formación de CO(g), CO<sub>2</sub>(g) y H<sub>2</sub>O(g) son −110.5, −393.5 y −241.1 kJ mol<sup>−1</sup>, respectivamente.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula la entalpía de la reacción entre el CO y el vapor de agua para formar CO<sub>2</sub> y H<sub>2</sub>.</p></div></div>

        `,

            <p class="pc-q-title">Q41 — Esta pregunta trata sobre el dióxido de carbono <span class="pc-total-chip">Total: 11 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><div class="pc-dotcross"><svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de puntos y cruces del CO2" style="width:300px;max-width:100%"><circle cx="55" cy="60" r="40" class="pc-dc-atom-circle"/><circle cx="119" cy="60" r="40" class="pc-dc-atom-circle"/><circle cx="183" cy="60" r="40" class="pc-dc-atom-circle"/><text x="55" y="66" class="pc-dc-atom-label">O</text><text x="119" y="66" class="pc-dc-atom-label">C</text><text x="183" y="66" class="pc-dc-atom-label">O</text><circle cx="83" cy="48" r="2.8" class="pc-dc-dot"/><text x="86.5" y="52.5" class="pc-dc-cross">&times;</text><circle cx="83" cy="72" r="2.8" class="pc-dc-dot"/><text x="86.5" y="76.5" class="pc-dc-cross">&times;</text><circle cx="147" cy="48" r="2.8" class="pc-dc-dot"/><text x="150.5" y="52.5" class="pc-dc-cross">&times;</text><circle cx="147" cy="72" r="2.8" class="pc-dc-dot"/><text x="150.5" y="76.5" class="pc-dc-cross">&times;</text><circle cx="50" cy="33" r="2.8" class="pc-dc-dot"/><circle cx="60" cy="33" r="2.8" class="pc-dc-dot"/><circle cx="50" cy="87" r="2.8" class="pc-dc-dot"/><circle cx="60" cy="87" r="2.8" class="pc-dc-dot"/><circle cx="178" cy="33" r="2.8" class="pc-dc-dot"/><circle cx="188" cy="33" r="2.8" class="pc-dc-dot"/><circle cx="178" cy="87" r="2.8" class="pc-dc-dot"/><circle cx="188" cy="87" r="2.8" class="pc-dc-dot"/></svg></div><span class="pc-compound-name">dióxido de carbono</span></div><div class="pc-compound" style="flex-direction:column"><div class="pc-dotcross"><svg viewBox="0 0 175 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de puntos y cruces del CO" style="width:235px;max-width:100%"><circle cx="55" cy="60" r="40" class="pc-dc-atom-circle"/><circle cx="119" cy="60" r="40" class="pc-dc-atom-circle"/><text x="55" y="66" class="pc-dc-atom-label">C</text><text x="119" y="66" class="pc-dc-atom-label">O</text><circle cx="83" cy="44" r="2.8" class="pc-dc-dot"/><text x="86.5" y="48.5" class="pc-dc-cross">&times;</text><circle cx="83" cy="60" r="2.8" class="pc-dc-dot"/><text x="86.5" y="64.5" class="pc-dc-cross">&times;</text><circle cx="83" cy="76" r="2.8" class="pc-dc-dot"/><circle cx="91" cy="76" r="2.8" class="pc-dc-dot"/><text x="20.5" y="60.5" class="pc-dc-cross">&times;</text><text x="20.5" y="70.5" class="pc-dc-cross">&times;</text><circle cx="149" cy="56" r="2.8" class="pc-dc-dot"/><circle cx="149" cy="66" r="2.8" class="pc-dc-dot"/></svg></div><p style="text-align:center;font-size:.85em">• electrones del O &nbsp; × electrones del C</p><span class="pc-compound-name">monóxido de carbono</span></div></div><p class="pc-note">Un punto por cada diagrama; vale cualquier combinación de puntos y cruces. En el CO, el tercer par de enlace lo aporta el O (enlace dativo) y el C conserva un par solitario.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CO<sub>2</sub>: +4 &nbsp;&nbsp; CO: +2</p><p class="pc-eq pc-math">Diferencia = <strong>2</strong></p><p class="pc-note">También se admite −2.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>c</em> = <em>k</em> × <em>p</em>(CO<sub>2</sub>) = 3.3 × 10<sup>−2</sup> mol dm<sup>−3</sup> atm<sup>−1</sup> × 3.0 atm = <strong>0.099 mol dm<sup>−3</sup></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em> = 0.099 mol dm<sup>−3</sup> × 0.250 dm<sup>3</sup> = 0.02475 mol</p><p class="pc-eq pc-math"><em>m</em> = 0.02475 mol × 44.01 g mol<sup>−1</sup> = <strong>1.09 g</strong></p><p class="pc-note">ECF: <em>m</em> = 11.01 × (respuesta de (i)) g.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>p</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>nRT</em></span><span class="pc-eq-frac-den"><em>V</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">0.02477 mol × 8.314 J K<sup>−1</sup> mol<sup>−1</sup> × 298 K</span><span class="pc-eq-frac-den">2.50 × 10<sup>−4</sup> m<sup>3</sup></span></span> = <strong>2.45 × 10<sup>5</sup> Pa</strong></p><p class="pc-note">ECF: <em>p</em> = 2.25 × 10<sup>5</sup> × (respuesta de (ii)) Pa.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(iv)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; alta presión y baja temperatura</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; alta presión y alta temperatura</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; baja presión y baja temperatura</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; baja presión y alta temperatura</td></tr></tbody></table><p class="pc-note">Sin puntos si se marca más de una casilla.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p>La concentración disuelta es la de la lata (0.099 mol dm<sup>−3</sup>), y a 7 atm debe cumplirse:</p><p class="pc-eq pc-math"><em>k</em><sub>mín</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>c</em></span><span class="pc-eq-frac-den"><em>p</em><sub>máx</sub></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">0.099 mol dm<sup>−3</sup></span><span class="pc-eq-frac-den">7 atm</span></span> = 0.0141 mol dm<sup>−3</sup> atm<sup>−1</sup></p><div class="pc-figure"><svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Constante de Henry del CO2 frente a la temperatura" style="width:520px;max-width:100%;font-family:Inter,sans-serif"><rect x="70" y="18" width="430" height="230" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="70.0" y1="18" x2="70.0" y2="248" stroke="currentColor" opacity=".15"/><text x="70.0" y="264" text-anchor="middle" font-size="11">0</text><line x1="156.0" y1="18" x2="156.0" y2="248" stroke="currentColor" opacity=".15"/><text x="156.0" y="264" text-anchor="middle" font-size="11">20</text><line x1="242.0" y1="18" x2="242.0" y2="248" stroke="currentColor" opacity=".15"/><text x="242.0" y="264" text-anchor="middle" font-size="11">40</text><line x1="328.0" y1="18" x2="328.0" y2="248" stroke="currentColor" opacity=".15"/><text x="328.0" y="264" text-anchor="middle" font-size="11">60</text><line x1="414.0" y1="18" x2="414.0" y2="248" stroke="currentColor" opacity=".15"/><text x="414.0" y="264" text-anchor="middle" font-size="11">80</text><line x1="500.0" y1="18" x2="500.0" y2="248" stroke="currentColor" opacity=".15"/><text x="500.0" y="264" text-anchor="middle" font-size="11">100</text><line x1="70" y1="248.0" x2="500" y2="248.0" stroke="currentColor" opacity=".15"/><text x="64" y="252.0" text-anchor="end" font-size="11">0.00</text><line x1="70" y1="215.1" x2="500" y2="215.1" stroke="currentColor" opacity=".15"/><text x="64" y="219.1" text-anchor="end" font-size="11">0.01</text><line x1="70" y1="182.3" x2="500" y2="182.3" stroke="currentColor" opacity=".15"/><text x="64" y="186.3" text-anchor="end" font-size="11">0.02</text><line x1="70" y1="149.4" x2="500" y2="149.4" stroke="currentColor" opacity=".15"/><text x="64" y="153.4" text-anchor="end" font-size="11">0.03</text><line x1="70" y1="116.6" x2="500" y2="116.6" stroke="currentColor" opacity=".15"/><text x="64" y="120.6" text-anchor="end" font-size="11">0.04</text><line x1="70" y1="83.7" x2="500" y2="83.7" stroke="currentColor" opacity=".15"/><text x="64" y="87.7" text-anchor="end" font-size="11">0.05</text><line x1="70" y1="50.9" x2="500" y2="50.9" stroke="currentColor" opacity=".15"/><text x="64" y="54.9" text-anchor="end" font-size="11">0.06</text><line x1="70" y1="18.0" x2="500" y2="18.0" stroke="currentColor" opacity=".15"/><text x="64" y="22.0" text-anchor="end" font-size="11">0.07</text><text x="285.0" y="292" text-anchor="middle" font-size="12">Temperatura / °C</text><text transform="translate(14,133.0) rotate(-90)" text-anchor="middle" font-size="12">Const. de Henry / mol dm⁻³ atm⁻¹</text><polyline fill="none" stroke="#2f6fb5" stroke-width="2.2" points="70.0,21.3 113.0,83.7 156.0,123.1 199.0,149.4 242.0,172.4 285.0,187.2 328.0,200.4 371.0,208.6 414.0,216.8 457.0,222.4 500.0,226.6"/><line x1="328.0" y1="248" x2="328.0" y2="201.7" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="70" y1="201.7" x2="328.0" y2="201.7" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/></svg></div><p>La constante de Henry baja al subir la temperatura; vale 0.0141 a unos <strong>60 °C</strong>. Por encima de esa temperatura la presión superaría las 7 atm.</p><p class="pc-note">Se aceptan valores entre 57 y 63 °C.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">CO + H<sub>2</sub>O &#8652; CO<sub>2</sub> + H<sub>2</sub>: con <em>x</em> mol que reaccionan, <em>n</em>(CO) = <em>n</em>(H<sub>2</sub>O) = 40 − <em>x</em> y <em>n</em>(CO<sub>2</sub>) = <em>n</em>(H<sub>2</sub>) = 20 + <em>x</em></p><p class="pc-eq pc-math">Como Δ<em>n</em><sub>gas</sub> = 0, <em>K</em><sub>p</sub> = <em>K</em><sub>c</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">(20 + <em>x</em>)<sup>2</sup></span><span class="pc-eq-frac-den">(40 − <em>x</em>)<sup>2</sup></span></span> = 0.64</p><p class="pc-eq pc-math">√0.64 = 0.8 = <span class="pc-eq-frac"><span class="pc-eq-frac-num">20 + <em>x</em></span><span class="pc-eq-frac-den">40 − <em>x</em></span></span> &nbsp;&rArr;&nbsp; <em>x</em> = 6.67 mol</p><table class="pc-table"><thead><tr><th>Gas</th><th>Moles en el equilibrio</th></tr></thead><tbody><tr><td>CO</td><td><strong>33.3</strong></td></tr><tr><td>H<sub>2</sub>O</td><td><strong>33.3</strong></td></tr><tr><td>CO<sub>2</sub></td><td><strong>26.7</strong></td></tr><tr><td>H<sub>2</sub></td><td><strong>26.7</strong></td></tr></tbody></table><p class="pc-note">Los cuatro correctos valen dos puntos; no hay puntuación parcial.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<sub>r</sub><em>H</em> = −393.5 − (−110.5 + (−241.1)) = <strong>−41.9 kJ mol<sup>−1</sup></strong></p><p class="pc-note">No se da el punto si la respuesta es positiva.</p></div>
