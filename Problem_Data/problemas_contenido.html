        enunciado: `
            <p class="pc-q-title">Q42 — Esta pregunta trata sobre la separación industrial de metales preciosos</p>

            <div class="pc-figrow"><div class="pc-figtext"><p>Cuando el níquel o el cobre se purifican por electrólisis, las impurezas se depositan debajo del ánodo como «lodo anódico». Las impurezas incluyen los metales raros rutenio, osmio, rodio, iridio, paladio, platino, plata y oro.</p></div><div class="pc-figside"><img src="https://i.imgur.com/egKPKrO.png" alt="Refinería: electrólisis de níquel o cobre y lodo anódico" loading="lazy" style="max-width:300px;width:100%;border-radius:10px"></div></div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Identifica qué elemento corresponde a cada una de las siguientes estructuras electrónicas:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>[Kr] 4d<sup>10</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>[Xe] 4f<sup>14</sup>5d<sup>9</sup>6s<sup>1</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>[Xe] 4f<sup>14</sup>5d<sup>7</sup>6s<sup>2</sup></p></div></div></div>
            <p>Las impurezas metálicas se separan inicialmente añadiendo agua regia (HCl / HNO<sub>3</sub>). El oro, el paladio y el platino forman complejos solubles. Los demás metales precipitan como elementos y sales insolubles.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=30 gapy=26
a @0,1: t:Lodo anódico | | caja=negro
j @1,1: t:
b @2,0: t:Soluble: HAuCl4, H2PdCl4, H2PtCl6 | | caja=negro
c @2,2: t:Lodo anódico: Ru, Os, Rh, Ir, AgCl | | caja=negro
a -&gt; j | Agua regia | HCl / HNO3 | estilo=linea
j -&gt; b | ruta=vh
j -&gt; c | ruta=vh"></div>
            <p>El oro y el platino reaccionan con el agua regia formando disoluciones de ácido cloroaúrico (HAuCl<sub>4</sub>) y de ácido cloroplatínico (H<sub>2</sub>PtCl<sub>6</sub>), además de dióxido de nitrógeno.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Escribe una ecuación para la reacción del oro con el agua regia.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Escribe una ecuación para la reacción del platino con el agua regia.</p></div></div></div>
            <p>La espectrometría de masas puede usarse para identificar el ácido cloroaúrico. El cloro natural existe como dos isótopos: <sup>35</sup>Cl (75 % de abundancia) y <sup>37</sup>Cl (25 %). El <sup>197</sup>Au tiene una abundancia del 100 %.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Calcula los valores de <em>m/z</em> y las intensidades de los picos del ion molecular del AuCl<sub>4</sub><sup>−</sup> como porcentaje del total. Usa masas enteras en el cálculo.</p></div></div>
            <p>El oro se precipita de la mezcla añadiendo cloruro de hierro(II). Esto deja en disolución el ácido cloroplatínico y el ácido cloropaládico. La adición de cloruro de amonio provoca la precipitación del compuesto <strong>X</strong>. A continuación, la adición de hidróxido de amonio provoca la precipitación del compuesto <strong>Y</strong>.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=30 gapy=26
a @0,1: t:HAuCl4, H2PdCl4, H2PtCl6 | | caja=negro
j1 @1,1: t:
au @2,0: t:Au | | caja=negro
m @2,2: t:H2PdCl4, H2PtCl6 | | caja=negro
j2 @3,2: t:
x @4,1: t:Compuesto X | | caja=negro
pd @4,3: t:H2PdCl4 | | caja=negro
y @4,4: t:Compuesto Y | | caja=negro
a -&gt; j1 | FeCl2 | | estilo=linea
j1 -&gt; au | ruta=vh
j1 -&gt; m | ruta=vh
m -&gt; j2 | NH4Cl | | estilo=linea
j2 -&gt; x | ruta=vh
j2 -&gt; pd | ruta=vh
pd -&gt; y | NH4OH"></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe una ecuación para la reacción del ácido cloroaúrico con cloruro de hierro(II).</p></div></div>
            <p>Una celda unidad se determina mediante cristalografía de rayos X. La celda unidad muestra la disposición de los átomos en un cristal. Al apilar las celdas unidad se genera la estructura global.</p>
            <div class="pc-figrow"><div class="pc-figtext"><p>El diagrama muestra la celda unidad del complejo <strong>X</strong>. El platino está situado en los vértices y en los centros de las caras de la celda unidad. Los centros NH<sub>4</sub><sup>+</sup> están unidos por enlaces de hidrógeno a los ligandos cloruro.</p><p>Algunos de los átomos están completamente contenidos dentro de los límites de una sola celda unidad. Solo una fracción de los átomos centrados en vértices, aristas o caras está contenida dentro de una sola celda unidad.</p></div><div class="pc-figside"><img src="https://i.imgur.com/2aQ9YE4.png" alt="Celda unidad del complejo X" loading="lazy" style="max-width:300px;width:100%;border-radius:10px"></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>¿Cuál es la fórmula del compuesto <strong>X</strong>?</p></div></div>
            <p>El compuesto <strong>Y</strong> contiene Pd en un entorno plano cuadrado. El análisis elemental revela: Pd 50.3 %, Cl 33.5 %, N 13.3 % y H 2.9 %.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Dibuja las posibles estructuras del compuesto <strong>Y</strong>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Escribe una ecuación para la formación del compuesto <strong>Y</strong> a partir de H<sub>2</sub>PdCl<sub>4</sub>.</p></div></div>
            <p>Los complejos de metales de transición pueden identificarse mediante diversas técnicas espectroscópicas, una de las cuales es la resonancia magnética nuclear (RMN). Igual que los núcleos de <sup>1</sup>H y <sup>13</sup>C pueden excitarse en un experimento de RMN, también pueden excitarse los de metales de transición. Puede registrarse un espectro de RMN si el espín (<em>I</em>) no es cero. Núcleos como <sup>195</sup>Pt y <sup>103</sup>Rh dan espectros útiles; sin embargo, otros núcleos como el <sup>105</sup>Pd producen líneas muy anchas y no son adecuados para experimentos de RMN.</p>
            <p>El acoplamiento de núcleos de metales de transición con otros núcleos puede desdoblar las señales, de forma similar a los dobletes, tripletes y cuartetos de la RMN de <sup>1</sup>H.</p>
            <p class="pc-eq pc-math">Número de picos en que se desdobla la resonancia = (2<em>N</em> × <em>I</em>) + 1</p>
            <p>donde <em>N</em> = número de núcleos equivalentes e <em>I</em> = espín de los núcleos con los que acopla.</p>
            <p>El <sup>195</sup>Pt tiene espín <em>I</em> = ½. El <sup>1</sup>H puede considerarse 100 % abundante y tiene espín <em>I</em> = ½. El <sup>16</sup>O puede considerarse 100 % abundante y tiene espín <em>I</em> = 0. No se observa acoplamiento de los núcleos de <sup>1</sup>H con el platino en la RMN de <sup>195</sup>Pt.</p>
            <p>En los baños de galvanoplastia pueden formarse complejos de platino como [Pt(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup> y <em>cis</em>-[Pt(NH<sub>3</sub>)<sub>2</sub>(H<sub>2</sub>O)<sub>2</sub>]<sup>2+</sup>. Una RMN de <sup>195</sup>Pt de una mezcla de los dos complejos muestra señales en δ = −2576 y −1555 ppm. Estas señales están desdobladas porque los núcleos de platino acoplan con <sup>14</sup>N (<em>I</em> = 1) o con <sup>15</sup>N (<em>I</em> = ½). Las señales pueden asignarse por su patrón de desdoblamiento.</p>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>Calcula en cuántas líneas se desdobla la señal de <sup>195</sup>Pt por el nitrógeno en la RMN de <sup>195</sup>Pt de:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p><em>cis</em>-[Pt(<sup>14</sup>NH<sub>3</sub>)<sub>2</sub>(H<sub>2</sub>O)<sub>2</sub>]<sup>2+</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>[Pt(<sup>14</sup>NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>[Pt(<sup>15</sup>NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup></p></div></div></div>
            <p>Las intensidades de las líneas en las resonancias de RMN de <sup>195</sup>Pt desdobladas por núcleos con <em>I</em> = 1 pueden obtenerse de los coeficientes del desarrollo del polinomio (<em>x</em><sup>2</sup> + <em>xy</em> + <em>y</em><sup>2</sup>)<sup><em>n</em></sup>, donde <em>n</em> es el número de átomos de <sup>14</sup>N acoplados equivalentes. Por tanto:</p>
            <p class="pc-eq pc-math"><em>n</em> = 1: &nbsp; (<em>x</em><sup>2</sup> + <em>xy</em> + <em>y</em><sup>2</sup>)<sup>1</sup> = <em>x</em><sup>2</sup> + <em>xy</em> + <em>y</em><sup>2</sup></p><p class="pc-eq pc-math"><em>n</em> = 2: &nbsp; (<em>x</em><sup>2</sup> + <em>xy</em> + <em>y</em><sup>2</sup>)<sup>2</sup> = <em>x</em><sup>4</sup> + 2<em>x</em><sup>3</sup><em>y</em> + 3<em>x</em><sup>2</sup><em>y</em><sup>2</sup> + 2<em>xy</em><sup>3</sup> + <em>y</em><sup>4</sup></p><p class="pc-eq pc-math"><em>n</em> = 3: &nbsp; (<em>x</em><sup>2</sup> + <em>xy</em> + <em>y</em><sup>2</sup>)<sup>3</sup> = <em>x</em><sup>6</sup> + 3<em>x</em><sup>5</sup><em>y</em> + 6<em>x</em><sup>4</sup><em>y</em><sup>2</sup> + 7<em>x</em><sup>3</sup><em>y</em><sup>3</sup> + 6<em>x</em><sup>2</sup><em>y</em><sup>4</sup> + 3<em>xy</em><sup>5</sup> + <em>y</em><sup>6</sup></p>
            <p>Esto conduce a un triángulo de tipo Pascal:</p>
            <table class="pc-table"><thead><tr><th><em>n</em></th><th>Coeficientes</th></tr></thead><tbody><tr><td>0</td><td>1</td></tr><tr><td>1</td><td>1 &nbsp; 1 &nbsp; 1</td></tr><tr><td>2</td><td>1 &nbsp; 2 &nbsp; 3 &nbsp; 2 &nbsp; 1</td></tr><tr><td>3</td><td>1 &nbsp; 3 &nbsp; 6 &nbsp; 7 &nbsp; 6 &nbsp; 3 &nbsp; 1</td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(i)</span><div class="pc-part-body"><p>Calcula las intensidades del patrón de desdoblamiento en la RMN de <sup>195</sup>Pt de:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p><em>cis</em>-[Pt(<sup>14</sup>NH<sub>3</sub>)<sub>2</sub>(H<sub>2</sub>O)<sub>2</sub>]<sup>2+</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>[Pt(<sup>14</sup>NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup></p></div></div></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">3 puntos</span></div><table class="pc-table"><thead><tr><th>Composición</th><th><em>m/z</em></th><th>Probabilidad</th><th>Intensidad relativa</th></tr></thead><tbody><tr><td><sup>197</sup>Au + 4 <sup>35</sup>Cl</td><td>337</td><td>(0.75)<sup>4</sup></td><td>31.6 %</td></tr><tr><td><sup>197</sup>Au + 3 <sup>35</sup>Cl + 1 <sup>37</sup>Cl</td><td>339</td><td>(0.75)<sup>3</sup> × 0.25 × 4</td><td>42.2 %</td></tr><tr><td><sup>197</sup>Au + 2 <sup>35</sup>Cl + 2 <sup>37</sup>Cl</td><td>341</td><td>(0.75)<sup>2</sup> × (0.25)<sup>2</sup> × 6</td><td>21.1 %</td></tr><tr><td><sup>197</sup>Au + 1 <sup>35</sup>Cl + 3 <sup>37</sup>Cl</td><td>343</td><td>0.75 × (0.25)<sup>3</sup> × 4</td><td>4.7 %</td></tr><tr><td><sup>197</sup>Au + 4 <sup>37</sup>Cl</td><td>345</td><td>(0.25)<sup>4</sup></td><td>0.4 %</td></tr></tbody></table><p class="pc-note">Un punto por los cinco <em>m/z</em> correctos y dos por las intensidades (uno si falla una; ninguno si fallan dos o más). Si se olvidan los factores estadísticos pero lo demás está bien, se da el segundo punto pero no el tercero.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">3 FeCl<sub>2</sub> + HAuCl<sub>4</sub> &rarr; Au + 3 FeCl<sub>3</sub> + HCl</p><p class="pc-note">También vale 3 Fe<sup>2+</sup> + Au<sup>3+</sup> → 3 Fe<sup>3+</sup> + Au.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>(NH<sub>4</sub>)<sub>2</sub>[PtCl<sub>6</sub>]</strong></p><p>El Pt ocupa vértices y centros de caras: 8 × <sup>1</sup>⁄<sub>8</sub> + 6 × <sup>1</sup>⁄<sub>2</sub> = 4 Pt por celda. Cada Pt está rodeado por 6 Cl (anión octaédrico [PtCl<sub>6</sub>]<sup>2−</sup>) y hay dos NH<sub>4</sub><sup>+</sup> por Pt, así que la proporción Pt : NH<sub>4</sub><sup>+</sup> : Cl es 1 : 2 : 6. Es el resultado de H<sub>2</sub>PtCl<sub>6</sub> + 2 NH<sub>4</sub>Cl.</p><p class="pc-note">Se admite escrita como iones con sus cargas o como múltiplo de la fórmula.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>n</em>(Pd) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">50.3</span><span class="pc-eq-frac-den">106.4</span></span> = 0.473 &nbsp; <em>n</em>(Cl) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">33.5</span><span class="pc-eq-frac-den">35.45</span></span> = 0.945 &nbsp; <em>n</em>(N) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">13.3</span><span class="pc-eq-frac-den">14.01</span></span> = 0.949 &nbsp; <em>n</em>(H) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2.9</span><span class="pc-eq-frac-den">1.008</span></span> = 2.88</p><p class="pc-eq pc-math">Pd : Cl : N : H = 1 : 2 : 2 : 6 &nbsp;&rArr;&nbsp; Pd(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub></p><div class="pc-compounds"><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="&lt;em&gt;cis&lt;/em&gt;-[PdCl&lt;sub&gt;2&lt;/sub&gt;(NH&lt;sub&gt;3&lt;/sub&gt;)&lt;sub&gt;2&lt;/sub&gt;]" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="100.0" y1="58.0" x2="100.0" y2="30.0" stroke="currentColor" stroke-width="1.8"/><line x1="115.0" y1="70.0" x2="150.0" y2="70.0" stroke="currentColor" stroke-width="1.8"/><line x1="100.0" y1="82.0" x2="100.0" y2="110.0" stroke="currentColor" stroke-width="1.8"/><line x1="85.0" y1="70.0" x2="50.0" y2="70.0" stroke="currentColor" stroke-width="1.8"/><text x="100" y="75" text-anchor="middle" font-size="15" font-weight="600">Pd</text><text x="100" y="20" text-anchor="middle" font-size="14">Cl</text><text x="166" y="75" text-anchor="start" font-size="14">NH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><text x="100" y="130" text-anchor="middle" font-size="14">NH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><text x="34" y="75" text-anchor="end" font-size="14">Cl</text></svg><span class="pc-compound-name"><em>cis</em>-[PdCl<sub>2</sub>(NH<sub>3</sub>)<sub>2</sub>]</span></div><div class="pc-compound" style="flex-direction:column"><svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="&lt;em&gt;trans&lt;/em&gt;-[PdCl&lt;sub&gt;2&lt;/sub&gt;(NH&lt;sub&gt;3&lt;/sub&gt;)&lt;sub&gt;2&lt;/sub&gt;]" style="width:200px;max-width:100%;font-family:Inter,sans-serif;font-size:13px"><line x1="100.0" y1="58.0" x2="100.0" y2="30.0" stroke="currentColor" stroke-width="1.8"/><line x1="115.0" y1="70.0" x2="150.0" y2="70.0" stroke="currentColor" stroke-width="1.8"/><line x1="100.0" y1="82.0" x2="100.0" y2="110.0" stroke="currentColor" stroke-width="1.8"/><line x1="85.0" y1="70.0" x2="50.0" y2="70.0" stroke="currentColor" stroke-width="1.8"/><text x="100" y="75" text-anchor="middle" font-size="15" font-weight="600">Pd</text><text x="100" y="20" text-anchor="middle" font-size="14">Cl</text><text x="166" y="75" text-anchor="start" font-size="14">NH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><text x="100" y="130" text-anchor="middle" font-size="14">Cl</text><text x="34" y="75" text-anchor="end" font-size="14">NH<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text></svg><span class="pc-compound-name"><em>trans</em>-[PdCl<sub>2</sub>(NH<sub>3</sub>)<sub>2</sub>]</span></div></div><p class="pc-note">Un punto por cada estructura (<em>cis</em> y <em>trans</em>). Si se dibujan tres estructuras, el máximo es un punto; con cuatro o más no hay puntos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">H<sub>2</sub>PdCl<sub>4</sub> + 4 NH<sub>4</sub>OH &rarr; Pd(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub> + 4 H<sub>2</sub>O + 2 NH<sub>4</sub>Cl</p><p class="pc-note">También: H<sub>2</sub>PdCl<sub>4</sub> + 2 NH<sub>4</sub>OH → Pd(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub> + 2 H<sub>2</sub>O + 2 HCl, o en forma iónica correcta. Debe estar completamente correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">(2<em>N</em> × <em>I</em>) + 1 = (2 × 2 × 1) + 1 = <strong>5 líneas</strong></p><p class="pc-note">Dos <sup>14</sup>N equivalentes, <em>I</em> = 1.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">(2 × 4 × 1) + 1 = <strong>9 líneas</strong></p><p class="pc-note">Cuatro <sup>14</sup>N equivalentes.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">(2 × 4 × ½) + 1 = <strong>5 líneas</strong></p><p class="pc-note">Cuatro <sup>15</sup>N equivalentes con <em>I</em> = ½.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em> = 2: &nbsp; <strong>1 : 2 : 3 : 2 : 1</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)(ii)</span><span class="pc-marks">1 punto</span></div><p>Se multiplica la fila <em>n</em> = 3 por (1 1 1) (suma de tres términos contiguos):</p><p class="pc-eq pc-math">1 &nbsp; 3 &nbsp; 6 &nbsp; 7 &nbsp; 6 &nbsp; 3 &nbsp; 1 &nbsp;&rArr;&nbsp; <em>n</em> = 4: &nbsp; <strong>1 : 4 : 10 : 16 : 19 : 16 : 10 : 4 : 1</strong></p></div>
        `

    "q43-agentes-nerviosos-2019": {
        titulo: "Intoxicación por agentes nerviosos",
        numero: "Q43",
        fuente: "51ª Olimpiada Internacional de Química (IChO) · UK Round One 2019",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 51st IChO, UK Round One 2019 (licencia CC BY-NC-SA). Autores originales: P. Bolgar, M. Jordan, JL Kiappes, B. Pilgrim, P. Robotham, H. Salisbury, D. Schofield, R. Simon, A. Taylor, A. Thom. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© The Hitman, © Matt Baldwin/Royal Society of Chemistry, © Shutterstock) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q43 — Esta pregunta trata sobre el tratamiento de la intoxicación por agentes nerviosos</p>

            <div class="pc-intro">
                <p>Los agentes nerviosos se unen a una enzima llamada acetilcolinesterasa (AChE) y la inhiben. La AChE inhibida ya no puede hidrolizar un neurotransmisor clave, lo que provoca parálisis y, finalmente, la muerte.</p>
                <p>Uno de los principales tratamientos de la intoxicación por agentes nerviosos es un grupo de sustancias que contienen el grupo funcional oxima (C=NOH). Estas reactivan la AChE inhibida eliminando el agente nervioso unido. Un reactivador importante es la sal cloruro de 2-piridinaldoxima de metilo (PAM).</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C[n+]1ccccc1/C=N/O.[Cl-]"></span><span class="pc-compound-name">PAM</span></div></div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula la masa molar del PAM.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Un adulto intoxicado por un agente nervioso necesita una dosis horaria de 3.00 mmol de PAM por cada kilogramo de masa corporal. Calcula la masa de PAM necesaria para una persona de 80 kg durante un tratamiento de 24 horas.</p></div></div></div>
            <p>Los agentes nerviosos actúan muy rápido. Los estudios cinéticos de los tratamientos con oximas son un área de estudio importante. La velocidad de reactivación de la AChE inhibida por el PAM se muestra a continuación.</p>
            <div class="pc-figure"><svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velocidad de reactivación frente a [PAM]" style="width:520px;max-width:100%;font-family:Inter,sans-serif"><rect x="70" y="18" width="430" height="230" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="70.0" y1="18" x2="70.0" y2="248" stroke="currentColor" opacity=".15"/><text x="70.0" y="264" text-anchor="middle" font-size="11">0.0000</text><line x1="141.7" y1="18" x2="141.7" y2="248" stroke="currentColor" opacity=".15"/><text x="141.7" y="264" text-anchor="middle" font-size="11">0.0002</text><line x1="213.3" y1="18" x2="213.3" y2="248" stroke="currentColor" opacity=".15"/><text x="213.3" y="264" text-anchor="middle" font-size="11">0.0004</text><line x1="285.0" y1="18" x2="285.0" y2="248" stroke="currentColor" opacity=".15"/><text x="285.0" y="264" text-anchor="middle" font-size="11">0.0006</text><line x1="356.7" y1="18" x2="356.7" y2="248" stroke="currentColor" opacity=".15"/><text x="356.7" y="264" text-anchor="middle" font-size="11">0.0008</text><line x1="428.3" y1="18" x2="428.3" y2="248" stroke="currentColor" opacity=".15"/><text x="428.3" y="264" text-anchor="middle" font-size="11">0.0010</text><line x1="500.0" y1="18" x2="500.0" y2="248" stroke="currentColor" opacity=".15"/><text x="500.0" y="264" text-anchor="middle" font-size="11">0.0012</text><line x1="70" y1="248.0" x2="500" y2="248.0" stroke="currentColor" opacity=".15"/><text x="64" y="252.0" text-anchor="end" font-size="11">0.0</text><line x1="70" y1="202.0" x2="500" y2="202.0" stroke="currentColor" opacity=".15"/><text x="64" y="206.0" text-anchor="end" font-size="11">4.0</text><line x1="70" y1="156.0" x2="500" y2="156.0" stroke="currentColor" opacity=".15"/><text x="64" y="160.0" text-anchor="end" font-size="11">8.0</text><line x1="70" y1="110.0" x2="500" y2="110.0" stroke="currentColor" opacity=".15"/><text x="64" y="114.0" text-anchor="end" font-size="11">12.0</text><line x1="70" y1="64.0" x2="500" y2="64.0" stroke="currentColor" opacity=".15"/><text x="64" y="68.0" text-anchor="end" font-size="11">16.0</text><line x1="70" y1="18.0" x2="500" y2="18.0" stroke="currentColor" opacity=".15"/><text x="64" y="22.0" text-anchor="end" font-size="11">20.0</text><text x="285.0" y="292" text-anchor="middle" font-size="12">[PAM] / mol dm⁻³</text><text transform="translate(14,133.0) rotate(-90)" text-anchor="middle" font-size="12">Velocidad / 10⁻¹² mol dm⁻³ s⁻¹</text><polyline fill="none" stroke="#2f6fb5" stroke-width="2.2" points="70.0,248.0 105.8,192.8 141.7,156.0 213.3,100.8 356.7,59.4 428.3,50.2"/><circle cx="70.0" cy="248.0" r="3.6" fill="#2f6fb5"/><circle cx="105.8" cy="192.8" r="3.6" fill="#2f6fb5"/><circle cx="141.7" cy="156.0" r="3.6" fill="#2f6fb5"/><circle cx="213.3" cy="100.8" r="3.6" fill="#2f6fb5"/><circle cx="356.7" cy="59.4" r="3.6" fill="#2f6fb5"/><circle cx="428.3" cy="50.2" r="3.6" fill="#2f6fb5"/></svg></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Indica el orden aproximado de reacción respecto al PAM a concentraciones de PAM inferiores a 0.0002 mol dm<sup>−3</sup>.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Indica el orden aproximado de reacción respecto al PAM a concentraciones de PAM superiores a 0.0008 mol dm<sup>−3</sup>.</p></div></div></div>
            <p>Se propuso el siguiente mecanismo de dos etapas para explicar estos resultados:</p>
            <p class="pc-eq pc-math">AChE-I + PAM &#8652; AChE-I-PAM &nbsp;(<em>K</em><sub>c</sub>) &nbsp;&nbsp;&nbsp; AChE-I-PAM &rarr; AChE + I-PAM &nbsp;(<em>k</em><sub>2</sub>)</p>
            <p>donde AChE-I es la AChE inhibida, AChE-I-PAM es un complejo de la AChE inhibida con el PAM, e I-PAM es el PAM con el agente nervioso unido.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p><em>K</em><sub>c</sub> es la constante de equilibrio de la primera etapa. Escribe una expresión para <em>K</em><sub>c</sub>.</p></div></div>
            <p>Con este modelo puede deducirse la siguiente expresión de la constante de velocidad de primer orden observada respecto a la concentración de AChE inhibida (<em>k</em><sub>obs</sub>):</p>
            <p class="pc-eq pc-math"><em>k</em><sub>obs</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>k</em><sub>2</sub>[PAM]</span><span class="pc-eq-frac-den">[PAM] + <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>K</em><sub>c</sub></span></span></span></span></p>
            <p>donde <em>k</em><sub>obs</sub> es la constante de velocidad observada, <em>K</em><sub>c</sub> la constante de equilibrio de la primera etapa y <em>k</em><sub>2</sub> la constante de velocidad de la segunda etapa. Se representó 1/<em>k</em><sub>obs</sub> frente a 1/[PAM]:</p>
            <div class="pc-figure"><svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recíproco de kobs frente al recíproco de [PAM]" style="width:520px;max-width:100%;font-family:Inter,sans-serif"><rect x="70" y="18" width="430" height="230" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="70.0" y1="18" x2="70.0" y2="248" stroke="currentColor" opacity=".15"/><text x="70.0" y="264" text-anchor="middle" font-size="11">0</text><line x1="141.7" y1="18" x2="141.7" y2="248" stroke="currentColor" opacity=".15"/><text x="141.7" y="264" text-anchor="middle" font-size="11">2,000</text><line x1="213.3" y1="18" x2="213.3" y2="248" stroke="currentColor" opacity=".15"/><text x="213.3" y="264" text-anchor="middle" font-size="11">4,000</text><line x1="285.0" y1="18" x2="285.0" y2="248" stroke="currentColor" opacity=".15"/><text x="285.0" y="264" text-anchor="middle" font-size="11">6,000</text><line x1="356.7" y1="18" x2="356.7" y2="248" stroke="currentColor" opacity=".15"/><text x="356.7" y="264" text-anchor="middle" font-size="11">8,000</text><line x1="428.3" y1="18" x2="428.3" y2="248" stroke="currentColor" opacity=".15"/><text x="428.3" y="264" text-anchor="middle" font-size="11">10,000</text><line x1="500.0" y1="18" x2="500.0" y2="248" stroke="currentColor" opacity=".15"/><text x="500.0" y="264" text-anchor="middle" font-size="11">12,000</text><line x1="70" y1="248.0" x2="500" y2="248.0" stroke="currentColor" opacity=".15"/><text x="64" y="252.0" text-anchor="end" font-size="11">0.00</text><line x1="70" y1="222.4" x2="500" y2="222.4" stroke="currentColor" opacity=".15"/><text x="64" y="226.4" text-anchor="end" font-size="11">1.00</text><line x1="70" y1="196.9" x2="500" y2="196.9" stroke="currentColor" opacity=".15"/><text x="64" y="200.9" text-anchor="end" font-size="11">2.00</text><line x1="70" y1="171.3" x2="500" y2="171.3" stroke="currentColor" opacity=".15"/><text x="64" y="175.3" text-anchor="end" font-size="11">3.00</text><line x1="70" y1="145.8" x2="500" y2="145.8" stroke="currentColor" opacity=".15"/><text x="64" y="149.8" text-anchor="end" font-size="11">4.00</text><line x1="70" y1="120.2" x2="500" y2="120.2" stroke="currentColor" opacity=".15"/><text x="64" y="124.2" text-anchor="end" font-size="11">5.00</text><line x1="70" y1="94.7" x2="500" y2="94.7" stroke="currentColor" opacity=".15"/><text x="64" y="98.7" text-anchor="end" font-size="11">6.00</text><line x1="70" y1="69.1" x2="500" y2="69.1" stroke="currentColor" opacity=".15"/><text x="64" y="73.1" text-anchor="end" font-size="11">7.00</text><line x1="70" y1="43.6" x2="500" y2="43.6" stroke="currentColor" opacity=".15"/><text x="64" y="47.6" text-anchor="end" font-size="11">8.00</text><line x1="70" y1="18.0" x2="500" y2="18.0" stroke="currentColor" opacity=".15"/><text x="64" y="22.0" text-anchor="end" font-size="11">9.00</text><text x="285.0" y="292" text-anchor="middle" font-size="12">[PAM]⁻¹ / mol⁻¹ dm³</text><text transform="translate(14,133.0) rotate(-90)" text-anchor="middle" font-size="12">1/kobs / s</text><line x1="70.0" y1="207.6" x2="464.2" y2="17.9" stroke="#2f6fb5" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="105.8" cy="187.9" r="3.6" fill="#2f6fb5"/><circle cx="114.8" cy="185.4" r="3.6" fill="#2f6fb5"/><circle cx="159.6" cy="166.2" r="3.6" fill="#2f6fb5"/><circle cx="249.2" cy="120.2" r="3.6" fill="#2f6fb5"/><circle cx="428.3" cy="34.6" r="3.6" fill="#2f6fb5"/></svg></div>
            <p style="text-align:center">Recta de ajuste: <em>y</em> = 6.75 × 10<sup>−4</sup> <em>x</em> + 1.58</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula <em>k</em><sub>2</sub>.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula <em>K</em><sub>c</sub>.</p></div></div></div>
            <p>Otra importante área de investigación es el desarrollo de reactivadores de la AChE más eficaces para tratar la intoxicación por agentes nerviosos. Un nuevo grupo de reactivadores se desarrolló usando (<em>E</em>)-1,4-dibromobut-2-eno como material de partida.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Dibuja la estructura del (<em>E</em>)-1,4-dibromobut-2-eno.</p></div></div>
            <p>Este grupo de reactivadores se sintetizó mediante una ruta de 2 etapas, usando una serie de reactivos relacionados:</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.46 gapx=4 gapy=14

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>M</em><sub>r</sub>(C<sub>7</sub>H<sub>9</sub>ClN<sub>2</sub>O) = 7(12.01) + 9(1.008) + 35.45 + 2(14.01) + 16.00 = <strong>172.6 g mol<sup>−1</sup></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em> = 24 h × 80.0 kg × 3.00 × 10<sup>−3</sup> mol h<sup>−1</sup> kg<sup>−1</sup> = 5.76 mol</p><p class="pc-eq pc-math"><em>m</em> = 5.76 mol × 172.6 g mol<sup>−1</sup> = <strong>994 g</strong></p><p class="pc-note">ECF: (respuesta de (i)) × 5.76 g.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(i)</span><span class="pc-marks">1 punto</span></div><p><strong>Primer orden</strong>: a concentraciones bajas, la velocidad es proporcional a [PAM] (tramo casi lineal).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(ii)</span><span class="pc-marks">1 punto</span></div><p><strong>Orden cero</strong>: a concentraciones altas, la velocidad se estabiliza y deja de depender de [PAM] (la enzima está saturada).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>K</em><sub>c</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">[AChE-I-PAM]</span><span class="pc-eq-frac-den">[AChE-I] [PAM]</span></span></p><p class="pc-note">Debe estar completamente correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)(i)</span><span class="pc-marks">1 punto</span></div><p>Reordenando la ecuación de <em>k</em><sub>obs</sub>:</p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>k</em><sub>obs</sub></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>k</em><sub>2</sub></span></span> + <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>k</em><sub>2</sub><em>K</em><sub>c</sub></span></span> × <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">[PAM]</span></span></p><p class="pc-eq pc-math">ordenada en el origen = 1.58 s = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>k</em><sub>2</sub></span></span> &nbsp;&rArr;&nbsp; <em>k</em><sub>2</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">1.58 s</span></span> = <strong>0.633 s<sup>−1</sup></strong></p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="BrC/C=C/CBr"></span><span class="pc-compound-name">(<em>E</em>)-1,4-dibromobut-2-eno</span></div></div><p class="pc-note">Sin punto si se dibuja el isómero <em>cis</em>.</p></div>

            <p class="pc-q-title">Q44 — Esta pregunta trata sobre las abejas y el Brexit</p>

            <div class="pc-intro">
                <p>Hay preocupación porque los pesticidas neonicotinoides puedan ser perjudiciales para las abejas. El tiametoxam es uno de los tres neonicotinoides que la Unión Europea (UE) prohibió en todos los usos al aire libre en abril de 2018. Cuando Gran Bretaña abandone la UE, este pesticida podría volver a estar disponible para su uso en el Reino Unido. A la gente le preocupa que esto dañe nuestra población de abejas.</p>

            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>¿Cuál es la fórmula molecular del tiametoxam?</p></div></div>
            <p>La síntesis del tiametoxam comienza con glicerol. En la conversión de <strong>A</strong> en <strong>B</strong> también pueden formarse otros dos subproductos (<strong>B′</strong> y <strong>B″</strong>). <strong>B</strong>, <strong>B′</strong> y <strong>B″</strong> son isómeros. <strong>B′</strong> y <strong>B″</strong> son isómeros geométricos. Se forma mucho menos <strong>B″</strong> que <strong>B′</strong>.</p>

            <p>En una síntesis alternativa del tiametoxam, el compuesto <strong>D</strong> también puede sintetizarse a partir de propanal.</p>

            <p class="pc-q-title">Q44 — Esta pregunta trata sobre las abejas y el Brexit <span class="pc-total-chip">Total: 27 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><strong>C<sub>8</sub>H<sub>10</sub>ClN<sub>5</sub>O<sub>3</sub>S</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">4 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="ClCC(Cl)CCl"></span><span class="pc-compound-name">A: 1,2,3-tricloropropano</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C=C(Cl)CCl"></span><span class="pc-compound-name">B: 2,3-dicloroprop-1-eno</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="ClC/C=C/Cl"></span><span class="pc-compound-name">B′: (<em>E</em>)-1,3-dicloroprop-1-eno</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="ClC/C=C\\Cl"></span><span class="pc-compound-name">B″: (<em>Z</em>)-1,3-dicloroprop-1-eno</span></div></div><p class="pc-note">Un punto por estructura. Si B′ y B″ están intercambiados, se da un punto de los dos. Sin ECF.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[N-]=C=S"></span><span class="pc-compound-name">S=C=N⁻ (el N ataca a B)</span></div></div><p class="pc-note">No se exige la forma correcta. La forma con la carga negativa en N explica que el átomo de N forme el enlace con el CH<sub>2</sub>Cl y se obtenga el isotiocianato C.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=[N+]=O"></span><span class="pc-compound-name">NO<sub>2</sub><sup>+</sup> (ion nitronio): <strong>lineal</strong></span></div></div><p class="pc-note">Debe indicarse que es lineal, o dibujarse como tal.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(E)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="N=C(N)N[N+](=O)[O-]"></span><span class="pc-compound-name">E: nitroguanidina</span></div></div></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(F)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CNC(=N)N[N+](=O)[O-]"></span><span class="pc-compound-name">F: N-metil-N′-nitroguanidina</span></div></div><p class="pc-note">Sin puntuación parcial: la estructura debe estar completa. ECF desde E.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(G)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CN(CO)C(=N[N+](=O)[O-])NCO"></span><span class="pc-compound-name">G (C<sub>4</sub>H<sub>10</sub>N<sub>4</sub>O<sub>4</sub>): bis(hidroximetil)</span></div></div><p class="pc-note">Sin puntuación parcial. Al reaccionar F con dos moléculas de metanal se forman dos grupos hidroximetilo (el segundo sobre el N metilado). ECF desde F si es coherente con la fórmula.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)(H)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CN1COCNC1=N[N+](=O)[O-]"></span><span class="pc-compound-name">H: 3-metil-4-nitroimino-1,3,5-oxadiazinano</span></div></div><p class="pc-note">La deshidratación cierra el anillo de seis miembros (pérdida de H<sub>2</sub>O entre los dos CH<sub>2</sub>OH). Sin ECF. Después, H reacciona con D (K<sub>2</sub>CO<sub>3</sub>) para dar el tiametoxam.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(I)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(Br)C=O"></span><span class="pc-compound-name">I: 2-bromopropanal</span></div></div><p class="pc-note">La bromación con Br<sub>2</sub> en medio ácido ocurre en α del carbonilo.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(J)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(SC(=N)N)C=O"></span><span class="pc-compound-name">J (C<sub>4</sub>H<sub>8</sub>N<sub>2</sub>OS): isotiouronio/tioimidato</span></div></div><p class="pc-note">Sin puntuación parcial. El S de la tiourea desplaza al Br (SN2). ECF desde I si es coherente con la fórmula.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Cc1cnc(N)s1"></span><span class="pc-compound-name">K: 2-amino-5-metiltiazol</span></div></div><p class="pc-note">Sin puntuación parcial. El NH<sub>2</sub> ataca al C=O y se deshidrata para formar el anillo aromático. ECF desde J si es coherente con la fórmula.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(L)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Cc1cnc([N+]#N)s1.[Cl-]"></span><span class="pc-compound-name">L: sal de diazonio</span></div></div><p class="pc-note">Sin puntuación parcial. ECF desde K.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(M)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Cc1cnc(Cl)s1"></span><span class="pc-compound-name">M: 2-cloro-5-metiltiazol</span></div></div><p class="pc-note">Sin ECF. La pérdida de N<sub>2</sub> la sustituye el cloruro (reacción de Sandmeyer/diazonio); NCS clora luego el metilo por vía radicalaria hasta D.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)(V)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="ClC(=NCC(Cl)=C)[S]"></span><span class="pc-compound-name">V· (radical en S)</span></div><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="S=C(Cl)[N]CC(Cl)=C"></span><span class="pc-compound-name">o bien V· (radical en N)</span></div></div><p class="pc-note">La posición del radical debe estar claramente indicada con un punto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)(W)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="[CH2]C1(Cl)CN=C(Cl)S1"></span><span class="pc-compound-name">W·</span></div></div><p class="pc-note">El radical S· ataca al carbono interno del alqueno (ciclación 5-<em>exo</em>) y deja el radical en el CH<sub>2</sub> primario.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)(Y)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="ClCC1(Cl)CN=C(Cl)S1"></span><span class="pc-compound-name">Y</span></div></div><p class="pc-note">W· abstrae un Cl de Cl<sub>2</sub> para dar Y y Cl·; luego Y elimina HCl y forma D (aromatización).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(j)(X)</span><span class="pc-marks">1 punto</span></div><p>Reactivo <strong>X</strong>: <strong>Cl<sub>2</sub></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(j)(Z)</span><span class="pc-marks">1 punto</span></div><p>Radical <strong>Z·</strong>: <strong>Cl·</strong></p></div>
        `
    },

    "q45-plastico-biodegradable-2019": {
        titulo: "Plástico biodegradable",
        numero: "Q45",
        fuente: "51ª Olimpiada Internacional de Química (IChO) · UK Round One 2019",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 51st IChO, UK Round One 2019 (licencia CC BY-NC-SA). Autores originales: P. Bolgar, M. Jordan, JL Kiappes, B. Pilgrim, P. Robotham, H. Salisbury, D. Schofield, R. Simon, A. Taylor, A. Thom. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© The Hitman, © Matt Baldwin/Royal Society of Chemistry, © Shutterstock) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q45 — Esta pregunta trata sobre un plástico biodegradable</p>

            <div class="pc-intro">
                <p>La reciente campaña para acabar con el uso de pajitas de plástico ha dirigido la atención hacia los plásticos biodegradables y el papel como materiales alternativos. El poli(ácido láctico) (PLA) se desarrolló inicialmente para implantes biomédicos y puede usarse como envase biodegradable. A continuación se muestra un tramo de PLA.</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="[*:11]OC(C)C(=O)OC(C)C(=O)OC(C)C(=O)[*:11]"></span><span class="pc-compound-name">tramo de PLA</span></div></div>
            <p><em>Nota: no se requiere estereoquímica en las fórmulas esqueléticas de las estructuras orgánicas de tus respuestas a esta pregunta.</em></p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Dibuja la estructura del ácido láctico (el monómero que forma el PLA). Su fórmula molecular es C<sub>3</sub>H<sub>6</sub>O<sub>3</sub>. Marca con un asterisco (*) los centros quirales de la estructura que dibujes.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>¿Qué término(s) describen la reacción de polimerización del monómero para formar el PLA?</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; adición</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; condensación</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; neutralización</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; oxidación</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; reducción</td></tr></tbody></table></div></div>
            <p>El PLA también puede formarse a partir del compuesto <strong>A</strong>, cuya fórmula molecular es C<sub>6</sub>H<sub>8</sub>O<sub>4</sub>.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja la estructura del compuesto <strong>A</strong>.</p></div></div>
            <p>El número medio de monómeros de ácido láctico por cadena polimérica en una muestra de PLA puede determinarse mediante análisis de grupos terminales. El análisis de grupos terminales es un procedimiento en el que se usan los grupos terminales reactivos del polímero para determinar su masa molecular.</p>
            <p>Se disolvieron 0.1619 g de PLA en 25 cm<sup>3</sup> de alcohol bencílico. La mezcla se valoró con disolución de KOH 0.0400 mol dm<sup>−3</sup>. El volumen gastado fue 6.81 cm<sup>3</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Calcula la masa molar media de las cadenas poliméricas de esta muestra de PLA.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula el número medio de unidades de monómero en cada cadena polimérica de esta muestra.</p><p><em>Si no obtuviste respuesta en (d), usa el valor incorrecto de 306 g mol<sup>−1</sup> como masa molar media.</em></p></div></div>
            <p>Se fabrican 286 000 toneladas de PLA al año.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Calcula la masa de NaOH necesaria para degradar completamente todo el PLA fabricado en un año hasta lactato de sodio. Supón que el PLA es puro e ignora la contribución de los grupos terminales.</p></div></div>
            <p>En realidad, el PLA puede degradarse mediante una enzima. Supón que una enzima degrada el PLA en una mezcla del monómero de ácido láctico y del compuesto <strong>B</strong> (un dímero del ácido láctico). Los plásticos comerciales contienen en realidad otros compuestos además del PLA. Supón que estos otros compuestos del plástico no reaccionan.</p>
            <p>Se degradó un plástico y se obtuvo una muestra de masa 1.044 g; se usaron valoraciones para determinar su composición. La muestra se disolvió en 100 cm<sup>3</sup> de agua para formar una disolución madre. Se necesitaron 19.40 cm<sup>3</sup> de disolución de NaOH 0.100 mol dm<sup>−3</sup> para neutralizar 20.00 cm<sup>3</sup> de esta disolución madre.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Calcula la cantidad de ácido en la muestra (en moles).</p></div></div>
            <p>El compuesto <strong>B</strong> se hidrolizó hirviéndolo en disolución de NaOH para ayudar a determinar las masas de ácido láctico y de compuesto <strong>B</strong>. Para ello se tomaron otros 20.00 cm<sup>3</sup> de la disolución madre y se mezclaron con 40.00 cm<sup>3</sup> de NaOH 0.100 mol dm<sup>−3</sup>. Se hirvió a reflujo durante 1 h. El NaOH restante se valoró con HCl 0.100 mol dm<sup>−3</sup>. El volumen gastado fue 18.50 cm<sup>3</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>Dibuja la estructura del compuesto <strong>B</strong>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(i)</span><div class="pc-part-body"><p>Calcula la masa de ácido láctico y la masa del compuesto <strong>B</strong> en la muestra.</p><p><em>Si no obtuviste respuesta en (g), usa el valor incorrecto de 8.60 × 10<sup>−3</sup> mol como cantidad de ácido en la muestra.</em></p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q45 — Esta pregunta trata sobre un plástico biodegradable <span class="pc-total-chip">Total: 13 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">2 puntos</span></div><div class="pc-free-host" data-esquema="size=md escala=1
la @0,0: CC(O)C(=O)O | ácido láctico | resaltar=1"></div><p>El carbono resaltado en amarillo (C-2, el que lleva H, OH, CH<sub>3</sub> y COOH) es el centro quiral <strong>C*</strong>.</p><p class="pc-note">Un punto por la estructura y otro por marcar correctamente el centro quiral.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; adición</td></tr><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; condensación</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; neutralización</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; oxidación</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; reducción</td></tr></tbody></table><p class="pc-note">Sin punto si se marca más de una casilla.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC1OC(=O)C(C)OC1=O"></span><span class="pc-compound-name">A: lactida (dímero cíclico)</span></div></div><p class="pc-note">No se requiere estereoquímica.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em>(KOH) = 0.0400 mol dm<sup>−3</sup> × 0.00681 dm<sup>3</sup> = 2.72 × 10<sup>−4</sup> mol = <em>n</em>(−COOH) = <em>n</em>(cadenas)</p><p class="pc-eq pc-math"><em>M</em><sub>cadena</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">0.1619 g</span><span class="pc-eq-frac-den">2.72 × 10<sup>−4</sup> mol</span></span> = <strong>595 g mol<sup>−1</sup></strong></p><p class="pc-note">Hace falta la respuesta correcta; no se da punto solo por el procedimiento.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>M</em><sub>cadena</sub> = <em>n</em> × <em>M</em>(unidad repetitiva) + <em>M</em>(H<sub>2</sub>O) = 72 <em>n</em> + 18</p><p class="pc-eq pc-math"><em>n</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">595 − 18</span><span class="pc-eq-frac-den">72</span></span> = <strong>8</strong> unidades</p><p class="pc-note">Con 306 g mol<sup>−1</sup> sale <em>n</em> = 4. ECF: (respuesta de (d) − 18)/72. Un punto si el planteamiento es correcto y solo hay un error (olvidar el −18, masa de la unidad errónea o fallo de cálculo).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p>Un mol de unidad repetitiva (72 g) reacciona con un mol de NaOH (40 g).</p><p class="pc-eq pc-math"><em>m</em>(NaOH) = 286 000 t × <span class="pc-eq-frac"><span class="pc-eq-frac-num">40 g mol<sup>−1</sup></span><span class="pc-eq-frac-den">72 g mol<sup>−1</sup></span></span> = <strong>1.59 × 10<sup>5</sup> t</strong> (159 000 toneladas)</p><p class="pc-note">Hace falta la respuesta correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em>(ácido) = 0.100 mol dm<sup>−3</sup> × 0.01940 dm<sup>3</sup> × <span class="pc-eq-frac"><span class="pc-eq-frac-num">100</span><span class="pc-eq-frac-den">20.00</span></span> = <strong>9.70 × 10<sup>−3</sup> mol</strong></p><p class="pc-note">Hace falta la respuesta correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(O)C(=O)OC(C)C(=O)O"></span><span class="pc-compound-name">B: dímero lineal del ácido láctico</span></div></div><p class="pc-note">No se requiere estereoquímica.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>n</em>(HCl) = 0.100 × 0.01850 = 1.85 × 10<sup>−3</sup> mol</p><p class="pc-eq pc-math"><em>n</em>(NaOH) que reaccionó con el PLA en la alícuota = (0.04000 × 0.100) − 1.85 × 10<sup>−3</sup> = 2.15 × 10<sup>−3</sup> mol</p><p class="pc-eq pc-math">en la disolución madre: 2.15 × 10<sup>−3</sup> × 5 = 1.075 × 10<sup>−2</sup> mol = <em>n</em>(unidades repetitivas)  &nbsp;<span style="font-size:.8em">(1.º punto)</span></p><p class="pc-eq pc-math"><em>n</em>(dímero) = 1.075 × 10<sup>−2</sup> − 9.70 × 10<sup>−3</sup> = 1.05 × 10<sup>−3</sup> mol</p><p class="pc-eq pc-math"><em>m</em>(dímero) = 162 g mol<sup>−1</sup> × 1.05 × 10<sup>−3</sup> mol = <strong>0.170 g</strong>  &nbsp;<span style="font-size:.8em">(2.º punto)</span></p><p class="pc-eq pc-math"><em>n</em>(monómero) = 1.075 × 10<sup>−2</sup> − 2 × 1.05 × 10<sup>−3</sup> = 8.65 × 10<sup>−3</sup> mol</p><p class="pc-eq pc-math"><em>m</em>(ácido láctico) = 90 g mol<sup>−1</sup> × 8.65 × 10<sup>−3</sup> mol = <strong>0.7785 g</strong>  &nbsp;<span style="font-size:.8em">(3.er punto)</span></p><p class="pc-note">Con el valor 8.60 × 10<sup>−3</sup> mol: dímero 0.348 g y ácido láctico 0.581 g. ECF: <em>m</em>(dímero) = 162 × (1.075 × 10<sup>−2</sup> − resultado de (g)); <em>m</em>(ácido láctico) = 90 × (1.075 × 10<sup>−2</sup> − 2 <em>n</em>(dímero)).</p></div>
        `
    },

    "q46-compuestos-litio-2018": {
        titulo: "Aplicaciones de compuestos de litio",

        enunciado: `
            <p class="pc-q-title">Q46 — Esta pregunta trata sobre las aplicaciones de algunos compuestos de litio</p>

            <div class="pc-intro">
                <p>Las baterías de iones de litio se están convirtiendo en una alternativa popular a las tradicionales baterías de plomo-ácido. Recientemente, la seguridad de las baterías de litio ha atraído la atención de los medios. En 2016, un importante fabricante retiró millones de teléfonos móviles por problemas con las baterías que se incendiaban o explotaban.</p>
            </div>
            <p>Las baterías de iones de litio tienen compuestos de litio intercalados como material de los electrodos. La intercalación es la inclusión o inserción reversible de una molécula (o ion) en materiales con estructura en capas.</p>
            <p>Durante la descarga, el cátodo es óxido de cobalto con iones litio intercalados, y el ánodo es grafito con iones litio intercalados. En los procesos de carga y descarga, los iones litio se mueven de un electrodo al otro a través de un electrolito, que suele ser una sal de litio disuelta en un disolvente orgánico. Si la batería se maneja según las instrucciones del fabricante, nunca se forma litio elemental en ella.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Durante la descarga, puede suponerse que la semirreacción en el cátodo es</p><p class="pc-eq pc-math">CoO<sub>2</sub> + Li<sup>+</sup> + e<sup>−</sup> &rarr; LiCoO<sub>2</sub></p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>¿Cuál es el estado de oxidación del cobalto en el CoO<sub>2</sub>?</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>¿Cuál es el estado de oxidación del cobalto en el LiCoO<sub>2</sub>?</p></div></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Si la batería se sobrecarga, puede formarse Li metálico en uno de los electrodos, lo que supone un grave riesgo de incendio. ¿En qué electrodo se formaría el Li? Marca la respuesta correcta.</p><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; A &nbsp;En el ánodo, que es el electrodo de óxido de cobalto.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; B &nbsp;En el cátodo, que es el electrodo de óxido de cobalto.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; C &nbsp;En el ánodo, que es el electrodo de grafito.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; D &nbsp;En el cátodo, que es el electrodo de grafito.</td></tr></tbody></table></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>El disolvente orgánico más usado en el electrolito se llama EC. Su fórmula molecular es C<sub>3</sub>H<sub>4</sub>O<sub>3</sub>. Uno de los productos de la hidrólisis del EC es el 1,2-etanodiol. Dibuja la estructura del EC.</p></div></div>
            <p>El litio arde violentamente en el aire produciendo una mezcla de óxido de litio y peróxido de litio (Li<sub>2</sub>O<sub>2</sub>).</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe la ecuación de la combustión del litio en el aire suponiendo que los dos productos se forman en una proporción molar 1 : 1.</p></div></div>
            <p>El peróxido de litio se usa para purificar el aire en espacios confinados, como submarinos y naves espaciales. Elimina el dióxido de carbono del aire y produce oxígeno.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Escribe una ecuación ajustada para la reacción entre el peróxido de litio y el dióxido de carbono.</p></div></div>
            <p>En la Estación Espacial Internacional se usa el compuesto <strong>A</strong> para almacenar oxígeno. El análisis elemental muestra que el compuesto <strong>A</strong> contiene 6.52 % de litio y 33.32 % de cloro en masa.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Determina la fórmula empírica del compuesto <strong>A</strong>.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Dibuja un diagrama de puntos y cruces del anión del compuesto <strong>A</strong>.</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Indica la forma del anión del compuesto <strong>A</strong>.</p></div><div class="pc-sub"><span class="pc-sub-label">(iv)</span><p>Escribe la ecuación de la descomposición del compuesto <strong>A</strong>. Supón que todos los átomos de oxígeno del compuesto <strong>A</strong> se liberan como oxígeno molecular en este proceso.</p></div></div></div>
            <p>La eficacia de un compuesto para almacenar oxígeno viene dada por su relación oxígeno : volumen (OV):</p>
            <p class="pc-eq pc-math">OV = <span class="pc-eq-frac"><span class="pc-eq-frac-num">volumen de oxígeno liberado</span><span class="pc-eq-frac-den">volumen del compuesto que lo liberó</span></span></p>
            <p>La densidad del compuesto <strong>A</strong> es 2.42 g cm<sup>−3</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Calcula la relación oxígeno : volumen (OV) del compuesto <strong>A</strong> a temperatura y presión ambiente.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q46 — Esta pregunta trata sobre las aplicaciones de algunos compuestos de litio <span class="pc-total-chip">Total: 10 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">CoO<sub>2</sub>: <strong>+4</strong> &nbsp;&nbsp;&nbsp; LiCoO<sub>2</sub>: <strong>+3</strong></p><p class="pc-note">Medio punto por cada estado de oxidación.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="width:100%"><tbody><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; A &nbsp;En el ánodo, que es el electrodo de óxido de cobalto.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; B &nbsp;En el cátodo, que es el electrodo de óxido de cobalto.</td></tr><tr><td style="text-align:left;padding:6px 10px;">&#9744;&nbsp; C &nbsp;En el ánodo, que es el electrodo de grafito.</td></tr><tr><td style="text-align:left;padding:6px 10px;font-weight:600">&#9745;&nbsp; D &nbsp;En el cátodo, que es el electrodo de grafito.</td></tr></tbody></table><p>El electrodo que es el ánodo (grafito) durante la descarga pasa a ser el cátodo durante la carga. El Li metálico se forma por reducción de los iones Li<sup>+</sup>, que ocurre en el cátodo, el electrodo basado en grafito.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="O=C1OCCO1"></span><span class="pc-compound-name">EC: carbonato de etileno</span></div></div></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">4 Li + <sup>3</sup>⁄<sub>2</sub> O<sub>2</sub> &rarr; Li<sub>2</sub>O + Li<sub>2</sub>O<sub>2</sub></p><p class="pc-eq pc-math">8 Li + 3 O<sub>2</sub> &rarr; 2 Li<sub>2</sub>O + 2 Li<sub>2</sub>O<sub>2</sub></p><p class="pc-note">Valen múltiplos. No hay puntuación parcial.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">2 Li<sub>2</sub>O<sub>2</sub> + 2 CO<sub>2</sub> &rarr; O<sub>2</sub> + 2 Li<sub>2</sub>CO<sub>3</sub></p><p class="pc-eq pc-math">Li<sub>2</sub>O<sub>2</sub> + CO<sub>2</sub> &rarr; <sup>1</sup>⁄<sub>2</sub> O<sub>2</sub> + Li<sub>2</sub>CO<sub>3</sub></p><p class="pc-note">No hay puntuación parcial.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">% de O = 100 − 6.52 − 33.32 = 60.16 %</p><p class="pc-eq pc-math"><em>n</em>(Li) : <em>n</em>(Cl) : <em>n</em>(O) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">6.52</span><span class="pc-eq-frac-den">6.94</span></span> : <span class="pc-eq-frac"><span class="pc-eq-frac-num">33.32</span><span class="pc-eq-frac-den">35.45</span></span> : <span class="pc-eq-frac"><span class="pc-eq-frac-num">60.16</span><span class="pc-eq-frac-den">16.00</span></span> = 0.939 : 0.940 : 3.76 = 1 : 1 : 4</p><p class="pc-eq pc-math"><strong>LiClO<sub>4</sub></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(ii)</span><span class="pc-marks">1 punto</span></div><div class="pc-dotcross"><svg viewBox="0 0 290 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de puntos y cruces del ion perclorato" style="width:350px;max-width:100%"><circle cx="150" cy="115" r="40" class="pc-dc-atom-circle"/><text x="150" y="121" class="pc-dc-atom-label">Cl</text><circle cx="150.0" cy="57.0" r="27" class="pc-dc-atom-circle"/><text x="150.0" y="63.0" class="pc-dc-atom-label">O</text><text x="141.5" y="90.5" class="pc-dc-cross">&times;</text><circle cx="154.0" cy="86.0" r="2.8" class="pc-dc-dot"/><circle cx="164.0" cy="43.5" r="2.8" class="pc-dc-dot"/><circle cx="168.2" cy="50.3" r="2.8" class="pc-dc-dot"/><circle cx="146.0" cy="38.0" r="2.8" class="pc-dc-dot"/><circle cx="154.0" cy="38.0" r="2.8" class="pc-dc-dot"/><circle cx="131.8" cy="50.3" r="2.8" class="pc-dc-dot"/><text x="131.5" y="48.0" class="pc-dc-cross">&times;</text><circle cx="208.0" cy="115.0" r="27" class="pc-dc-atom-circle"/><text x="208.0" y="121.0" class="pc-dc-atom-label">O</text><text x="174.5" y="115.5" class="pc-dc-cross">&times;</text><circle cx="179.0" cy="119.0" r="2.8" class="pc-dc-dot"/><circle cx="221.5" cy="129.0" r="2.8" class="pc-dc-dot"/><circle cx="214.7" cy="133.2" r="2.8" class="pc-dc-dot"/><circle cx="227.0" cy="111.0" r="2.8" class="pc-dc-dot"/><circle cx="227.0" cy="119.0" r="2.8" class="pc-dc-dot"/><circle cx="214.7" cy="96.8" r="2.8" class="pc-dc-dot"/><text x="217.0" y="105.5" class="pc-dc-cross">&times;</text><circle cx="150.0" cy="173.0" r="27" class="pc-dc-atom-circle"/><text x="150.0" y="179.0" class="pc-dc-atom-label">O</text><text x="149.5" y="148.5" class="pc-dc-cross">&times;</text><circle cx="146.0" cy="144.0" r="2.8" class="pc-dc-dot"/><circle cx="136.0" cy="186.5" r="2.8" class="pc-dc-dot"/><circle cx="131.8" cy="179.7" r="2.8" class="pc-dc-dot"/><circle cx="154.0" cy="192.0" r="2.8" class="pc-dc-dot"/><circle cx="146.0" cy="192.0" r="2.8" class="pc-dc-dot"/><circle cx="168.2" cy="179.7" r="2.8" class="pc-dc-dot"/><text x="159.5" y="191.0" class="pc-dc-cross">&times;</text><circle cx="92.0" cy="115.0" r="27" class="pc-dc-atom-circle"/><text x="92.0" y="121.0" class="pc-dc-atom-label">O</text><text x="116.5" y="123.5" class="pc-dc-cross">&times;</text><circle cx="121.0" cy="111.0" r="2.8" class="pc-dc-dot"/><circle cx="78.5" cy="101.0" r="2.8" class="pc-dc-dot"/><circle cx="85.3" cy="96.8" r="2.8" class="pc-dc-dot"/><circle cx="73.0" cy="119.0" r="2.8" class="pc-dc-dot"/><circle cx="73.0" cy="111.0" r="2.8" class="pc-dc-dot"/><circle cx="85.3" cy="133.2" r="2.8" class="pc-dc-dot"/><circle cx="78.5" cy="129.0" r="3.4" fill="none" stroke="#2a7a3b" stroke-width="1.6"/><text x="262" y="30" font-size="16" font-weight="600" fill="currentColor">1−</text></svg></div><p style="text-align:center;font-size:.85em">• electrones del O &nbsp; × electrones del Cl &nbsp; <span style="color:#2a7a3b">○</span> = electrón adicional (carga 1−)</p><p class="pc-note">Deben mostrarse todos los electrones de los oxígenos; vale alternar puntos y cruces. El electrón adicional puede marcarse con otro símbolo. No hay ECF si la fórmula de (i) es incorrecta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(iii)</span><span class="pc-marks">1 punto</span></div><p>(iii) Anión ClO<sub>4</sub><sup>−</sup>: <strong>tetraédrico</strong> (cuatro pares de enlace y ningún par solitario sobre el Cl).</p><p>(iv) Descomposición:</p><p class="pc-eq pc-math">LiClO<sub>4</sub> &rarr; 2 O<sub>2</sub> + LiCl</p><p class="pc-note">En esta tabla se agrupan (iii) y (iv): medio punto cada uno. No hay ECF si la fórmula de (i) es incorrecta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">1 mol de A (<em>M</em> = 106.39 g mol<sup>−1</sup>) libera 2 mol de O<sub>2</sub> = 2 × 24.0 dm<sup>3</sup> = 48.0 dm<sup>3</sup> = 48 000 cm<sup>3</sup></p><p class="pc-eq pc-math"><em>V</em>(A) = <span class="pc-eq-frac"><span class="pc-eq-frac-num">106.39 g</span><span class="pc-eq-frac-den">2.42 g cm<sup>−3</sup></span></span> = 43.96 cm<sup>3</sup></p><p class="pc-eq pc-math">OV = <span class="pc-eq-frac"><span class="pc-eq-frac-num">48 000 cm<sup>3</sup></span><span class="pc-eq-frac-den">43.96 cm<sup>3</sup></span></span> = <strong>1090</strong></p><p class="pc-note">La relación no tiene unidades: con unidades el máximo es 1 punto. Medio punto por el volumen de O<sub>2</sub>, medio por el volumen del compuesto y un punto por la relación.</p></div>

        titulo: "Síntesis de amoníaco",

        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 50th IChO, UK Round One 2018 (licencia CC BY-NC-SA). Autores originales: P. Bolgar, M. Jordan, B. Pilgrim, P. Robotham, D. Schofield, R. Simon, A. Taylor, A. Thom, B. Wicky. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph / SVG); las fotografías y figuras originales (© wk1003mike / Shutterstock, © Todd Klassy / Shutterstock, © U.S. Photonics / Nuclear Regulatory Commission, © Carl Court / Getty Images, © Cammep / iStock, © Macmillan Publishers Ltd) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q47 — Esta pregunta trata sobre la obtención de amoníaco</p>

            <div class="pc-intro">
                <p>El proceso Haber se usa para fabricar amoníaco, cuyo uso principal son los fertilizantes que a menudo se pulverizan sobre los cultivos. Alrededor del 1 % de toda la energía mundial se usa en el proceso Haber, por lo que hay grupos de investigación que buscan métodos de producción de amoníaco más sostenibles.</p>
            </div>
            <p>Al responder esta pregunta puede que necesites las siguientes relaciones y constantes:</p>
            <p class="pc-eq pc-math">Δ<em>G</em>° = Δ<em>H</em>° − <em>T</em>Δ<em>S</em>°</p><p class="pc-eq pc-math">Δ<em>G</em>° = −<em>nFE</em>°<sub>cel</sub></p><p class="pc-eq pc-math"><em>Q</em> = <em>It</em></p>
            <p>donde <em>n</em> es el número de electrones transferidos en la ecuación de la reacción de la celda; <em>F</em> es la constante de Faraday (la carga transportada por un mol de electrones), igual a 9.65 × 10<sup>4</sup> C mol<sup>−1</sup>; <em>E</em>°<sub>cel</sub> es el potencial de la celda electroquímica en voltios (1 V = 1 J C<sup>−1</sup>); <em>Q</em> es la carga eléctrica en culombios; <em>I</em> es la intensidad en amperios y <em>t</em> el tiempo en segundos. 1 tonelada = 1 × 10<sup>6</sup> g.</p>
            <p>Un enfoque publicado recientemente para obtener amoníaco usa el siguiente método de tres etapas:</p>
            <table class="pc-table"><thead><tr><th>Etapa</th><th>Proceso</th></tr></thead><tbody><tr><td>Etapa 1</td><td>Electrólisis de hidróxido de litio fundido a 750 K para formar litio metálico: 4 LiOH → 4 Li + 2 H<sub>2</sub>O + O<sub>2</sub></td></tr><tr><td>Etapa 2</td><td>Reacción del litio metálico con nitrógeno para formar nitruro de litio</td></tr><tr><td>Etapa 3</td><td>Reacción del nitruro de litio con agua para regenerar hidróxido de litio y formar amoníaco</td></tr></tbody></table>
            <p>Así, el hidróxido de litio formado en la Etapa 3 puede reutilizarse en la Etapa 1 y el proceso puede repetirse.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Escribe las dos semiecuaciones que se combinan para dar la ecuación global de la Etapa 1.</p></div></div>
            <p>La siguiente tabla recoge los datos termoquímicos (con 3 cifras significativas) de la Etapa 1.</p>
            <table class="pc-table"><thead><tr><th>A 750 K</th><th>LiOH</th><th>Li</th><th>H<sub>2</sub>O</th><th>O<sub>2</sub></th></tr></thead><tbody><tr><td>Δ<sub>f</sub><em>H</em>° / kJ mol<sup>−1</sup></td><td>−446</td><td>+15.0</td><td>−268</td><td>+15.8</td></tr><tr><td><em>S</em>° / J K<sup>−1</sup> mol<sup>−1</sup></td><td>+128</td><td>+63.7</td><td>+224</td><td>+236</td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Calcula para la Etapa 1 a 750 K:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Δ<em>H</em>° en kJ mol<sup>−1</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Δ<em>S</em>° en J K<sup>−1</sup> mol<sup>−1</sup></p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Δ<em>G</em>° en kJ mol<sup>−1</sup></p></div></div></div>
            <p>La electrólisis solo transcurrirá a una velocidad apreciable cuando el potencial aplicado supere en 0.60 V el potencial de la celda electroquímica.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Calcula el potencial mínimo que debe aplicarse en la Etapa 1.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe las ecuaciones de las Etapas 2 y 3 y calcula a partir de ellas la relación estequiométrica entre el litio producido en la Etapa 1 y el amoníaco producido en la Etapa 3.</p></div></div>
            <p>En un experimento a pequeña escala, los investigadores aplicaron una corriente de 0.200 A durante 1000 segundos. El rendimiento de la producción de litio en este proceso fue del 88.5 %. Puede suponerse que el rendimiento de las Etapas 2 y 3 es del 100 %.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Calcula la masa de litio generada en la Etapa 1.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Calcula el volumen de amoníaco producido, en cm<sup>3</sup>, a temperatura y presión ambiente.</p></div></div>
            <p>Una posible aplicación de este enfoque es usar fuentes de energía renovables como fuente de electricidad para la electrólisis y producir amoníaco en una granja, donde puede usarse de inmediato. El tamaño medio de una granja del Reino Unido es de 130 acres y una granja necesita 0.0770 toneladas de amoníaco por acre al año.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Si el hidróxido de litio no se reciclara al final del proceso, calcula la masa total de litio (en toneladas) que habría que producir para generar la masa de amoníaco necesaria durante un año.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q47 — Esta pregunta trata sobre la obtención de amoníaco <span class="pc-total-chip">Total: 12 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Li<sup>+</sup> + e<sup>−</sup> &rarr; Li</p><p class="pc-eq pc-math">4 OH<sup>−</sup> &rarr; 2 H<sub>2</sub>O + O<sub>2</sub> + 4 e<sup>−</sup></p><p class="pc-note">Medio punto por cada semiecuación; vale un múltiplo y debe estar completamente correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<em>H</em>° = [2(−268) + 15.8 + 4(15.0)] − [4(−446)] = <strong>+1.32 × 10<sup>3</sup> kJ mol<sup>−1</sup></strong> (+1324)</p><p class="pc-note">No se penaliza la ausencia del signo +, pero vale cero si es negativo.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<em>S</em>° = [4(63.7) + 2(224) + 236] − [4(128)] = <strong>+427 J K<sup>−1</sup> mol<sup>−1</sup></strong></p><p class="pc-note">No se penaliza la ausencia del signo +, pero vale cero si es negativo.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)(iii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">Δ<em>G</em>° = Δ<em>H</em>° − <em>T</em>Δ<em>S</em>° = 1324 kJ mol<sup>−1</sup> − (750 K × 0.427 kJ K<sup>−1</sup> mol<sup>−1</sup>) = <strong>+1.00 × 10<sup>3</sup> kJ mol<sup>−1</sup></strong> (+1004)</p><p class="pc-note">ECF: Δ<em>G</em>° = (i) − 0.75 × (ii).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>E</em>°<sub>cel</sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">−Δ<em>G</em>°</span><span class="pc-eq-frac-den"><em>nF</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">−1004 × 10<sup>3</sup> J mol<sup>−1</sup></span><span class="pc-eq-frac-den">4 × 9.65 × 10<sup>4</sup> C mol<sup>−1</sup></span></span> = −2.60 V</p><p class="pc-eq pc-math"><em>E</em><sub>mín. aplicado</sub> = 2.60 + 0.60 = <strong>+3.20 V</strong></p><p class="pc-note">Medio punto por −2.60 V (con signo) y medio por sumar 0.60 V al valor absoluto.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math">Etapa 2: &nbsp; 6 Li + N<sub>2</sub> &rarr; 2 Li<sub>3</sub>N</p><p class="pc-eq pc-math">Etapa 3: &nbsp; Li<sub>3</sub>N + 3 H<sub>2</sub>O &rarr; NH<sub>3</sub> + 3 LiOH</p><p class="pc-eq pc-math">relación Li : NH<sub>3</sub> = <strong>3 : 1</strong></p><p class="pc-note">Medio punto por cada ecuación y un punto por la relación; sin ECF desde ecuaciones incorrectas.</p></div>
