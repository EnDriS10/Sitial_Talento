    "q21-vapeo-2023": {
        titulo: "Vapeo y acetato de vitamina E",
        numero: "Q21",
        fuente: "55ª Olimpiada Internacional de Química (IChO) · UK Round One 2023",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 55th IChO, UK Round One 2023 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, S. Kang, JL Kiappes, B. Pilgrim, R. Plant, P. Robotham, A. Taylor, A. Thom, G. Trenins.",

        enunciado: `
            <p class="pc-q-title">Q21 — Vapeo y acetato de vitamina E</p>

            <div class="pc-intro">
                <p>Entre abril de 2019 y febrero de 2020 hubo 68 muertes por lesión pulmonar asociada al vapeo (VALI) en EE. UU. La mayoría de los líquidos de vapeo vinculados a los casos de VALI contenían en aquel momento acetato de vitamina E. Al ingerirse, el acetato de vitamina E es inocuo. Sin embargo, cuando se calienta a altas temperaturas, puede descomponerse en un compuesto muy tóxico.</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="CC(=O)Oc1c(C)c(C)c2OC(C)(CCCC(C)CCCC(C)CCCC(C)C)CCc2c1C"></span><span class="pc-compound-name">acetato de vitamina E</span></div></div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><div style="flex:1;min-width:0"><p>¿Qué grupo(s) funcional(es) contiene el acetato de vitamina E? Marca la(s) respuesta(s) correcta(s) en el cuadernillo.</p><table class="pc-table" style="table-layout:fixed;width:100%"><thead><tr><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Nitrilo</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Alcohol</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Éster</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Cetona</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Éter</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Ácido carboxílico</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>El acetato de vitamina E tiene fórmula molecular C<sub><em>x</em></sub>H<sub>52</sub>O<sub>3</sub>. Determina <em>x</em>.</p></div></div></div>
            <p>Se usaron varias técnicas analíticas para investigar el producto tóxico.</p>
            <p>En el espectro de masas del acetato de vitamina E, el pico a <em>m</em>/<em>z</em> = 165.2 procede del ion resultante de la pérdida del producto tóxico a partir del ion que da el pico a <em>m</em>/<em>z</em> = 207.2.</p>
            <p>El espectro de RMN de <sup>1</sup>H en CDCl<sub>3</sub> del producto tóxico tiene 1 señal.</p>
            <p>El espectro de RMN de <sup>13</sup>C en D<sub>2</sub>O del producto tóxico tiene 2 señales.</p>
            <p>Se muestran cuatro estructuras posibles para el producto tóxico. Solo una es correcta.</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C#CO"></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C=C=O"></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="CC(C)=O"></span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C1=CO1"></span></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>En la tabla del cuadernillo, indica (con &#10003; o &#10007;) si cada estructura es coherente con los datos de cada técnica analítica.</p></div></div>
            <p>Una síntesis del acetato de vitamina E incluye la reacción de Wittig. En esta reacción un aldehído (o cetona) reacciona con un iluro de fosfonio para dar un alqueno.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.4 gapx=8 gapy=30
ald @0,0: [*:1]C=O | aldehído
p1 @1,0: t:+
yl @2,0: [P+]([*:15])([*:15])([*:15])[CH-][*:2] | iluro de fosfonio
e @4,0: [*:1]/C=C/[*:2] | alqueno E
p2 @5,0: t:+
z @6,0: [*:1]/C=C\\[*:2] | alqueno Z
p3 @7,0: t:+
ph @8,0: t:Ph₃P=O
yl -&gt; e | ruta=recta"></div>
            <p>Ph = C<sub>6</sub>H<sub>5</sub>. Si hay un enlace C=O o C=C adyacente al carbono con carga negativa del iluro de fosfonio, el alqueno mayoritario es el isómero <em>E</em>. En caso contrario, el alqueno mayoritario es el isómero <em>Z</em>. En la tabla se muestran dos ejemplos de reactivos y del producto mayoritario de la reacción de Wittig.</p>
            <table class="pc-table"><thead><tr><th>aldehído/cetona</th><th>iluro de fosfonio</th><th>alqueno mayoritario</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC(C)C=O"></span></td><td><span class="pc-mol" data-size="md" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]C(C)(C)C"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="CC(C)/C=C\\C(C)(C)C"></span><br><em>isómero Z</em></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC=O"></span></td><td><span class="pc-mol" data-size="md" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]C(=O)C(C)(C)C"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="C/C=C/C(=O)C(C)(C)C"></span><br><em>isómero E</em></td></tr></tbody></table>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Completa en el cuadernillo la siguiente tabla de reacciones de Wittig.</p><table class="pc-table"><thead><tr><th>aldehído/cetona</th><th>iluro de fosfonio</th><th>alqueno mayoritario</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC=O"></span></td><td><span class="pc-mol" data-size="md" data-smiles="[P+]([*:15])([*:15])([*:15])[C-]1CCCCC1"></span></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC(C)C=O"></span></td><td><span class="pc-mol" data-size="md" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]/C=C/C=C/CC"></span></td><td></td></tr><tr><td></td><td></td><td><span class="pc-mol" data-size="sm" data-smiles="C/C=C/C=C\\CC"></span></td></tr><tr><td><em>o bien</em></td><td><em>o bien</em></td><td></td></tr></tbody></table></div></div>
            <p>La primera parte de la síntesis del acetato de vitamina E se muestra abajo.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.6 gapx=22 gapy=40
yl @2,0: [P+]([*:15])([*:15])([*:15])[CH-]C(C)=O | iluro de fosfonio
a @0,1: t:A | C₁₀H₁₂O₃
dia @1,1: CC(=O)Oc1c(C)c(C=O)c(OC(C)=O)c(C)c1C | C₁₄H₁₆O₅
b @3,1: t:B
c @3,2: t:C
d @2,2: t:D | C₁₅H₂₀O₃
by @2,3: CC(O)(C#C)C#C | + 2 × (subproducto)
al @0,2: CC(=O)Oc1c(C)c(C)c2OC(C)(C#C)CCc2c1C | C₁₇H₂₀O₃
a -&gt; dia | (CH3CO)2O
dia -&gt; b | Wittig | + iluro
b -&gt; c | H2
c -&gt; d | 1) 5 equiv. HC≡CMgBr | 2) H2O
d -&gt; al | 1) HCl(aq) | 2) (CH3CO)2O"></div>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Dibuja las estructuras de <strong>A</strong>, <strong>B</strong>, <strong>C</strong> y <strong>D</strong>.</p></div></div>
            <p>Al añadir HCl<sub>(aq)</sub>, <strong>D</strong> reacciona intramolecularmente para formar un anillo y una molécula de agua. Esta reacción transcurre a través de un carbocatión terciario intermedio.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Dibuja la estructura de este carbocatión.</p></div></div>
            <p>La segunda parte de la síntesis del acetato de vitamina E se muestra abajo.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=40 gapy=40
al @0,0: CC(=O)Oc1c(C)c(C)c2OC(C)(C#C)CCc2c1C | C₁₇H₂₀O₃
w @1,0: t:W
x @2,0: t:X | (+ subproducto Y)
z @2,1: t:Z
ve @1,1: CC(=O)Oc1c(C)c(C)c2OC(C)(/C=C\\CC(C)CCCC(C)CCCC(C)C)CCc2c1C
fin @0,1: CC(=O)Oc1c(C)c(C)c2OC(C)(CCCC(C)CCCC(C)CCCC(C)C)CCc2c1C | acetato de vitamina E
al -&gt; w | H2 | catalizador de Lindlar
w -&gt; x | O3 | Zn
x -&gt; z | Z
z -&gt; ve | Wittig con X
ve -&gt; fin | H2"></div>
            <p>La reacción que transforma <strong>W</strong> en la molécula <strong>X</strong> y el subproducto <strong>Y</strong> se llama ozonólisis. El esquema general de la ozonólisis, con ozono (O<sub>3</sub>) y Zn, es:</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.6 gapx=45 gapy=30
al @0,0: [*:1]C([*:2])=C([*:3])[*:4]
p1 @2,0: [*:1]C([*:2])=O
p2 @3,0: O=C([*:3])[*:4]
al -&gt; p1 | O3 | Zn"></div>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Dibuja las estructuras de <strong>W</strong>, <strong>X</strong>, del subproducto <strong>Y</strong> y del reactivo <strong>Z</strong>.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q21 — Vapeo y acetato de vitamina E <span class="pc-total-chip">Total: 21 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">2 puntos</span></div><table class="pc-table"><thead><tr><th>Nitrilo</th><th>Alcohol</th><th>Éster</th><th>Cetona</th><th>Éter</th><th>Ácido carboxílico</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong>&#10003;</strong></td><td>&nbsp;</td><td><strong>&#10003;</strong></td><td>&nbsp;</td></tr></tbody></table><p class="pc-note">Un punto por cada una (éster y éter); se resta un punto por cada respuesta incorrecta, hasta llegar a cero.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><p><em>x</em> = <strong>31</strong> (fórmula completa C<sub>31</sub>H<sub>52</sub>O<sub>3</sub>).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">3 puntos</span></div><table class="pc-table"><thead><tr><th>Estructura</th><th>¿Coherente con la espectrometría de masas?</th><th>¿Coherente con la RMN de <sup>1</sup>H?</th><th>¿Coherente con la RMN de <sup>13</sup>C?</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="C#CO"></span></td><td>&#10003;</td><td>&#10007;</td><td>&#10003;</td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C=C=O"></span></td><td>&#10003;</td><td>&#10003;</td><td>&#10003;</td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC(C)=O"></span></td><td>&#10007;</td><td>&#10003;</td><td>&#10003;</td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C1=CO1"></span></td><td>&#10003;</td><td>&#10003;</td><td>&#10007;</td></tr></tbody></table><p class="pc-note">Un punto por cada columna totalmente correcta. El producto tóxico es el <strong>cetena</strong> (H<sub>2</sub>C=C=O): los dos carbonos dan 2 señales de <sup>13</sup>C, los dos H equivalentes dan 1 señal de <sup>1</sup>H y la masa 42 corresponde a la pérdida de 207.2 &minus; 165.2.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(1)</span><span class="pc-marks">1 punto</span></div><table class="pc-table"><thead><tr><th>aldehído/cetona</th><th>iluro de fosfonio</th><th>alqueno mayoritario</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC=O"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="[P+]([*:15])([*:15])([*:15])[C-]1CCCCC1"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="CC=C1CCCCC1"></span></td></tr></tbody></table><p class="pc-note">Para el primer alqueno no hay diferencia entre los isómeros E y Z.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(2)</span><span class="pc-marks">1 punto</span></div><table class="pc-table"><thead><tr><th>aldehído/cetona</th><th>iluro de fosfonio</th><th>alqueno mayoritario</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC(C)C=O"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]/C=C/C=C/CC"></span></td><td><span class="pc-mol" data-size="md" data-smiles="CC(C)/C=C/C=C/C=C/CC"></span></td></tr></tbody></table><p class="pc-note">Para el segundo alqueno la estereoquímica debe ser correcta: <em>E</em> en los tres dobles enlaces.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(3)</span><span class="pc-marks">4 puntos</span></div><table class="pc-table"><thead><tr><th>aldehído/cetona</th><th>iluro de fosfonio</th><th>alqueno mayoritario</th></tr></thead><tbody><tr><td><span class="pc-mol" data-size="sm" data-smiles="CC=O"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]/C=C\\CC"></span></td><td><span class="pc-mol" data-size="md" data-smiles="C/C=C/C=C\\CC"></span></td></tr><tr><td><em>o bien</em></td><td><em>o bien</em></td><td></td></tr><tr><td><span class="pc-mol" data-size="sm" data-smiles="C/C=C/C=O"></span></td><td><span class="pc-mol" data-size="sm" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]CC"></span></td><td></td></tr></tbody></table><p class="pc-note">Un punto por cada respuesta; las dos filas pueden darse en cualquier orden y deben tener la estereoquímica correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">4 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Oc1c(C)c(C=O)c(O)c(C)c1C"></span><span class="pc-compound-name">A</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(=O)Oc1c(C)c(/C=C/C(C)=O)c(OC(C)=O)c(C)c1C"></span><span class="pc-compound-name">B (alqueno E)</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(=O)Oc1c(C)c(CCC(C)=O)c(OC(C)=O)c(C)c1C"></span><span class="pc-compound-name">C</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Oc1c(C)c(CCC(C)(O)C#C)c(O)c(C)c1C"></span><span class="pc-compound-name">D</span></div></div><p class="pc-note">Un punto por cada estructura. En B el alqueno debe ser E. Se admite arrastre de errores triviales en C y D si la transformación es correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="Oc1c(C)c(CC[C+](C)C#C)c(O)c(C)c1C"></span><span class="pc-compound-name">carbocatión terciario</span></div></div><p class="pc-note">Se admite arrastre de errores triviales, pero el catión debe ser terciario.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">4 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(=O)Oc1c(C)c(C)c2OC(C)(C=C)CCc2c1C"></span><span class="pc-compound-name">W</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(=O)Oc1c(C)c(C)c2OC(C)(C=O)CCc2c1C"></span><span class="pc-compound-name">X</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="C=O"></span><span class="pc-compound-name">Y (metanal)</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[P+]([*:15])([*:15])([*:15])[CH-]CC(C)CCCC(C)CCCC(C)C"></span><span class="pc-compound-name">Z (iluro de fosfonio)</span></div></div><p>Secuencia: <strong>W</strong> &rarr; (O<sub>3</sub>, Zn) <strong>X</strong> + <strong>Y</strong>; <strong>X</strong> + <strong>Z</strong> (Wittig, alqueno <em>Z</em>) &rarr; H<sub>2</sub> &rarr; acetato de vitamina E.</p><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="CC(=O)Oc1c(C)c(C)c2OC(C)(/C=C\\CC(C)CCCC(C)CCCC(C)C)CCc2c1C"></span><span class="pc-compound-name">alqueno Z (intermedio)</span></div></div><p class="pc-note">Un punto por cada estructura. Sin arrastre, porque se puede trabajar hacia atrás.</p></div>
        `
    },

    "q22-queso-2023": {
        titulo: "El queso",
        numero: "Q22",
        fuente: "55ª Olimpiada Internacional de Química (IChO) · UK Round One 2023",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 55th IChO, UK Round One 2023 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, S. Kang, JL Kiappes, B. Pilgrim, R. Plant, P. Robotham, A. Taylor, A. Thom, G. Trenins.",

        enunciado: `
            <p class="pc-q-title">Q22 — El queso</p>

            <div class="pc-intro">
                <p>La ex primera ministra Liz Truss dijo una vez que «importamos dos tercios de nuestro queso. Eso es una vergüenza».</p>
                <p>Cuando empezamos a escribir esta prueba, en el verano de 2022, pensamos que una pregunta sobre el queso sería oportuna, dado que la Olimpiada Internacional de Química de 2023 se celebraba en Suiza (un país con muchos quesos famosos) y que Liz Truss sería la primera ministra en el momento de la primera ronda.</p>
                <p>Aunque hay muchas diferencias en la elaboración del queso, la conversión de la lactosa en ácido láctico durante la fermentación es un proceso químico clave en todos los quesos.</p>
            </div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(O)C(=O)O"></span><span class="pc-compound-name">ácido láctico</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CCC(=O)O"></span><span class="pc-compound-name">ácido propanoico</span></div></div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>El ácido láctico tiene una constante de disociación ácida <em>K</em><sub>a</sub> = 1.38 &times; 10<sup>&minus;4</sup>.</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Dibuja la base conjugada del ácido láctico.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Calcula el p<em>K</em><sub>a</sub> del ácido láctico.</p></div></div></div>
            <p>El ácido láctico es más ácido que el ácido propanoico. Esto se debe a un enlace de hidrógeno que estabiliza su base conjugada.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Dibuja la estructura de la base conjugada del ácido láctico mostrando este enlace de hidrógeno.</p></div></div>
            <p>La lactosa, el azúcar de partida de la leche, es un disacárido de fórmula C<sub>12</sub>H<sub>22</sub>O<sub>11</sub>. En el primer paso de la conversión en ácido láctico, la lactosa se transforma en dos monosacáridos. Los monosacáridos posibles se muestran abajo; <strong>A</strong> y <strong>B</strong> son las dos unidades de la lactosa (A: la unidad de la izquierda, B: la de la derecha).</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="OC[C@H]1O[C@@H](O)[C@H](O)[C@@H](O)[C@@H]1%10.OC[C@H]1O[C@@H](O%10)[C@H](O)[C@@H](O)[C@H]1O"></span><span class="pc-compound-name">lactosa</span></div></div>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@H](O)[C@H](O)[C@@H]1O"></span><span class="pc-compound-name">alosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@H](O)[C@H](O)[C@H]1O"></span><span class="pc-compound-name">gulosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@H](O)[C@@H](O)[C@@H]1O"></span><span class="pc-compound-name">glucosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@H](O)[C@@H](O)[C@H]1O"></span><span class="pc-compound-name">galactosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@@H](O)[C@H](O)[C@H]1O"></span><span class="pc-compound-name">idosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@@H](O)[C@H](O)[C@@H]1O"></span><span class="pc-compound-name">altrosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@@H](O)[C@@H](O)[C@@H]1O"></span><span class="pc-compound-name">manosa</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="OC[C@H]1O[C@@H](O)[C@@H](O)[C@@H](O)[C@H]1O"></span><span class="pc-compound-name">talosa</span></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><div style="flex:1;min-width:0"><p>¿Cómo clasificarías la reacción de la lactosa para formar los dos monosacáridos? Marca la(s) respuesta(s) correcta(s) en el cuadernillo.</p><table class="pc-table" style="table-layout:fixed;width:100%"><thead><tr><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Oxidación</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Reducción</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Condensación</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Hidrólisis</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Isomerización</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Eliminación</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Escribe los nombres de los monosacáridos (A y B) que forman la lactosa.</p></div></div></div>
            <p>La conversión de lactosa en ácido láctico la realizan bacterias mediante un proceso bioquímico complejo, aunque el ácido láctico suele ser el único producto.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe una ecuación para la conversión de lactosa en ácido láctico.</p></div></div>
            <p>Muchas variedades de queso suizo, como el Emmental, son famosas por los agujeros u «ojos» que aparecen en el queso. Para producirlos es importante otra especie de bacteria, <em>Propionibacterium freudenreichii</em>. Esta bacteria realiza la reacción del ácido láctico para dar ácido propanoico, ácido etanoico, dióxido de carbono y agua. La producción de dióxido de carbono hace que aparezcan las burbujas.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Escribe una ecuación para la producción de dióxido de carbono que realiza esta bacteria. En la reacción neta, el ácido láctico es el único reactivo, y el ácido etanoico y el dióxido de carbono se producen en cantidades iguales.</p></div></div>
            <p>Supón que, durante la fermentación a 21 °C, aparece en el queso una burbuja esférica de 1.5 cm de diámetro.</p>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Calcula el volumen de esta burbuja en m<sup>3</sup>.</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Suponiendo que la burbuja es CO<sub>2</sub> puro a presión atmosférica, <em>p</em><sub>atm</sub> = 101 325 Pa, calcula la masa de ácido láctico que fermentaron las bacterias para producir esta burbuja. Supón que el CO<sub>2</sub> cumple la ley de los gases ideales, <em>pV</em> = <em>nRT</em>.</p></div></div></div>
            <p>Nota: el símbolo de estado para el queso es (ch). El dióxido de carbono disuelto en el queso puede existir de dos formas: CO<sub>2</sub> gaseoso disuelto, CO<sub>2(ch)</sub>, o hidrogenocarbonato disuelto, HCO<sub>3(ch)</sub><sup>&minus;</sup>.</p>
            <p class="pc-eq pc-math">CO<sub>2(ch)</sub> + H<sub>2</sub>O &rlarr; HCO<sub>3(ch)</sub><sup>&minus;</sup> + H<sup>+</sup><sub>(ch)</sub></p><p class="pc-eq pc-math"><em>K</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">[H<sup>+</sup><sub>(ch)</sub>] [HCO<sub>3(ch)</sub><sup>&minus;</sup>]</span><span class="pc-eq-frac-den">[CO<sub>2(ch)</sub>]</span></span> = 4.47 &times; 10<sup>&minus;7</sup> mol dm<sup>&minus;3</sup></p>
            <p>Al final de la fermentación, [CO<sub>2(ch)</sub>] + [HCO<sub>3(ch)</sub><sup>&minus;</sup>] = 3.70 &times; 10<sup>&minus;2</sup> mol dm<sup>&minus;3</sup> y pH = 5.20.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Calcula la concentración de equilibrio del dióxido de carbono disuelto en el queso, [CO<sub>2(ch)</sub>].</p></div></div>
            <p>Examinamos ahora cómo se forman en las primeras etapas de la fermentación burbujas («ojos») de CO<sub>2</sub> de cierto tamaño. Supón una burbuja de radio <em>r</em> en contacto con un volumen fijo de queso <em>V</em><sub>ch</sub> a temperatura <em>T</em>. La presión del CO<sub>2</sub> dentro de la burbuja, <em>p</em><sub>b</sub>, se relaciona con la concentración de CO<sub>2</sub> disuelto mediante la ley de Henry:</p>
            <div style="text-align:center"><svg viewBox="0 0 150 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Burbuja de CO2 de radio r en un volumen de queso V_ch" style="width:170px;max-width:100%;font-family:Inter,sans-serif"><circle cx="75" cy="65" r="58" fill="#f6c90e" fill-opacity=".8" stroke="currentColor" stroke-width="1.2"/><circle cx="75" cy="65" r="24" fill="#fff" stroke="currentColor" stroke-width="1.2"/><path d="M75,65 L92,48" stroke="currentColor" stroke-width="1.5"/><text x="88" y="66" font-size="13" font-style="italic" fill="#000">r</text><text x="108" y="106" font-size="13" font-style="italic" fill="currentColor">V<tspan baseline-shift="sub" font-size="9">ch</tspan></text></svg></div>
            <p class="pc-eq pc-math">[CO<sub>2(ch)</sub>] = <em>k</em><sub>H</sub> <em>p</em><sub>b</sub></p>
            <div class="pc-part"><span class="pc-part-label">(h)</span><div class="pc-part-body"><p>En la tabla del cuadernillo, marca qué expresión da las cantidades de CO<sub>2(g)</sub>, CO<sub>2(ch)</sub> y HCO<sub>3(ch)</sub><sup>&minus;</sup> en función de <em>p</em><sub>b</sub>, <em>r</em>, <em>k</em><sub>H</sub>, <em>V</em><sub>ch</sub>, <em>T</em>, pH y las constantes pertinentes.</p><div style="overflow-x:auto"><table class="pc-table" style="table-layout:fixed;min-width:780px;font-size:13px"><thead><tr><th style="width:70px"></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi;<em>r</em><sup>3</sup><em>p</em><sub>b</sub></span><span class="pc-eq-frac-den">3<em>RT</em></span></span></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi;<em>r</em><sup>3</sup><em>p</em><sub>b</sub></span><span class="pc-eq-frac-den">3<em>RT</em></span></span> <em>K</em> &middot; 10<sup>pH</sup></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><em>K</em> &middot; 10<sup>pH</sup> <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>V</em><sub>ch</sub><em>p</em><sub>b</sub></span><span class="pc-eq-frac-den">3<em>RT</em></span></span></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><em>K</em> &middot; 10<sup>&minus;pH</sup> <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub></th></tr></thead><tbody><tr><th><em>n</em><sub>CO<sub>2(g)</sub></sub></th><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><th><em>n</em><sub>CO<sub>2(ch)</sub></sub></th><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><th><em>n</em><sub>HCO<sub>3(ch)</sub><sup>&minus;</sup></sub></th><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div></div>
            <p>La suma de las cantidades de sustancia del inciso <strong>(h)</strong> es una constante, llamada &eta;, y la presión dentro de la burbuja se modela con la ecuación</p>
            <p class="pc-eq pc-math"><em>p</em><sub>b</sub> = <em>p</em><sub>atm</sub> + <span class="pc-eq-frac"><span class="pc-eq-frac-num">&gamma;</span><span class="pc-eq-frac-den"><em>r</em></span></span></p>
            <p>donde &gamma; es una constante.</p>
            <div class="pc-part"><span class="pc-part-label">(i)</span><div class="pc-part-body"><p>Sustituyendo esta expresión de <em>p</em><sub>b</sub>, expresa la suma de las cantidades de sustancia como</p><p class="pc-eq pc-math">(<em>a</em> + <em>b</em><em>r</em><sup>3</sup>) (<em>p</em><sub>atm</sub> + <span class="pc-eq-frac"><span class="pc-eq-frac-num">&gamma;</span><span class="pc-eq-frac-den"><em>r</em></span></span>) = &eta;</p><p>dando <em>a</em> y <em>b</em> en función de <em>k</em><sub>H</sub>, <em>V</em><sub>ch</sub>, <em>K</em>, <em>T</em>, pH y las constantes pertinentes.</p></div></div>
            <p>Esta ecuación da el tamaño de la burbuja, <em>r</em>, pero es demasiado complicada para resolverla a mano. En su lugar, usamos que &gamma;/<em>r</em> es pequeño comparado con <em>p</em><sub>atm</sub> para aproximarla con la ecuación más simple</p>
            <p class="pc-eq pc-math"><em>r</em> = (<span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>d</em></span><span class="pc-eq-frac-den"><em>b</em></span></span>)<sup>1/3</sup> (1 &minus; <span class="pc-eq-frac"><span class="pc-eq-frac-num">&gamma;&eta;</span><span class="pc-eq-frac-den">3<em>p</em><sub>atm</sub><sup>2</sup> <em>d</em></span></span> &middot; <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den"><em>r</em></span></span>) &nbsp;&nbsp;, donde &nbsp; <em>d</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">&eta;</span><span class="pc-eq-frac-den"><em>p</em><sub>atm</sub></span></span> &minus; <em>a</em></p>
            <p>En esta etapa de la fermentación: <em>a</em> = 1.70 &times; 10<sup>&minus;9</sup> mol Pa<sup>&minus;1</sup>; <em>b</em> = 1.75 &times; 10<sup>&minus;3</sup> mol Pa<sup>&minus;1</sup> m<sup>&minus;3</sup>; &eta; = 2.35 &times; 10<sup>&minus;4</sup> mol; &gamma; = 9.28 Pa m.</p>
            <div class="pc-part"><span class="pc-part-label">(j)</span><div class="pc-part-body"><p>Calcula los dos valores posibles de <em>r</em> que satisfacen la ecuación simplificada e indica cuál es la solución física correcta, coherente con que &gamma;/<em>r</em> sea pequeño frente a <em>p</em><sub>atm</sub>.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q22 — El queso <span class="pc-total-chip">Total: 20 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(i)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(O)C(=O)[O-]"></span><span class="pc-compound-name">lactato (base conjugada)</span></div></div><p class="pc-note">También se acepta la forma con la carga deslocalizada entre los dos oxígenos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">p<em>K</em><sub>a</sub> = &minus;log<sub>10</sub>(<em>K</em><sub>a</sub>) = &minus;log<sub>10</sub>(1.38&times;10<sup>&minus;4</sup>) = <strong>3.86</strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><div style="text-align:center"><svg viewBox="0 0 230 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lactato con enlace de hidrógeno intramolecular" style="width:250px;max-width:100%;font-family:Inter,sans-serif"><path d="M20,108 L52,90 L84,108 L116,90" stroke="currentColor" stroke-width="1.7" fill="none"/><line x1="84" y1="108" x2="84" y2="80" stroke="currentColor" stroke-width="1.7"/><text x="84" y="68" font-size="16" text-anchor="middle" fill="currentColor">O</text><text x="84" y="22" font-size="14" text-anchor="middle" fill="currentColor">H</text><line x1="84" y1="56" x2="84" y2="32" stroke="currentColor" stroke-width="1.7"/><path d="M116,90 L116,126" stroke="currentColor" stroke-width="1.7"/><path d="M122,90 L122,126" stroke="currentColor" stroke-width="1.7"/><text x="119" y="144" font-size="16" text-anchor="middle" fill="currentColor">O</text><path d="M116,90 L148,72" stroke="currentColor" stroke-width="1.7"/><text x="158" y="76" font-size="16" text-anchor="middle" fill="currentColor">O</text><circle cx="177" cy="62" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="173.5" y1="62" x2="180.5" y2="62" stroke="currentColor" stroke-width="1.4"/><path d="M92,26 L148,60" stroke="#d0323c" stroke-width="2.4" stroke-dasharray="3 3" fill="none"/></svg></div><p class="pc-note">Debe verse claramente que el enlace de hidrógeno procede del H del grupo hidroxilo y llega a un oxígeno del carboxilato.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(i)</span><span class="pc-marks">1 punto</span></div><table class="pc-table" style="table-layout:fixed;width:100%"><thead><tr><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Oxidación</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Reducción</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Condensación</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Hidrólisis</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Isomerización</th><th style="padding:6px 3px;font-size:12.5px;overflow-wrap:anywhere">Eliminación</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td><strong>&#10003;</strong></td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table><p class="pc-note">Sin puntos si se marca más de una respuesta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)(ii)</span><span class="pc-marks">2 puntos</span></div><table class="pc-table"><thead><tr><th>A</th><th>B</th></tr></thead><tbody><tr><td>glucosa</td><td>galactosa</td></tr></tbody></table><p class="pc-note">Un punto por cada una.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">C<sub>12</sub>H<sub>22</sub>O<sub>11</sub> + H<sub>2</sub>O &rarr; 4 C<sub>3</sub>H<sub>6</sub>O<sub>3</sub></p><p class="pc-note">Se aceptan múltiplos con estequiometría correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">3 C<sub>3</sub>H<sub>6</sub>O<sub>3</sub> &rarr; 2 C<sub>3</sub>H<sub>6</sub>O<sub>2</sub> + C<sub>2</sub>H<sub>4</sub>O<sub>2</sub> + CO<sub>2</sub> + H<sub>2</sub>O</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(i)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>V</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi; (0.5 &times; 1.5&times;10<sup>&minus;2</sup> m)<sup>3</sup></span><span class="pc-eq-frac-den">3</span></span> = <strong>1.77&times;10<sup>&minus;6</sup> m<sup>3</sup></strong></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)(ii)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><em>n</em><sub>CO<sub>2</sub></sub> = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>pV</em></span><span class="pc-eq-frac-den"><em>RT</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">101325 Pa &times; 1.77&times;10<sup>&minus;6</sup> m<sup>3</sup></span><span class="pc-eq-frac-den">8.314 J K<sup>&minus;1</sup> mol<sup>&minus;1</sup> &times; (21 + 273) K</span></span> = 7.337&times;10<sup>&minus;5</sup> mol</p><p class="pc-eq pc-math"><em>n</em><sub>C<sub>3</sub>H<sub>6</sub>O<sub>3</sub></sub> = 3 <em>n</em><sub>CO<sub>2</sub></sub> = 2.201&times;10<sup>&minus;4</sup> mol</p><p class="pc-eq pc-math"><em>M</em> = 90.078 g mol<sup>&minus;1</sup> &nbsp;&rArr;&nbsp; <em>m</em> = 2.201&times;10<sup>&minus;4</sup> mol &times; 90.078 g mol<sup>&minus;1</sup> = <strong>1.98&times;10<sup>&minus;2</sup> g</strong></p><p class="pc-note">Se admite arrastre de (e) y (f)(i).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">2 puntos</span></div><p>Con la concentración total <em>c</em><sub>tot</sub>: [CO<sub>2(ch)</sub>] + [HCO<sub>3(ch)</sub><sup>&minus;</sup>] = <em>c</em><sub>tot</sub> y <span class="pc-eq-frac"><span class="pc-eq-frac-num">[H<sup>+</sup>]([HCO<sub>3</sub><sup>&minus;</sup>])</span><span class="pc-eq-frac-den">[CO<sub>2</sub>]</span></span> = <em>K</em>. Sustituyendo [HCO<sub>3</sub><sup>&minus;</sup>] = <em>c</em><sub>tot</sub> &minus; [CO<sub>2</sub>]:</p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">[H<sup>+</sup>](<em>c</em><sub>tot</sub> &minus; [CO<sub>2(ch)</sub>])</span><span class="pc-eq-frac-den">[CO<sub>2(ch)</sub>]</span></span> = <em>K</em></p><p class="pc-eq pc-math">[H<sup>+</sup>] = 10<sup>&minus;pH</sup> = 10<sup>&minus;5.20</sup> mol dm<sup>&minus;3</sup></p><p class="pc-eq pc-math">[CO<sub>2(ch)</sub>] = <span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>c</em><sub>tot</sub></span><span class="pc-eq-frac-den">1 + <em>K</em>/[H<sup>+</sup>]</span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">3.70&times;10<sup>&minus;2</sup> mol dm<sup>&minus;3</sup></span><span class="pc-eq-frac-den">1 + <span class="pc-eq-frac"><span class="pc-eq-frac-num">4.47&times;10<sup>&minus;7</sup></span><span class="pc-eq-frac-den">10<sup>&minus;5.20</sup></span></span></span></span> = <strong>3.46&times;10<sup>&minus;2</sup> mol dm<sup>&minus;3</sup></strong></p><p class="pc-note">Punto completo por la concentración correcta; un punto por expresar bien [H<sup>+</sup>] en función del pH.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)</span><span class="pc-marks">3 puntos</span></div><div style="overflow-x:auto"><table class="pc-table" style="table-layout:fixed;min-width:780px;font-size:13px"><thead><tr><th style="width:70px"></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi;<em>r</em><sup>3</sup><em>p</em><sub>b</sub></span><span class="pc-eq-frac-den">3<em>RT</em></span></span></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi;<em>r</em><sup>3</sup><em>p</em><sub>b</sub></span><span class="pc-eq-frac-den">3<em>RT</em></span></span> <em>K</em> &middot; 10<sup>pH</sup></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><em>K</em> &middot; 10<sup>pH</sup> <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>V</em><sub>ch</sub><em>p</em><sub>b</sub></span><span class="pc-eq-frac-den">3<em>RT</em></span></span></th><th class="pc-math" style="font-weight:400;padding:6px 4px;font-size:13.5px;white-space:nowrap"><em>K</em> &middot; 10<sup>&minus;pH</sup> <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub></th></tr></thead><tbody><tr><th><em>n</em><sub>CO<sub>2(g)</sub></sub></th><td>&nbsp;</td><td><strong>&#10003;</strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><th><em>n</em><sub>CO<sub>2(ch)</sub></sub></th><td><strong>&#10003;</strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><th><em>n</em><sub>HCO<sub>3(ch)</sub><sup>&minus;</sup></sub></th><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td><strong>&#10003;</strong></td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><p>Para CO<sub>2(g)</sub>: <em>pV</em> = <em>nRT</em> &rArr; <em>n</em> = 4&pi;<em>r</em><sup>3</sup><em>p</em><sub>b</sub>/(3<em>RT</em>). Para CO<sub>2(ch)</sub>: <em>n</em> = [CO<sub>2(ch)</sub>] <em>V</em><sub>ch</sub> = <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub> (ley de Henry). Para HCO<sub>3(ch)</sub><sup>&minus;</sup>: <em>n</em> = [HCO<sub>3</sub><sup>&minus;</sup>] <em>V</em><sub>ch</sub> = <em>K</em> [CO<sub>2(ch)</sub>] <em>V</em><sub>ch</sub> / [H<sup>+</sup>] = <em>K</em> &middot; 10<sup>pH</sup> <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> <em>p</em><sub>b</sub>.</p><p class="pc-note">Un punto por cada identificación correcta. La deducción no se exige al estudiante.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(i)</span><span class="pc-marks">2 puntos</span></div><p class="pc-eq pc-math"><em>a</em> = <em>k</em><sub>H</sub> <em>V</em><sub>ch</sub> (1 + <em>K</em> &middot; 10<sup>pH</sup>) &nbsp;&nbsp; y &nbsp;&nbsp; <em>b</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi;</span><span class="pc-eq-frac-den">3<em>RT</em></span></span></p><p>Desarrollo: &eta; = <em>n</em><sub>CO<sub>2(ch)</sub></sub> + <em>n</em><sub>HCO<sub>3(ch)</sub><sup>&minus;</sup></sub> + <em>n</em><sub>CO<sub>2(g)</sub></sub> = [<em>k</em><sub>H</sub><em>V</em><sub>ch</sub>(1 + <em>K</em>&middot;10<sup>pH</sup>) + <span class="pc-eq-frac"><span class="pc-eq-frac-num">4&pi;<em>r</em><sup>3</sup></span><span class="pc-eq-frac-den">3<em>RT</em></span></span>] (<em>p</em><sub>atm</sub> + &gamma;/<em>r</em>).</p><p class="pc-note">Un punto por cada expresión correcta (<em>a</em> y <em>b</em>).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(j)</span><span class="pc-marks">3 puntos</span></div><p class="pc-eq pc-math"><em>d</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">2.35&times;10<sup>&minus;4</sup> mol</span><span class="pc-eq-frac-den">101325 Pa</span></span> &minus; 1.70&times;10<sup>&minus;9</sup> mol Pa<sup>&minus;1</sup> = 6.193&times;10<sup>&minus;10</sup> mol Pa<sup>&minus;1</sup></p><p class="pc-eq pc-math">(<span class="pc-eq-frac"><span class="pc-eq-frac-num"><em>d</em></span><span class="pc-eq-frac-den"><em>b</em></span></span>)<sup>1/3</sup> = 7.073&times;10<sup>&minus;3</sup> m</p><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">&gamma;&eta;</span><span class="pc-eq-frac-den">3<em>p</em><sub>atm</sub><sup>2</sup><em>d</em></span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">9.28 Pa m &times; 2.35&times;10<sup>&minus;4</sup> mol</span><span class="pc-eq-frac-den">3 &times; 101325<sup>2</sup> Pa<sup>2</sup> &times; 6.193&times;10<sup>&minus;10</sup> mol Pa<sup>&minus;1</sup></span></span> = 1.143&times;10<sup>&minus;4</sup> m</p><p class="pc-eq pc-math"><em>r</em> = 7.073&times;10<sup>&minus;3</sup> (1 &minus; 1.143&times;10<sup>&minus;4</sup>/<em>r</em>) &nbsp;&rArr;&nbsp; <em>r</em><sup>2</sup> &minus; 7.073&times;10<sup>&minus;3</sup> <em>r</em> + 8.087&times;10<sup>&minus;7</sup> = 0</p><p class="pc-eq pc-math"><em>r</em> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">2</span></span> &middot; 7.073&times;10<sup>&minus;3</sup> &plusmn; <span class="pc-sqrt"><svg class="pc-sqrt-sign" viewBox="0 0 15 30" preserveAspectRatio="none" aria-hidden="true"><path d="M1,17 L3.5,15.2 L7,27.5 L14.6,1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/></svg><span class="pc-sqrt-body">(<span class="pc-eq-frac"><span class="pc-eq-frac-num">1</span><span class="pc-eq-frac-den">2</span></span> &middot; 7.073&times;10<sup>&minus;3</sup>)<sup>2</sup> &minus; 8.087&times;10<sup>&minus;7</sup></span></span></p><p class="pc-eq pc-math"><em>r</em> = <strong>6.96&times;10<sup>&minus;3</sup> m</strong> &nbsp; o &nbsp; <em>r</em> = 1.16&times;10<sup>&minus;4</sup> m</p><p>Solo la primera raíz (<em>r</em> = 6.96&times;10<sup>&minus;3</sup> m) cumple que &gamma;/<em>r</em> sea pequeño frente a <em>p</em><sub>atm</sub>, así que es la solución física correcta.</p><p class="pc-note">Un punto por cada valor correcto de <em>r</em> y un punto por identificar el mayor (6.96&times;10<sup>&minus;3</sup> m) como solución física.</p></div>
        `

    "q23-gasolina-e10-2022": {
        titulo: "Gasolina E10",
        numero: "Q23",
        fuente: "54ª Olimpiada Internacional de Química (IChO) · UK Round One 2022",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 54th IChO, UK Round One 2022 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, M. Jordan, S. Kang, JL Kiappes, B. Pilgrim, P. Robotham, A. Taylor, A. Thom, G. Trenins. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph); las ilustraciones originales (© Prof. David Leigh, © Carla Keen) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q23 — Gasolina E10</p>

            <div class="pc-intro">
                <p>Para ayudar a combatir las causas del cambio climático, en septiembre de 2021 el gobierno del Reino Unido cambió el grado de gasolina estándar de los surtidores de E5 a E10. Estos valores E se refieren al porcentaje de etanol en la mezcla combustible etanol-hidrocarburo. Se ha argumentado que el cambio de E5 a E10 fue uno de los factores que contribuyeron a la escasez de gasolina de octubre de 2021, cuando los minoristas intentaron retirar sus existencias de E5.</p>
                <p>Los valores E y los índices de octano aparecen ambos en los surtidores. En la gasolina hay solo una pequeña proporción del isómero de cadena lineal del octano, porque tiende a «detonar» (<em>knock</em>) en el motor. La detonación ocurre cuando el combustible se enciende prematuramente y reduce la eficiencia del motor. Los isómeros de octano de cadena ramificada detonan mucho menos y abundan en la gasolina. Uno de los isómeros principales es el 2,2,4-trimetilpentano.</p>
            </div>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Dibuja la fórmula esquelética del 2,2,4-trimetilpentano.</p></div></div>
            <p>Mezclar etanol en combustibles como el E5 y el E10 también reduce la detonación. El etanol es un biocombustible que suele producirse fermentando azúcar de plantas de cultivo. Las plantas captan dióxido de carbono de la atmósfera y lo convierten en azúcares como la glucosa, C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>, mediante la fotosíntesis.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Escribe la ecuación de formación de la glucosa en la fotosíntesis a partir de dióxido de carbono.</p></div></div>
            <p>La fermentación anaerobia de la glucosa produce etanol y dióxido de carbono.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Escribe la ecuación de la fermentación anaerobia de la glucosa.</p></div></div>
            <p>Una de las características de un combustible eficaz es la cantidad de energía que libera, es decir, su entalpía de combustión. Un método para determinarla consiste en usar entalpías medias de enlace. Algunas de ellas se dan a continuación.</p>
            <table class="pc-table"><thead><tr><th>Enlace</th><th>Entalpía media de enlace / kJ mol<sup>−1</sup></th></tr></thead><tbody><tr><td>C–C</td><td>347</td></tr><tr><td>C–H</td><td>413</td></tr><tr><td>O=O</td><td>498</td></tr><tr><td>C–O</td><td>358</td></tr><tr><td>C=O</td><td>805</td></tr><tr><td>O–H</td><td>464</td></tr></tbody></table>
            <p>Calculada por este método, todos los isómeros del octano tienen el mismo valor.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Calcula la entalpía de combustión de un isómero del octano.</p></div></div>
            <p>Supón que 1 litro de combustible E10 contiene 100 mL de etanol y 900 mL de isómeros del octano, y que 1 litro de E5 contiene 50 mL de etanol y 950 mL de isómeros del octano. La densidad del etanol puro es 0.789 g cm<sup>−3</sup> y la de los isómeros del octano puros es 0.703 g cm<sup>−3</sup>. Puedes suponer que no hay cambio de volumen al mezclar.</p>
            <p>La entalpía de combustión del etanol calculada con entalpías medias de enlace es −1276 kJ mol<sup>−1</sup>.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Para los combustibles E5 y E10, calcula la energía, en kJ, que se libera al quemar 1 litro de cada uno.</p><p><em>Si no obtuviste respuesta en la parte (d), puedes usar un valor de −6666 kJ mol<sup>−1</sup> para la entalpía de combustión de los isómeros del octano en este cálculo.</em></p></div></div>
            <div class="pc-part"><span class="pc-part-label">(f)</span><div class="pc-part-body"><p>Tomando como 100 % la energía liberada al quemar 1 litro de E5, calcula el porcentaje de energía liberado al quemar 1 litro de E10.</p></div></div>
            <p>Todo el dióxido de carbono liberado por la combustión del etanol queda compensado por el dióxido de carbono captado cuando crecen las plantas. Por ello, la contribución del etanol no se cuenta al comparar las huellas de CO<sub>2</sub> de los combustibles E5 y E10.</p>
            <div class="pc-part"><span class="pc-part-label">(g)</span><div class="pc-part-body"><p>Tomando como 100 % el CO<sub>2</sub> producido al quemar 1 litro de E5, calcula el porcentaje de CO<sub>2</sub> producido al quemar 1 litro de E10. Considera solo el CO<sub>2</sub> formado en la combustión de los isómeros del octano.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q23 — Gasolina E10 <span class="pc-total-chip">Total: 9 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC(C)CC(C)(C)C"></span><span class="pc-compound-name">2,2,4-trimetilpentano</span></div></div><p class="pc-note">Solo se acepta la fórmula esquelética.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">6CO<sub>2</sub> + 6H<sub>2</sub>O &rarr; C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub></p><p class="pc-note">Debe estar totalmente correcta.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> &rarr; 2C<sub>2</sub>H<sub>5</sub>OH + 2CO<sub>2</sub></p><p class="pc-note">Debe estar totalmente correcta. Se acepta el etanol como C<sub>2</sub>H<sub>6</sub>O.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">C<sub>8</sub>H<sub>18</sub> + 12.5 O<sub>2</sub> &rarr; 8CO<sub>2</sub> + 9H<sub>2</sub>O</p><p>Entalpía total de enlace de los reactivos = [(7 × 347) + (18 × 413) + (12.5 × 498)] kJ mol<sup>−1</sup> = 16 088 kJ mol<sup>−1</sup></p><p>Entalpía total de enlace de los productos = [(16 × 805) + (18 × 464)] kJ mol<sup>−1</sup> = 21 232 kJ mol<sup>−1</sup></p><p class="pc-eq pc-math">&Delta;<sub>c</sub><em>H</em> = (16 088 − 21 232) kJ mol<sup>−1</sup> = <strong>−5144 kJ mol<sup>−1</sup></strong></p><p class="pc-note">Debe ser negativa. Debe estar referida a un mol de C<sub>8</sub>H<sub>18</sub> (no a una ecuación ajustada con 2C<sub>8</sub>H<sub>18</sub> y 25O<sub>2</sub>).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">3 puntos</span></div><p><strong>Etanol:</strong> −1276 kJ mol<sup>−1</sup> / 46.07 g mol<sup>−1</sup> = −27.70 kJ g<sup>−1</sup>; −27.70 kJ g<sup>−1</sup> × 0.789 g cm<sup>−3</sup> = −21.86 kJ cm<sup>−3</sup></p><p><strong>Octano:</strong> −5144 kJ mol<sup>−1</sup> / 114.22 g mol<sup>−1</sup> = −45.04 kJ g<sup>−1</sup>; −45.04 kJ g<sup>−1</sup> × 0.703 g cm<sup>−3</sup> = −31.66 kJ cm<sup>−3</sup></p><p class="pc-eq pc-math">Energía de 1 L de <strong>E5</strong> = (950 cm<sup>3</sup> × 31.66 kJ cm<sup>−3</sup>) + (50 cm<sup>3</sup> × 21.86 kJ cm<sup>−3</sup>) = <strong>31 170 kJ</strong></p><p class="pc-eq pc-math">Energía de 1 L de <strong>E10</strong> = (900 cm<sup>3</sup> × 31.66 kJ cm<sup>−3</sup>) + (100 cm<sup>3</sup> × 21.86 kJ cm<sup>−3</sup>) = <strong>30 680 kJ</strong></p><p><em>Ruta alternativa (por moles):</em> E5: 50 cm<sup>3</sup> × 0.789 / 46.07 = 0.8563 mol de etanol y 950 cm<sup>3</sup> × 0.703 / 114.22 = 5.847 mol de octano → (0.8563 × 1276) + (5.847 × 5144) = 31 170 kJ. E10: 1.713 mol de etanol y 5.539 mol de octano → 30 680 kJ.</p><p class="pc-note">Un punto por el valor −21.86 kJ cm<sup>−3</sup> del etanol, otro por −31.66 kJ cm<sup>−3</sup> del octano, y el tercero por ambas energías correctas (o, por la otra ruta, por los moles de etanol y octano de E5 y E10 y las dos energías). Se admite error arrastrado desde (d) o el uso de −6666 kJ mol<sup>−1</sup>.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(f)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">30 680 kJ</span><span class="pc-eq-frac-den">31 170 kJ</span></span> × 100 = <strong>98.4 %</strong></p><p class="pc-note">Se admite error arrastrado desde la parte (e).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(g)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math"><span class="pc-eq-frac"><span class="pc-eq-frac-num">900</span><span class="pc-eq-frac-den">950</span></span> × 100 = <strong>94.7 %</strong></p><p class="pc-note">El CO<sub>2</sub> del octano es proporcional al volumen de octano: 900 mL en E10 frente a 950 mL en E5.</p></div>
        `
    },

    "q24-oxido-nitroso-2022": {
        titulo: "Óxido nitroso",
        numero: "Q24",
        fuente: "54ª Olimpiada Internacional de Química (IChO) · UK Round One 2022",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 54th IChO, UK Round One 2022 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, M. Jordan, S. Kang, JL Kiappes, B. Pilgrim, P. Robotham, A. Taylor, A. Thom, G. Trenins. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph); las ilustraciones originales (© Prof. David Leigh, © Carla Keen) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q24 — La química del óxido nitroso</p>

            <div class="pc-intro">
                <p>El óxido nitroso, N<sub>2</sub>O, se usa como propelente en la nata montada, como aditivo para mejorar la combustión en motores de automóvil y como anestésico en medicina y odontología. Al inhalarlo puede provocar euforia histérica, de ahí su apodo de «gas de la risa». Hoy se sabe que su uso recreativo conlleva graves riesgos para la salud.</p>
            </div>
            <p>El óxido nitroso puede formarse a partir del ácido nitroso, HNO<sub>2</sub>, un ácido débil que se emplea en la fabricación de colorantes.</p>
            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Dibuja el diagrama de puntos y cruces del HNO<sub>2</sub>.</p></div></div>
            <p>El ácido nitroso puede convertirse en óxido nitroso por dos métodos distintos. El primero se muestra abajo. Primero, el ácido nitroso reacciona con O<sub>2</sub> para formar la molécula <strong>A</strong>. Después, <strong>A</strong> reacciona con amoniaco para formar una sal [<strong>B</strong><sup>+</sup>][<strong>C</strong><sup>−</sup>], que luego se descompone térmicamente en óxido nitroso y agua.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.5 gapx=60 gapy=30
h @0,0: t:HNO2
a @1,0: t:A
s @2,0: t:[B⁺][C⁻]
p @3,0: t:N2O + 2 H2O
h -&gt; a | O2
a -&gt; s | NH3
s -&gt; p | calor"></div>
            <p>El análisis elemental muestra que <strong>A</strong> contiene un 1.60 % de hidrógeno y un 22.23 % de nitrógeno en masa.</p>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Determina la fórmula de <strong>A</strong>.</p></div></div>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja los iones <strong>B</strong><sup>+</sup> y <strong>C</strong><sup>−</sup> mostrando claramente su forma.</p></div></div>
            <p>El segundo método descompone térmicamente el ácido nitroso. Por cada dos moléculas de ácido nitroso se forma una molécula de cada una de <strong>D</strong>, <strong>E</strong> y agua. <strong>E</strong> es un gas rojo parduzco en equilibrio con un gas incoloro <strong>X</strong>.</p>
            <p><strong>D</strong> y <strong>E</strong> reaccionan entre sí para formar la molécula <strong>F</strong>, que luego se descompone térmicamente en óxido nitroso y oxígeno.</p>
            <div class="pc-part"><span class="pc-part-label">(d)</span><div class="pc-part-body"><p>Escribe las fórmulas de <strong>D</strong>, <strong>E</strong>, <strong>F</strong> y <strong>X</strong>.</p></div></div>
            <p>El óxido nitroso es una molécula lineal con un átomo de nitrógeno en el medio.</p>
            <div class="pc-part"><span class="pc-part-label">(e)</span><div class="pc-part-body"><p>Dibuja la estructura del N<sub>2</sub>O.</p></div></div>

        `,

        respuesta: `
            <p class="pc-q-title">Q24 — La química del óxido nitroso <span class="pc-total-chip">Total: 9 puntos</span></p>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><div class="pc-dotcross"><svg viewBox="20 10 270 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de puntos y cruces de HNO2" style="width:400px;max-width:100%"><circle cx="60" cy="85" r="26" class="pc-dc-atom-circle"/><circle cx="108" cy="85" r="36" class="pc-dc-atom-circle"/><circle cx="168" cy="85" r="38" class="pc-dc-atom-circle"/><circle cx="228" cy="85" r="36" class="pc-dc-atom-circle"/><text x="60" y="93" class="pc-dc-atom-label">H</text><text x="108" y="93" class="pc-dc-atom-label">O</text><text x="168" y="93" class="pc-dc-atom-label">N</text><text x="228" y="93" class="pc-dc-atom-label">O</text><text x="74.5" y="82.5" class="pc-dc-cross">&times;</text><circle cx="79" cy="92" r="2.4" class="pc-dc-dot"/><circle cx="137" cy="78" r="2.4" class="pc-dc-dot"/><text x="132.5" y="96.5" class="pc-dc-cross">&times;</text><text x="189.5" y="70.5" class="pc-dc-cross">&times;</text><circle cx="204" cy="66" r="2.4" class="pc-dc-dot"/><text x="189.5" y="108.5" class="pc-dc-cross">&times;</text><circle cx="204" cy="104" r="2.4" class="pc-dc-dot"/><circle cx="101" cy="56" r="2.4" class="pc-dc-dot"/><circle cx="115" cy="56" r="2.4" class="pc-dc-dot"/><circle cx="101" cy="114" r="2.4" class="pc-dc-dot"/><circle cx="115" cy="114" r="2.4" class="pc-dc-dot"/><text x="156.5" y="56.5" class="pc-dc-cross">&times;</text><text x="170.5" y="56.5" class="pc-dc-cross">&times;</text><circle cx="221" cy="56" r="2.4" class="pc-dc-dot"/><circle cx="235" cy="56" r="2.4" class="pc-dc-dot"/><circle cx="257" cy="78" r="2.4" class="pc-dc-dot"/><circle cx="257" cy="92" r="2.4" class="pc-dc-dot"/></svg></div><p class="pc-note">Un enlace sencillo H–O, un enlace sencillo O–N y un doble enlace N=O (cuatro electrones compartidos), con los pares solitarios restantes en cada átomo.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">H: <span class="pc-eq-frac"><span class="pc-eq-frac-num">1.60</span><span class="pc-eq-frac-den">1.008</span></span> = 1.587 mol</p><p class="pc-eq pc-math">N: <span class="pc-eq-frac"><span class="pc-eq-frac-num">22.23</span><span class="pc-eq-frac-den">14.01</span></span> = 1.587 mol</p><p class="pc-eq pc-math">O: <span class="pc-eq-frac"><span class="pc-eq-frac-num">100 − 1.60 − 22.23</span><span class="pc-eq-frac-den">16.00</span></span> = <span class="pc-eq-frac"><span class="pc-eq-frac-num">76.17</span><span class="pc-eq-frac-den">16.00</span></span> = 4.761 mol</p><p class="pc-eq pc-math">H : N : O = 1 : 1 : 3</p><p><strong>A es HNO<sub>3</sub></strong> (ácido nítrico).</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound"><svg viewBox="0 0 150 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ion amonio tetraédrico" style="width:170px;max-width:100%;font-family:Inter,sans-serif;font-size:17px"><line x1="75" y1="62" x2="75" y2="22" stroke="currentColor" stroke-width="1.8"/><line x1="75" y1="62" x2="32" y2="82" stroke="currentColor" stroke-width="1.8"/><polygon points="75,62 112,80 114,90 " fill="currentColor"/><polygon points="75,62 114,74 118,86 112,80" fill="currentColor"/><line x1="74.5" y1="67.8" x2="76.9" y2="68.5" stroke="currentColor" stroke-width="1.4"/><line x1="74.3" y1="73.7" x2="78.5" y2="74.9" stroke="currentColor" stroke-width="1.4"/><line x1="74.1" y1="79.5" x2="80.1" y2="81.3" stroke="currentColor" stroke-width="1.4"/><line x1="74.0" y1="85.4" x2="81.8" y2="87.7" stroke="currentColor" stroke-width="1.4"/><line x1="73.8" y1="91.3" x2="83.4" y2="94.2" stroke="currentColor" stroke-width="1.4"/><line x1="73.6" y1="97.1" x2="85.0" y2="100.6" stroke="currentColor" stroke-width="1.4"/><text x="75" y="14" text-anchor="middle" fill="currentColor">H</text><text x="22" y="90" text-anchor="middle" fill="currentColor">H</text><text x="124" y="96" text-anchor="middle" fill="currentColor">H</text><text x="80" y="122" text-anchor="middle" fill="currentColor">H</text><text x="75" y="68" text-anchor="middle" fill="currentColor" style="font-size:18px">N</text><circle cx="94" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M91,50 h6 M94,47 v6" stroke="currentColor" stroke-width="1.2"/></svg><span class="pc-compound-name">B⁺ = NH₄⁺ (tetraédrico)</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[O-][N+](=O)[O-]"></span><span class="pc-compound-name">C⁻ = NO₃⁻ (trigonal plano)</span></div></div><p class="pc-note">Un punto por cada ion. El amonio debe verse aproximadamente tetraédrico (no cuadrado plano) y el nitrato aproximadamente trigonal plano; se admiten estructuras deslocalizadas para el nitrato.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">4 puntos</span></div><p class="pc-eq pc-math"><strong>D</strong> = NO &nbsp;&nbsp; <strong>E</strong> = NO<sub>2</sub> &nbsp;&nbsp; <strong>F</strong> = N<sub>2</sub>O<sub>3</sub> &nbsp;&nbsp; <strong>X</strong> = N<sub>2</sub>O<sub>4</sub></p><p class="pc-eq pc-math">2HNO<sub>2</sub> &rarr; NO + NO<sub>2</sub> + H<sub>2</sub>O &nbsp;·&nbsp; NO + NO<sub>2</sub> &rarr; N<sub>2</sub>O<sub>3</sub> &nbsp;·&nbsp; N<sub>2</sub>O<sub>3</sub> &rarr; N<sub>2</sub>O + O<sub>2</sub> &nbsp;·&nbsp; 2NO<sub>2</sub> &#8652; N<sub>2</sub>O<sub>4</sub></p><p class="pc-note">Un punto por cada fórmula.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(e)</span><span class="pc-marks">1 punto</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="N#[N+][O-]"></span><span class="pc-compound-name">N≡N⁺–O⁻</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="[N-]=[N+]=O"></span><span class="pc-compound-name">⁻N=N⁺=O</span></div></div><p class="pc-note">Se acepta cualquiera de las dos estructuras. No se acepta ninguna estructura con cinco enlaces al nitrógeno.</p></div>
        `
    },

    "q25-cubano-2022": {
        titulo: "El cubano",
        numero: "Q25",
        fuente: "54ª Olimpiada Internacional de Química (IChO) · UK Round One 2022",
        creditos: "Adaptado y traducido al español a partir de: Royal Society of Chemistry — 54th IChO, UK Round One 2022 (licencia CC BY-NC-SA). Autores originales: H. Alonzi, R. Beattie, P. Bolgar, C. Francis, M. Jordan, S. Kang, JL Kiappes, B. Pilgrim, P. Robotham, A. Taylor, A. Thom, G. Trenins. Las estructuras, esquemas y diagramas están generados por código propio (RDKit / MolGraph); las ilustraciones originales (© Prof. David Leigh, © Carla Keen) se enlazan desde su alojamiento externo.",

        enunciado: `
            <p class="pc-q-title">Q25 — El cubano</p>

            <div class="pc-figrow"><div class="pc-figtext"><p>Los sólidos platónicos son formas tridimensionales en las que todas las caras, aristas y ángulos son congruentes (idénticos). Solo hay cinco sólidos así. Platón supuso que los elementos clásicos —aire, tierra, fuego y agua— correspondían cada uno a una de esas formas.</p><p>Con los avances de la química en los últimos 2360 años, ya no pensamos que haya cuatro elementos ni que estén hechos de sólidos platónicos. Sin embargo, sí podemos fabricar un sólido platónico con elementos.</p><p>Una de esas moléculas, el cubano, resulta de interés y de posible utilidad por su estructura tan inusual.</p></div><div class="pc-figside"><figure class="pc-figure" style="margin:0"><img src="https://i.imgur.com/tCYClav.png" alt="Fórmula esquelética del cubano" loading="lazy" style="max-width:190px;width:100%"><figcaption>Fórmula esquelética del cubano</figcaption></figure></div></div>

            <div class="pc-part"><span class="pc-part-label">(a)</span><div class="pc-part-body"><p>Indica la fórmula molecular del cubano.</p></div></div>
            <p>Una síntesis del cubano transcurre a través del ácido cubano-1,4-dicarboxílico. Abajo se muestran las estructuras del ácido cubanocarboxílico y de los tres isómeros del ácido cubanodicarboxílico.</p>
            <div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="cubo:5=COOH"></span><span class="pc-compound-name">ácido cubanocarboxílico</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="cubo:5=COOH,6=COOH"></span><span class="pc-compound-name">ácido cubano-1,2-dicarboxílico</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="cubo:0=COOH,2=COOH"></span><span class="pc-compound-name">ácido cubano-1,3-dicarboxílico</span></div><div class="pc-compound "><span class="pc-mol" data-size="sm" data-smiles="cubo:3=COOH,5=COOH"></span><span class="pc-compound-name">ácido cubano-1,4-dicarboxílico</span></div></div>
            <div class="pc-part"><span class="pc-part-label">(b)</span><div class="pc-part-body"><p>Completa la tabla del cuadernillo con el número de picos del espectro de RMN de <sup>13</sup>C de:</p><div class="pc-sub"><span class="pc-sub-label">(i)</span><p>Cubano</p></div><div class="pc-sub"><span class="pc-sub-label">(ii)</span><p>Ácido cubanocarboxílico</p></div><div class="pc-sub"><span class="pc-sub-label">(iii)</span><p>Ácido cubano-1,2-dicarboxílico</p></div><div class="pc-sub"><span class="pc-sub-label">(iv)</span><p>Ácido cubano-1,3-dicarboxílico</p></div><div class="pc-sub"><span class="pc-sub-label">(v)</span><p>Ácido cubano-1,4-dicarboxílico.</p></div></div></div>
            <p>El comienzo de la síntesis del cubano se muestra abajo.</p>
            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=60 gapy=36
cp @0,0: O=C1CCCC1
a @1,0: t:A | C₇H₁₂O₂
b @2,0: t:B | C₇H₉O₂Br₃
c @2,1: t:C | C₇H₇O₂Br
d @1,1: BrC12C=CC(C1%10OCCO%10)C%14C2C=C(Br)C%14%15OCCO%15 | D | tam=lg
cp -&gt; a | HOCH2CH2OH | H2SO4
a -&gt; b | Br2 | (3 equivalentes)
b -&gt; c | NaOH (exceso)
c -&gt; d | Diels–Alder | (rápida)
corchete: c"></div>
            <p>Se trató <strong>A</strong> con tres equivalentes de Br<sub>2</sub> para formar <strong>B</strong>. En <strong>B</strong>, de fórmula molecular C<sub>7</sub>H<sub>9</sub>O<sub>2</sub>Br<sub>3</sub>, cada uno de los tres átomos de bromo está exactamente a <strong>tres enlaces</strong> de distancia de los dos átomos de oxígeno.</p>
            <p>Después se hizo reaccionar <strong>B</strong> con hidróxido de sodio en exceso. Se propone que esta reacción transcurre a través del intermedio <strong>C</strong>, que luego reacciona con otra molécula de sí mismo para formar el compuesto <strong>D</strong>.</p>
            <div class="pc-part"><span class="pc-part-label">(c)</span><div class="pc-part-body"><p>Dibuja las estructuras de <strong>A</strong> y <strong>B</strong>.</p></div></div>
            <p>La reacción de <strong>C</strong> a <strong>D</strong> se conoce como cicloadición de Diels–Alder. El ejemplo más sencillo, entre butadieno y eteno, se muestra a continuación.</p>
            <svg viewBox="0 0 440 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mecanismo de la cicloadición de Diels-Alder entre butadieno y eteno" style="max-width:480px;width:100%;display:block;margin:8px auto;font-family:Inter,sans-serif;font-size:12px"><defs><marker id="da-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9z" fill="#d0323c"/></marker><marker id="da-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9z" fill="currentColor"/></marker></defs><g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"><line x1="31.8" y1="81.3" x2="56.8" y2="46.3"/><line x1="28.2" y1="78.7" x2="53.2" y2="43.7"/><line x1="55" y1="45" x2="105" y2="45"/><line x1="103.2" y1="46.3" x2="128.2" y2="81.3"/><line x1="106.8" y1="43.7" x2="131.8" y2="78.7"/><line x1="55.0" y1="137.2" x2="105.0" y2="137.2"/><line x1="55.0" y1="132.8" x2="105.0" y2="132.8"/><line x1="350.0" y1="48.0" x2="386.4" y2="69.0"/><line x1="386.4" y1="69.0" x2="386.4" y2="111.0"/><line x1="386.4" y1="111.0" x2="350.0" y2="132.0"/><line x1="350.0" y1="132.0" x2="313.6" y2="111.0"/><line x1="313.6" y1="111.0" x2="313.6" y2="69.0"/><line x1="314.7" y1="70.9" x2="351.1" y2="49.9"/><line x1="312.5" y1="67.1" x2="348.9" y2="46.1"/></g><g stroke="#d0323c" stroke-width="1.6" fill="none" marker-end="url(#da-h)"><path d="M41,64 Q48,32 78,40" marker-end="url(#da-h)"/><path d="M120,62 Q158,86 120,106" marker-end="url(#da-h)"/><path d="M72,135 Q38,140 38,108" marker-end="url(#da-h)"/></g><line x1="205" y1="90" x2="268" y2="90" stroke="currentColor" stroke-width="1.6" marker-end="url(#da-k)"/><text x="80" y="166" text-anchor="middle" fill="currentColor">butadieno (s-cis) + eteno</text><text x="236" y="80" text-anchor="middle" fill="currentColor">calor</text><text x="350" y="158" text-anchor="middle" fill="currentColor">ciclohexeno</text></svg>
            <p>Los tres pares de electrones π se desplazan a la vez (mecanismo concertado, flechas rojas): el dieno (en conformación s-cis) y el dienófilo forman dos enlaces σ nuevos y aparece un doble enlace entre los carbonos centrales del dieno.</p>
            <p>Otros tres ejemplos de cicloadiciones de Diels–Alder se muestran abajo:</p>

            <div class="pc-free-host" data-esquema="size=sm escala=0.62 gapx=60 gapy=40

            <p>El compuesto <strong>D</strong> reacciona con ácido acuoso para formar el compuesto <strong>E</strong>, que al exponerse a luz UV reacciona <strong>intra</strong>molecularmente para formar el compuesto <strong>F</strong>. El compuesto <strong>F</strong> contiene dos anillos de cuatro miembros.</p>
            <p>Por último, <strong>F</strong> se hace reaccionar con hidróxido de sodio y después con ácido clorhídrico. Esto da lugar a una reacción conocida como transposición de Favorskii. La reacción general de la transposición de Favorskii es:</p>

            <p>Los dos materiales de partida experimentan una reacción de Diels–Alder para formar <strong>Q</strong>. Se forma un anillo adicional para dar el producto <strong>R</strong>, que después reacciona para dar tres productos, uno de los cuales se muestra. El compuesto <strong>S</strong> es un gas, y el compuesto <strong>T</strong>, tratado con NaOH, da ácido barreleno-1,2-dicarboxílico.</p>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(a)</span><span class="pc-marks">1 punto</span></div><p class="pc-eq pc-math">C<sub>8</sub>H<sub>8</sub></p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(b)</span><span class="pc-marks">3 puntos</span></div><table class="pc-table"><thead><tr><th>Molécula</th><th>Nº de picos en RMN de <sup>13</sup>C</th></tr></thead><tbody><tr><td>Cubano</td><td>1</td></tr><tr><td>Ácido cubanocarboxílico</td><td>5</td></tr><tr><td>Ácido cubano-1,2-dicarboxílico</td><td>4</td></tr><tr><td>Ácido cubano-1,3-dicarboxílico</td><td>5</td></tr><tr><td>Ácido cubano-1,4-dicarboxílico</td><td>3</td></tr></tbody></table><p class="pc-note">3 puntos si las cinco son correctas; 2 puntos con tres o cuatro correctas; 1 punto con una o dos.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(c)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="C1COC2(O1)CCCC2"></span><span class="pc-compound-name">A</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="BrC1CCC(Br)(Br)C12OCCO2"></span><span class="pc-compound-name">B</span></div></div><p class="pc-note">Un punto por cada estructura. A es el cetal etilénico (1,4-dioxaespiro[4.4]nonano) de la ciclopentanona; B lleva un Br en un carbono α y dos en el otro α, todos a tres enlaces de los O.</p></div>
<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(d)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="CC1=C(C)CC(C)CC1"></span><span class="pc-compound-name">W (1,2,4-trimetilciclohexeno)</span></div><div class="pc-compound "><span class="pc-mol" data-size="md" data-smiles="BrCC1C(CBr)C2C=CC1C2"></span><span class="pc-compound-name">X (aducto con CH₂Br en carbonos contiguos)</span></div></div><p class="pc-note">Un punto por cada estructura. No se exige estereoquímica; se aceptan ambas representaciones del norborneno.</p></div>

<div class="pc-answer"><div class="pc-answer-head"><span class="pc-part-label">(h)(F)</span><span class="pc-marks">2 puntos</span></div><div class="pc-compounds"><div class="pc-compound "><span class="pc-mol" data-size="lg" data-smiles="BrC12C%20C%21C(C1=O)C%14C2C%20C%21(Br)C%14=O"></span><span class="pc-compound-name">F</span></div></div><p class="pc-note">Dos puntos si es correcta; se admite error arrastrado desde E por cualquier error razonable de sustituyente. F es el producto de la cicloadición [2+2] intramolecular (dos anillos de cuatro miembros).</p></div>
