<!DOCTYPE html>
<html lang="es">
<head>
<!-- Fija la carpeta REAL del archivo (Problem_Data/) como base ANTES de
     que el script de más abajo cambie lo que se ve en la barra de
     direcciones a la ruta bonita (p.ej. /Banco_Problemas/q1-piscina/
     enunciado). Sin esto, en cuanto la URL visible aparenta estar 2
     niveles más profunda de lo que realmente está, el navegador
     resolvería mal todas las rutas relativas de esta página
     (fetch('problemas_contenido.html'), '../Banco_Problemas.html', etc.)
     — el mismo problema que motivó el <base> de index.html. -->
<base id="pv-base-href" href="/">
<script>
    (function () {
        // En este punto location.pathname es siempre la ruta REAL
        // (.../Problem_Data/visor.html), ya que cualquier acceso por la
        // ruta bonita pasa antes por 404.html, que redirige aquí de
        // verdad (ver 404.html). Así que basta con quitar el nombre de
        // archivo para quedarnos con la carpeta real.
        var p = location.pathname.replace(/visor\.html$/, '');
        document.getElementById('pv-base-href').href = location.origin + p;
    })();
</script>
<!-- Oculta la ruta real (Problem_Data/visor.html?id=..&tab=..) y muestra
     la bonita (Banco_Problemas/<id>/<tab>) en la barra de direcciones,
     tanto si se llegó aquí por un enlace directo como por la
     redirección de 404.html. Guarda id/tab en variables globales ANTES
     de reescribir la URL, porque el replaceState() de abajo borra el
     query string (?id=..&tab=..) que el script principal, más abajo en
     la página, necesita leer. -->
<script>
    (function (l) {
        var params = new URLSearchParams(l.search);
        window.__pvId  = params.get('id') || '';
        window.__pvTab = ['tu-respuesta', 'respuesta'].indexOf(params.get('tab')) >= 0 ? params.get('tab') : 'enunciado';
        if (/\/Problem_Data\/visor\.html$/.test(l.pathname) && window.__pvId) {
            var repoRoot = l.pathname.replace(/Problem_Data\/visor\.html$/, '');
            history.replaceState(null, '',
                repoRoot + 'Banco_Problemas/' + encodeURIComponent(window.__pvId) + '/' + window.__pvTab + l.hash
            );
        }
    }(window.location));
</script>

        border-radius: 7px; padding: 2px 9px; height: fit-content; font-size: 14px;
    }
    [data-theme="dark"] .pc-part-label { color: var(--gold-light); background: rgba(255,255,255,.08); }
    .pc-part-body { flex: 1; min-width: 0; }
    .pc-part-body p:last-child { margin-bottom: 0; }
    .pc-sub { display: flex; gap: 8px; margin: 6px 0; padding-left: 4px; }
    .pc-sub-label { flex-shrink: 0; font-weight: 700; color: var(--text-muted); font-size: 13.5px; }
    .pc-sub p { margin: 0 !important; }

    .pc-compounds { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 18px; }
    .pc-compound {
        display: flex; flex-direction: column; gap: 3px;
        background: rgba(4,18,43,.035); border: 1px solid var(--border);
        border-radius: 10px; padding: 8px 12px; min-width: 140px;
    }
    [data-theme="dark"] .pc-compound { background: rgba(255,255,255,.03); }
    .pc-compound-name { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .pc-compound-formula { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-muted); }
    .pc-compound-yes { border-color: var(--green); background: rgba(31,122,77,.08); }
    .pc-compound-yes .pc-compound-formula { color: var(--green); font-weight: 600; }
    .pc-compound-no { opacity: .65; }

    .pc-answer {
        border-left: 3px solid var(--gold); padding: 4px 0 4px 16px; margin: 4px 0 20px;
    }
    .pc-answer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pc-marks {
        font-size: 11px; font-weight: 700; color: var(--gold); background: rgba(201,162,39,.14);
        padding: 2px 9px; border-radius: 999px;
    }
    [data-theme="dark"] .pc-marks { background: rgba(212,168,42,.14); }
    .pc-note {
        font-size: 13px; font-style: italic; color: var(--text-muted);
        background: rgba(4,18,43,.03); border-radius: 8px; padding: 9px 12px; margin: 8px 0 0 !important;
    }
    [data-theme="dark"] .pc-note { background: rgba(255,255,255,.03); }

    .pc-table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 14px; }
    .pc-table th, .pc-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: center; }
    .pc-table th { background: rgba(4,18,43,.04); font-weight: 700; }
    [data-theme="dark"] .pc-table th { background: rgba(255,255,255,.05); }

    .pc-dotcross { display: flex; justify-content: center; margin: 10px 0; }
    .pc-dotcross svg { width: 260px; height: auto; }
    .pc-dc-atom-circle { fill: var(--card-bg); stroke: var(--text); stroke-width: 1.4; }
    .pc-dc-atom-label { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; fill: var(--text); text-anchor: middle; }
    .pc-dc-dot { fill: var(--navy-text); }
    [data-theme="dark"] .pc-dc-dot { fill: var(--gold-light); }
    .pc-dc-cross { font-size: 15px; font-weight: 800; fill: var(--red-soft); text-anchor: middle; }

    /* ── Estructuras químicas dibujadas por MolGraph (RDKit.js) ── */
    .pc-mol { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
    .pc-mol-rendered .pc-skel-svg { display: block; }
    .pc-skel-svg { width: 100%; height: auto; max-width: 210px; }
    .pc-mol-sm .pc-skel-svg { max-width: 130px; }
    .pc-mol-lg .pc-skel-svg { max-width: 300px; }

    /* ── Moléculas construidas a mano (sustituyentes con letra: R¹, R²,
       R³, R⁴, X, Y, Z, H "postizo", NC abreviado...) — mismo trazo
       visual que las de RDKit, para que no se note la diferencia. ── */
    .pc-skel-bond { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
    .pc-skel-label { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; fill: var(--text); }

    /* ── Esquemas de síntesis / reacción (flechas con reactivos) ──
       Cada .pc-scheme-row es un flujo de pasos (molécula → flecha →
       molécula → …). Se deja que el navegador reparta los pasos en varias
       líneas (flex-wrap) en vez de desbordar horizontalmente, y ChemDraw
       reagrupa el resultado en .pc-scheme-line, alternando el sentido de
       lectura línea a línea (izq→der, der→izq, …) con un pequeño conector
       en "codo" entre líneas — como una síntesis dibujada a mano que sigue
       hacia la derecha, baja al llegar al borde, continúa hacia la
       izquierda, vuelve a bajar, y así sucesivamente. ── */
    .pc-scheme-box {
        background: rgba(4,18,43,.03); border: 1px solid var(--border); border-radius: 12px;
        padding: 16px 18px; margin: 10px 0 18px; overflow-x: auto;
    }
    [data-theme="dark"] .pc-scheme-box { background: rgba(255,255,255,.03); }
    .pc-scheme-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0; row-gap: 18px; }
    .pc-scheme-row-snake { flex-direction: column; align-items: stretch; row-gap: 4px; }
    .pc-scheme-line { display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 14px; justify-content: flex-start; }
    .pc-scheme-line-rev { flex-direction: row-reverse; justify-content: flex-end; }
    .pc-scheme-turn { display: flex; align-items: center; flex-shrink: 0; }
    .pc-scheme-turn-right { justify-content: flex-end; margin-left: auto; }
    .pc-scheme-turn-left { justify-content: flex-start; margin-right: auto; }
    .pc-scheme-line-rev .pc-scheme-turn-right { margin-left: 0; margin-right: auto; order: -1; }
    .pc-scheme-turn-svg { width: 20px; height: 22px; }
    .pc-scheme-turn-path { fill: none; stroke: var(--text-muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .pc-scheme-node { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 40px; flex-shrink: 0; }
    .pc-scheme-mol .pc-skel-svg { max-width: 168px; }
    .pc-scheme-label { font-size: 11.5px; font-weight: 700; color: var(--text); text-align: center; white-space: nowrap; }
    .pc-scheme-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: center; white-space: nowrap; }
    .pc-scheme-unknown {
        display: inline-flex; align-items: center; justify-content: center;
        width: 34px; height: 34px; border: 2px dashed var(--border);
        border-radius: 8px; font-family: 'Playfair Display', serif;
        font-weight: 900; font-size: 17px; color: var(--navy-text);
    }
    [data-theme="dark"] .pc-scheme-unknown { color: var(--gold-light); }
    .pc-scheme-plus { font-size: 16px; font-weight: 700; color: var(--text-muted); padding: 0 2px; flex-shrink: 0; }
    .pc-scheme-arrow { display: flex; flex-direction: column; align-items: center; min-width: 72px; flex-shrink: 0; }
    .pc-scheme-arrow-above, .pc-scheme-arrow-below { font-size: 10.8px; color: var(--text-muted); white-space: nowrap; font-weight: 600; }
    .pc-scheme-arrow-above { margin-bottom: 1px; }
    .pc-scheme-arrow-below { margin-top: 1px; }
    .pc-scheme-arrow-svg { display: block; }
    .pc-scheme-line-rev .pc-scheme-arrow-svg { transform: scaleX(-1); }
    .pc-scheme-arrow-line { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
    .pc-scheme-arrowhead { fill: var(--text); }

    /* ── Zoom: síntesis completas y moléculas individuales ampliables ──
       .pc-scheme-box recibe un botón de "ampliar todo el esquema"; cada
       .pc-mol / .pc-scheme-mol ya renderizada es clicable para ampliar
       solo esa molécula. Todo se abre en el mismo visor a pantalla
       completa (#molzoom-overlay) con zoom por rueda/pellizco y arrastre. ── */
    .pc-scheme-box { position: relative; }
    .pc-scheme-expand-btn {
        position: absolute; top: 8px; right: 8px; z-index: 2;
        display: flex; align-items: center; gap: 5px;
        background: var(--card-bg); color: var(--text-muted);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 5px 9px; font-size: 12px; font-weight: 600;
        cursor: pointer; opacity: .75; transition: opacity .15s, color .15s;
    }
    .pc-scheme-expand-btn:hover { opacity: 1; color: var(--text); }
    .pc-mol-rendered, .pc-scheme-mol { cursor: zoom-in; border-radius: 8px; transition: background .15s; }
    .pc-mol-rendered:hover, .pc-scheme-mol:hover { background: rgba(201,162,39,.12); }
    [data-theme="dark"] .pc-mol-rendered:hover, [data-theme="dark"] .pc-scheme-mol:hover { background: rgba(212,168,42,.14); }

    #molzoom-overlay {
        position: fixed; inset: 0; z-index: 9999; background: rgba(4,10,24,.82);
        display: none; align-items: center; justify-content: center; flex-direction: column;
        backdrop-filter: blur(2px); touch-action: none;
    }
    #molzoom-overlay.activo { display: flex; }
    .molzoom-bar {
        position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 2;
    }
    .molzoom-btn {
        width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18);
        background: rgba(255,255,255,.08); color: #fff; font-size: 17px; font-weight: 700;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: background .15s;
    }
    .molzoom-btn:hover { background: rgba(255,255,255,.18); }
    .molzoom-stage {
        width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center;
        cursor: grab;
    }
    .molzoom-stage.arrastrando { cursor: grabbing; }
    .molzoom-inner {
        transform-origin: center center; transition: transform .06s linear;
        background: var(--card-bg); border-radius: 16px; padding: 26px 30px;
        max-width: none;
    }
    .molzoom-inner svg { display: block; }
    .molzoom-hint {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,.55); font-size: 12px; text-align: center;
    }

    /* ── Esquema "en horquilla": un compuesto de partida del que salen
       varias flechas distintas, cada una hacia su propio producto (p. ej.
       bromuro de alilo + AgCN → A, + NaCN → B). Cada rama es una flecha
       "en escuadra" (codo a 90°) de una sola pieza — ver elbowArrowSvg()
       en mol-graph.html — un único trazo continuo que sube o baja y
       luego gira hacia la derecha, en vez de una línea diagonal suelta
       pegada a una flecha horizontal aparte. La molécula de partida
       queda centrada verticalmente respecto a todas las ramas, y cada
       producto queda centrado respecto a su propia flecha. ── */
    .pc-fork { display: flex; align-items: center; gap: 2px; }
    .pc-fork-start { display: flex; align-items: center; flex-shrink: 0; }
    .pc-fork-branches { display: flex; flex-direction: column; justify-content: center; gap: 16px; flex: 1; min-width: 0; }
    .pc-fork-branch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pc-fork-elbow { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .pc-elbow-svg { display: block; }
    .pc-elbow-line { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pc-elbow-head { fill: var(--text); }
    /* El nombre debajo de la molécula (p. ej. "bromuro de alilo") no debe
       contar para centrar la flecha: si contara, el centrado se haría
       respecto al bloque imagen+texto y la flecha quedaría pegada más
       arriba de lo debido, no en mitad de la estructura dibujada. Se
       saca el rótulo del flujo (position:absolute) para que la altura
       que ve el flexbox al centrar sea SOLO la de la imagen — así el eje
       de las flechas coincide con el centro real de cada molécula. */
    .pc-fork-start .pc-scheme-node,
    .pc-fork-branch .pc-scheme-node { position: relative; }
    .pc-fork-start .pc-scheme-label,
    .pc-fork-branch .pc-scheme-label {
        position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
        margin-top: 4px;
    }

    /* ── Flecha de equilibrio (doble, sentidos opuestos) ── */
    .pc-scheme-eq-svg { height: 22px; }

    /* ── Esquema de síntesis en varias líneas con flecha "de horquilla"
       para bajar de una a la siguiente (Q6): cada línea se lee siempre
       de izquierda a derecha; al llegar al final, el siguiente paso de
       reacción se dibuja como una flecha de una sola pieza que baja
       pegada al borde derecho y gira para entrar por la izquierda de la
       línea de abajo, con sus reactivos encima/debajo del tramo
       horizontal — en vez de repetir el compuesto de unión y usar un
       conector decorativo sin información, como antes. ── */
    .pc-scheme-zigzag .pc-scheme-row { margin: 4px 0; }
    .pc-hairpin { display: flex; flex-direction: column; align-items: center; margin: 2px 0 10px; }
    .pc-hairpin-svg { display: block; width: 100%; }

    /* ── Ecuaciones / fórmulas destacadas (cajas de cálculo, p.ej. Q5) ── */
    .pc-eq-box {
        font-family: 'JetBrains Mono', monospace; font-size: 14.5px; text-align: center;
        background: rgba(4,18,43,.035); border: 1px solid var(--border); border-radius: 10px;
        padding: 14px 16px; margin: 10px 0 18px; line-height: 2; overflow-x: auto;
    }
    [data-theme="dark"] .pc-eq-box { background: rgba(255,255,255,.04); }
    .pc-eq-box sup, .pc-eq-box sub { font-size: 75%; }

    /* ── ecuaciones tipo «matemáticas»: serif, fracciones y raíces que se ajustan al contenido ── */
    .pc-eq.pc-math { font-family: 'STIX Two Text','Cambria Math','Latin Modern Math','Times New Roman',serif; font-size: 17px; line-height: 2.5; letter-spacing: 0; }
    .pc-math sub, .pc-math sup { font-size: 68%; }
    .pc-math .pc-eq-frac { margin: 0 5px; }
    .pc-math .pc-eq-frac-num, .pc-math .pc-eq-frac-den { padding: 0 6px; line-height: 1.4; text-align: center; }
    .pc-sqrt { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 3px; }
    .pc-sqrt-sign { flex: 0 0 15px; width: 15px; align-self: stretch; height: auto; overflow: visible; }
    .pc-sqrt-body { border-top: 1.5px solid currentColor; padding: 3px 5px 1px 3px; display: inline-flex; align-items: center; }
    .pc-eq-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; }
    .pc-eq-frac-num, .pc-eq-frac-den { padding: 0 4px; }
    .pc-eq-frac-num { border-bottom: 1.4px solid var(--text); }
    .pc-skel-bond { stroke: var(--text); stroke-width: 2.1; stroke-linecap: round; }
    .pc-skel-dashed { stroke-dasharray: 4 3; }
    .pc-skel-wedge { fill: var(--text); stroke: none; }
    .pc-skel-hash { stroke-width: 1.8; }
    .pc-skel-bg { fill: var(--card-bg); }
    .pc-skel-label { font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 700; fill: var(--text); text-anchor: middle; }
    .pc-skel-charge { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 800; fill: var(--red-soft); text-anchor: middle; }
    .pc-skel-star { font-size: 17px; font-weight: 800; fill: var(--red-soft); text-anchor: middle; }
    .pc-mol-missing { font-size: 11px; color: var(--red-soft); font-style: italic; }

    .pc-compounds { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 0 18px; }
    .pc-compound {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        background: rgba(4,18,43,.03); border: 1px solid var(--border);
        border-radius: 12px; padding: 12px 14px 10px; min-width: 130px;
    }
    [data-theme="dark"] .pc-compound { background: rgba(255,255,255,.03); }
    .pc-compound-name { font-size: 12px; font-weight: 700; color: var(--text); text-align: center; }
    .pc-compound-formula { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-muted); text-align: center; }
    .pc-compound-yes { border-color: var(--green); background: rgba(31,122,77,.08); }
    .pc-compound-yes .pc-compound-name { color: var(--green); }
    .pc-compound-no { opacity: .6; }

    /* ── Diagramas de orbitales moleculares ── */
    .pc-orbitals-row { display: flex; align-items: center; gap: 14px; margin: 8px 0; }
    .pc-orbitals-row-label { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text-muted); width: 74px; }
    .pc-orbitals { display: inline-block; }
    .pc-orb-svg { display: block; height: 58px; width: auto; }
    .pc-orb-lobe { stroke: var(--text); stroke-width: 1.3; stroke-linejoin: round; }
    .pc-orb-pos { fill: var(--card-bg, #fff); }
    .pc-orb-neg { fill: var(--text); }
    .pc-orb-lobe.pc-orb-dash { fill: none; stroke-dasharray: 2.5 2.5; opacity: .6; stroke-width: 1.1; }
    .pc-orb-axis { stroke: var(--text); stroke-width: 1; opacity: .55; }
    .pc-diagram-rendered { display: block; margin: 14px 0; }
    .pc-diagram-rendered .pc-orb-svg { height: auto; width: 100%; max-width: 420px; }
    .pc-orb-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; fill: var(--text); }
    .pc-orb-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; fill: var(--text); }
    .pc-orb-leader { stroke: var(--text); stroke-width: 1; opacity: .6; }
    .pc-orb-arc { fill: none; stroke: var(--text); stroke-width: 1.2; color: var(--text); }
    .pc-orb-caption { font-family: 'Inter', sans-serif; font-size: 11.5px; line-height: 1.35; color: var(--text); text-align: center; }
    .pc-figrow { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
    .pc-figrow > p, .pc-figrow > .pc-figtext { flex: 1 1 300px; margin: 0; }
    .pc-figrow > .pc-figside { flex: 0 0 auto; }
    .pc-figrow > .pc-figside .pc-diagram-rendered { margin: 0; }
    .pc-orb-pfig { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .pc-orb-ptitle { font-size: 13px; font-weight: 500; padding-left: 4px; }
    .pc-diagram-rendered .pc-orb-pwide { width: 250px; height: auto; }
    .pc-orb-int { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0; font-size: 13px; line-height: 1.25; }
    .pc-orb-int-l { text-align: right; width: 120px; }
    .pc-orb-int-r { text-align: left; width: 140px; }
    .pc-diagram-rendered .pc-orb-intsvg { width: 84px; height: auto; }
    .pc-orb-groups { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; margin: 14px 0; }
    .pc-orb-groups figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .pc-orb-groups figcaption { font-size: 13px; font-weight: 700; text-align: center; line-height: 1.2; }
    .pc-orb-groups figcaption small { font-weight: 500; color: var(--text-muted); font-size: 11px; }
    .pc-orb-groups .pc-orb-svg, .pc-orb-stack .pc-orb-svg { height: 54px; width: auto; max-width: none; }
    .pc-orb-stack { display: flex; gap: 14px; align-items: stretch; }
    .pc-orb-rows { display: flex; flex-direction: column; gap: 12px; }
    .pc-orb-eax { display: flex; gap: 8px; align-items: stretch; }
    .pc-orb-line { width: 3px; background: var(--text); position: relative; margin: 10px 8px 0 8px; }
    .pc-orb-line::before { content: ''; position: absolute; top: -9px; left: -6px; border: 7.5px solid transparent; border-bottom: 11px solid var(--text); border-top: 0; }
    .pc-orb-etx { display: flex; flex-direction: column; justify-content: space-between; font-size: 12.5px; line-height: 1.2; }
    .pc-orb-energy-diagram { display: flex; align-items: stretch; gap: 14px; margin: 14px 0; padding: 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; }
    .pc-orb-energy-rows { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .pc-orb-energy-rows .pc-orbitals-row { margin: 0; }
    .pc-orb-energy-axis { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 46px; }
    .pc-orb-energy-arrow { font-size: 20px; color: var(--gold-dark, var(--navy-text)); }
    .pc-orb-energy-text { font-size: 10.5px; font-weight: 700; text-align: center; color: var(--text-muted); line-height: 1.2; }

    /* ── Galería de imágenes (Q5, cargadas desde un listado externo) ── */
    .pc-gallery { display: flex; flex-direction: column; gap: 16px; margin: 14px 0 20px; }
    .pc-gallery-item {
        background: rgba(4,18,43,.03); border: 1px solid var(--border); border-radius: 12px;
        padding: 12px; text-align: center;
    }
    [data-theme="dark"] .pc-gallery-item { background: rgba(255,255,255,.03); }
    .pc-gallery-item img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 8px; }
    .pc-gallery-caption { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
    .pc-gallery-empty { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 14px; text-align: center; }

    /* ── Figura/foto suelta embebida en el enunciado ── */
    .pc-figure { margin: 10px 0 18px; text-align: center; }
    .pc-figure img { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); }
    .pc-figure figcaption { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

    /* ── Fila del título con botón de compartir ── */
    .pv-title-row { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; }
    .pv-title-row .pv-heading { margin: 0; }
    .pv-title-row .mp-icon-btn { flex-shrink: 0; }
</style>

<div class="mp-topbar">
    <div class="mp-breadcrumb">

// ── Zoom de esquemas de síntesis y moléculas individuales ──
// Delegación de eventos sobre #pv-main (nunca se reemplaza el nodo en sí,
// solo su innerHTML en cada pvRender), así que basta con un único listener
// que sobrevive a los cambios de pestaña / re-renderizados.
const MolZoomUI = (() => {
    const overlay = document.getElementById('molzoom-overlay');
    const stage = document.getElementById('molzoom-stage');
    const inner = document.getElementById('molzoom-inner');
    const hint = document.getElementById('molzoom-hint');
    let scale = 1, panX = 0, panY = 0;
    let arrastrando = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;
    let pinchDist0 = null, pinchScale0 = 1;

    const MIN = 0.4, MAX = 5;

    function aplicar() {
        inner.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    function reset() { scale = 1; panX = 0; panY = 0; aplicar(); }
    function zoomPor(factor, cx, cy) {
        const nuevo = Math.min(MAX, Math.max(MIN, scale * factor));
        if (nuevo === scale) return;
        scale = nuevo;
        aplicar();
    }

    function abrir(html, esEsquema) {
        inner.innerHTML = html;
        reset();
        overlay.classList.add('activo');
        hint.textContent = esEsquema
            ? (_pvLang() === 'es' ? '🖱️ Rueda o pellizca para zoom · arrastra para mover · Esc para cerrar'
                                   : '🖱️ Scroll or pinch to zoom · drag to pan · Esc to close')
            : (_pvLang() === 'es' ? '🖱️ Rueda para zoom · arrastra para mover' : '🖱️ Scroll to zoom · drag to pan');
    }
    function cerrar() { overlay.classList.remove('activo'); inner.innerHTML = ''; }

    document.getElementById('molzoom-in').onclick = () => zoomPor(1.25);
    document.getElementById('molzoom-out').onclick = () => zoomPor(0.8);
    document.getElementById('molzoom-reset').onclick = reset;
    document.getElementById('molzoom-close').onclick = cerrar;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrar(); });
    document.addEventListener('keydown', (e) => {
        if (!overlay.classList.contains('activo')) return;
        if (e.key === 'Escape') cerrar();
        else if (e.key === '+' || e.key === '=') zoomPor(1.2);
        else if (e.key === '-') zoomPor(0.85);
        else if (e.key === '0') reset();
    });

    // Rueda del ratón / trackpad
    stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomPor(e.deltaY < 0 ? 1.12 : 0.9);
    }, { passive: false });

    // Arrastrar para mover (ratón)
    stage.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return; // el táctil se maneja aparte (pellizco / 1 dedo)
        arrastrando = true;
        stage.classList.add('arrastrando');
        startX = e.clientX; startY = e.clientY; startPanX = panX; startPanY = panY;
        stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', (e) => {
        if (!arrastrando) return;
        panX = startPanX + (e.clientX - startX);
        panY = startPanY + (e.clientY - startY);
        aplicar();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
        stage.addEventListener(ev, () => { arrastrando = false; stage.classList.remove('arrastrando'); })
    );
    stage.addEventListener('dblclick', reset);

    // Táctil: 1 dedo arrastra, 2 dedos hacen pellizco (pinch) para zoom
    stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            arrastrando = true;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            startPanX = panX; startPanY = panY;
        } else if (e.touches.length === 2) {
            arrastrando = false;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinchDist0 = Math.hypot(dx, dy);
            pinchScale0 = scale;
        }
    }, { passive: true });
    stage.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && arrastrando) {
            panX = startPanX + (e.touches[0].clientX - startX);
            panY = startPanY + (e.touches[0].clientY - startY);
            aplicar();
        } else if (e.touches.length === 2 && pinchDist0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            scale = Math.min(MAX, Math.max(MIN, pinchScale0 * (dist / pinchDist0)));
            aplicar();
        }
    }, { passive: true });
    stage.addEventListener('touchend', () => { arrastrando = false; pinchDist0 = null; });

    // Delegación: click en "ampliar esquema" o en una molécula individual ya renderizada.
    document.getElementById('pv-main').addEventListener('click', (e) => {
        const btnEsquema = e.target.closest('.pc-scheme-expand-btn');
        if (btnEsquema) {
            const box = btnEsquema.closest('.pc-scheme-box');
            if (box) {
                const clone = box.cloneNode(true);
                clone.querySelectorAll('.pc-scheme-expand-btn').forEach(b => b.remove());
                abrir(clone.innerHTML, true);
            }
            return;
        }
        const mol = e.target.closest('.pc-mol-rendered, .pc-scheme-mol');
        if (mol) { abrir(mol.innerHTML, false); }
    });

    // Añade el botón "ampliar" a cada esquema de síntesis que aún no lo tenga.
    // Se llama tras cada MolGraph.renderAll(), así que es seguro invocarla varias veces.
    function decorate(root) {
        (root || document).querySelectorAll('.pc-scheme-box').forEach(box => {
            if (box.querySelector(':scope > .pc-scheme-expand-btn')) return;
            const btn = document.createElement('button');
            btn.className = 'pc-scheme-expand-btn';
            btn.type = 'button';
            btn.innerHTML = '🔍 ' + (_pvLang() === 'es' ? 'Ampliar' : 'Expand');
            box.prepend(btn);
        });
    }

    return { decorate };
})();

function pvAplicarTema() {
    let dark;
    try {
        const g = localStorage.getItem('theme');
        dark = g ? g === 'dark' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    } catch(e) { dark = false; }
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    /* icono gestionado por modern-ui.js */
}
function pvToggleThemeMode() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e) {}
    /* icono gestionado por modern-ui.js */
}
function pvToggleIdioma() {
    const next = _pvLang() === 'es' ? 'en' : 'es';

}

// ── Parámetros de la URL ──
// Leídos por el script del <head> ANTES de reescribir la URL a su forma
// bonita (Banco_Problemas/<id>/<tab>), que ya no lleva query string.
const _pvId = window.__pvId || '';
let _pvTab = ['tu-respuesta', 'respuesta'].indexOf(window.__pvTab) >= 0 ? window.__pvTab : 'enunciado';
// La solución oficial pide confirmación: una vez aceptada, no se vuelve a preguntar
// en esta visita (ni al recargar la pestaña durante la sesión) para ese problema.
let _pvRespOk = false;
function _pvLeerOk() { try { return sessionStorage.getItem('pvOk:' + _pvId) === '1'; } catch (e) { return false; } }
function _pvGuardarOk() { try { sessionStorage.setItem('pvOk:' + _pvId, '1'); } catch (e) {} }

// ── Carga de contenido: mismo patrón que CNQ_data.html / professor_data.html
//    (fetch + DOMParser + inyectar el <script> real, no un parser JSON casero).
//    Esto permite que el contenido sea HTML real en español, con comillas,
//    subíndices, tablas, etc. sin restricciones. ──
let _pvDatos = null;
async function _pvCargarScript(url, globalName) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' cargando ' + url);
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const el = doc.body.querySelector('script[id]');
    if (!el) throw new Error('No se encontró <script id="..."> en ' + url);
    const s = document.createElement('script');
    s.textContent = el.textContent;
    document.head.appendChild(s);
    return window[globalName];
}
async function _pvCargar() {
    const contenido = await _pvCargarScript('problemas_contenido.html', 'contenidoProblemas');
    // ChemDraw e imágenes son opcionales: si faltan, seguimos sin romper la página.
    try { await _pvCargarScript('mol-graph.html', 'MolGraph'); } catch (e) { console.warn('MolGraph no disponible:', e); }
    try { window._pvImagenes = await _pvCargarScript('imagenes.html', 'imagenesProblemas'); } catch (e) { window._pvImagenes = {}; }
    return contenido || {};
}

function pvRenderGalerias(root) {
    root.querySelectorAll('[data-gallery]').forEach(el => {
        const key = el.getAttribute('data-gallery');
        const items = (window._pvImagenes && window._pvImagenes[key]) || [];
        if (!items.length) {
            el.innerHTML = `<div class="pc-gallery-empty">📷 Imágenes pendientes de añadir (${key}).</div>`;
            return;
        }
        el.innerHTML = items.map(it => `
            <div class="pc-gallery-item">
                <img src="${it.url}" alt="${it.nombre || ''}" loading="lazy">
                ${it.nombre ? `<div class="pc-gallery-caption">${it.nombre}</div>` : ''}
            </div>
        `).join('');
    });
}

async function pvCompartir() {
    const p = _pvDatos && _pvDatos[_pvId];
    const titulo = p ? p.titulo : document.title;
    const url = location.href;
    const btn = document.getElementById('pv-share-btn');
    try {
        if (navigator.share) {
            await navigator.share({ title: titulo, url });
            return;
        }
    } catch (e) { /* el usuario canceló o falló: probamos con el portapapeles */ }
    try {
        await navigator.clipboard.writeText(url);
        const original = btn.textContent;
        btn.textContent = '✅';
        setTimeout(() => { btn.textContent = original; }, 1400);
    } catch (e) {
        prompt(_pvLang() === 'es' ? 'Copia este enlace:' : 'Copy this link:', url);
    }
}

function pvConfirmarRespuesta() {
    return new Promise((ok) => {
        const bg = document.createElement('div');
        bg.className = 'pv-conf-bg';
        bg.setAttribute('role', 'dialog'); bg.setAttribute('aria-modal', 'true');
        bg.innerHTML = `<div class="pv-conf"><h3>${_pvT('confTitulo')}</h3><p>${_pvT('confTexto')}</p>
            <div class="pv-conf-btns"><button type="button" class="pv-conf-no">${_pvT('confNo')}</button><button type="button" class="pv-conf-si">${_pvT('confSi')}</button></div></div>`;
        const cerrar = (v) => { document.removeEventListener('keydown', tecla); bg.remove(); ok(v); };
        const tecla = (e) => { if (e.key === 'Escape') cerrar(false); };
        bg.addEventListener('click', (e) => { if (e.target === bg) cerrar(false); });
        bg.querySelector('.pv-conf-no').onclick = () => cerrar(false);
        bg.querySelector('.pv-conf-si').onclick = () => cerrar(true);
        document.addEventListener('keydown', tecla);
        document.body.appendChild(bg);
        bg.querySelector('.pv-conf-no').focus();
    });
}

async function pvSetTab(tab) {
    if (tab === 'respuesta' && !_pvRespOk && !_pvLeerOk()) {
        if (!(await pvConfirmarRespuesta())) return;
        _pvRespOk = true; _pvGuardarOk();
    }
    _pvTab = tab;
    // La URL visible ya está en su forma bonita (.../Banco_Problemas/<id>/
    // <tab>, ver script del <head>); al cambiar de pestaña solo hace falta
    // reemplazar ese último segmento.
    const url = new URL(location.href);
    if (/\/Banco_Problemas\/[^/]+\/[^/]+$/.test(url.pathname)) {
        url.pathname = url.pathname.replace(/[^/]+$/, tab);
    } else {
        // Por si acaso todavía estamos en la ruta real (poco probable: el
        // script del <head> ya la reescribe al cargar).
        url.searchParams.set('tab', tab);
    }
    history.replaceState(null, '', url);
    pvRender();
}

async function pvRender() {
    if (!_pvDatos || !_pvDatos[_pvId]) return;
    const p = _pvDatos[_pvId];
    const l = _pvLang();
    const titulo = p.titulo;

    document.getElementById('pv-back-label').textContent = _pvT('back');
    document.getElementById('pv-crumb-actual').textContent = '📝 ' + titulo;
    document.getElementById('pv-lang-btn').textContent = l === 'es' ? 'ES' : 'EN';
    document.getElementById('pv-foot-back').innerHTML = `<a href="../Banco_Problemas.html">${_pvT('volver')}</a>`;
    document.title = titulo + ' — Sitial de Talentos';

    const cuerpo = _pvTab === 'tu-respuesta'
        ? '<div class="pv-tu2" id="pv-tu-root"></div>'
        : (p[_pvTab] || '<p>Contenido no disponible.</p>');

    document.getElementById('pv-main').innerHTML = `
        <span class="pv-q-badge">${p.numero || ''}</span>
        <div class="pv-title-row">
            <h1 class="pv-heading">${titulo}</h1>
            <button class="mp-icon-btn" id="pv-share-btn" onclick="pvCompartir()" title="Compartir">🔗</button>
        </div>
        <p class="pv-fuente">${p.fuente || ''}</p>
        <div class="pv-tabs">
            <button class="pv-tab ${_pvTab === 'enunciado' ? 'activo' : ''}" onclick="pvSetTab('enunciado')">${_pvT('tabEnunciado')}</button>
            <button class="pv-tab ${_pvTab === 'tu-respuesta' ? 'activo' : ''}" onclick="pvSetTab('tu-respuesta')">${_pvT('tabTu')}</button>
            <button class="pv-tab ${_pvTab === 'respuesta' ? 'activo' : ''}" onclick="pvSetTab('respuesta')">${_pvT('tabRespuesta')}</button>
        </div>
        <article class="pv-articulo" id="pv-articulo">${cuerpo}</article>
        ${p.creditos ? `<p class="pv-creditos">${p.creditos}</p>` : ''}
    `;

    const articulo = document.getElementById('pv-articulo');
    if (window.MolGraph) await window.MolGraph.renderAll(articulo);
    MolZoomUI.decorate(articulo);
    pvRenderGalerias(articulo);
    if (_pvTab === 'tu-respuesta') pvTutorInit();
    pvFab();
}


// ══════════════ Chat «conversar sobre la solución» + selección de texto ══════════════
// Sin penalización: se usa cuando la solución o la corrección ya están a la vista.
const _chKey = () => 'pvChat:' + _pvId;
function _chLoad() { try { return JSON.parse(localStorage.getItem(_chKey())) || []; } catch (e) { return []; } }
function _chSave(l) { try { localStorage.setItem(_chKey(), JSON.stringify(l.slice(-30))); } catch (e) {} }
function _resLoad() { try { return JSON.parse(localStorage.getItem('pvRes:' + _pvId)); } catch (e) { return null; } }
function _resSave(r) { try { localStorage.setItem('pvRes:' + _pvId, JSON.stringify(r)); } catch (e) {} }
const _chInst = [];   // instancias montadas (cajón e inline) para repintarlas a la vez

// Respuesta de la IA → HTML seguro: negritas, `código`, y dibujos químicos.
// Dibujos admitidos (todo se escapa; la IA nunca inyecta HTML):
//   [[MOL: SMILES | etiqueta]]            → una molécula
//   ```esquema … ```                      → esquema libre (ver MolGraph.parseEsquema)
function _chFmt(txt) {
    const t = String(txt == null ? '' : txt);
    const re = /```(?:esquema|mol|mecanismo)[^\n]*\n([\s\S]*?)```|\[\[\s*MOL\s*:\s*([^\]|]+?)\s*(?:\|\s*([^\]]*?))?\s*\]\]/gi;
    const inline = (x) => _tuEsc(x).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>');
    let out = '', last = 0, m;
    while ((m = re.exec(t))) {
        out += inline(t.slice(last, m.index));
        const dsl = m[1] != null ? m[1].trim() : 'm1 @0,0: ' + m[2].trim() + (m[3] ? ' | ' + m[3].trim() : '');
        out += `<div class="pc-free-host" data-esquema="${_tuEsc(dsl)}"></div>`;
        last = re.lastIndex;
    }
    return out + inline(t.slice(last));
}

// Botón flotante «Preguntar al tutor» al seleccionar texto
(function pvSeleccion() {
    let btn = null, ctx = null;
    const ocultar = () => { if (btn) btn.style.display = 'none'; ctx = null; };
    function comprobar() {
        const sel = window.getSelection();
        const texto = sel ? sel.toString().trim() : '';
        if (!sel || sel.isCollapsed || texto.length < 3) return ocultar();
        const el = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
        const zona = el && el.closest('#pv-articulo, #tu-out, #tu-log, .pv-chat-log');
        if (!zona || (el.closest('textarea, input, button'))) return ocultar();
        let fuente, chat = el.closest('.pv-chat');
        if (zona.id === 'pv-articulo') fuente = _pvTab === 'respuesta' ? 'respuesta' : 'enunciado';
        else if (zona.id === 'tu-log') fuente = 'pista';
        else fuente = 'resultado';
        ctx = { texto: texto.slice(0, 1200), fuente, chat };
        if (!btn) {
            btn = document.createElement('button'); btn.id = 'pv-selbtn'; btn.type = 'button';
            btn.addEventListener('mousedown', (e) => e.preventDefault());
            btn.addEventListener('click', () => {
                const c = ctx; ocultar(); if (!c) return;
                if (c.fuente === 'enunciado' || c.fuente === 'pista') return pvPrefillPista(c.texto);
                const inst = _chInst.find((i) => i.root.isConnected && c.chat && i.root === c.chat);
                if (inst) { inst.setQuote(c.texto); const t = inst.root.querySelector('textarea'); if (!t.value) t.value = _pvT('chatQSel'); t.focus(); return; }
                const inline = document.getElementById('tu-chat-mount');
                if (c.fuente === 'resultado' && inline && _chInst.some((i) => i.root === inline)) {
                    const i2 = _chInst.find((i) => i.root === inline); i2.setQuote(c.texto);
                    const t = inline.querySelector('textarea'); if (!t.value) t.value = _pvT('chatQSel'); inline.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.focus(); return;
                }
                pvAbrirDrawer(c.texto, c.fuente);
            });
            document.body.appendChild(btn);
        }
        btn.textContent = _pvT('selBtn') + (fuente === 'enunciado' || fuente === 'pista' ? ' (−)' : '');
        btn.title = fuente === 'enunciado' || fuente === 'pista' ? _pvT('hintCostNote') : '';
        const r = sel.getRangeAt(0).getBoundingClientRect();
        btn.style.display = 'block';
        btn.style.top = Math.max(8, window.scrollY + r.top - btn.offsetHeight - 8) + 'px';
        btn.style.left = Math.min(window.scrollX + document.documentElement.clientWidth - btn.offsetWidth - 8, Math.max(8, window.scrollX + r.left + r.width / 2 - btn.offsetWidth / 2)) + 'px';
    }
    let tm = null;
    const prog = () => { clearTimeout(tm); tm = setTimeout(comprobar, 60); };
    document.addEventListener('mouseup', prog); document.addEventListener('keyup', prog); document.addEventListener('touchend', prog);
    document.addEventListener('selectionchange', prog);
    document.addEventListener('mousedown', (e) => { if (btn && e.target !== btn) ocultar(); });
    window.addEventListener('scroll', () => { if (btn && btn.style.display === 'block') comprobar(); }, { passive: true });
})();

const _TU_API = (location.pathname.replace(/(Banco_Problemas\/[^/]+\/[^/]+|Problem_Data\/visor\.html)$/, '')) + 'api/tutor';
const _tuEsc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let _tuFiles = [];   // [{kind:'img', data, name} | {kind:'txt', text, name}]

function _tuSave(st) { try { localStorage.setItem('pvTutor:' + _pvId, JSON.stringify(st)); } catch (e) {} }
function _tuPct(st) { return Math.min(40, st.hints.reduce((a, h) => a + (h.cost || 0), 0)); }

// Reduce la foto (lado máx. 2000 px, JPEG) para que quepa en la petición
function _tuComprimir(file) {
    return new Promise((ok, fail) => {
        const fr = new FileReader();
        fr.onerror = () => fail(new Error('read'));
        fr.onload = () => {
            const im = new Image();
            im.onerror = () => fail(new Error('img'));
            im.onload = () => {
                // hasta 2000 px (los esquemas con moléculas y reactivos pierden detalle con menos); si pesa de más, se baja calidad/tamaño
                let lado = Math.min(2000, Math.max(im.width, im.height)), q = 0.88, out = '';
                for (let i = 0; i < 6; i++) {
                    const k = Math.min(1, lado / Math.max(im.width, im.height));
                    const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
                    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
                    out = c.toDataURL('image/jpeg', q);
                    if (out.length < 1.0e6) break;
                    q = Math.max(0.6, q - 0.08); lado = Math.round(lado * 0.85);
                }
                ok(out);
            };
            im.src = fr.result;
        };
        fr.readAsDataURL(file);
    });
}
async function _tuLeerArchivos(files, destino, max) {
    for (const f of files) {
        if (destino.length >= max) { alert(_pvT('tuTooMany')); break; }
        try {
            if (/^image\//.test(f.type)) destino.push({ kind: 'img', data: await _tuComprimir(f), name: f.name });
            else if (/^text\/|\.(txt|md|tex)$/i.test(f.name)) destino.push({ kind: 'txt', text: (await f.text()).slice(0, 6000), name: f.name });
        } catch (e) { /* archivo no legible: se ignora */ }
    }
}
async function _tuPost(body) {

    try { r = await fetch(_TU_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, problemId: _pvId, lang: _pvLang() }) }); }
    catch (e) { throw new Error(_pvT('tuNoApi')); }
    let j = null; try { j = await r.json(); } catch (e) {}

    if (!r.ok || !j) throw new Error((j && j.error) || (r.status === 404 || r.status === 405 ? _pvT('tuNoApi') : _pvT('tuErr')));
    return j;
}

            };
        });
        if (!fromSaved) { _resSave({ final: r.final, max: r.max, bruto: r.bruto, penalizacionPct: r.penalizacionPct, penalizacion: r.penalizacion, maxEnviado: r.maxEnviado, revisionCruzada: r.revisionCruzada, resumen: r.resumen, advertencias: r.advertencias, incisos: r.incisos, transcripcion: r.transcripcion }); $('tu-out').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    };
    const pintaParcial = (r, bodyBase) => {
        $('tu-out').innerHTML = `<div class="pv-score" style="border-color:var(--border);text-align:left">
            <strong>${_pvT('tuPartH')}</strong>
            <p style="margin:8px 0 0">${_pvT('tuPartHas')} <b>${r.presentes.map(_tuEsc).join(', ') || '—'}</b></p>
            <p style="margin:4px 0 0">${_pvT('tuPartMiss')} <b>${r.faltan.map(_tuEsc).join(', ') || '—'}</b></p>
            ${r.cortada ? `<p style="margin:4px 0 0">${_pvT('tuPartCut')}</p>` : ''}
            <p style="margin:10px 0 0">${_pvT('tuPartAsk')}</p>
            <div class="pv-row"><button type="button" class="pv-b pv-main" id="tu-pgo">${_pvT('tuPartGo')}</button><button type="button" class="pv-b" id="tu-pmore">${_pvT('tuPartMore')}</button></div></div>`;
        $('tu-pmore').onclick = () => { $('tu-out').innerHTML = ''; $('tu-gf').closest('label').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
        $('tu-pgo').onclick = () => enviarCalificar({ ...bodyBase, transcripcion: r.transcripcion, presentes: r.presentes, faltan: r.faltan, cortada: r.cortada, confirmarParcial: true, images: [], texts: [] });
    };
    { const g = _resLoad(); if (g && g.incisos) pintaResultado(g, true); }
    const enviarCalificar = async (cuerpo) => {
        $('tu-gerr').textContent = ''; $('tu-go').disabled = true; if ($('tu-pgo')) $('tu-pgo').disabled = true;
        const old = _pvT('tuGrade'); $('tu-go').textContent = _pvT('tuGrading');
        try {
            const r = await _tuPost(cuerpo);
            if (r.vacio) { $('tu-out').innerHTML = `<p class="pv-note">⚠️ ${_tuEsc(r.mensaje || _pvT('tuEmpty'))}</p>`; }
            else if (r.parcial) pintaParcial(r, { action: 'grade', hints: cuerpo.hints });
            else pintaResultado(r);
        } catch (e) { $('tu-gerr').textContent = e.message; }
        $('tu-go').disabled = false; $('tu-go').textContent = old;
    };
    $('tu-go').onclick = () => {
        $('tu-out').innerHTML = '';
        enviarCalificar({
            action: 'grade', images: _tuFiles.filter((f) => f.kind === 'img').map((f) => f.data),
            texts: _tuFiles.filter((f) => f.kind === 'txt').map((f) => f.text).concat($('tu-notes').value.trim() ? [$('tu-notes').value.trim()] : []),
            hints: st.hints.map((h) => ({ level: h.level })),
        });
    };
}

async function pvInicializar() {
    try {
        _pvDatos = await _pvCargar();
        if (!_pvDatos[_pvId]) throw new Error('Problema no encontrado: ' + _pvId);
        if (_pvTab === 'respuesta' && !_pvLeerOk()) {      // enlace directo a la respuesta → confirmar
            _pvTab = 'enunciado';
            await pvRender();
            const url = new URL(location.href);
            if (/\/Banco_Problemas\/[^/]+\/[^/]+$/.test(url.pathname)) { url.pathname = url.pathname.replace(/[^/]+$/, 'enunciado'); history.replaceState(null, '', url); }
            if (await pvConfirmarRespuesta()) { _pvRespOk = true; _pvGuardarOk(); pvSetTab('respuesta'); }
            return;
        }
        pvRender();
    } catch (err) {
        console.error(err);
        document.getElementById('pv-main').innerHTML = `<div class="pv-estado">⚠️ ${_pvT('error')}</div>`;
    }
}
pvInicializar();
