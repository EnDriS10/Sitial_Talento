<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo… — Sitial de Talentos Cubanos</title>
    <!--
        Single Page Apps for GitHub Pages
        https://github.com/rafgraph/spa-github-pages

        GitHub Pages es hosting estático puro: no hay servidor que reescriba
        rutas, así que una URL "bonita" como
            /Sitial_Talento/Historial_Eventos/IChO
        no corresponde a ningún archivo real y GitHub Pages sirve este
        404.html en su lugar. Este script toma esa ruta, la codifica dentro
        de la query string y redirige a index.html, donde un script gemelo
        en el <head> la decodifica y restaura la URL original con
        history.replaceState — todo esto ocurre antes de que la aplicación
        arranque, así que la sección/subsección correcta se muestra igual
        que si se hubiera navegado ahí dentro de la propia página.

        pathSegmentsToKeep = 1 cuando el sitio vive bajo un único segmento
        de ruta fijo, p.ej. /Sitial_Talento/ (el nombre del repositorio en
        un GitHub Pages "de proyecto", username.github.io/repo/). Cuando el
        sitio se sirve desde la raíz de un dominio propio — como el
        despliegue en Vercel (sitialtalento.vercel.app/) o un GitHub Pages
        "de usuario" (username.github.io/) — no hay ningún segmento fijo
        que preservar y este valor debe ser 0.

        Antes este valor estaba fijo en 1 pensando solo en GitHub Pages, y
        eso rompía por completo el sitio en Vercel: al no existir ningún
        segmento "/Sitial_Talento/" que recortar, el script recortaba por
        error el primer segmento REAL de la ruta (p.ej. "Historial_Medallas")
        como si fuera el nombre del repositorio, generaba una redirección
        mal formada que tampoco encontraba archivo real, volvía a caer en
        este mismo 404.html, y así sucesivamente — de ahí el bucle infinito
        con "~and~" acumulándose en la URL. Por eso ahora se detecta solo:

        ── Rutas bonitas de páginas "reales" (no del SPA de index.html) ──
        Banco de Problemas, Media y Noticias son archivos .html sueltos, no
        secciones de index.html, así que antes de caer en el truco genérico
        de arriba, se comprueban aquí sus rutas bonitas y se redirige
        directamente al archivo real correspondiente:
            /Banco_Problemas               → Banco_Problemas.html
            /media                         → media.html
            /noticias                      → noticias.html
            /Banco_Problemas/<id>/<tab>    → Problem_Data/visor.html?id=<id>&tab=<tab>
        Cada uno de esos archivos reales, al cargar, oculta de nuevo su
        propia URL "fea" con history.replaceState (ver el script al
        inicio de cada uno), así que el usuario nunca llega a ver el
        ".html" ni la ruta interna de verdad.
    -->
    <script>
        var pathSegmentsToKeep = /\.github\.io$/.test(window.location.hostname) ? 1 : 0;
        var l = window.location;
        var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var resto = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).filter(Boolean);

        if (resto.length === 1 && resto[0] === 'Banco_Problemas') {
            l.replace(repoBase + '/Banco_Problemas.html' + l.search + l.hash);
        } else if (resto.length === 1 && resto[0] === 'media') {
            l.replace(repoBase + '/media.html' + l.search + l.hash);
        } else if (resto.length === 1 && resto[0] === 'noticias') {
            l.replace(repoBase + '/noticias.html' + l.search + l.hash);
        } else if ((resto.length === 2 || resto.length === 3) && resto[0] === 'Banco_Problemas') {
            var id  = decodeURIComponent(resto[1]);
            var tab = resto.length === 3 ? decodeURIComponent(resto[2]) : 'enunciado';
            l.replace(repoBase + '/Problem_Data/visor.html?id=' + encodeURIComponent(id) + '&tab=' + encodeURIComponent(tab));
        } else {
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                repoBase + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        }
    </script>
    <style>
        html, body { height: 100%; margin: 0; display: flex; align-items: center; justify-content: center;
            background: #04122b; color: #f0c84a; font-family: 'DM Sans', system-ui, sans-serif; }
        p { font-size: 15px; opacity: .85; }
    </style>
</head>
<body>
    <p>Redirigiendo…</p>
</body>
</html>
