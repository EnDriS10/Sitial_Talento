<base id="app-base-href" href="/">
<script>
    (function () {
        var segs = location.pathname.split('/');
        var i = -1;
        for (var k = 0; k < segs.length; k++) { if (segs[k] === 'Equipo') { i = k; break; } }
        var p = i >= 0 ? segs.slice(0, i).join('/') + '/' : location.pathname.replace(/[^\/]*$/, '');
        document.getElementById('app-base-href').href = location.origin + p;
    })();
</script>

<style>
    :root {
        --navy: #04122b; --navy-text: var(--navy); --navy-mid: #0b2150; --navy-light: #122d6b;
        --gold: #c9a227; --gold-light: #f0c84a; --silver: #b0bec5; --bronze: #a0522d; --accent: #1a6fb5;
        --bg: #f5f3ee; --card-bg: #ffffff; --text: #1a1a2e; --text-muted: #5a6a8a; --border: #dde3f0;
        --cu-blue: #002a8f; --cu-red: #cc0001;
    }
    [data-theme="dark"] {
        --navy: #141a2b; --navy-text: #a9c2ee; --navy-mid: #1a2840; --navy-light: #3a5a9a;
        --gold: #d4a82a; --gold-light: #f5d060; --accent: #5ba3e8;
        --bg: #0d1117; --card-bg: #161b22; --text: #e6edf3; --text-muted: #8b949e; --border: #30363d;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; transition: background .25s, color .25s; }
    a { color: inherit; text-decoration: none; }

    /* Topbar (igual que media.html) */
    .mp-topbar { position: sticky; top: 0; z-index: 50; background: var(--navy); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; flex-shrink: 0; }
    .mp-breadcrumb { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .mp-crumb-home { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--gold-light); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; padding: 6px 8px 6px 4px; border-radius: 8px; transition: background .18s; white-space: nowrap; flex-shrink: 0; }
    .mp-crumb-home:hover { background: rgba(255,255,255,.1); }
    .mp-crumb-sep { color: rgba(255,255,255,.35); font-size: 14px; flex-shrink: 0; }
    .mp-crumb-current { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .mp-icon-btn { background: rgba(255,255,255,.12); border: none; border-radius: 8px; color: #fff; width: 36px; height: 36px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; }
    .mp-icon-btn:hover { background: rgba(255,255,255,.22); }

    .eq-main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; flex: 1 0 auto; width: 100%; }

    /* Hero */
    .eq-hero { background: var(--navy); color: #fff; border-radius: 20px; padding: 34px 28px 28px; position: relative; overflow: hidden; margin-bottom: 22px; }
    .eq-hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 55% 80% at 12% 50%, rgba(0,42,143,.28), transparent 65%), radial-gradient(ellipse 45% 70% at 90% 30%, rgba(204,0,1,.2), transparent 65%); pointer-events: none; }
    .eq-hero > * { position: relative; }
    .eq-flag { display: flex; width: 120px; height: 4px; border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
    .eq-flag span { flex: 1; } .eq-flag span:nth-child(odd) { background: var(--cu-blue); } .eq-flag span:nth-child(even) { background: #f2f2f2; } .eq-flag span:nth-child(3) { background: var(--cu-red); }
    .eq-eyebrow { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,.5); font-weight: 600; margin: 0 0 8px; }
    .eq-title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: clamp(30px, 6vw, 46px); line-height: 1.05; margin: 0 0 8px; }
    .eq-title em { font-style: normal; color: var(--gold-light); }
    .eq-subtitle { font-size: 14px; color: rgba(255,255,255,.65); margin: 0 0 4px; }
    .eq-sede { font-size: 15px; color: rgba(255,255,255,.9); margin: 10px 0 0; font-weight: 500; }
    .eq-hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; align-items: center; }
    .eq-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 22px; border: none; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform .15s, background .2s; }
    .eq-btn:hover { transform: translateY(-2px); }
    .eq-btn-gold { background: var(--gold-light); color: #04122b; }
    .eq-btn-ghost { background: rgba(255,255,255,.12); color: #fff; }
    .eq-btn-ghost:hover { background: rgba(255,255,255,.22); }
    .eq-btn svg { width: 16px; height: 16px; }
    .eq-yearnav { display: inline-flex; align-items: center; background: rgba(255,255,255,.12); border-radius: 22px; overflow: hidden; }
    .eq-yearnav button, .eq-yearnav select { background: none; border: none; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; padding: 10px 12px; cursor: pointer; }
    .eq-yearnav button:hover { background: rgba(255,255,255,.15); }
    .eq-yearnav button:disabled { opacity: .3; cursor: default; }
    .eq-yearnav select { appearance: none; -webkit-appearance: none; text-align: center; padding: 10px 6px; }
    .eq-yearnav select option { color: #111; }

    /* Stats */
    .eq-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 30px; }
    .eq-stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px 10px; text-align: center; }
    .eq-stat b { display: block; font-family: 'Playfair Display', serif; font-size: 30px; line-height: 1; color: var(--navy-text); }
    .eq-stat span { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-top: 7px; }
    @media (max-width: 600px) { .eq-stats { grid-template-columns: repeat(3, 1fr); } .eq-hero { padding: 26px 18px 22px; } }

    .eq-section { margin-bottom: 36px; }
    .eq-h2 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--navy-text); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
    .eq-h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .eq-count { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; color: var(--text-muted); background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; }

    .eq-subchips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .eq-subchip { padding: 6px 14px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--card-bg); font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
    .eq-subchip:hover, .eq-subchip.activo { border-color: var(--accent); color: var(--accent); }

    /* Cards */
    .eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .eq-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 2px 14px rgba(4,18,43,.06); transition: transform .2s, box-shadow .2s; }
    .eq-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(4,18,43,.13); }
    .eq-av { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; background: #e8ecf5; border: 3px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .eq-card[data-m="oro"] .eq-av { border-color: var(--gold); } .eq-card[data-m="plata"] .eq-av { border-color: var(--silver); } .eq-card[data-m="bronce"] .eq-av { border-color: #c87941; } .eq-card[data-m="mencion"] .eq-av { border-color: #7aaae8; }
    .eq-av img { width: 100%; height: 100%; object-fit: cover; }
    .eq-ini { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px; color: var(--navy-light); }
    .eq-info { min-width: 0; flex: 1; }
    .eq-name { font-size: 15px; font-weight: 600; color: var(--navy-text); display: block; line-height: 1.3; margin-bottom: 6px; }
    a.eq-name:hover { color: var(--accent); text-decoration: underline; }
    .eq-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .prov { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: rgba(201,162,39,.14); color: #7a5800; cursor: default; }
    [data-theme="dark"] .prov { color: #d4a82a; }
    .eq-rank { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .rol-tag { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; background: rgba(59,130,246,.13); color: var(--navy-light); }
    [data-theme="dark"] .rol-tag { background: rgba(90,160,255,.12); color: #8fb4f0; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
    .badge i { width: 7px; height: 7px; border-radius: 50%; display: block; }
    .badge-oro { background: #fff8e1; color: #9a7200; } .badge-oro i { background: var(--gold); }
    .badge-plata { background: #f0f4f8; color: #5a6a8a; } .badge-plata i { background: var(--silver); }
    .badge-bronce { background: #fdf0e8; color: #7a3b10; } .badge-bronce i { background: var(--bronze); }
    .badge-mencion { background: #e8f0fb; color: #1a4a9a; } .badge-mencion i { background: var(--accent); }
    .badge-participante { background: #f4f4f4; color: #888; } .badge-participante i { background: #ccc; }
    [data-theme="dark"] .badge-oro { background: #2a1f00; color: #f5d060; } [data-theme="dark"] .badge-plata { background: #1e2230; color: #a0b4c8; }
    [data-theme="dark"] .badge-bronce { background: #2a1408; color: #d09060; } [data-theme="dark"] .badge-mencion { background: #0e1a30; color: #6090d0; }
    [data-theme="dark"] .badge-participante { background: #1e2230; color: #8b949e; }

    /* Fotos */
    .eq-gallery { columns: 4 220px; column-gap: 14px; }
    .eq-gallery img { width: 100%; display: block; margin: 0 0 14px; border-radius: 12px; cursor: zoom-in; border: 1px solid var(--border); box-shadow: 0 2px 14px rgba(4,18,43,.08); transition: transform .22s, box-shadow .22s; break-inside: avoid; background: var(--card-bg); }
    .eq-gallery img:hover { transform: translateY(-3px) scale(1.012); box-shadow: 0 10px 26px rgba(4,18,43,.18); }
    .eq-links { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
    .eq-links a { color: var(--accent); font-weight: 600; font-size: 14px; }
    .eq-links a:hover { text-decoration: underline; }
    .eq-estado { padding: 70px 20px; text-align: center; color: var(--text-muted); font-size: 15px; }
    .eq-estado a { color: var(--accent); font-weight: 600; }

    /* Lightbox */
    .eq-lb { position: fixed; inset: 0; z-index: 1000; background: rgba(4,10,22,.95); display: none; align-items: center; justify-content: center; padding: 32px; }
    .eq-lb.visible { display: flex; }
    .eq-lb img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
    .eq-lb button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .eq-lb button:hover { background: rgba(255,255,255,.24); }
    .eq-lb button:disabled { opacity: 0; pointer-events: none; }
    .eq-lb-close { top: 18px; right: 22px; } .eq-lb-prev { left: 16px; top: 50%; transform: translateY(-50%); } .eq-lb-next { right: 16px; top: 50%; transform: translateY(-50%); }

    /* Share sheet */
    .eq-share-ov { position: fixed; inset: 0; z-index: 1100; background: rgba(4,10,22,.55); display: none; align-items: flex-end; justify-content: center; }
    .eq-share-ov.abierto { display: flex; }
    .eq-share-sheet { width: 100%; max-width: 560px; background: var(--card-bg); border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); position: relative; animation: eqUp .28s cubic-bezier(.32,.9,.35,1.1); }
    @keyframes eqUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .eq-share-title { text-align: center; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin: 0 0 16px; }
    .eq-share-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .eq-share-op { display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: none; cursor: pointer; padding: 4px 2px; border-radius: 12px; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; }
    .eq-share-op:hover { background: rgba(128,128,128,.1); }
    .eq-share-ic { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .eq-share-ic svg { width: 22px; height: 22px; }
    .eq-url { margin-top: 16px; display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 8px 8px 8px 14px; }
    .eq-url input { flex: 1; min-width: 0; border: none; background: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12.5px; outline: none; }
    .eq-url button { background: var(--navy); color: #fff; border: none; border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .eq-toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(10px); background: rgba(20,20,20,.92); color: #fff; padding: 10px 20px; border-radius: 22px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; z-index: 1200; }
    .eq-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 480px) { .eq-share-grid { grid-template-columns: repeat(3, 1fr); row-gap: 14px; } }

    /* Footer */
    footer { background: var(--navy); color: rgba(255,255,255,.55); text-align: center; padding: 28px 20px 22px; font-size: 13px; flex-shrink: 0; }
    footer a { color: var(--gold-light); }
    .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; flex-wrap: wrap; }
    .footer-links a { font-size: 13px; font-weight: 500; }
</style>

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

async function cargarScript(url, id) {

}
function quitarComentarios(src) {
    let out = '', inStr = false, q = '', esc_ = false, i = 0;
    while (i < src.length) {
        const c = src[i];
        if (esc_) { out += c; esc_ = false; i++; continue; }
        if (c === '\\' && inStr) { out += c; esc_ = true; i++; continue; }
        if (!inStr && (c === '"' || c === "'")) { inStr = true; q = c; out += c; i++; continue; }
        if (inStr && c === q) { inStr = false; out += c; i++; continue; }
        if (!inStr && c === '/' && src[i + 1] === '/') { while (i < src.length && src[i] !== '\n') i++; continue; }
        out += c; i++;
    }
    return out;
}

    return quitarComentarios(src).replace(/,(\s*[\]\}])/g, '$1').replace(/(^|[{,])\s*([^\s"'0-9{},\[\]:][^\s:,\]{}]*)\s*:/gm, (m, pre, key) => (key[0] === '"' || key[0] === "'") ? m : `${pre} "${key.trim()}":`);
}

function parseParams() {

        const b = document.createElement('button'); b.className = 'eq-share-op eq-nat';
        b.innerHTML = `<span class="eq-share-ic" style="background:#4b5563"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span>${t('more')}`;
        b.onclick = () => navigator.share({ title: document.title, text: textoCompartir(), url: urlActual() }).catch(() => {});
        grid.insertBefore(b, grid.firstChild);
    }
    document.getElementById('eq-share-ov').classList.add('abierto');
}
function cerrarCompartir() { document.getElementById('eq-share-ov').classList.remove('abierto'); }
function compartirRed(red) {
    const u = encodeURIComponent(urlActual()), tx = encodeURIComponent(textoCompartir());
    const m = { whatsapp: `https://wa.me/?text=${tx}%20${u}`, facebook: `https://www.facebook.com/sharer/sharer.php?u=${u}`, x: `https://twitter.com/intent/tweet?text=${tx}&url=${u}`, telegram: `https://t.me/share/url?url=${u}&text=${tx}` }[red];
    if (m) window.open(m, '_blank', 'noopener,noreferrer,width=560,height=620');
}
function copiarEnlace() {
    const url = urlActual(), fin = ok => toast(ok ? t('copied') : t('copyFail'));
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => fin(true)).catch(() => fin(false));
    else { try { const i = document.getElementById('eq-url-input'); i.select(); document.execCommand('copy'); fin(true); } catch (e) { fin(false); } }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarCompartir(); });

(async function () {
    try {
        const [, , media] = await Promise.all([
            cargarScript('Data/olympiad_data.html', 'olympiad-data'),
            cargarScript('Data/professor_data.html', 'professor-data').catch(() => {}),
            cargarMedia().catch(() => [])
        ]);
        FOTOS = (media || []).map(a => ({ ...a, fecha: fechaDe(a.nombre), evento: eventoDe(a.nombre), num: numDe(a.nombre) }))
            .sort((a, b) => (a.fecha - b.fecha) || (a.num - b.num) || a.nombre.localeCompare(b.nombre));
        window._listo = true;
        render();
    } catch (err) {
        console.error(err);
        document.getElementById('eq-root').innerHTML = `<div class="eq-estado">⚠️ ${t('loadErr')}<br><br><a href="index.html#inicio">${t('backHome')}</a></div>`;
    }
})();
